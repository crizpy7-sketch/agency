7, 4, P.gold2, 2, 11); px(ctx, 7, 4, P.gold1, 1, 11);\n  px(ctx, 6, 9, P.gold1, 4, 3); px(ctx, 7, 10, P.gold3, 2, 1);\n  autoOutline(ctx, 16, 16, 0.5);\n};\n\n// ---- village ground finishing -----------------------------------------\nTP['t.plaza'] = ctx => {\n  px(ctx, 0, 0, P.sand1, 16, 16);\n  for (let r = 0; r < 2; r++) for (let c = 0; c < 2; c++) {\n    const x = c * 8, y = r * 8;\n    px(ctx, x, y, (r + c) % 2 ? P.sand1 : P.sand0, 7, 7);\n    px(ctx, x, y, mix(P.sand0, '#fff', 0.3), 7, 1);\n    px(ctx, x + 6, y + 1, P.sand2, 1, 6);\n    px(ctx, x + 1, y + 6, P.sand2, 6, 1);\n    for (let i = 0; i < 3; i++) {\n      const ox = 1 + Math.floor(hash(i, r * 2 + c, 201) * 5);\n      const oy = 1 + Math.floor(hash(i, r * 2 + c, 202) * 5);\n      px(ctx, x + ox, y + oy, mix(P.sand1, P.sand2, 0.4));\n    }\n  }\n};\nTP['t.plaza.edge'] = ctx => {\n  TP['t.plaza'](ctx);\n  px(ctx, 0, 13, P.sand2, 16, 1);\n  px(ctx, 0, 14, P.sand3, 16, 2);\n  for (let x = 0; x < 16; x += 4) px(ctx, x, 14, P.sand2, 1, 2);\n};\nTP['t.cobble'] = ctx => {\n  // Warm stone, not cold grey, and only one step of value between the mortar and the\n  // stones. A near-white stone on a dark base reads as static, and cold grey fights\n  // the sand plaza it sits beside.\n  const mortar = mix(P.rock2, P.sand3, 0.55);\n  const stone = mix(P.rock1, P.sand2, 0.55);\n  const lit = mix(P.rock0, P.sand1, 0.5);\n  px(ctx, 0, 0, mortar, 16, 16);\n  for (let r = 0; r < 4; r++) {\n    const y = r * 4, off = r % 2 ? -2 : 0;\n    for (let x = off; x < 16; x += 5) {\n      ellipse(ctx, x + 2, y + 1.5, 2.4, 1.8, (px_, py, dx, dy, d) =>\n        d > 0.85 ? mortar : (dx + dy < -0.3 ? lit : stone));\n    }\n  }\n};\nTP['t.gravel'] = ctx => {\n  // The outermost village finish. It sits directly against grass, so it stays quiet.\n  px(ctx, 0, 0, mix(P.sand2, P.rock1, 0.35), 16, 16);\n  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {\n    const n = hash(x, y, 211);\n    if (n > 0.92) px(ctx, x, y, P.sand1);\n    else if (n < 0.16) px(ctx, x, y, P.rock2);\n  }\n  for (const [x, y] of [[3, 4], [10, 9], [6, 13]]) { px(ctx, x, y, P.rock0, 2, 1); px(ctx, x, y + 1, P.rock3, 2, 1); }\n};\n\n// ===========================================================================\nexport function register() {\n  for (const name of TILES) {\n    const fn = TP[name];\n    if (!fn) { console.warn('[tiles] no painter for', name); continue; }\n    Atlas.defineAnim(name, 16, 16, ANIM_TILES[name] || 1, fn);\n  }\n  for (const fam of AUTOTILE) {\n    for (let m = 0; m < 16; m++) {\n      Atlas.define(`t.${fam}.m${m}`, 16, 16, ctx => autotileTile(fam, m, ctx));\n    }\n    if (!Atlas.has(`t.${fam}`)) Atlas.define(`t.${fam}`, 16, 16, ctx => autotileTile(fam, 15, ctx));\n  }\n}\n","deps":{"./atlas.js":"art/atlas.js","./palette.js":"art/palette.js","./names.js":"art/names.js"}},{"id":"art/sprites.js","code":"// ---------------------------------------------------------------------------\n// Characters (16x24, origin bottom-centre) and buildings (footprint sized).\n//\n// Characters: one parametric painter, thirteen palettes and silhouettes. Every\n// cast member must be identifiable from their colour block alone at 1x.\n// Buildings: one parametric house painter with an explicit tier ladder —\n//   t1 humble (plank walls, small dark windows, plain roof)\n//   t2 settled (plaster + timber, chimney, proper shingles, planter)\n//   t3 proud  (gold ridge, banners, lit windows, sign, emblem, steps)\n// ---------------------------------------------------------------------------\n\nimport { Atlas } from './atlas.js';\nimport { P, RAMP, mix, shade } from './palette.js';\nimport { CHARS, DIRS4, CHAR_FRAMES, BUILDINGS } from './names.js';\nimport { px, hash, ellipse, shadedBlob, autoOutline, panelBox, strokeRect, tone } from './tiles.js';\n\nconst GLASS = ['#cfe7f2', '#8fbcd4', '#5c8ba8', '#3c5f78'];\nconst LITG = [P.gold0, P.gold1, P.gold2, P.gold3];\nconst ROOFV = [P.violet0, P.violet1, P.violet2, P.violet3];\nconst ROOFG = [P.roofG0, P.roofG1, P.roofG2, P.roofG3];\nconst ROOFB = [P.roofB0, P.roofB1, P.roofB2, P.roofB3];\nconst ROOFR = [P.roof0, P.roof1, P.roof2, P.roof3];\nconst STONE = RAMP.rock, WOOD = RAMP.wood, PLAS = RAMP.plaster;\n\n// ===========================================================================\n// CHARACTERS\n// ===========================================================================\n\nconst SKIN = {\n  fair: ['#ffe0bd', '#f0c39a', '#cf9b73'],\n  warm: ['#f5c99b', '#dda877', '#b8814f'],\n  tan: ['#dda06e', '#bd7f4f', '#945c34'],\n  deep: ['#a9714a', '#8a5636', '#653b23'],\n};\n\n// hair / clothing choices are deliberately far apart in hue so a crowd reads.\nconst LOOKS = {\n  hero: {\n    skin: 'warm', hair: ['#c07a3f', '#8e5325'], hairStyle: 'short',\n    top: ['#4fb8a6', '#2f8578'], bottom: ['#4a5f8c', '#31416b'], shoe: ['#8e6034', '#5b3d21'],\n    accent: P.gold1, scarf: true,\n  },\n  mayor: {\n    skin: 'fair', hair: ['#d8d2c4', '#a49d8d'], hairStyle: 'bald',\n    top: ['#4f8b31', '#36641f'], bottom: ['#7a6248', '#523f2c'], shoe: ['#5b3d21', '#3d2817'],\n    accent: P.gold1, hat: 'tall', vest: P.gold2,\n  },\n  gran: {\n    skin: 'fair', hair: ['#f2eee4', '#c6bfae'], hairStyle: 'bun',\n    top: ['#b79ada', '#8065ad'], bottom: ['#6d5b8a', '#4a3c60'], shoe: ['#5b3d21', '#3d2817'],\n    accent: P.bloom1, skirt: true, shawl: '#e0d3f2',\n  },\n  kid: {\n    skin: 'fair', hair: ['#f2d472', '#c0a03f'], hairStyle: 'mop', child: true,\n    top: ['#ffd45e', '#d99f2c'], bottom: ['#59a2d4', '#3a6c96'], shoe: ['#c04214', '#8a2e0e'],\n    accent: P.spark1,\n  },\n  twin: {\n    skin: 'tan', hair: ['#6b4a7d', '#472f56'], hairStyle: 'twin', child: true,\n    top: ['#f593b9', '#c95f88'], bottom: ['#6fae45', '#4f8b31'], shoe: ['#8e6034', '#5b3d21'],\n    accent: P.bloom0,\n  },\n  farmer: {\n    skin: 'tan', hair: ['#8e6034', '#5f3d20'], hairStyle: 'short',\n    top: ['#e8cf9a', '#bfa473'], bottom: ['#5f7fb0', '#3f5a84'], shoe: ['#654223', '#452c17'],\n    accent: P.gold2, hat: 'straw', overalls: true,\n  },\n  smith: {\n    skin: 'deep', hair: ['#3b2b23', '#241a14'], hairStyle: 'short',\n    top: ['#b04136', '#822b26'], bottom: ['#4a3826', '#2f2417'], shoe: ['#3d2817', '#241a12'],\n    accent: '#e8563f', apron: ['#8e6034', '#5b3d21'], band: '#e8563f', broad: true,\n  },\n  baker: {\n    skin: 'fair', hair: ['#a4633a', '#70401f'], hairStyle: 'bun',\n    top: ['#f593b9', '#c95f88'], bottom: ['#e3d2ac', '#b8a37d'], shoe: ['#8e6034', '#5b3d21'],\n    accent: P.paper0, apron: ['#fdf6e3', '#d8cbaa'], hat: 'chef',\n  },\n  fisher: {\n    skin: 'warm', hair: ['#3f5f7a', '#2a4055'], hairStyle: 'short',\n    top: ['#5590bd', '#3a6c96'], bottom: ['#3f5a6b', '#2a3d49'], shoe: ['#e0cfa6', '#a99070'],\n    accent: P.water0, hat: 'hood', boots: true,\n  },\n  ranger: {\n    skin: 'tan', hair: ['#4f3a2a', '#33261b'], hairStyle: 'short',\n    top: ['#4f8b31', '#33601f'], bottom: ['#6b5238', '#493724'], shoe: ['#493724', '#2e2216'],\n    accent: P.leaf0, hat: 'hood', cloak: ['#63a464', '#2d5a33'], quiver: true,\n  },\n  weaver: {\n    skin: 'warm', hair: ['#2f2438', '#1c1524'], hairStyle: 'long',\n    top: ['#a98ada', '#7d5fb0'], bottom: ['#563d80', '#3a2857'], shoe: ['#5b3d21', '#3d2817'],\n    accent: P.violet0, skirt: true, shawl: '#f5c877',\n  },\n  peddler: {\n    skin: 'deep', hair: ['#4a3220', '#2d1e13'], hairStyle: 'short',\n    top: ['#dda23f', '#a9762a'], bottom: ['#8e6034', '#5b3d21'], shoe: ['#452c17', '#2b1a0e'],\n    accent: P.roof0, hat: 'wide', pack: ['#b04136', '#822b26'],\n  },\n  rival: {\n    skin: 'fair', hair: ['#e6eef7', '#a9bcd0'], hairStyle: 'swept',\n    top: ['#3a4f7a', '#25334f'], bottom: ['#2f3a52', '#1d2534'], shoe: ['#4a3826', '#2b1f14'],\n    accent: '#cfe7f2', collar: '#f2f7ff', cloak: ['#4f6b9c', '#25334f'],\n  },\n};\n\nfunction metrics(child) {\n  return child\n    ? { hy: 3, hh: 9, ny: 12, ty: 13, tb: 16, ly: 17, fy: 21 }\n    : { hy: 1, hh: 10, ny: 11, ty: 12, tb: 16, ly: 17, fy: 21 };\n}\n\nfunction charPainter(look) {\n  return (ctx, w, h, frame) => {\n    const pose = frame === 1 ? 1 : frame === 3 ? -1 : 0;\n    const dir = look.__dir;\n    const flip = dir === 'right';\n    if (flip) { ctx.save(); ctx.translate(16, 0); ctx.scale(-1, 1); }\n    drawCharacter(ctx, look, flip ? 'left' : dir, pose);\n    if (flip) ctx.restore();\n    autoOutline(ctx, 16, 24, 0.46, 0.26);\n  };\n}\n\nfunction drawCharacter(ctx, L, dir, pose) {\n  const m = metrics(L.child);\n  const sk = SKIN[L.skin];\n  const bob = pose !== 0 ? -1 : 0;\n  const side = dir === 'left';\n  const back = dir === 'up';\n\n  drawLegs(ctx, L, dir, pose, m);\n  drawTorso(ctx, L, dir, pose, m, bob, sk);\n  drawHead(ctx, L, dir, m, bob, sk, side, back);\n}\n\nfunction drawLegs(ctx, L, dir, pose, m) {\n  const [b0, b1] = L.bottom, [s0, s1] = L.shoe;\n  const legTop = m.ly, footTop = m.fy;\n  const far = [shade(b0, -0.22), shade(b1, -0.22)];\n  const farS = [shade(s0, -0.22), shade(s1, -0.22)];\n\n  const leg = (x, top, cols, shoes, footY) => {\n    px(ctx, x, top, cols[0], 3, footY - top);\n    px(ctx, x + 2, top, cols[1], 1, footY - top);\n    px(ctx, x, footY, shoes[0], 3, 2);\n    px(ctx, x, footY, shade(shoes[0], 0.18), 3, 1);\n    px(ctx, x + 2, footY, shoes[1], 1, 2);\n  };\n\n  if (L.skirt) {\n    // skirt hides the stride; legs peek out below\n    px(ctx, 4, legTop, L.bottom[0], 8, 3);\n    px(ctx, 3, legTop + 1, L.bottom[0], 10, 2);\n    px(ctx, 3, legTop + 2, L.bottom[1], 10, 1);\n    const o = pose === 0 ? 0 : 1;\n    px(ctx, 5 + (pose > 0 ? -1 : 0), legTop + 3, SKIN[L.skin][1], 2, footTop - legTop - 3);\n    px(ctx, 9 + (pose < 0 ? 1 : 0), legTop + 3, SKIN[L.skin][2], 2, footTop - legTop - 3);\n    px(ctx, 5 + (pose > 0 ? -1 : 0), footTop - o, L.shoe[0], 2, 2);\n    px(ctx, 9 + (pose < 0 ? 1 : 0), footTop, L.shoe[0], 2, 2);\n    return;\n  }\n\n  if (dir === 'left' || dir === 'right') {\n    const fwd = -1;   // 'left' is authored; 'right' is mirrored by the caller\n    let nearX, farX;\n    if (pose === 0) { nearX = 6; farX = 7; }\n    else if (pose === 1) { nearX = 6 + fwd * 2; farX = 7 - fwd * 2; }\n    else { nearX = 6 - fwd * 2; farX = 7 + fwd * 2; }\n    leg(farX, legTop, far, farS, footTop);\n    leg(nearX, legTop, L.bottom, L.shoe, footTop);\n  } else {\n    const lx = 4, rx = 9;\n    if (pose === 0) {\n      leg(lx, legTop, L.bottom, L.shoe, footTop);\n      leg(rx, legTop, L.bottom, L.shoe, footTop);\n    } else if (pose === 1) {\n      leg(lx - 1, legTop, L.bottom, L.shoe, footTop);\n      leg(rx, legTop, far, farS, footTop - 1);\n    } else {\n      leg(lx, legTop, far, farS, footTop - 1);\n      leg(rx + 1, legTop, L.bottom, L.shoe, footTop);\n    }\n  }\n}\n\nfunction drawTorso(ctx, L, dir, pose, m, bob, sk) {\n  const [t0, t1] = L.top;\n  const ty = m.ty + bob, tb = m.tb + bob;\n  const hgt = tb - ty + 1;\n  const broad = L.broad ? 1 : 0;\n  const side = dir === 'left' || dir === 'right';\n\n  // torso block\n  const x0 = side ? 4 : 4 - broad, x1 = side ? 11 : 11 + broad;\n  px(ctx, x0, ty, t0, x1 - x0 + 1, hgt);\n  px(ctx, x0, ty, shade(t0, 0.14), x1 - x0 + 1, 1);\n  px(ctx, x1, ty, t1, 1, hgt);\n  px(ctx, x0, tb, t1, x1 - x0 + 1, 1);\n\n  if (L.cloak) {\n    px(ctx, x0 - 1, ty, L.cloak[0], 3, hgt + 1);\n    px(ctx, x1 - 1, ty, L.cloak[1], 3, hgt + 1);\n    px(ctx, x0 - 1, ty, shade(L.cloak[0], 0.15), 3, 1);\n  }\n  if (L.apron) {\n    px(ctx, 5, ty + 1, L.apron[0], 6, hgt);\n    px(ctx, 5, ty + 1, shade(L.apron[0], 0.12), 6, 1);\n    px(ctx, 10, ty + 1, L.apron[1], 1, hgt);\n  }\n  if (L.overalls) {\n    px(ctx, 5, ty, L.bottom[0], 2, hgt); px(ctx, 9, ty, L.bottom[0], 2, hgt);\n    px(ctx, 5, tb - 1, L.bottom[0], 6, 2);\n    px(ctx, 5, ty, shade(L.bottom[0], 0.14), 2, 1); px(ctx, 9, ty, shade(L.bottom[0], 0.14), 2, 1);\n    px(ctx, 6, tb, P.gold2); px(ctx, 9, tb, P.gold2);\n  }\n  if (L.vest) {\n    px(ctx, 5, ty + 1, L.vest, 2, hgt - 1); px(ctx, 9, ty + 1, L.vest, 2, hgt - 1);\n    px(ctx, 7, ty + 3, shade(L.vest, -0.2), 2, 1);\n  }\n  if (L.scarf) {\n    px(ctx, 4, ty, L.accent, 8, 2);\n    px(ctx, 4, ty, shade(L.accent, 0.2), 8, 1);\n    px(ctx, dir === 'up' ? 5 : 10, ty + 2, shade(L.accent, -0.12), 2, 3);\n  }\n  if (L.collar) {\n    px(ctx, 4, ty, L.collar, 8, 2);\n    px(ctx, 6, ty + 2, shade(L.collar, -0.1), 4, 1);\n  }\n  if (L.pack && dir !== 'down') {\n    px(ctx, 3, ty + 1, L.pack[0], 10, hgt - 1);\n    px(ctx, 3, ty + 1, shade(L.pack[0], 0.15), 10, 1);\n    px(ctx, 3, tb, L.pack[1], 10, 1);\n    px(ctx, 6, ty + 3, P.gold2, 4, 1);\n  }\n  if (L.quiver && dir !== 'down') {\n    px(ctx, 11, ty - 1, P.wood3, 3, 6);\n    px(ctx, 11, ty - 1, P.wood2, 1, 6);\n    px(ctx, 12, ty - 3, P.paper1, 1, 3); px(ctx, 12, ty - 4, P.paper0);\n  }\n\n  // arms + hands\n  const swing = pose;\n  if (side) {\n    const ax = 4, ay = ty + 1 + (swing > 0 ? 1 : 0);\n    px(ctx, ax, ay, t1, 2, hgt - 1);\n    px(ctx, ax, ay, shade(t1, 0.12), 2, 1);\n    px(ctx, ax, ay + hgt - 1, sk[0], 2, 2);\n    px(ctx, ax + 1, ay + hgt - 1, sk[1], 1, 2);\n  } else {\n    const aL = ty + (swing > 0 ? 1 : 0), aR = ty + (swing < 0 ? 1 : 0);\n    px(ctx, 2 - broad, aL, t1, 2, hgt);\n    px(ctx, 2 - broad, aL, shade(t1, 0.12), 2, 1);\n    px(ctx, 12 + broad, aR, t1, 2, hgt);\n    px(ctx, 12 + broad, aR, shade(t1, 0.12), 2, 1);\n    px(ctx, 2 - broad, aL + hgt, sk[0], 2, 2);\n    px(ctx, 12 + broad, aR + hgt, sk[0], 2, 2);\n    px(ctx, 3 - broad, aL + hgt, sk[1], 1, 2);\n    px(ctx, 13 + broad, aR + hgt, sk[1], 1, 2);\n  }\n  // neck\n  px(ctx, 6, m.ny + bob, sk[1], 4, 1);\n  px(ctx, 6, m.ny + bob, sk[2], 4, 1);\n}\n\nfunction drawHead(ctx, L, dir, m, bob, sk, side, back) {\n  const hy = m.hy + bob, hb = hy + m.hh - 1;\n  const [h0, h1] = L.hair;\n\n  // skull\n  px(ctx, 3, hy + 1, sk[0], 10, m.hh - 2);\n  px(ctx, 4, hy, sk[0], 8, 1);\n  px(ctx, 4, hb, sk[0], 8, 1);\n  px(ctx, 11, hy + 1, sk[1], 2, m.hh - 2);\n  px(ctx, 12, hy + 2, sk[1], 1, m.hh - 4);\n  px(ctx, 4, hb, sk[1], 8, 1);\n  px(ctx, 3, hy + 1, mix(sk[0], '#fff', 0.25), 1, 3);\n\n  // hair\n  const st = L.hairStyle;\n  const cap = (rows) => {\n    px(ctx, 4, hy, h0, 8, 1);\n    px(ctx, 3, hy + 1, h0, 10, rows - 1);\n    px(ctx, 3, hy + 1, mix(h0, '#fff', 0.2), 4, 1);\n    px(ctx, 11, hy + 1, h1, 2, rows - 1);\n    px(ctx, 3, hy + rows - 1, h1, 10, 1);\n  };\n  if (back) {\n    // rear of the head: all hair, keep the silhouette of the style\n    cap(m.hh - 1);\n    px(ctx, 3, hy + 1, h0, 10, m.hh - 2);\n    px(ctx, 3, hy + 1, mix(h0, '#fff', 0.18), 4, 2);\n    px(ctx, 11, hy + 1, h1, 2, m.hh - 2);\n    px(ctx, 4, hb - 1, h1, 8, 2);\n    px(ctx, 5, hb, sk[2], 6, 1);\n  } else if (st === 'bald') {\n    px(ctx, 3, hy + 1, h0, 10, 2);\n    px(ctx, 3, hy + 3, h0, 1, 3); px(ctx, 12, hy + 3, h1, 1, 3);\n    px(ctx, 5, hy, h0, 6, 1);\n  } else if (st === 'mop') {\n    cap(5);\n    for (let x = 3; x < 13; x += 2) px(ctx, x, hy + 4, h0, 1, 2);\n    px(ctx, 3, hy + 4, h1, 1, 3); px(ctx, 12, hy + 4, h1, 1, 3);\n  } else if (st === 'long') {\n    cap(4);\n    px(ctx, 2, hy + 2, h0, 2, m.hh + 2); px(ctx, 12, hy + 2, h1, 2, m.hh + 2);\n    px(ctx, 2, hy + 2, mix(h0, '#fff', 0.16), 1, 4);\n  } else if (st === 'bun') {\n    cap(4);\n    shadedBlob(ctx, 8, hy - 2, 3.2, 2.4, [mix(h0, '#fff', 0.3), h0, h1, shade(h1, -0.2)], { edge: 0.2 });\n    px(ctx, 3, hy + 3, h1, 1, 2); px(ctx, 12, hy + 3, h1, 1, 2);\n  } else if (st === 'twin') {\n    cap(4);\n    for (const bx of [1, 12]) {\n      shadedBlob(ctx, bx + 1, hy + 5, 2.4, 2.8, [mix(h0, '#fff', 0.25), h0, h1, shade(h1, -0.2)], { edge: 0.2 });\n      px(ctx, bx + 1, hy + 3, L.accent, 2, 1);\n    }\n  } else if (st === 'swept') {\n    cap(4);\n    px(ctx, 3, hy + 4, h0, 3, 2);\n    px(ctx, 10, hy, h0, 4, 2); px(ctx, 12, hy - 1, h0, 2, 2);\n    px(ctx, 12, hy + 3, h1, 1, 3);\n  } else {\n    cap(4);\n    px(ctx, 3, hy + 4, h0, 2, 3); px(ctx, 12, hy + 4, h1, 1, 3);\n  }\n\n  // hats\n  const hat = L.hat;\n  if (hat === 'straw') {\n    px(ctx, 1, hy + 2, P.gold2, 14, 2);\n    px(ctx, 1, hy + 2, P.gold1, 14, 1);\n    px(ctx, 4, hy - 2, P.gold1, 8, 4);\n    px(ctx, 4, hy - 2, P.gold0, 8, 1);\n    px(ctx, 11, hy - 1, P.gold3, 1, 3);\n    px(ctx, 4, hy + 1, P.gold3, 8, 1);\n  } else if (hat === 'tall') {\n    px(ctx, 3, hy + 1, P.leaf3, 10, 2);\n    px(ctx, 5, hy - 5, P.leaf2, 6, 6);\n    px(ctx, 5, hy - 5, P.leaf1, 2, 6);\n    px(ctx, 5, hy - 2, P.gold2, 6, 1);\n    px(ctx, 10, hy - 5, P.leaf4, 1, 6);\n  } else if (hat === 'chef') {\n    px(ctx, 3, hy, P.paper0, 10, 2);\n    px(ctx, 4, hy - 3, P.paper0, 8, 3);\n    px(ctx, 4, hy - 3, P.white, 8, 1);\n    px(ctx, 11, hy - 2, P.paper2, 1, 3);\n    px(ctx, 3, hy + 2, P.paper2, 10, 1);\n  } else if (hat === 'hood') {\n    const hc = L.cloak ? L.cloak : L.top;\n    px(ctx, 2, hy, hc[0], 12, 4);\n    px(ctx, 2, hy, shade(hc[0], 0.15), 12, 1);\n    px(ctx, 2, hy + 4, hc[0], 2, 4); px(ctx, 12, hy + 4, hc[1], 2, 4);\n    px(ctx, 4, hy + 3, shade(hc[1], -0.1), 8, 1);\n    px(ctx, 2, hy + 7, hc[1], 12, 2);\n  } else if (hat === 'wide') {\n    px(ctx, 0, hy + 2, P.wood3, 16, 2);\n    px(ctx, 0, hy + 2, P.wood2, 16, 1);\n    px(ctx, 4, hy - 3, P.wood2, 8, 5);\n    px(ctx, 4, hy - 3, P.wood1, 8, 1);\n    px(ctx, 4, hy + 1, P.roof2, 8, 1);\n    px(ctx, 11, hy - 2, P.wood4, 1, 4);\n  }\n  if (L.band) { px(ctx, 3, hy + 3, L.band, 10, 1); px(ctx, 3, hy + 3, shade(L.band, 0.2), 4, 1); }\n  if (L.shawl) {\n    px(ctx, 3, hb + 1, L.shawl, 10, 2);\n    px(ctx, 2, hb + 2, L.shawl, 12, 2);\n    px(ctx, 2, hb + 3, shade(L.shawl, -0.18), 12, 1);\n  }\n\n  if (back) return;\n\n  // face\n  const eyeY = hy + Math.round(m.hh * 0.52);\n  const dark = P.ink;\n  const white = '#ffffff';\n  if (side) {\n    // three-quarter-ish profile: one big eye toward the front, hair over the back\n    px(ctx, 4, eyeY, dark, 2, 2);\n    px(ctx, 4, eyeY, white, 1, 1);\n    px(ctx, 3, eyeY + 1, mix(sk[1], P.ink3, 0.35), 1, 1);\n    px(ctx, 4, eyeY + 3, mix(sk[2], P.ink3, 0.4), 2, 1);\n    px(ctx, 8, hy + 1, h0, 5, m.hh - 3);\n    px(ctx, 11, hy + 1, h1, 2, m.hh - 3);\n    px(ctx, 6, eyeY + 2, mix(sk[1], P.roof1, 0.35), 2, 1);\n  } else {\n    px(ctx, 4, eyeY, dark, 2, 2);\n    px(ctx, 10, eyeY, dark, 2, 2);\n    px(ctx, 4, eyeY, white, 1, 1);\n    px(ctx, 10, eyeY, white, 1, 1);\n    px(ctx, 7, eyeY + 2, mix(sk[2], P.ink3, 0.3), 2, 1);\n    px(ctx, 3, eyeY + 2, mix(sk[1], P.roof1, 0.4), 1, 1);\n    px(ctx, 12, eyeY + 2, mix(sk[1], P.roof1, 0.4), 1, 1);\n  }\n}\n\n// ===========================================================================\n// BUILDINGS\n// ===========================================================================\n\nfunction plankWall(ctx, x, y, w, h, ramp) {\n  px(ctx, x, y, ramp[1], w, h);\n  for (let i = 0; i < w; i += 4) {\n    px(ctx, x + i, y, mix(ramp[1], ramp[0], 0.5), 3, h);\n    px(ctx, x + i + 3, y, ramp[3], 1, h);\n    for (let j = 0; j < h; j++) if (hash(i, j, 301) > 0.94) px(ctx, x + i + 1, y + j, ramp[2]);\n  }\n  px(ctx, x, y, ramp[0], w, 1);\n}\n\nfunction plasterWall(ctx, x, y, w, h, ramp, beams) {\n  px(ctx, x, y, ramp[1], w, h);\n  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {\n    const n = hash(i, j, 307);\n    if (n > 0.95) px(ctx, x + i, y + j, ramp[0]);\n    else if (n < 0.05) px(ctx, x + i, y + j, ramp[2]);\n  }\n  px(ctx, x, y, ramp[0], w, 1);\n  px(ctx, x, y, ramp[0], 1, h);\n  px(ctx, x + w - 1, y, ramp[2], 1, h);\n  if (beams) {\n    // half-timbered corners and a mid rail\n    px(ctx, x, y, P.wood2, 2, h); px(ctx, x + w - 2, y, P.wood3, 2, h);\n    px(ctx, x, y, P.wood1, 1, h);\n    const rail = y + Math.floor(h * 0.55);\n    px(ctx, x, rail, P.wood2, w, 2);\n    px(ctx, x, rail, P.wood1, w, 1);\n  }\n}\n\nfunction stoneBase(ctx, x, y, w, h) {\n  px(ctx, x, y, STONE[2], w, h);\n  for (let r = 0; r < Math.ceil(h / 3); r++) {\n    const yy = y + r * 3, off = r % 2 ? -2 : 0;\n    for (let i = off; i < w; i += 6) {\n      px(ctx, x + Math.max(0, i), yy, STONE[1], Math.min(5, w - Math.max(0, i)), 2);\n      px(ctx, x + Math.max(0, i), yy, STONE[0], Math.min(5, w - Math.max(0, i)), 1);\n    }\n  }\n  px(ctx, x, y + h - 1, STONE[4], w, 1);\n}\n\nfunction shingleRoof(ctx, W, roofH, ramp, o = {}) {\n  const topHalf = Math.max(2, Math.round(W / 2 - roofH * 0.62));\n  const rows = [];\n  for (let y = 0; y < roofH; y++) {\n    const t = roofH === 1 ? 1 : y / (roofH - 1);\n    const half = topHalf + (W / 2 - topHalf) * t;\n    const x0 = Math.round(W / 2 - half), x1 = Math.round(W / 2 + half) - 1;\n    rows.push([x0, x1]);\n    const band = y % 3;\n    let c = ramp[1];\n    if (band === 0) c = ramp[0];\n    if (band === 2) c = ramp[2];\n    px(ctx, x0, y, c, x1 - x0 + 1, 1);\n    // shingle notches\n    if (band === 2) for (let x = x0 + ((y * 2) % 4); x <= x1; x += 4) px(ctx, x, y, ramp[3]);\n    // lit left slope / shaded right slope\n    px(ctx, x0, y, mix(c, '#ffffff', 0.18), Math.max(1, Math.round((x1 - x0) * 0.16)), 1);\n    px(ctx, x1 - Math.max(0, Math.round((x1 - x0) * 0.10)), y, ramp[3], Math.max(1, Math.round((x1 - x0) * 0.10) + 1), 1);\n    // keyline on the slope edges (autoOutline can't reach off-canvas)\n    px(ctx, x0, y, ramp[3]);\n    px(ctx, x1, y, shade(ramp[3], -0.2));\n  }\n  // ridge\n  const [rx0, rx1] = rows[0];\n  px(ctx, rx0, 0, o.ridge || ramp[3], rx1 - rx0 + 1, 1);\n  if (o.ridge) {\n    px(ctx, rx0, 1, o.ridge, rx1 - rx0 + 1, 1);\n    px(ctx, rx0, 0, shade(o.ridge, 0.3), rx1 - rx0 + 1, 1);\n  }\n  // eaves board\n  const [ex0, ex1] = rows[roofH - 1];\n  px(ctx, ex0, roofH - 1, ramp[3], ex1 - ex0 + 1, 1);\n  px(ctx, ex0, roofH - 2, ramp[2], ex1 - ex0 + 1, 1);\n  if (o.scallop) {\n    for (let x = ex0; x <= ex1; x += 3) px(ctx, x, roofH, ramp[2], 2, 1);\n  }\n  return rows;\n}\n\nfunction window9(ctx, x, y, w, h, lit, o = {}) {\n  strokeRect(ctx, x - 1, y - 1, w + 2, h + 2, P.wood4);\n  px(ctx, x, y, lit ? LITG[1] : GLASS[1], w, h);\n  px(ctx, x, y, lit ? LITG[0] : GLASS[0], w, Math.max(1, (h >> 1) - 1));\n  px(ctx, x, y + h - 2, lit ? LITG[2] : GLASS[2], w, 2);\n  if (w >= 5) px(ctx, x + ((w - 1) >> 1), y, P.wood3, 1, h);\n  if (h >= 5) px(ctx, x, y + ((h - 1) >> 1), P.wood3, w, 1);\n  // sill\n  px(ctx, x - 2, y + h + 1, P.wood2, w + 4, 1);\n  px(ctx, x - 2, y + h + 1, P.wood1, w + 4, 1);\n  px(ctx, x - 2, y + h + 2, P.wood3, w + 4, 1);\n  if (o.shutters) {\n    px(ctx, x - 3, y - 1, o.shutters, 2, h + 2);\n    px(ctx, x + w + 1, y - 1, shade(o.shutters, -0.2), 2, h + 2);\n  }\n  if (o.box) {\n    px(ctx, x - 1, y + h + 2, P.wood2, w + 2, 3);\n    px(ctx, x - 1, y + h + 2, P.wood1, w + 2, 1);\n    for (let i = 0; i < w + 1; i += 2) {\n      px(ctx, x + i - 1, y + h + 1, P.leaf2, 1, 1);\n      px(ctx, x + i, y + h + 1, i % 4 ? P.bloom1 : P.gold1, 1, 1);\n    }\n  }\n}\n\nfunction doorway(ctx, cx, baseY, w, h, tier, o = {}) {\n  const x = cx - (w >> 1);\n  px(ctx, x - 1, baseY - h - 1, P.wood4, w + 2, h + 1);\n  px(ctx, x, baseY - h, P.wood2, w, h);\n  px(ctx, x, baseY - h, P.wood1, w, 1);\n  for (let i = 1; i < w; i += 3) px(ctx, x + i, baseY - h + 1, P.wood3, 1, h - 1);\n  px(ctx, x + 1, baseY - h + 2, P.wood1, w - 3, Math.floor(h / 2) - 2);\n  px(ctx, x + 1, baseY - h + 2, P.wood0, w - 3, 1);\n  px(ctx, x + w - 2, baseY - h, P.wood4, 1, h);\n  px(ctx, x + w - 3, baseY - Math.round(h * 0.55), P.gold2, 2, 2);\n  px(ctx, x + w - 3, baseY - Math.round(h * 0.55), P.gold0, 1, 1);\n  if (tier >= 2) {\n    px(ctx, x - 2, baseY - h - 2, P.wood2, w + 4, 2);\n    px(ctx, x - 2, baseY - h - 2, P.wood1, w + 4, 1);\n  }\n  if (tier >= 3) {\n    px(ctx, x - 3, baseY, STONE[1], w + 6, 2);\n    px(ctx, x - 3, baseY, STONE[0], w + 6, 1);\n    px(ctx, x - 2, baseY - 1, STONE[0], w + 4, 1);\n    // little porch lanterns\n    for (const lx of [x - 4, x + w + 2]) {\n      px(ctx, lx, baseY - h - 1, P.wood3, 1, 3);\n      px(ctx, lx - 1, baseY - h + 1, LITG[2], 3, 3);\n      px(ctx, lx - 1, baseY - h + 1, LITG[0], 3, 1);\n      px(ctx, lx, baseY - h + 2, P.white, 1, 1);\n    }\n  }\n  if (o.arch) {\n    ellipse(ctx, cx, baseY - h, w / 2 + 1, 4, (X, Y, dx, dy, d) =>\n      dy > 0 ? null : (d > 0.72 ? P.wood4 : P.wood2));\n  }\n}\n\nfunction chimney(ctx, x, y, h, smoke) {\n  px(ctx, x, y, STONE[2], 6, h);\n  px(ctx, x, y, STONE[1], 4, h);\n  px(ctx, x, y, STONE[0], 1, h);\n  px(ctx, x + 5, y, STONE[3], 1, h);\n  px(ctx, x - 1, y, STONE[1], 8, 2);\n  px(ctx, x - 1, y, STONE[0], 8, 1);\n  px(ctx, x + 1, y + 1, '#2a2130', 4, 1);\n  for (let r = 0; r < Math.floor(h / 3); r++) px(ctx, x, y + 3 + r * 3, STONE[3], 6, 1);\n  if (smoke) {\n    ctx.globalAlpha = 0.5;\n    for (const [ox, oy, r] of [[2, -3, 1.6], [4, -6, 2.0], [1, -9, 2.4]]) {\n      ellipse(ctx, x + ox, y + oy, r, r, '#e8e2ee');\n    }\n    ctx.globalAlpha = 1;\n  }\n}\n\nfunction banner(ctx, x, y, h, c0, c1) {\n  px(ctx, x, y, c0, 4, h);\n  px(ctx, x, y, shade(c0, 0.2), 1, h);\n  px(ctx, x + 3, y, c1, 1, h);\n  px(ctx, x, y, P.gold1, 4, 1);\n  px(ctx, x, y + h, c1, 1, 1); px(ctx, x + 3, y + h, c1, 1, 1);\n  px(ctx, x + 1, y + h - 1, P.gold2, 2, 1);\n}\n\nconst EMBLEM = {\n  flame(ctx, x, y) {\n    ellipse(ctx, x, y + 1, 2.4, 3, (X, Y, dx, dy, d) => d > 0.72 ? P.ember3 : P.ember1);\n    px(ctx, x, y - 3, P.ember2); px(ctx, x, y, P.spark0, 1, 2);\n  },\n  pot(ctx, x, y) {\n    px(ctx, x - 3, y, STONE[2], 7, 4); px(ctx, x - 3, y, STONE[1], 7, 1);\n    px(ctx, x - 4, y - 1, STONE[1], 9, 1);\n    px(ctx, x - 1, y - 4, '#e8e2ee', 3, 2);\n  },\n  hammer(ctx, x, y) {\n    px(ctx, x - 3, y - 3, STONE[1], 6, 3); px(ctx, x - 3, y - 3, STONE[0], 6, 1);\n    px(ctx, x, y, P.wood2, 2, 5); px(ctx, x, y, P.wood1, 1, 5);\n  },\n  book(ctx, x, y) {\n    px(ctx, x - 4, y - 3, P.paper0, 8, 6); px(ctx, x - 4, y - 3, P.white, 8, 1);\n    px(ctx, x - 1, y - 3, P.roof2, 2, 6);\n    px(ctx, x - 4, y + 3, P.paper3, 8, 1);\n  },\n  heart(ctx, x, y) {\n    px(ctx, x - 3, y - 3, P.roof1, 2, 3); px(ctx, x + 1, y - 3, P.roof1, 2, 3);\n    px(ctx, x - 3, y, P.roof1, 6, 1); px(ctx, x - 2, y + 1, P.roof2, 4, 1);\n    px(ctx, x - 1, y + 2, P.roof2, 2, 1); px(ctx, x - 3, y - 3, P.roof0, 1, 1);\n  },\n  drop(ctx, x, y) {\n    ellipse(ctx, x, y + 1, 2.6, 3, (X, Y, dx, dy, d) => d > 0.7 ? P.water3 : P.water1);\n    px(ctx, x, y - 3, P.water2); px(ctx, x - 1, y, P.water0);\n  },\n  coin(ctx, x, y) {\n    ellipse(ctx, x, y, 3.4, 3.4, (X, Y, dx, dy, d) => d > 0.72 ? P.gold3 : (dx + dy < -0.2 ? P.gold0 : P.gold1));\n    px(ctx, x, y - 1, P.gold3, 1, 3);\n  },\n  flower(ctx, x, y) {\n    for (const [dx, dy] of [[0, -2], [-2, 0], [2, 0], [0, 2]]) px(ctx, x + dx, y + dy, P.bloom1, 2, 2);\n    px(ctx, x, y, P.gold1, 2, 2); px(ctx, x, y, P.gold0);\n  },\n  bell(ctx, x, y) {\n    ellipse(ctx, x, y, 3.4, 3, (X, Y, dx, dy, d) => dy > 0.4 ? null : (d > 0.7 ? P.gold3 : P.gold1));\n    px(ctx, x - 3, y + 1, P.gold2, 7, 1); px(ctx, x, y + 2, P.gold3, 1, 1);\n    px(ctx, x - 3, y + 1, P.gold0, 2, 1);\n  },\n  leaf(ctx, x, y) {\n    ellipse(ctx, x, y, 3.4, 2.4, (X, Y, dx, dy, d) => d > 0.75 ? P.leaf3 : (dx + dy < -0.1 ? P.leaf0 : P.leaf1));\n    px(ctx, x - 3, y + 2, P.leaf3, 3, 1);\n  },\n};\n\n/** the generic house: roof over walls, door, windows, tier dressing */\nfunction house(ctx, W, H, cfg) {\n  const t = cfg.tier;\n  const overhangPx = cfg.overhang * 16;\n  const roofH = overhangPx + (cfg.roofExtra ?? 8);\n  const wallTop = Math.max(0, roofH - 4);\n  const wallH = H - wallTop;\n  const baseH = t >= 2 ? 4 : 3;\n  const ramp = cfg.roof;\n  const wallRamp = t === 1 ? WOOD : PLAS;\n\n  // walls (inset 1px so the silhouette gets an outline)\n  if (t === 1) plankWall(ctx, 1, wallTop, W - 2, wallH, WOOD);\n  else plasterWall(ctx, 1, wallTop, W - 2, wallH, PLAS, t >= 2);\n  stoneBase(ctx, 1, H - baseH, W - 2, baseH);\n\n  // roof\n  const rows = shingleRoof(ctx, W, roofH, t === 1 ? ramp.map(c => mix(c, P.rock2, 0.34)) : ramp, {\n    ridge: t >= 3 ? P.gold2 : null,\n    scallop: t >= 3,\n  });\n  // eaves shadow on the wall\n  const [ex0, ex1] = rows[roofH - 1];\n  ctx.globalAlpha = 0.30;\n  px(ctx, Math.max(1, ex0), roofH, '#241a2e', Math.min(W - 2, ex1 - ex0 + 1), 2);\n  ctx.globalAlpha = 1;\n\n  // gable emblem\n  if (t >= 2 && cfg.emblem && roofH > 14) {\n    EMBLEM[cfg.emblem](ctx, W >> 1, Math.round(roofH * 0.45));\n  }\n\n  // door\n  const doorW = W >= 40 ? 12 : 10;\n  const doorH = Math.min(wallH - baseH - 2, t >= 3 ? 17 : 15);\n  doorway(ctx, cfg.doorCX ?? (W >> 1), H - baseH, doorW, doorH, t, { arch: t >= 3 });\n\n  // windows\n  const winY = wallTop + 7;\n  const ww = t === 1 ? 4 : t === 2 ? 5 : 6;\n  const wh = t === 1 ? 4 : 5;\n  const lit = t >= 3;\n  const spots = cfg.windows || (W >= 40 ? [7, W - 8] : [6, W - 7]);\n  for (const sx of spots) {\n    window9(ctx, sx - (ww >> 1), winY, ww, wh, lit, {\n      shutters: t >= 2 ? mix(ramp[2], P.wood2, 0.4) : null,\n      box: t >= 3,\n    });\n  }\n\n  // tier dressing\n  if (t >= 2) chimney(ctx, cfg.chimX ?? (W - 12), Math.max(0, roofH - overhangPx - 6), overhangPx > 8 ? 12 : 9, t >= 3);\n  if (t >= 3) {\n    banner(ctx, 2, roofH + 1, 12, ramp[1], ramp[3]);\n    banner(ctx, W - 6, roofH + 1, 12, ramp[1], ramp[3]);\n    // planters flanking the door\n    for (const px0 of [3, W - 9]) {\n      px(ctx, px0, H - baseH - 5, P.wood2, 6, 5);\n      px(ctx, px0, H - baseH - 5, P.wood1, 6, 1);\n      px(ctx, px0 + 5, H - baseH - 5, P.wood3, 1, 5);\n      for (let i = 0; i < 6; i += 2) {\n        px(ctx, px0 + i, H - baseH - 7, P.leaf2, 1, 2);\n        px(ctx, px0 + i, H - baseH - 8, i % 4 ? P.bloom1 : P.gold1, 1, 1);\n      }\n    }\n  }\n  if (t >= 4) {\n    // a second, grander roof tier plus a lantern on the ridge\n    const rH = Math.round(roofH * 0.55);\n    const sub = shingleRoof(ctx, W - 8, rH, ramp, { ridge: P.gold1 });\n    ctx.save();\n    ctx.restore();\n    px(ctx, (W >> 1) - 3, 0, P.gold2, 6, 2);\n    px(ctx, (W >> 1) - 2, -4, LITG[1], 4, 5);\n    px(ctx, (W >> 1) - 2, -4, LITG[0], 4, 2);\n  }\n}\n\n/** t4 needs the small upper roof composited above, so it gets its own routine */\nfunction grandHouse(ctx, W, H, cfg) {\n  house(ctx, W, H, { ...cfg, tier: 3 });\n  const ramp = cfg.roof;\n  const upH = 12, upW = W - 14;\n  const ox = (W - upW) >> 1;\n  ctx.save();\n  ctx.translate(ox, 0);\n  shingleRoof(ctx, upW, upH, ramp, { ridge: P.gold1 });\n  ctx.restore();\n  // cupola lantern\n  px(ctx, (W >> 1) - 4, upH - 2, P.wood3, 8, 5);\n  px(ctx, (W >> 1) - 3, upH - 1, LITG[1], 6, 3);\n  px(ctx, (W >> 1) - 3, upH - 1, LITG[0], 6, 1);\n  px(ctx, (W >> 1) - 1, upH, P.white, 2, 1);\n  px(ctx, (W >> 1) - 5, upH + 3, P.wood2, 10, 1);\n  ctx.globalAlpha = 0.18; ellipse(ctx, W >> 1, upH, 12, 10, LITG[0]); ctx.globalAlpha = 1;\n  banner(ctx, 4, upH + 6, 14, P.gold1, P.gold3);\n  banner(ctx, W - 8, upH + 6, 14, P.gold1, P.gold3);\n}\n\n// ---- bespoke buildings --------------------------------------------------\n\nfunction gardenPlot(ctx, W, H, t) {\n  // tilled beds, fence, and a visible harvest ladder\n  px(ctx, 0, 0, P.soil1, W, H);\n  for (let r = 0; r < H; r += 4) {\n    px(ctx, 0, r, P.soil0, W, 1);\n    px(ctx, 0, r + 2, P.soil2, W, 1);\n    px(ctx, 0, r + 3, P.soil3, W, 1);\n  }\n  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (hash(x, y, 401) > 0.95) px(ctx, x, y, P.soil0);\n  const rows = t === 1 ? 2 : t === 2 ? 3 : 4;\n  for (let r = 0; r < rows; r++) {\n    const y = H - 4 - r * 6;\n    for (let x = 4; x < W - 3; x += 6) {\n      if (t === 1) {\n        px(ctx, x, y - 2, P.leaf2, 1, 2); px(ctx, x - 1, y - 3, P.leaf1, 3, 1);\n      } else {\n        px(ctx, x, y - 5, P.leaf2, 1, 5);\n        px(ctx, x - 2, y - 4, P.leaf1, 2, 1); px(ctx, x + 1, y - 5, P.leaf1, 2, 1);\n        px(ctx, x - 2, y - 2, P.leaf0, 2, 1); px(ctx, x + 1, y - 3, P.leaf0, 2, 1);\n        if (t >= 3) { px(ctx, x - 1, y - 1, P.ember2, 2, 2); px(ctx, x - 1, y - 1, P.ember1); }\n      }\n    }\n  }\n  // fence\n  px(ctx, 0, 0, P.wood3, W, 2); px(ctx, 0, 0, P.wood2, W, 1);\n  for (let x = 1; x < W; x += 7) { px(ctx, x, 0, P.wood2, 2, 5); px(ctx, x, 0, P.wood1, 1, 5); }\n  if (t >= 2) {\n    px(ctx, 0, H - 2, P.wood3, W, 2);\n    for (let x = 1; x < W; x += 7) { px(ctx, x, H - 5, P.wood2, 2, 5); px(ctx, x, H - 5, P.wood1, 1, 5); }\n  }\n  if (t >= 3) {\n    // trellis + scarecrow\n    px(ctx, W - 5, 2, P.wood2, 2, H - 6); px(ctx, W - 5, 2, P.wood1, 1, H - 6);\n    for (let y = 4; y < H - 6; y += 4) px(ctx, W - 8, y, P.leaf2, 5, 1);\n    px(ctx, 3, 3, P.wood3, 1, 9);\n    px(ctx, 1, 5, P.wood3, 5, 1);\n    px(ctx, 2, 5, P.roofB1, 3, 4); px(ctx, 2, 5, P.roofB0, 3, 1);\n    ellipse(ctx, 3.5, 3, 2.2, 2, (x, y, dx, dy, d) => d > 0.75 ? P.sand2 : P.sand0);\n    px(ctx, 3, 3, P.ink2); px(ctx, 4, 3, P.ink2);\n    px(ctx, 1, 1, P.gold2, 5, 1);\n  }\n  autoOutline(ctx, W, H, 0.5);\n}\n\nfunction fountain(ctx, W, H, t) {\n  const cy = H - 7;\n  // basin\n  ellipse(ctx, W / 2, cy, W / 2 - 1, 7, (x, y, dx, dy, d) =>\n    d > 0.82 ? STONE[3] : (dx + dy < -0.2 ? STONE[0] : STONE[1]));\n  ellipse(ctx, W / 2, cy, W / 2 - 4, 4.6, (x, y, dx, dy, d) =>\n    d > 0.8 ? P.water4 : (dx + dy < -0.2 ? P.water1 : P.water2));\n  for (const [x, y, w] of [[6, cy - 2, 5], [18, cy + 1, 6]]) px(ctx, x, y, P.water0, w, 1);\n  // pedestal\n  px(ctx, W / 2 - 3, cy - 10, STONE[2], 6, 10);\n  px(ctx, W / 2 - 3, cy - 10, STONE[1], 4, 10);\n  px(ctx, W / 2 - 3, cy - 10, STONE[0], 1, 10);\n  if (t >= 2) {\n    ellipse(ctx, W / 2, cy - 11, 7, 3, (x, y, dx, dy, d) => d > 0.8 ? STONE[3] : (dy < 0 ? STONE[0] : STONE[1]));\n    ellipse(ctx, W / 2, cy - 12, 4.5, 2, (x, y, dx, dy, d) => P.water1);\n    px(ctx, W / 2 - 1, cy - 18, P.gold1, 2, 6);\n    px(ctx, W / 2 - 1, cy - 18, P.gold0, 1, 6);\n    px(ctx, W / 2 - 3, cy - 20, P.gold2, 6, 2);\n    px(ctx, W / 2 - 3, cy - 20, P.gold0, 6, 1);\n    // falling water\n    for (const dx of [-6, 6]) {\n      px(ctx, W / 2 + dx, cy - 10, P.water0, 1, 7);\n      px(ctx, W / 2 + dx + (dx < 0 ? 1 : -1), cy - 8, P.water1, 1, 5);\n    }\n    px(ctx, W / 2 - 1, cy - 22, P.water0, 2, 2);\n  } else {\n    px(ctx, W / 2 - 2, cy - 13, P.water1, 4, 4);\n    px(ctx, W / 2 - 1, cy - 15, P.water0, 2, 3);\n  }\n  autoOutline(ctx, W, H, 0.5);\n}\n\nfunction marketStall(ctx, W, H, t) {\n  const ramp = ROOFR;\n  // awning\n  const aH = 12;\n  for (let y = 0; y < aH; y++) {\n    const half = Math.round(4 + (W / 2 - 1 - 4) * (y / (aH - 1)));\n    const x0 = (W >> 1) - half, x1 = (W >> 1) + half - 1;\n    for (let x = x0; x <= x1; x++) {\n      const stripe = Math.floor((x - x0) / 4) % 2;\n      px(ctx, x, y, stripe ? P.paper0 : ramp[1], 1, 1);\n      if (y === 0) px(ctx, x, y, stripe ? P.paper2 : ramp[3]);\n    }\n    px(ctx, x0, y, ramp[3]); px(ctx, x1, y, shade(ramp[3], -0.2));\n  }\n  for (let x = 2; x < W - 2; x += 4) px(ctx, x, aH, ramp[2], 2, 2);\n  // posts\n  for (const x of [2, W - 5]) {\n    px(ctx, x, aH - 2, P.wood3, 3, H - aH + 2);\n    px(ctx, x, aH - 2, P.wood2, 1, H - aH + 2);\n  }\n  // counter\n  const cy = H - 10;\n  px(ctx, 1, cy, P.wood1, W - 2, 3);\n  px(ctx, 1, cy, P.wood0, W - 2, 1);\n  px(ctx, 1, cy + 3, P.wood3, W - 2, 1);\n  px(ctx, 1, cy + 4, P.wood2, W - 2, H - cy - 5);\n  for (let x = 2; x < W - 2; x += 4) px(ctx, x, cy + 4, P.wood3, 1, H - cy - 5);\n  px(ctx, 1, H - 1, P.wood4, W - 2, 1);\n  // goods\n  const goods = t === 1 ? 2 : t === 2 ? 4 : 6;\n  for (let i = 0; i < goods; i++) {\n    const x = 5 + i * 6, y = cy - 3;\n    const kind = i % 3;\n    if (kind === 0) { ellipse(ctx, x, y, 2.2, 2, (X, Y, dx, dy, d) => d > 0.7 ? P.roof3 : (dx + dy < -0.2 ? P.roof0 : P.roof1)); }\n    if (kind === 1) { px(ctx, x - 2, y - 2, P.gold1, 5, 4); px(ctx, x - 2, y - 2, P.gold0, 5, 1); px(ctx, x + 2, y - 1, P.gold3, 1, 3); }\n    if (kind === 2) { ellipse(ctx, x, y, 2.4, 2, (X, Y, dx, dy, d) => d > 0.7 ? P.leaf3 : (dx + dy < -0.2 ? P.leaf0 : P.leaf1)); }\n  }\n  if (t >= 2) {\n    px(ctx, W - 12, cy - 9, P.wood2, 11, 7);\n    px(ctx, W - 12, cy - 9, P.wood1, 11, 1);\n    px(ctx, W - 11, cy - 7, P.paper1, 9, 4);\n    EMBLEM.coin(ctx, W - 7, cy - 5);\n  }\n  if (t >= 3) {\n    banner(ctx, 1, aH, 10, P.gold1, P.gold3);\n    banner(ctx, W - 5, aH, 10, P.gold1, P.gold3);\n    px(ctx, 3, H - 8, P.wood2, 7, 7); px(ctx, 3, H - 8, P.wood1, 7, 1);\n    px(ctx, 3, H - 5, P.wood3, 7, 1);\n  }\n  autoOutline(ctx, W, H, 0.5);\n}\n\nfunction villageGate(ctx, W, H, t) {\n  // two stone piers and a timber lintel\n  for (const x of [1, W - 9]) {\n    stoneBase(ctx, x, 10, 8, H - 10);\n    px(ctx, x, 8, STONE[1], 8, 3);\n    px(ctx, x, 8, STONE[0], 8, 1);\n    px(ctx, x + 7, 8, STONE[3], 1, H - 8);\n  }\n  px(ctx, 0, 4, P.wood3, W, 5);\n  px(ctx, 0, 4, P.wood2, W, 3);\n  px(ctx, 0, 4, P.wood1, W, 1);\n  px(ctx, 0, 8, P.wood4, W, 1);\n  for (let x = 3; x < W; x += 6) px(ctx, x, 5, P.wood3, 1, 3);\n  // sign board\n  px(ctx, (W >> 1) - 9, 9, P.wood2, 18, 8);\n  px(ctx, (W >> 1) - 9, 9, P.wood1, 18, 1);\n  px(ctx, (W >> 1) - 8, 11, P.paper1, 16, 5);\n  px(ctx, (W >> 1) - 8, 11, P.paper0, 16, 1);\n  for (let i = 0; i < 3; i++) px(ctx, (W >> 1) - 6 + i * 5, 13, P.ink3, 3, 1);\n  px(ctx, (W >> 1) - 9, 16, P.wood4, 18, 1);\n  if (t >= 2) {\n    px(ctx, 0, 2, P.wood2, W, 2); px(ctx, 0, 2, P.wood1, W, 1);\n    for (const x of [4, W - 8]) {\n      px(ctx, x, 9, P.wood3, 1, 3);\n      px(ctx, x - 2, 12, LITG[2], 5, 5);\n      px(ctx, x - 2, 12, LITG[1], 5, 3);\n      px(ctx, x - 1, 13, LITG[0], 3, 2);\n      px(ctx, x - 2, 11, P.wood3, 5, 1);\n      ctx.globalAlpha = 0.16; ellipse(ctx, x, 14, 8, 8, LITG[0]); ctx.globalAlpha = 1;\n    }\n    banner(ctx, 6, 9, 12, P.roof1, P.roof3);\n    banner(ctx, W - 10, 9, 12, P.roof1, P.roof3);\n    for (let x = 0; x < W; x += 4) px(ctx, x, 1, P.leaf2, 3, 2);\n    for (let x = 2; x < W; x += 8) px(ctx, x, 0, P.bloom1, 2, 2);\n  }\n  autoOutline(ctx, W, H, 0.5);\n}\n\nfunction bellTower(ctx, W, H, t) {\n  // stone shaft\n  stoneBase(ctx, 2, 24, W - 4, H - 24);\n  px(ctx, 2, 24, STONE[2], W - 4, H - 24);\n  for (let r = 0; r < Math.ceil((H - 24) / 4); r++) {\n    const y = 24 + r * 4, off = r % 2 ? -3 : 0;\n    for (let i = off; i < W - 4; i += 7) {\n      const x = 2 + Math.max(0, i), w = Math.min(6, W - 2 - x);\n      px(ctx, x, y, STONE[1], w, 3);\n      px(ctx, x, y, STONE[0], w, 1);\n      px(ctx, x + w - 1, y, STONE[3], 1, 3);\n    }\n  }\n  px(ctx, 2, 24, STONE[0], 1, H - 24); px(ctx, W - 3, 24, STONE[4], 1, H - 24);\n  // arched belfry opening\n  px(ctx, 4, 12, P.wood3, W - 8, 13);\n  px(ctx, 5, 13, '#241c2c', W - 10, 12);\n  ellipse(ctx, W / 2, 16, W / 2 - 5, 5, (x, y, dx, dy, d) => dy > 0 ? null : (d > 0.75 ? P.wood3 : '#241c2c'));\n  // bell\n  const bc = t >= 2 ? [P.gold0, P.gold1, P.gold2, P.gold3] : [STONE[0], STONE[1], STONE[2], STONE[3]];\n  ellipse(ctx, W / 2, 19, 5, 5.5, (x, y, dx, dy, d) =>\n    dy > 0.45 ? null : (d > 0.78 ? bc[3] : (dx + dy < -0.2 ? bc[0] : bc[1])));\n  px(ctx, W / 2 - 5, 21, bc[2], 10, 2);\n  px(ctx, W / 2 - 5, 21, bc[1], 10, 1);\n  px(ctx, W / 2 - 1, 23, bc[3], 2, 2);\n  px(ctx, W / 2 - 1, 12, bc[2], 2, 2);\n  // roof\n  const rH = 13;\n  shingleRoof(ctx, W, rH, ROOFG, { ridge: t >= 2 ? P.gold1 : null, scallop: t >= 2 });\n  if (t >= 2) {\n    // clock face + banners\n    ellipse(ctx, W / 2, 30, 6, 6, (x, y, dx, dy, d) => d > 0.86 ? P.gold3 : (d > 0.74 ? P.gold2 : P.paper0));\n    px(ctx, W / 2, 30, P.ink2); px(ctx, W / 2, 27, P.ink3, 1, 3); px(ctx, W / 2, 30, P.ink3, 3, 1);\n    for (const [dx, dy] of [[0, -5], [5, 0], [0, 5], [-5, 0]]) px(ctx, (W >> 1) + dx, 30 + dy, P.ink3);\n    banner(ctx, 1, rH + 1, 12, P.roofG1, P.roofG3);\n    banner(ctx, W - 5, rH + 1, 12, P.roofG1, P.roofG3);\n    px(ctx, (W >> 1) - 1, 0, P.gold1, 2, 3);\n  }\n  px(ctx, 1, H - 3, STONE[1], W - 2, 3);\n  px(ctx, 1, H - 3, STONE[0], W - 2, 1);\n  px(ctx, 1, H - 1, STONE[4], W - 2, 1);\n  autoOutline(ctx, W, H, 0.5);\n}\n\nconst BCFG = {\n  hearthstone: { roof: ROOFR, emblem: 'flame' },\n  cottage: { roof: ROOFR, emblem: 'flower' },\n  kitchen: { roof: LITG.map(c => mix(c, P.roof1, 0.3)), emblem: 'pot' },\n  workshop: { roof: ROOFB, emblem: 'hammer' },\n  library: { roof: ROOFV, emblem: 'book' },\n  infirmary: { roof: PLAS, emblem: 'heart' },\n  bathhouse: { roof: ROOFB.map(c => mix(c, P.water1, 0.3)), emblem: 'drop' },\n};\n\nfunction buildingPainter(b, tier) {\n  const W = b.w * 16, H = (b.h + b.overhang) * 16;\n  return ctx => {\n    if (b.id === 'garden') return gardenPlot(ctx, W, H, tier);\n    if (b.id === 'fountain') return fountain(ctx, W, H, tier);\n    if (b.id === 'market') return marketStall(ctx, W, H, tier);\n    if (b.id === 'gate') return villageGate(ctx, W, H, tier);\n    if (b.id === 'belltower') return bellTower(ctx, W, H, tier);\n    const cfg = { ...(BCFG[b.id] || { roof: ROOFR }), tier, overhang: b.overhang };\n    if (tier >= 4) grandHouse(ctx, W, H, cfg);\n    else house(ctx, W, H, cfg);\n    autoOutline(ctx, W, H, 0.5);\n  };\n}\n\n// ===========================================================================\nexport function register() {\n  for (const who of CHARS) {\n    const base = LOOKS[who] || LOOKS.hero;\n    for (const dir of DIRS4) {\n      const look = { ...base, __dir: dir };\n      Atlas.defineAnim(`c.${who}.${dir}`, 16, 24, CHAR_FRAMES, charPainter(look));\n    }\n  }\n  for (const b of BUILDINGS) {\n    for (let i = 1; i <= b.tiers; i++) {\n      Atlas.define(`b.${b.id}.t${i}`, b.w * 16, (b.h + b.overhang) * 16, buildingPainter(b, i));\n    }\n  }\n}\n","deps":{"./atlas.js":"art/atlas.js","./palette.js":"art/palette.js","./names.js":"art/names.js","./tiles.js":"art/tiles.js"}},{"id":"art/creatures.js","code":"// The Guardians.\n//\n// 18 species x front / back / overworld. Rather than 54 unrelated drawings, every\n// creature is described by a spec — silhouette, ramp, ears, tail, wings, markings —\n// and painted by one shared routine. That is what makes them read as a family, and\n// it is what makes an evolution look like the same creature grown up: the child and\n// the adult share a spec and differ by mass, detail, and a couple of features.\n\nimport { Atlas } from './atlas.js';\nimport { GUARDIANS } from './names.js';\nimport { P, RAMP, mix, shade } from './palette.js';\n\n// ---------------------------------------------------------------- paint helpers\nconst fill = (ctx, x, y, c, w = 1, h = 1) => { ctx.fillStyle = c; ctx.fillRect(x | 0, y | 0, w, h); };\n\nfunction ellipse(ctx, cx, cy, rx, ry, c) {\n  ctx.fillStyle = c;\n  for (let y = Math.ceil(cy - ry); y <= cy + ry; y++) {\n    const t = (y + 0.5 - cy) / ry;\n    if (Math.abs(t) > 1) continue;\n    const half = Math.sqrt(1 - t * t) * rx;\n    const x0 = Math.round(cx - half), x1 = Math.round(cx + half);\n    if (x1 > x0) ctx.fillRect(x0, y, x1 - x0, 1);\n  }\n}\n\n/** Ellipse with a light-from-top-left ramp: the house shading rule, everywhere. */\nfunction orb(ctx, cx, cy, rx, ry, ramp, { lift = 0 } = {}) {\n  ellipse(ctx, cx, cy, rx, ry, ramp[3]);\n  ellipse(ctx, cx, cy - ry * 0.10, rx * 0.94, ry * 0.90, ramp[2]);\n  ellipse(ctx, cx - rx * 0.16, cy - ry * 0.26, rx * 0.74, ry * 0.68, ramp[1]);\n  ellipse(ctx, cx - rx * 0.28, cy - ry * 0.42, rx * 0.42, ry * 0.36, ramp[Math.max(0, 1 - lift)]);\n}\n\n/** 1px outline in a darker shade of the sprite's own colour — never pure black. */\nfunction outline(ctx, w, h, col) {\n  const img = ctx.getImageData(0, 0, w, h);\n  const d = img.data;\n  const at = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? 0 : d[(y * w + x) * 4 + 3];\n  const out = [];\n  for (let y = 0; y < h; y++) {\n    for (let x = 0; x < w; x++) {\n      if (at(x, y) !== 0) continue;\n      if (at(x - 1, y) || at(x + 1, y) || at(x, y - 1) || at(x, y + 1)) out.push([x, y]);\n    }\n  }\n  ctx.fillStyle = col;\n  for (const [x, y] of out) ctx.fillRect(x, y, 1, 1);\n}\n\nfunction eyes(ctx, cx, cy, spread, r, col, { closed = false, shine = true } = {}) {\n  for (const s of [-1, 1]) {\n    const ex = cx + s * spread;\n    if (closed) { fill(ctx, ex - r, cy, P.ink, r * 2, 1); continue; }\n    ellipse(ctx, ex, cy, r, r * 1.15, P.ink);\n    ellipse(ctx, ex, cy + r * 0.2, r * 0.72, r * 0.8, col);\n    if (shine) fill(ctx, ex - Math.max(1, r * 0.4), cy - r * 0.5, '#ffffff', 1, 1);\n  }\n}\n\nfunction ramper(base) {\n  return [shade(base, 0.42), shade(base, 0.2), base, shade(base, -0.22), shade(base, -0.44)];\n}\n\n// ---------------------------------------------------------------- feature parts\nfunction earFox(ctx, cx, cy, w, h, ramp, dir) {\n  const s = dir;\n  ctx.fillStyle = ramp[2];\n  for (let i = 0; i < h; i++) {\n    const ww = Math.max(1, Math.round(w * (1 - i / h)));\n    ctx.fillRect(cx + s * i * 0.35 - ww / 2, cy - i, ww, 1);\n  }\n  ctx.fillStyle = ramp[4];\n  for (let i = 0; i < h * 0.6; i++) {\n    const ww = Math.max(1, Math.round(w * 0.45 * (1 - i / (h * 0.6))));\n    ctx.fillRect(cx + s * i * 0.35 - ww / 2, cy - i - 1, ww, 1);\n  }\n}\n\nfunction earRabbit(ctx, cx, cy, w, h, ramp, dir) {\n  ellipse(ctx, cx + dir * h * 0.18, cy - h / 2, w / 2, h / 2, ramp[2]);\n  ellipse(ctx, cx + dir * h * 0.18, cy - h / 2, w / 4, h / 2.6, ramp[4]);\n}\n\nfunction tuftOwl(ctx, cx, cy, w, h, ramp, dir) {\n  ctx.fillStyle = ramp[3];\n  for (let i = 0; i < h; i++) ctx.fillRect(cx + dir * i * 0.5, cy - i, Math.max(1, w - i), 1);\n}\n\nfunction hornStone(ctx, cx, cy, w, h, ramp, dir) {\n  ctx.fillStyle = ramp[1];\n  for (let i = 0; i < h; i++) ctx.fillRect(cx + dir * i * 0.6 - w / 2, cy - i, Math.max(1, w - i * 0.6), 1);\n}\n\nfunction flameTail(ctx, x, y, size, hot) {\n  const R = [P.ember0, P.ember1, P.ember2, P.ember3];\n  const c = hot || R;\n  for (let i = 0; i < 4; i++) {\n    const k = 1 - i / 4;\n    ellipse(ctx, x + i * size * 0.10, y - i * size * 0.42, size * 0.52 * k + 1, size * 0.62 * k + 1, c[Math.min(3, i)]);\n  }\n  ellipse(ctx, x, y - size * 0.2, size * 0.28, size * 0.34, '#fff3c4');\n}\n\nfunction leafTail(ctx, x, y, size, ramp) {\n  for (let i = 0; i < 3; i++) {\n    const a = -0.5 + i * 0.5;\n    ellipse(ctx, x + Math.cos(a) * size * 0.5, y - size * 0.3 + Math.sin(a) * size * 0.4,\n      size * 0.42, size * 0.22, ramp[i === 1 ? 1 : 2]);\n  }\n  fill(ctx, x - 1, y - size * 0.35, ramp[4], size * 0.9, 1);\n}\n\nfunction boltTail(ctx, x, y, size) {\n  const pts = [[0, 0], [0.5, -0.4], [0.2, -0.45], [0.8, -1.0], [0.45, -0.55], [0.75, -0.5]];\n  ctx.fillStyle = P.spark1;\n  for (let i = 0; i < pts.length - 1; i++) {\n    const [ax, ay] = pts[i], [bx, by] = pts[i + 1];\n    const steps = Math.ceil(size);\n    for (let s = 0; s <= steps; s++) {\n      const t = s / steps;\n      ctx.fillRect(Math.round(x + (ax + (bx - ax) * t) * size), Math.round(y + (ay + (by - ay) * t) * size), 2, 2);\n    }\n  }\n  ctx.fillStyle = P.spark0;\n  ctx.fillRect(Math.round(x + 0.5 * size), Math.round(y - 0.5 * size), 2, 2);\n}\n\nfunction dropTail(ctx, x, y, size, ramp) {\n  ellipse(ctx, x, y - size * 0.2, size * 0.4, size * 0.5, ramp[2]);\n  ctx.fillStyle = ramp[1];\n  for (let i = 0; i < size * 0.6; i++) ctx.fillRect(x - 1, y - size * 0.6 - i, 2, 1);\n  fill(ctx, x - 1, y - size * 0.35, '#ffffff', 1, 1);\n}\n\nfunction wingFeather(ctx, cx, cy, w, h, ramp, dir, spread = 1) {\n  for (let i = 0; i < 3; i++) {\n    const k = 1 - i * 0.22;\n    ellipse(ctx, cx + dir * (w * 0.35 + i * 2) * spread, cy + i * h * 0.2,\n      w * 0.42 * k, h * 0.52 * k, ramp[1 + (i % 2)]);\n  }\n  ellipse(ctx, cx + dir * w * 0.3 * spread, cy, w * 0.4, h * 0.55, ramp[2]);\n}\n\nfunction wingBat(ctx, cx, cy, w, h, ramp, dir) {\n  ctx.fillStyle = ramp[3];\n  for (let i = 0; i < h; i++) {\n    const ww = Math.round(w * (1 - Math.abs(i - h / 2) / (h / 1.4)));\n    if (ww > 0) ctx.fillRect(cx + (dir > 0 ? 0 : -ww), cy - h / 2 + i, ww, 1);\n  }\n  ctx.fillStyle = ramp[4];\n  for (let i = 0; i < 3; i++) ctx.fillRect(cx + dir * (2 + i * (w / 3.5)) - (dir < 0 ? 1 : 0), cy - h / 2 + 2, 1, h - 4);\n}\n\nfunction petalCrown(ctx, cx, cy, r, ramp) {\n  for (let i = 0; i < 6; i++) {\n    const a = (i / 6) * Math.PI * 2 - 0.4;\n    ellipse(ctx, cx + Math.cos(a) * r, cy + Math.sin(a) * r * 0.7, r * 0.5, r * 0.42, ramp[i % 2 ? 1 : 2]);\n  }\n  ellipse(ctx, cx, cy, r * 0.42, r * 0.38, P.gold1);\n}\n\nfunction rockPlates(ctx, cx, cy, rx, ry, ramp) {\n  for (let i = 0; i < 7; i++) {\n    const a = -Math.PI + (i / 6) * Math.PI;\n    ellipse(ctx, cx + Math.cos(a) * rx * 0.72, cy + Math.sin(a) * ry * 0.66,\n      rx * 0.26, ry * 0.24, i % 2 ? ramp[1] : ramp[3]);\n  }\n}\n\n// ---------------------------------------------------------------- species specs\n// `mass` scales the whole creature; stage-2 and stage-3 forms are bigger and\n// carry an extra feature, so an evolution reads as growth rather than replacement.\nconst SPEC = {\n  embercub:   { shape: 'quad', base: '#f08a3c', mass: 0.74, ears: 'fox', tail: 'flame', belly: '#ffdca8', eye: '#4fd0e8', legs: 4, mark: 'blaze' },\n  emberlynx:  { shape: 'quad', base: '#ef7a2a', mass: 0.90, ears: 'fox', tail: 'flame', belly: '#ffd39a', eye: '#4fd0e8', legs: 4, mark: 'blaze', mane: true },\n  pyrelion:   { shape: 'quad', base: '#e8641d', mass: 1.06, ears: 'fox', tail: 'flame', belly: '#ffcb86', eye: '#ffe066', legs: 4, mark: 'blaze', mane: true, crown: 'ember' },\n\n  leafowl:    { shape: 'bird', base: '#7fc056', mass: 0.72, ears: 'owl', tail: 'leaf', belly: '#e2f0c0', eye: '#f5c020', legs: 2, wings: 'feather', beak: true },\n  grovewing:  { shape: 'bird', base: '#5ea23e', mass: 0.98, ears: 'owl', tail: 'leaf', belly: '#d6ecb2', eye: '#f5c020', legs: 2, wings: 'feather', beak: true, crown: 'leaf' },\n\n  aquarabbit: { shape: 'quad', base: '#5fc2e8', mass: 0.72, ears: 'rabbit', tail: 'drop', belly: '#dff4fb', eye: '#2a6fa8', legs: 4, mark: 'splash' },\n  torrentide: { shape: 'quad', base: '#3f9fd4', mass: 1.0, ears: 'rabbit', tail: 'drop', belly: '#cfeaf8', eye: '#1d5b85', legs: 4, mark: 'splash', crown: 'wave' },\n\n  terranox:   { shape: 'squat', base: '#8f9b6a', mass: 0.80, ears: 'horn', tail: 'none', belly: '#d9d3a8', eye: '#f0d070', legs: 4, shell: true },\n  cragnox:    { shape: 'squat', base: '#7d8a5c', mass: 1.04, ears: 'horn', tail: 'none', belly: '#cfc79c', eye: '#f0d070', legs: 4, shell: true, crown: 'stone' },\n\n  wisplet:    { shape: 'wisp', base: '#dfeaf5', mass: 0.66, ears: 'fox', tail: 'wisp', belly: '#ffffff', eye: '#7fc7e8', legs: 0, wings: 'feather', float: true },\n  zephyrix:   { shape: 'wisp', base: '#eef5fb', mass: 0.98, ears: 'fox', tail: 'wisp', belly: '#ffffff', eye: '#5aa8d8', legs: 0, wings: 'feather', float: true, serpent: true },\n\n  voltkit:    { shape: 'quad', base: '#f5d63f', mass: 0.72, ears: 'fox', tail: 'bolt', belly: '#fff3bb', eye: '#3b3222', legs: 4, mark: 'zag' },\n  voltmane:   { shape: 'quad', base: '#eec92c', mass: 1.0, ears: 'fox', tail: 'bolt', belly: '#fff0aa', eye: '#3b3222', legs: 4, mark: 'zag', mane: true },\n\n  florabloom: { shape: 'sprite', base: '#8fd07a', mass: 0.70, ears: 'none', tail: 'leaf', belly: '#e6f6d4', eye: '#2f6b3a', legs: 2, crown: 'petal' },\n  floradiant: { shape: 'sprite', base: '#7ac167', mass: 0.96, ears: 'none', tail: 'leaf', belly: '#ddf2c8', eye: '#2f6b3a', legs: 2, crown: 'petal', wings: 'feather' },\n\n  drakindle:  { shape: 'drake', base: '#e05a3a', mass: 0.80, ears: 'horn', tail: 'flame', belly: '#f7c98e', eye: '#ffd24a', legs: 2, wings: 'bat' },\n  drakember:  { shape: 'drake', base: '#cf4527', mass: 1.06, ears: 'horn', tail: 'flame', belly: '#f2bb7c', eye: '#ffd24a', legs: 2, wings: 'bat', crown: 'ember' },\n\n  hearthling: { shape: 'wisp', base: '#f5c877', mass: 0.78, ears: 'none', tail: 'flame', belly: '#fff0cc', eye: '#c0521a', legs: 0, float: true, crown: 'ember', glow: true },\n};\n\n// ---------------------------------------------------------------- the painter\nfunction paintCreature(ctx, W, H, id, view) {\n  const s = SPEC[id];\n  if (!s) return;\n  const ramp = ramper(s.base);\n  const belly = ramper(s.belly);\n  const back = view === 'back';\n  const M = s.mass * (W / 64);\n\n  // Silhouette is the first thing a player reads, so the archetype changes the\n  // actual proportions rather than just the decoration on top of one egg.\n  const FORM = {\n    quad:   { bx: 1.16, by: 0.82, hr: 0.92, neck: 0.42, lift: 2 },\n    bird:   { bx: 0.84, by: 1.00, hr: 1.08, neck: 0.20, lift: 2 },\n    squat:  { bx: 1.26, by: 0.70, hr: 0.86, neck: 0.24, lift: 1 },\n    wisp:   { bx: 0.74, by: 1.14, hr: 0.96, neck: 0.50, lift: 9 },\n    sprite: { bx: 0.72, by: 0.72, hr: 1.02, neck: 0.34, lift: 2 },\n    drake:  { bx: 0.92, by: 1.02, hr: 0.94, neck: 0.44, lift: 2 },\n  };\n  const f = FORM[s.shape] || FORM.quad;\n\n  const cx = W / 2;\n  const groundY = H - 6 * (W / 64);\n  const bodyRx = 15 * M * f.bx, bodyRy = 13 * M * f.by;\n  const bodyCy = groundY - bodyRy - (s.float ? 8 * M : f.lift * M);\n  const headR = 11 * M * f.hr;\n  const headCy = bodyCy - bodyRy - headR * f.neck;\n\n  // --- behind the body ---\n  if (s.wings === 'feather') {\n    wingFeather(ctx, cx - bodyRx * 0.5, bodyCy - bodyRy * 0.2, 16 * M, 20 * M, ramp, -1, back ? 1.25 : 1);\n    wingFeather(ctx, cx + bodyRx * 0.5, bodyCy - bodyRy * 0.2, 16 * M, 20 * M, ramp, 1, back ? 1.25 : 1);\n  }\n  if (s.wings === 'bat') {\n    wingBat(ctx, cx - bodyRx * 0.7, bodyCy - bodyRy * 0.3, 18 * M, 22 * M, ramp, -1);\n    wingBat(ctx, cx + bodyRx * 0.7, bodyCy - bodyRy * 0.3, 18 * M, 22 * M, ramp, 1);\n  }\n\n  // --- tail ---\n  // From behind, a centred tail hides inside the body — push it out to one side so\n  // the player's own Guardian still reads as itself.\n  const tailX = cx + bodyRx * (back ? -1.0 : 0.92);\n  const tailY = bodyCy - bodyRy * (back ? 0.35 : 0.15);\n  if (s.tail === 'flame') flameTail(ctx, tailX, tailY, 18 * M);\n  else if (s.tail === 'leaf') leafTail(ctx, tailX, tailY, 16 * M, RAMP.leaf);\n  else if (s.tail === 'bolt') boltTail(ctx, tailX - 2, tailY, 9 * M);\n  else if (s.tail === 'drop') dropTail(ctx, tailX, tailY, 14 * M, RAMP.water);\n  else if (s.tail === 'wisp') {\n    for (let i = 0; i < 4; i++) {\n      ellipse(ctx, tailX + i * 3 * M, tailY - i * 3 * M, (5 - i) * M, (4 - i * 0.7) * M, ramp[1]);\n    }\n  }\n\n  // --- legs ---\n  if (s.legs === 4) {\n    for (const sx of [-1, 1]) {\n      ellipse(ctx, cx + sx * bodyRx * 0.62, groundY - 3 * M, 4 * M, 4.5 * M, ramp[3]);\n      ellipse(ctx, cx + sx * bodyRx * 0.34, groundY - 2 * M, 3.6 * M, 4 * M, ramp[2]);\n    }\n  } else if (s.legs === 2) {\n    for (const sx of [-1, 1]) {\n      ellipse(ctx, cx + sx * bodyRx * 0.42, groundY - 2.5 * M, 4 * M, 3.4 * M, P.gold2);\n      fill(ctx, cx + sx * bodyRx * 0.42 - 3 * M, groundY - 1 * M, P.gold3, 6 * M, 1);\n    }\n  }\n\n  // --- body ---\n  orb(ctx, cx, bodyCy, bodyRx, bodyRy, ramp);\n  if (!back) {\n    ellipse(ctx, cx, bodyCy + bodyRy * 0.28, bodyRx * 0.6, bodyRy * 0.58, belly[1]);\n  }\n  if (s.shell) rockPlates(ctx, cx, bodyCy, bodyRx, bodyRy, RAMP.rock);\n  if (s.mane) {\n    for (let i = 0; i < 9; i++) {\n      const a = Math.PI + (i / 8) * Math.PI;\n      ellipse(ctx, cx + Math.cos(a) * headR * 1.15, headCy + Math.sin(a) * headR * 1.1,\n        4.5 * M, 4 * M, i % 2 ? shade(s.base, -0.25) : shade(s.base, 0.12));\n    }\n  }\n  if (s.serpent) {\n    for (let i = 0; i < 3; i++) {\n      ellipse(ctx, cx + (i - 1) * 5 * M, bodyCy + bodyRy * 0.5 + i * 2 * M, 6 * M, 3.4 * M, ramp[2]);\n    }\n  }\n  // A wisp has no floor — it tapers into a tail instead of sitting on legs.\n  if (s.shape === 'wisp') {\n    for (let i = 0; i < 4; i++) {\n      const k = 1 - i / 4;\n      ellipse(ctx, cx + Math.sin(i * 1.1) * 3 * M, bodyCy + bodyRy * (0.8 + i * 0.34),\n        bodyRx * 0.52 * k, bodyRy * 0.26 * k, ramp[2 + (i % 2)]);\n    }\n  }\n  // A squat guardian is wider than it is tall and reads best with a heavy base.\n  if (s.shape === 'squat') {\n    ellipse(ctx, cx, bodyCy + bodyRy * 0.62, bodyRx * 0.92, bodyRy * 0.40, ramp[3]);\n  }\n  // A bird's chest is the shape you recognise it by.\n  if (s.shape === 'bird' && !back) {\n    ellipse(ctx, cx, bodyCy + bodyRy * 0.16, bodyRx * 0.62, bodyRy * 0.72, belly[1]);\n    ellipse(ctx, cx, bodyCy + bodyRy * 0.30, bodyRx * 0.44, bodyRy * 0.52, belly[0]);\n  }\n\n  // --- head ---\n  orb(ctx, cx, headCy, headR, headR * 0.94, ramp, { lift: 1 });\n\n  // ears / horns / tufts\n  for (const d of [-1, 1]) {\n    const ex = cx + d * headR * 0.62, ey = headCy - headR * 0.68;\n    if (s.ears === 'fox') earFox(ctx, ex, ey, 7 * M, 9 * M, ramp, d);\n    else if (s.ears === 'rabbit') earRabbit(ctx, ex, ey, 6 * M, 15 * M, ramp, d);\n    else if (s.ears === 'owl') tuftOwl(ctx, ex, ey, 5 * M, 7 * M, ramp, d);\n    else if (s.ears === 'horn') hornStone(ctx, ex, ey, 6 * M, 8 * M, RAMP.rock, d);\n  }\n\n  // Crowns sit clear above the brow — a signature feature must never eat the face.\n  if (s.crown === 'petal') petalCrown(ctx, cx, headCy - headR * 1.02, 7 * M, RAMP.gold.map(c => mix(c, P.bloom1, 0.6)));\n  if (s.crown === 'leaf') leafTail(ctx, cx + 2 * M, headCy - headR * 1.15, 12 * M, RAMP.leaf);\n  if (s.crown === 'ember') flameTail(ctx, cx, headCy - headR * 1.15, 12 * M);\n  if (s.crown === 'stone') { for (let i = -1; i <= 1; i++) hornStone(ctx, cx + i * 5 * M, headCy - headR * 0.8, 5 * M, 6 * M, RAMP.rock, i); }\n  if (s.crown === 'wave') {\n    for (let i = -1; i <= 1; i++) ellipse(ctx, cx + i * 5 * M, headCy - headR * 0.85, 3.5 * M, 4.5 * M, RAMP.water[1]);\n  }\n\n  // face — the back view keeps the head shape but shows no face\n  if (!back) {\n    // Big eyes are most of the appeal at this size — 64x64 has room, use it.\n    const eyeY = headCy + headR * 0.10;\n    const eyeR = Math.max(2.4, 3.7 * M);\n    eyes(ctx, cx, eyeY, headR * 0.46, eyeR, s.eye);\n    for (const d of [-1, 1]) {          // a warm cheek keeps the face from reading flat\n      ellipse(ctx, cx + d * headR * 0.78, eyeY + headR * 0.3, 2.4 * M, 1.6 * M, mix(s.base, P.bloom1, 0.45));\n    }\n    if (s.beak) {\n      ellipse(ctx, cx, eyeY + headR * 0.42, 3.2 * M, 2.6 * M, P.gold2);\n      fill(ctx, cx - 1, eyeY + headR * 0.42, P.gold3, 2, Math.max(1, 2 * M));\n    } else {\n      ellipse(ctx, cx, eyeY + headR * 0.38, 2.4 * M, 1.8 * M, shade(s.base, -0.5));\n      fill(ctx, cx - 1 * M, eyeY + headR * 0.52, shade(s.base, -0.5), 2 * M, 1);\n    }\n    if (s.mark === 'blaze') ellipse(ctx, cx, headCy - headR * 0.42, 3 * M, 4 * M, belly[0]);\n    if (s.mark === 'zag') {\n      ctx.fillStyle = shade(s.base, -0.35);\n      for (let i = 0; i < 4; i++) fill(ctx, cx - 5 * M + i * 2.5 * M, headCy - headR * 0.5 + (i % 2) * 2 * M, shade(s.base, -0.35), 2 * M, 1);\n    }\n    if (s.mark === 'splash') {\n      for (const d of [-1, 1]) ellipse(ctx, cx + d * headR * 0.66, headCy + headR * 0.34, 2.2 * M, 1.6 * M, belly[0]);\n    }\n  } else {\n    // back-of-head detail so the rear view isn't a blank egg\n    ellipse(ctx, cx, headCy + headR * 0.1, headR * 0.55, headR * 0.5, shade(s.base, -0.14));\n  }\n\n  outline(ctx, W, H, shade(s.base, -0.6));\n\n  if (s.glow) {\n    ctx.globalCompositeOperation = 'lighter';\n    ellipse(ctx, cx, bodyCy, bodyRx * 1.25, bodyRy * 1.2, 'rgba(245,200,119,0.16)');\n    ctx.globalCompositeOperation = 'source-over';\n  }\n}\n\n// Tiny overworld form: the same silhouette, simplified, with a 2-frame idle bob.\nfunction paintOverworld(ctx, W, H, id, frame) {\n  const s = SPEC[id];\n  if (!s) return;\n  const ramp = ramper(s.base);\n  const bob = frame ? 1 : 0;\n  const cx = W / 2, groundY = H - 2;\n  ellipse(ctx, cx, groundY, 5, 2, 'rgba(0,0,0,0.28)');\n  const bodyCy = groundY - 5 - bob;\n  ellipse(ctx, cx, bodyCy, 4.5, 3.6, ramp[3]);\n  ellipse(ctx, cx - 0.6, bodyCy - 0.8, 3.8, 2.8, ramp[2]);\n  const headCy = bodyCy - 4.6;\n  ellipse(ctx, cx, headCy, 4, 3.6, ramp[2]);\n  ellipse(ctx, cx - 0.8, headCy - 0.8, 3, 2.4, ramp[1]);\n  for (const d of [-1, 1]) {\n    if (s.ears === 'rabbit') fill(ctx, cx + d * 2, headCy - 6, ramp[2], 1, 4);\n    else if (s.ears !== 'none') fill(ctx, cx + d * 2.4 - (d < 0 ? 1 : 0), headCy - 4, ramp[3], 2, 3);\n  }\n  if (s.tail === 'flame') { fill(ctx, cx + 5, bodyCy - 3 - bob, P.ember1, 2, 3); fill(ctx, cx + 5, bodyCy - 4 - bob, P.ember0, 1, 1); }\n  else if (s.tail === 'bolt') fill(ctx, cx + 5, bodyCy - 3, P.spark1, 2, 3);\n  else if (s.tail === 'leaf') fill(ctx, cx + 5, bodyCy - 2, RAMP.leaf[1], 3, 2);\n  else if (s.tail === 'drop') fill(ctx, cx + 5, bodyCy - 2, RAMP.water[1], 2, 3);\n  fill(ctx, cx - 2, headCy, P.ink, 1, 1);\n  fill(ctx, cx + 1, headCy, P.ink, 1, 1);\n  outline(ctx, W, H, shade(s.base, -0.6));\n}\n\nexport function register() {\n  for (const g of GUARDIANS) {\n    Atlas.define(`g.${g.id}.front`, 64, 64, (ctx, w, h) => paintCreature(ctx, w, h, g.id, 'front'));\n    Atlas.define(`g.${g.id}.back`, 64, 64, (ctx, w, h) => paintCreature(ctx, w, h, g.id, 'back'));\n    Atlas.defineAnim(`g.${g.id}.ow`, 16, 16, 2, (ctx, w, h, f) => paintOverworld(ctx, w, h, g.id, f));\n  }\n}\n\nexport { SPEC };\n","deps":{"./atlas.js":"art/atlas.js","./names.js":"art/names.js","./palette.js":"art/palette.js"}},{"id":"art/effects.js","code":"// Effects: shadows, footfalls, weather, hit flashes, bonding, evolution.\n// Small, cheap, and animated — these are what make actions feel like they landed.\n\nimport { Atlas } from './atlas.js';\nimport { FX, ANIM_FX } from './names.js';\nimport { P, RAMP, mix, shade } from './palette.js';\n\nconst fill = (ctx, x, y, c, w = 1, h = 1) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); };\n\nfunction ellipse(ctx, cx, cy, rx, ry, c) {\n  if (rx <= 0 || ry <= 0) return;\n  ctx.fillStyle = c;\n  for (let y = Math.ceil(cy - ry); y <= cy + ry; y++) {\n    const t = (y + 0.5 - cy) / ry;\n    if (Math.abs(t) > 1) continue;\n    const half = Math.sqrt(1 - t * t) * rx;\n    const x0 = Math.round(cx - half), x1 = Math.round(cx + half);\n    if (x1 > x0) ctx.fillRect(x0, y, x1 - x0, 1);\n  }\n}\n\nfunction ring(ctx, cx, cy, r, c, thick = 1) {\n  ctx.fillStyle = c;\n  const steps = Math.max(10, Math.round(r * 7));\n  for (let i = 0; i < steps; i++) {\n    const a = (i / steps) * Math.PI * 2;\n    ctx.fillRect(Math.round(cx + Math.cos(a) * r), Math.round(cy + Math.sin(a) * r * 0.62), thick, thick);\n  }\n}\n\n// A small kit of per-effect painters. Anything not listed gets a sane default so a\n// missing painter degrades to \"faint sparkle\" rather than a magenta box.\nconst FXP = {\n  'fx.shadow': (ctx, w, h) => { ellipse(ctx, w / 2, h / 2, w / 2 - 1, h / 2 - 0.5, 'rgba(24,18,12,0.42)'); },\n  'fx.shadow.big': (ctx, w, h) => { ellipse(ctx, w / 2, h / 2, w / 2 - 2, h / 2 - 1, 'rgba(24,18,12,0.36)'); },\n\n  'fx.grass.rustle': (ctx, w, h, f) => {\n    const lean = [0, 2, 0, -2][f];\n    for (let i = 0; i < 5; i++) {\n      const x = 2 + i * 3;\n      ctx.fillStyle = i % 2 ? RAMP.grass[1] : RAMP.grass[2];\n      for (let j = 0; j < 6; j++) ctx.fillRect(x + Math.round(lean * j / 6), h - 2 - j, 1, 1);\n    }\n    if (f === 1 || f === 3) { fill(ctx, 3, h - 9, RAMP.grass[0]); fill(ctx, 12, h - 8, RAMP.grass[0]); }\n  },\n\n  'fx.dust': (ctx, w, h, f) => {\n    const r = 1.5 + f * 1.6, a = 0.5 - f * 0.11;\n    ellipse(ctx, w / 2 - 2, h - 4, r, r * 0.55, `rgba(226,208,170,${Math.max(0, a)})`);\n    ellipse(ctx, w / 2 + 3, h - 3, r * 0.7, r * 0.4, `rgba(226,208,170,${Math.max(0, a * 0.8)})`);\n  },\n\n  'fx.splash': (ctx, w, h, f) => {\n    ring(ctx, w / 2, h - 5, 2 + f * 2.6, RAMP.water[0]);\n    for (let i = 0; i < 4; i++) {\n      const a = -0.3 - i * 0.6;\n      fill(ctx, w / 2 + Math.cos(a) * (3 + f * 3), h - 6 - Math.sin(a) * (3 + f * 2.2), RAMP.water[1], 1, 1);\n    }\n  },\n\n  'fx.sparkle': (ctx, w, h, f) => {\n    const r = [1, 3, 5, 3][f];\n    const c = [P.spark0, P.spark1, P.gold1, P.spark2][f];\n    for (const [dx, dy] of [[0, 0], [-5, -4], [5, 3], [4, -5], [-4, 4]]) {\n      fill(ctx, w / 2 + dx, h / 2 + dy - r, c, 1, r);\n      fill(ctx, w / 2 + dx - Math.floor(r / 2), h / 2 + dy, c, r, 1);\n    }\n  },\n\n  'fx.impact': (ctx, w, h, f) => {\n    const r = 2 + f * 3.4;\n    ring(ctx, w / 2, h / 2, r, f < 2 ? '#ffffff' : P.gold1, f < 3 ? 2 : 1);\n    if (f < 2) ellipse(ctx, w / 2, h / 2, r * 0.5, r * 0.34, '#fffdf0');\n  },\n\n  'fx.slash': (ctx, w, h, f) => {\n    ctx.fillStyle = f < 2 ? '#ffffff' : P.paper2;\n    for (let i = 0; i < w; i++) {\n      const y = h / 2 + (i - w / 2) * 0.55 + (f - 1.5) * 3;\n      ctx.fillRect(i, Math.round(y), 1, f < 2 ? 3 : 2);\n    }\n  },\n\n  'fx.ring': (ctx, w, h, f) => {\n    ring(ctx, w / 2, h / 2, 2 + f * 3.2, f < 2 ? P.gold0 : P.gold2, f < 2 ? 2 : 1);\n  },\n\n  'fx.charm': (ctx, w, h, f) => {\n    // A woven charm, tumbling. Our capture object — nothing thrown, something offered.\n    const cy = h / 2 - Math.sin((f / 6) * Math.PI) * 4;\n    ellipse(ctx, w / 2, cy, 5, 5, P.gold2);\n    ellipse(ctx, w / 2 - 1, cy - 1, 3.4, 3.4, P.gold1);\n    ellipse(ctx, w / 2 - 1.5, cy - 1.5, 1.6, 1.6, P.gold0);\n    ctx.fillStyle = P.wood3;\n    for (let i = 0; i < 4; i++) fill(ctx, w / 2 - 4 + i * 2.4, cy + 4 + (i % 2), P.wood2, 1, 3);\n  },\n\n  'fx.charm.open': (ctx, w, h, f) => {\n    ring(ctx, w / 2, h / 2, 2 + f * 3, P.gold0, 2);\n    for (let i = 0; i < 6; i++) {\n      const a = (i / 6) * Math.PI * 2 + f * 0.4;\n      fill(ctx, w / 2 + Math.cos(a) * (4 + f * 3), h / 2 + Math.sin(a) * (4 + f * 3), P.gold1, 2, 2);\n    }\n  },\n\n  'fx.heart': (ctx, w, h, f) => {\n    const y = h / 2 - f * 2;\n    const c = [P.bloom0, P.bloom1, P.bloom1, P.bloom2][f];\n    for (const dx of [-2, 2]) ellipse(ctx, w / 2 + dx, y, 2.4, 2.2, c);\n    ctx.fillStyle = c;\n    for (let i = 0; i < 5; i++) ctx.fillRect(w / 2 - 4 + i, y + 2 + i * 0.6, 9 - i * 2, 1);\n  },\n\n  'fx.star': (ctx, w, h, f) => {\n    const r = 3 + f;\n    ctx.fillStyle = P.spark0;\n    for (let i = -r; i <= r; i++) {\n      ctx.fillRect(w / 2 + i, h / 2, 1, 1);\n      ctx.fillRect(w / 2, h / 2 + i, 1, 1);\n      if (Math.abs(i) < r * 0.6) { ctx.fillRect(w / 2 + i, h / 2 + i, 1, 1); ctx.fillRect(w / 2 + i, h / 2 - i, 1, 1); }\n    }\n    ellipse(ctx, w / 2, h / 2, 2, 2, '#ffffff');\n  },\n\n  'fx.evolve': (ctx, w, h, f) => {\n    const a = 0.2 + f * 0.13;\n    ellipse(ctx, w / 2, h / 2, w / 2 - f, h / 2 - f, `rgba(255,246,196,${a})`);\n    for (let i = 0; i < 8; i++) {\n      const ang = (i / 8) * Math.PI * 2 + f * 0.3;\n      fill(ctx, w / 2 + Math.cos(ang) * (6 + f * 3), h / 2 + Math.sin(ang) * (6 + f * 3), P.gold0, 2, 2);\n    }\n  },\n\n  'fx.exclaim': (ctx, w, h) => {\n    ellipse(ctx, w / 2, h / 2, 6, 6, P.paper0);\n    ring(ctx, w / 2, h / 2, 6, P.ink2, 1);\n    fill(ctx, w / 2 - 1, h / 2 - 4, P.ember2, 2, 5);\n    fill(ctx, w / 2 - 1, h / 2 + 3, P.ember2, 2, 2);\n  },\n  'fx.emote.happy': (ctx, w, h) => {\n    ellipse(ctx, w / 2, h / 2, 6, 6, P.paper0); ring(ctx, w / 2, h / 2, 6, P.ink2, 1);\n    fill(ctx, w / 2 - 3, h / 2 - 1, P.ink2, 2, 1); fill(ctx, w / 2 + 2, h / 2 - 1, P.ink2, 2, 1);\n    fill(ctx, w / 2 - 2, h / 2 + 2, P.ink2, 5, 1);\n  },\n  'fx.emote.think': (ctx, w, h) => {\n    ellipse(ctx, w / 2, h / 2, 6, 6, P.paper0); ring(ctx, w / 2, h / 2, 6, P.ink2, 1);\n    fill(ctx, w / 2 - 3, h / 2, P.ink2, 2, 2); fill(ctx, w / 2, h / 2, P.ink2, 2, 2); fill(ctx, w / 2 + 3, h / 2, P.ink2, 2, 2);\n  },\n  'fx.emote.sleep': (ctx, w, h) => {\n    ellipse(ctx, w / 2, h / 2, 6, 6, P.paper0); ring(ctx, w / 2, h / 2, 6, P.ink2, 1);\n    fill(ctx, w / 2 - 3, h / 2 - 2, P.ink2, 5, 1); fill(ctx, w / 2 - 3, h / 2 + 2, P.ink2, 5, 1);\n    fill(ctx, w / 2 - 1, h / 2, P.ink2, 3, 1);\n  },\n\n  'fx.rain': (ctx, w, h, f) => { ctx.fillStyle = 'rgba(159,201,232,0.85)'; ctx.fillRect(w / 2, f, 1, 4); },\n  'fx.snow': (ctx, w, h, f) => { ellipse(ctx, w / 2 + (f % 2), h / 2, 1.2, 1.2, '#f2f8ff'); },\n  'fx.smoke': (ctx, w, h, f) => {\n    ellipse(ctx, w / 2 + Math.sin(f) * 2, h - 4 - f * 3, 2 + f * 0.8, 2 + f * 0.7, `rgba(226,222,214,${0.5 - f * 0.1})`);\n  },\n\n  'fx.build.frame': (ctx, w, h) => {\n    ctx.fillStyle = P.wood2;\n    ctx.fillRect(0, 0, 1, h); ctx.fillRect(w - 1, 0, 1, h);\n    ctx.fillRect(0, 0, w, 1); ctx.fillRect(0, h - 1, w, 1);\n    for (let i = 0; i < w; i += 4) ctx.fillRect(i, h - 1 - i * (h / w), 2, 1);\n  },\n};\n\n// Element bursts share one shape and differ only by palette — that keeps the type\n// language consistent across the whole battle screen.\nconst BURSTS = {\n  'fx.ember': RAMP.ember, 'fx.leaf': RAMP.leaf, 'fx.bubble': RAMP.water,\n  'fx.rock': RAMP.rock, 'fx.wind': ['#f2fbff', '#cfeaf5', '#9fd8e8', '#6fb3cc'],\n  'fx.spark': [P.spark0, P.spark1, P.spark2, P.gold3],\n  'fx.petal': [P.bloom0, P.bloom1, P.bloom2, P.bloom3],\n  'fx.dusk': [P.violet0, P.violet1, P.violet2, P.violet3],\n};\n\nfunction burst(ramp) {\n  return (ctx, w, h, f) => {\n    const n = 6;\n    for (let i = 0; i < n; i++) {\n      const a = (i / n) * Math.PI * 2 + f * 0.35;\n      const d = 2 + f * 3.2;\n      const r = Math.max(1, 3 - f * 0.6);\n      ellipse(ctx, w / 2 + Math.cos(a) * d, h / 2 + Math.sin(a) * d * 0.85, r, r, ramp[i % ramp.length]);\n    }\n    if (f < 2) ellipse(ctx, w / 2, h / 2, 4 - f, 4 - f, ramp[0]);\n  };\n}\n\nexport function register() {\n  for (const name of FX) {\n    const frames = ANIM_FX[name] || 1;\n    const size = name === 'fx.shadow' ? [16, 6]\n      : name === 'fx.shadow.big' ? [64, 12]\n      : name.startsWith('fx.emote') || name === 'fx.exclaim' ? [16, 16]\n      : name === 'fx.rain' || name === 'fx.snow' ? [4, 8]\n      : [24, 24];\n    const painter = FXP[name] || (BURSTS[name] ? burst(BURSTS[name]) : FXP['fx.sparkle']);\n    Atlas.defineAnim(name, size[0], size[1], frames, painter);\n  }\n}\n","deps":{"./atlas.js":"art/atlas.js","./names.js":"art/names.js","./palette.js":"art/palette.js"}},{"id":"art/uiart.js","code":"// Interface chrome: window frames, cursors, bars, icons, and type badges.\n//\n// The frames are 24x24 nine-slice sources with 8px corners. They should read as a\n// crafted wooden window with a paper face — dark keyline, warm bevel, light face,\n// 1px top highlight — because every line of dialogue in the game sits on one.\n\nimport { Atlas } from './atlas.js';\nimport { UI } from './names.js';\nimport { P, TYPE_COLOR, mix, shade } from './palette.js';\n\nconst fill = (ctx, x, y, c, w = 1, h = 1) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };\n\nfunction ellipse(ctx, cx, cy, rx, ry, c) {\n  ctx.fillStyle = c;\n  for (let y = Math.ceil(cy - ry); y <= cy + ry; y++) {\n    const t = (y + 0.5 - cy) / ry;\n    if (Math.abs(t) > 1) continue;\n    const half = Math.sqrt(1 - t * t) * rx;\n    const x0 = Math.round(cx - half), x1 = Math.round(cx + half);\n    if (x1 > x0) ctx.fillRect(x0, y, x1 - x0, 1);\n  }\n}\n\n/** 24x24 nine-slice source: 8px corners, 8px stretchable middles. */\nfunction frame(ctx, w, h, { line, bevel, face, hi, stud }) {\n  fill(ctx, 0, 0, face, w, h);\n  // face\n  fill(ctx, 2, 2, face, w - 4, h - 4);\n  // bevel ring\n  fill(ctx, 1, 1, bevel, w - 2, 1);\n  fill(ctx, 1, h - 2, bevel, w - 2, 1);\n  fill(ctx, 1, 1, bevel, 1, h - 2);\n  fill(ctx, w - 2, 1, bevel, 1, h - 2);\n  // outer keyline\n  fill(ctx, 0, 0, line, w, 1);\n  fill(ctx, 0, h - 1, line, w, 1);\n  fill(ctx, 0, 0, line, 1, h);\n  fill(ctx, w - 1, 0, line, 1, h);\n  // inner top highlight — this is what makes it look lit rather than flat\n  fill(ctx, 2, 2, hi, w - 4, 1);\n  fill(ctx, 2, 2, hi, 1, h - 4);\n  // corner studs\n  if (stud) {\n    for (const [x, y] of [[3, 3], [w - 5, 3], [3, h - 5], [w - 5, h - 5]]) {\n      fill(ctx, x, y, stud, 2, 2);\n      fill(ctx, x, y, shade(stud, 0.3), 1, 1);\n    }\n  }\n}\n\nfunction bar(ctx, w, h, track, rim) {\n  fill(ctx, 0, 0, rim, w, h);\n  fill(ctx, 1, 1, track, w - 2, h - 2);\n  fill(ctx, 1, 1, shade(track, -0.2), w - 2, 1);\n}\n\nfunction typeBadge(ctx, w, h, color) {\n  fill(ctx, 0, 0, shade(color, -0.5), w, h);\n  fill(ctx, 1, 1, color, w - 2, h - 2);\n  fill(ctx, 1, 1, shade(color, 0.28), w - 2, 1);\n  fill(ctx, 1, h - 2, shade(color, -0.25), w - 2, 1);\n}\n\nconst PAINT = {\n  'ui.frame': (ctx, w, h) => frame(ctx, w, h, {\n    line: P.ui4, bevel: P.ui2, face: P.paper0, hi: '#fffdf2', stud: P.gold2,\n  }),\n  'ui.frame.dark': (ctx, w, h) => frame(ctx, w, h, {\n    line: '#0d1017', bevel: '#3a4356', face: '#1c2331', hi: '#4d586e', stud: P.gold3,\n  }),\n  'ui.frame.gold': (ctx, w, h) => frame(ctx, w, h, {\n    line: '#4a3213', bevel: P.gold3, face: P.paper0, hi: '#fffaea', stud: P.gold1,\n  }),\n\n  'ui.cursor': (ctx, w, h) => {\n    // A small pointing wedge with a shadow, so it reads on light and dark faces.\n    ctx.fillStyle = P.ink;\n    for (let i = 0; i < 7; i++) ctx.fillRect(1, 1 + i, Math.max(1, 5 - Math.abs(i - 3)), 1);\n    ctx.fillStyle = P.gold1;\n    for (let i = 0; i < 7; i++) ctx.fillRect(0, i, Math.max(1, 5 - Math.abs(i - 3)), 1);\n    fill(ctx, 0, 2, P.gold0, 2, 1);\n  },\n  'ui.cursor.small': (ctx, w, h) => {\n    ctx.fillStyle = P.gold2;\n    for (let i = 0; i < 5; i++) ctx.fillRect(0, i, Math.max(1, 3 - Math.abs(i - 2)), 1);\n  },\n  'ui.tail': (ctx, w, h) => {\n    for (let i = 0; i < h; i++) fill(ctx, i, i, P.paper0, w - i * 2, 1);\n    fill(ctx, 0, 0, P.ui4, 1, 1);\n    for (let i = 0; i < h; i++) { fill(ctx, i, i, P.ui4, 1, 1); fill(ctx, w - 1 - i, i, P.ui4, 1, 1); }\n  },\n\n  'ui.hpbar': (ctx, w, h) => bar(ctx, w, h, '#2c2418', P.ui4),\n  'ui.xpbar': (ctx, w, h) => bar(ctx, w, h, '#1d2a34', P.ui4),\n\n  'ui.coin': (ctx, w, h) => {\n    ellipse(ctx, w / 2, h / 2, w / 2 - 1, h / 2 - 1, P.gold3);\n    ellipse(ctx, w / 2, h / 2 - 0.5, w / 2 - 2, h / 2 - 2, P.gold1);\n    ellipse(ctx, w / 2 - 1, h / 2 - 1.5, 1.5, 1.5, P.gold0);\n  },\n  'ui.hearth': (ctx, w, h) => {\n    for (let i = 0; i < 3; i++) {\n      ellipse(ctx, w / 2, h / 2 + 1 - i * 1.6, (w / 2 - 1) * (1 - i * 0.22), (h / 2) * (1 - i * 0.18),\n        [P.ember3, P.ember2, P.ember0][i]);\n    }\n  },\n  'ui.heart': (ctx, w, h) => {\n    for (const dx of [-2, 2]) ellipse(ctx, w / 2 + dx, h / 2 - 1, 2.4, 2.2, P.bloom1);\n    ctx.fillStyle = P.bloom1;\n    for (let i = 0; i < 5; i++) ctx.fillRect(w / 2 - 4 + i, h / 2 + 1 + i * 0.6, 9 - i * 2, 1);\n  },\n  'ui.star': (ctx, w, h) => {\n    ctx.fillStyle = P.spark1;\n    for (let i = -4; i <= 4; i++) { ctx.fillRect(w / 2 + i, h / 2, 1, 1); ctx.fillRect(w / 2, h / 2 + i, 1, 1); }\n    ellipse(ctx, w / 2, h / 2, 2.4, 2.4, P.spark0);\n  },\n  'ui.ball': (ctx, w, h) => {\n    ellipse(ctx, w / 2, h / 2, w / 2 - 1, h / 2 - 1, P.gold2);\n    ellipse(ctx, w / 2, h / 2, w / 2 - 2.5, h / 2 - 2.5, P.gold0);\n    fill(ctx, 1, h / 2, P.wood3, w - 2, 1);\n  },\n  'ui.ball.empty': (ctx, w, h) => {\n    ellipse(ctx, w / 2, h / 2, w / 2 - 1, h / 2 - 1, P.ui2);\n    ellipse(ctx, w / 2, h / 2, w / 2 - 2.5, h / 2 - 2.5, P.ui1);\n  },\n  'ui.arrow.up': (ctx, w, h) => {\n    ctx.fillStyle = P.gold2;\n    for (let i = 0; i < 4; i++) ctx.fillRect(w / 2 - i, h / 2 + i - 1, i * 2 + 1, 1);\n  },\n  'ui.arrow.down': (ctx, w, h) => {\n    ctx.fillStyle = P.gold2;\n    for (let i = 0; i < 4; i++) ctx.fillRect(w / 2 - 3 + i, h / 2 - 2 + i, 7 - i * 2, 1);\n  },\n  'ui.badge.new': (ctx, w, h) => { fill(ctx, 0, 0, P.ember2, w, h); fill(ctx, 1, 1, P.ember1, w - 2, h - 2); },\n  'ui.badge.lock': (ctx, w, h) => {\n    fill(ctx, 2, h / 2 - 1, P.rock2, w - 4, h / 2); fill(ctx, 3, h / 2, P.rock1, w - 6, h / 2 - 2);\n    ctx.fillStyle = P.rock2;\n    for (let i = 0; i < 4; i++) ctx.fillRect(w / 2 - 2 + (i % 2) * 3, h / 2 - 4 + Math.floor(i / 2), 1, 2);\n  },\n  'ui.badge.check': (ctx, w, h) => {\n    ctx.fillStyle = '#7ed957';\n    for (let i = 0; i < 3; i++) ctx.fillRect(2 + i, h / 2 + i, 2, 2);\n    for (let i = 0; i < 5; i++) ctx.fillRect(5 + i, h / 2 + 2 - i, 2, 2);\n  },\n  'ui.minimap.frame': (ctx, w, h) => frame(ctx, w, h, {\n    line: '#0d1017', bevel: P.gold3, face: 'rgba(20,26,38,0.7)', hi: P.gold2, stud: null,\n  }),\n};\n\nexport function register() {\n  for (const name of UI) {\n    if (name.startsWith('ui.type.')) {\n      const t = name.slice('ui.type.'.length);\n      Atlas.define(name, 22, 9, (ctx, w, h) => typeBadge(ctx, w, h, TYPE_COLOR[t] || P.ui2));\n      continue;\n    }\n    const size = name.startsWith('ui.frame') ? [24, 24]\n      : name === 'ui.cursor' ? [6, 8]\n      : name === 'ui.cursor.small' ? [4, 6]\n      : name === 'ui.tail' ? [8, 6]\n      : name === 'ui.hpbar' || name === 'ui.xpbar' ? [48, 6]\n      : name === 'ui.minimap.frame' ? [24, 24]\n      : name.startsWith('ui.badge') ? [10, 10]\n      : name.startsWith('ui.arrow') ? [8, 6]\n      : [10, 10];\n    Atlas.define(name, size[0], size[1], PAINT[name] || ((ctx, w, h) => fill(ctx, 0, 0, P.ui2, w, h)));\n  }\n}\n","deps":{"./atlas.js":"art/atlas.js","./names.js":"art/names.js","./palette.js":"art/palette.js"}},{"id":"audio/songs.js","code":"// The score. Every song is note data played through core/audio.js — no audio files,\n// no samples, nothing borrowed. Warm folk modes, small ensembles, short loops that\n// are meant to sit under play for a long time without wearing out.\n//\n// Note tokens: `c4` pitch, `-` hold the previous note, `.` rest.\n// Percussion tracks use `X` (low thump) and `x` (brush).\n// `div` is steps per beat, so div:2 means each token is an eighth note.\n\nimport { Audio } from '../core/audio.js';\n\nconst LEAD = { wave: 'square', gain: 0.13, legato: 0.88, env: { a: 0.012, d: 0.07, s: 0.62, r: 0.07 }, filter: 2600 };\nconst SOFT = { wave: 'triangle', gain: 0.15, legato: 0.94, env: { a: 0.02, d: 0.10, s: 0.7, r: 0.12 } };\nconst BASS = { wave: 'triangle', gain: 0.20, legato: 0.96, env: { a: 0.01, d: 0.08, s: 0.8, r: 0.08 } };\nconst PAD = { wave: 'sawtooth', gain: 0.045, legato: 1, filter: 900, env: { a: 0.18, d: 0.3, s: 0.7, r: 0.3 } };\nconst PERC = { wave: 'noise', gain: 0.085, decay: 0.055 };\n\nconst song = (bpm, div, tracks) => ({ bpm, div, tracks });\nconst t = (base, notes, extra = {}) => ({ ...base, ...extra, notes });\n\nexport function register() {\n  // ---- title: banked embers, nobody in a hurry ----------------------------------\n  Audio.defineSong('title', song(70, 2, {\n    lead: t(SOFT, `\n      a4 - - .  c5 - - .  e5 - - -  d5 - - .\n      c5 - - .  a4 - - .  g4 - - -  - - - .\n      a4 - - .  c5 - - .  f5 - - -  e5 - - .\n      d5 - - .  c5 - - .  a4 - - -  - - - .`, { gain: 0.17, vibrato: { rate: 4.5, depth: 2 } }),\n    pad: t(PAD, `\n      a3 - - - - - - -  f3 - - - - - - -\n      c4 - - - - - - -  e3 - - - - - - -`),\n    bass: t(BASS, `\n      a2 - - - - - - .  f2 - - - - - - .\n      c3 - - - - - - .  e2 - - - - - - .`, { gain: 0.16 }),\n  }));\n\n  // ---- village: pastoral, a little proud -----------------------------------------\n  Audio.defineSong('village', song(104, 2, {\n    lead: t(LEAD, `\n      g4 . c5 . e5 . d5 .  c5 . a4 . g4 - - .\n      f4 . a4 . c5 . b4 .  a4 . g4 . f4 - - .\n      g4 . c5 . e5 . g5 .  f5 . e5 . d5 - - .\n      e5 . d5 . c5 . a4 .  g4 - - - - - - .`),\n    harm: t(SOFT, `\n      e4 - - - c4 - - -  a3 - - - c4 - - -\n      d4 - - - f4 - - -  c4 - - - e4 - - -`, { gain: 0.085 }),\n    bass: t(BASS, `\n      c3 . c3 . g2 . g2 .  f2 . f2 . c3 . c3 .\n      f2 . f2 . c3 . c3 .  g2 . g2 . c3 . c3 .`),\n    perc: t(PERC, `. . x . . . x .  . . x . . x x .`),\n  }));\n\n  // ---- field: walking pace, open sky ---------------------------------------------\n  Audio.defineSong('field', song(126, 2, {\n    lead: t(LEAD, `\n      c5 . d5 . e5 . g5 .  e5 . d5 . c5 - - .\n      d5 . e5 . f5 . a5 .  g5 . e5 . d5 - - .\n      e5 . g5 . a5 . g5 .  e5 . d5 . c5 - - .\n      a4 . c5 . d5 . e5 .  d5 - c5 - - - - .`),\n    harm: t(SOFT, `g4 - e4 - c5 - g4 -  f4 - a4 - e4 - c4 -`, { gain: 0.07 }),\n    bass: t(BASS, `\n      c3 . g2 . c3 . e3 .  f2 . c3 . f2 . a2 .\n      c3 . g2 . c3 . e3 .  g2 . d3 . g2 . b2 .`),\n    perc: t(PERC, `X . x . X . x x  X . x . X x x .`),\n  }));\n\n  // ---- forest: the path forgets itself --------------------------------------------\n  Audio.defineSong('forest', song(88, 2, {\n    lead: t(SOFT, `\n      a4 - . . e4 - . .  a4 - b4 - c5 - - .\n      b4 - . . g4 - . .  e4 - - - - - - .\n      c5 - . . b4 - . .  a4 - g4 - e4 - - .\n      d4 - . . e4 - . .  a4 - - - - - - .`, { gain: 0.13, vibrato: { rate: 5, depth: 3 } }),\n    pad: t(PAD, `a3 - - - - - - - e3 - - - - - - -  f3 - - - - - - - e3 - - - - - - -`),\n    bass: t(BASS, `a2 - - - - - . .  e2 - - - - - . .  f2 - - - - - . .  e2 - - - - - . .`, { gain: 0.17 }),\n  }));\n\n  // ---- river: flowing, never lands ------------------------------------------------\n  Audio.defineSong('river',
