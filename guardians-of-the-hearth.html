ayer.running ? RUN : WALK;\n  return true;\n}\n\nfunction updatePlayer() {\n  if (player.bump > 0) player.bump--;\n\n  if (player.hop) {\n    const h = player.hop;\n    h.t++;\n    const k = Math.min(1, h.t / HOP);\n    player.px = (h.fromX + (h.toX - h.fromX) * k) * TILE;\n    player.py = (h.fromY + (h.toY - h.fromY) * k) * TILE - Math.sin(k * Math.PI) * 14;\n    player.anim += 2;\n    if (k >= 1) {\n      player.hop = null;\n      player.px = player.x * TILE; player.py = player.y * TILE;\n      dust.push({ x: player.px, y: player.py, t: 0 });\n      onArrive();\n    }\n    return;\n  }\n\n  if (player.moving) {\n    player.t++;\n    const k = Math.min(1, player.t / player.dur);\n    player.px = (player.fx + (player.x - player.fx) * k) * TILE;\n    player.py = (player.fy + (player.y - player.fy) * k) * TILE;\n    player.anim++;\n    if (k >= 1) {\n      player.moving = false;\n      player.fx = player.x; player.fy = player.y;\n      player.px = player.x * TILE; player.py = player.y * TILE;\n      onArrive();\n      // Chain immediately so held movement never stutters between tiles.\n      if (!busy) {\n        const d = Input.dir();\n        if (d) {\n          player.running = Input.held('run');\n          if (d === player.dir) tryStep(d);\n          else { player.dir = d; player.turn = TURN; }\n        }\n      }\n    }\n    return;\n  }\n\n  player.px = player.x * TILE; player.py = player.y * TILE;\n  if (busy) { player.anim = 0; return; }\n\n  const d = Input.dir();\n  player.running = Input.held('run');\n\n  if (!d) { player.turn = 0; player.anim = 0; return; }\n\n  if (d !== player.dir) {\n    // Turn in place first — a tap should never move you.\n    player.dir = d;\n    player.turn = TURN;\n    player.anim = 0;\n    return;\n  }\n  if (player.turn > 0) { player.turn--; return; }\n  tryStep(d);\n}\n\nfunction update() {\n  if (!map) return;\n\n  if (!busy) {\n    if (Input.pressed('a') && !player.moving && !player.hop) { Input.consume('a'); interact(); }\n    else if (Input.pressed('start')) { Input.consume('start'); Scenes.push('pause'); }\n    else if (Input.pressed('select')) { Input.consume('select'); Scenes.push('village'); }\n  }\n\n  updatePlayer();\n\n  for (const n of npcs) {\n    n.notice(player.x, player.y);\n    n.update((x, y) => (x === player.x && y === player.y) || occupied(x, y));\n  }\n\n  for (let i = dust.length - 1; i >= 0; i--) if (++dust[i].t > 22) dust.splice(i, 1);\n  for (let i = rustle.length - 1; i >= 0; i--) if (++rustle[i].t > 20) rustle.splice(i, 1);\n\n  R.centerOn(player.px + 8, player.py + 8, map.bounds);\n}\n\n// --- render ------------------------------------------------------------------\nfunction drawTiles() {\n  const cam = R.camera;\n  const x0 = Math.max(0, Math.floor(cam.x / TILE) - 1);\n  const y0 = Math.max(0, Math.floor(cam.y / TILE) - 1);\n  const x1 = Math.min(map.w - 1, Math.ceil((cam.x + R.W) / TILE) + 1);\n  const y1 = Math.min(map.h - 1, Math.ceil((cam.y + R.H) / TILE) + 1);\n  const frame = Math.floor(performance.now() / 180);\n\n  R.layer(LAYER.GROUND, () => {\n    // Outside the map edge reads as void otherwise; fill it with the map's own base.\n    R.rect(0, 0, R.W, R.H, map.indoor ? '#171019' : '#2c3a22');\n    for (let y = y0; y <= y1; y++) {\n      for (let x = x0; x <= x1; x++) {\n        const img = Atlas.tryGet(map.ground(x, y), frame);\n        if (img) R.blit(img, x * TILE - cam.x, y * TILE - cam.y);\n      }\n    }\n  });\n\n  R.layer(LAYER.MID, () => {\n    for (let y = y0; y <= y1; y++) {\n      for (let x = x0; x <= x1; x++) {\n        let name = map.mid(x, y);\n        if (!name) continue;\n        if (name === 't.lamp') name = lampTile();\n        const img = Atlas.tryGet(name, frame);\n        if (img) R.blit(img, x * TILE - cam.x, y * TILE - cam.y);\n      }\n    }\n    for (const r of rustle) {\n      const img = Atlas.tryGet('fx.grass.rustle', Math.floor(r.t / 5));\n      if (img) R.blit(img, r.x * TILE - cam.x, r.y * TILE - cam.y);\n    }\n  });\n\n  R.layer(LAYER.OVER, () => {\n    for (let y = y0; y <= y1; y++) {\n      for (let x = x0; x <= x1; x++) {\n        const img = Atlas.tryGet(map.over(x, y), frame);\n        if (img) R.blit(img, x * TILE - cam.x, y * TILE - cam.y);\n      }\n    }\n  });\n}\n\nfunction drawStructures(cam) {\n  for (const st of map.structures || []) {\n    const img = Atlas.tryGet(st.sprite);\n    const sx = st.x * TILE - cam.x;\n    const sy = (st.y - st.overhang) * TILE - cam.y;\n    if (sx > R.W || sy > R.H || sx + st.w * TILE < 0) continue;\n    R.sortEntity((st.y + st.h) * TILE, () => {\n      if (img) R.blit(img, sx, sy);\n      else R.rect(sx, sy, st.w * TILE, (st.h + st.overhang) * TILE, '#ff00ff');\n    });\n  }\n}\n\nfunction drawPlayer(cam) {\n  const sx = Math.round(player.px - cam.x);\n  const sy = Math.round(player.py - cam.y) - 8;\n  const moving = player.moving || player.hop;\n  const speed = player.running ? 5 : 8;\n  const frame = moving ? Math.floor(player.anim / speed) % 4 : 0;\n  const lean = player.bump > 0 ? Math.round(Math.sin(player.bump / 10 * Math.PI) * 2) : 0;\n  const v = DIR_VEC[player.dir];\n\n  R.sortEntity(player.py + TILE, () => {\n    const shadow = Atlas.tryGet('fx.shadow');\n    if (shadow) R.blit(shadow, sx, sy + 19, { alpha: 0.5 });\n    const img = Atlas.tryGet(`c.${S.player.sprite || 'hero'}.${player.dir}`, frame);\n    const dx = sx + lean * v.x, dy = sy + lean * v.y;\n    if (img) {\n      // In tall grass the lower body is hidden, exactly like standing in it.\n      if (map.isGrass(player.x, player.y) && !player.hop) {\n        R.blit(img, dx, dy, { clip: { x: 0, y: 0, w: 16, h: 19 } });\n      } else R.blit(img, dx, dy);\n    } else R.rect(dx + 2, dy + 4, 12, 20, '#ff00ff');\n  });\n}\n\nfunction drawFx(cam) {\n  R.layer(LAYER.MID, () => {\n    for (const d of dust) {\n      const img = Atlas.tryGet('fx.dust', Math.floor(d.t / 6));\n      if (img) R.blit(img, d.x - cam.x, d.y - cam.y + 6, { alpha: 1 - d.t / 22 });\n    }\n  });\n}\n\nfunction render() {\n  if (!map) return;\n  const cam = R.camera;\n  drawTiles();\n  try { Hooks.village.drawGround(map, cam); } catch {}\n  drawFx(cam);\n  drawStructures(cam);\n  try { Hooks.village.drawSprites(map, cam, (y, fn) => R.sortEntity(y, fn)); } catch {}\n  for (const n of npcs) R.sortEntity(n.py + TILE, () => n.draw(cam));\n  drawPlayer(cam);\n\n  R.layer(LAYER.WEATHER, () => {\n    // Darken first, then punch the warm light through it. The other order lets an\n    // additive glow saturate bright tiles to white before the tint can touch them,\n    // which turned every bench near a lamp into a white rectangle after dark.\n    drawLighting(map);\n    drawNightGlow(map, cam);\n    drawWeather();\n  });\n\n  R.layer(LAYER.UI, () => {\n    if (UIx.drawToasts) UIx.drawToasts();\n  });\n  try { Hooks.hud?.draw?.(map); } catch {}\n}\n\n// --- scene -------------------------------------------------------------------\nfunction overworldScene() {\n  return {\n    async enter(params) {\n      const id = params?.map || S.player.map || START.map;\n      const known = (() => { try { loadMap(id); return true; } catch { return false; } })();\n      const startId = known ? id : START.map;\n      const x = params?.x ?? (known ? S.player.x : START.x);\n      const y = params?.y ?? (known ? S.player.y : START.y);\n      await enterMap(startId, x, y, params?.dir || S.player.dir || START.dir, { fade: false });\n    },\n    exit() { syncState(); save(); },\n    update,\n    render,\n  };\n}\n\nexport function register() {\n  Scenes.register('overworld', () => overworldScene());\n  Hooks.install('world', {\n    async warpTo(mapId, x, y, dir) { await enterMap(mapId, x, y, dir); },\n    refresh() { if (map) { try { Hooks.village.applyTo(map); } catch {} } },\n    playerTile() {\n      return player\n        ? { x: player.x, y: player.y, dir: player.dir, map: map?.id }\n        : { x: S.player.x, y: S.player.y, dir: S.player.dir, map: S.player.map };\n    },\n    currentMap() { return map; },\n    lockInput(v) { busy = !!v; },\n  });\n}\n\nexport { map as currentMap, nameOf };\n","deps":{"../core/renderer.js":"core/renderer.js","../core/input.js":"core/input.js","../core/scene.js":"core/scene.js","../art/atlas.js":"art/atlas.js","../core/audio.js":"core/audio.js","../core/bridge.js":"core/bridge.js","../state.js":"state.js","../core/events.js":"core/events.js","../core/util.js":"core/util.js","../core/rng.js":"core/rng.js","./map.js":"world/map.js","./maps.js":"world/maps.js","./npc.js":"world/npc.js","./daynight.js":"world/daynight.js"}},{"id":"battle/capture.js","code":"// BONDING — our capture mechanic.\n//\n// You do not throw anything at a guardian. You hold out a charm, stand still, and see\n// whether it decides to come. So the maths is built out of *reasons to trust you*:\n//\n//   · how tired it is            (a worn-out guardian is glad of the help)\n//   · whether it is ailing       (scorched, tangled, soaked, dazzled — it wants out)\n//   · what you're offering       (the charm's quality)\n//   · how your village is doing  (Hooks.village.level() — a warm village is a good home)\n//   · your mission streak        (S.missions.streak — you keep your promises)\n//\n// The last two are the hook: bonding is the reward for looking after the village and\n// the family, not for grinding. A player who has done neither is *not* locked out —\n// the floor is 2% — but a player who has is bonding at two or three times the rate.\n//\n// PURE MODULE — no DOM, no state.js. Everything comes in through `ctx`, so the whole\n// thing is node-testable and deterministic given an rng.\n\nimport { SPECIES, isFainted } from './species.js';\n\n/** The charms. `power` is a straight multiplier on the bond chance. */\nexport const CHARMS = Object.freeze({\n  charm:     { id: 'charm',     name: 'Woven Charm',   power: 1.0,\n               blurb: 'Grass and red thread. The one everybody starts with.' },\n  warm:      { id: 'warm',      name: 'Warm Charm',    power: 1.6,\n               blurb: 'Kept in a pocket by the fire until it is properly warm.' },\n  gilded:    { id: 'gilded',    name: 'Gilded Charm',   power: 2.4,\n               blurb: 'Gold leaf over cedar. Catches the light beautifully.' },\n  hearthspun:{ id: 'hearthspun',name: 'Hearthspun Charm', power: 3.6,\n               blurb: 'Spun from the smoke of the village hearth. Almost never refused.' },\n});\nexport const CHARM_IDS = Object.freeze(Object.keys(CHARMS));\nexport const getCharm = id => CHARMS[id] || CHARMS.charm;\n\n/** Status ailments make a guardian readier to accept help. */\nexport const STATUS_BONUS = Object.freeze({\n  scorch: 1.4, tangle: 1.6, soaked: 1.4, dazzled: 1.7,\n});\n\nexport const BOND_BEATS = 4;      // four heartbeats of the charm before it settles\n\n/**\n * The bond chance, 0..1. Broken out from bondAttempt so the UI can *show* it\n * (the bond menu prints a plain-language read of this number) and tests can assert it.\n *\n *   base       species bondRate / 255                (0.03 .. 0.75)\n *   tired      (3*max - 2*hp) / (3*max)              (0.33 at full HP -> ~1.0 at 1 HP)\n *   ailing     STATUS_BONUS                          (1.0 .. 1.7)\n *   charm      CHARMS[..].power                      (1.0 .. 3.6)\n *   village    1 + 0.07 * (villageLevel - 1)         (1.0 .. ~1.6)\n *   streak     1 + 0.045 * min(streak, 12)           (1.0 .. ~1.54)\n *   respect    a guardian far above your level is warier\n */\nexport function bondChance(foe, ctx = {}) {\n  const sp = SPECIES[foe.species];\n  const rate = sp ? sp.bondRate : 90;\n  const maxhp = Math.max(1, foe.maxhp);\n  const hp = Math.max(1, Math.min(maxhp, foe.hp));\n\n  const base = rate / 255;\n  const tired = (3 * maxhp - 2 * hp) / (3 * maxhp);\n  const ailing = foe.status ? (STATUS_BONUS[foe.status] || 1) : 1;\n  const charm = getCharm(ctx.charm).power;\n  const village = 1 + 0.07 * Math.max(0, (ctx.villageLevel || 1) - 1);\n  const streak = 1 + 0.045 * Math.min(12, Math.max(0, ctx.streak || 0));\n  const respect = clamp(1 + ((ctx.playerLevel || foe.lvl) - foe.lvl) / 40, 0.7, 1.25);\n\n  const p = base * tired * ailing * charm * village * streak * respect;\n  return clamp(p, 0.02, 0.98);\n}\n\n/** Everything the bond UI wants to show, without rolling anything. */\nexport function bondPreview(foe, ctx = {}) {\n  const p = bondChance(foe, ctx);\n  return {\n    p,\n    percent: Math.round(p * 100),\n    read: p >= 0.75 ? 'It is already leaning towards you.'\n        : p >= 0.5 ? 'It is listening.'\n        : p >= 0.28 ? 'It is thinking about it.'\n        : p >= 0.12 ? 'It is not sure yet.'\n        : 'It is a long way from trusting you.',\n    charm: getCharm(ctx.charm),\n    factors: {\n      tired: Math.round((1 - foe.hp / Math.max(1, foe.maxhp)) * 100),\n      ailing: !!foe.status,\n      village: ctx.villageLevel || 1,\n      streak: ctx.streak || 0,\n    },\n  };\n}\n\n/**\n * Roll a bonding attempt.\n *\n * Four heartbeats, each succeeding with p^(1/4), so all four succeeding is exactly p.\n * Failing on beat 3 still *feels* close, which is the point — the animation gets to\n * show the charm nearly opening.\n *\n * Returns { ok, p, beats, hearth, msg }.\n *   beats  0..4, how far the charm got. 4 = bonded.\n *   hearth how much village hearth the attempt earns (a near miss still earns 1).\n */\nexport function bondAttempt(foe, ctx = {}, rng) {\n  const p = bondChance(foe, ctx);\n  if (isFainted(foe)) {\n    return { ok: false, p: 0, beats: 0, hearth: 0, msg: 'It cannot hear you.' };\n  }\n  const per = Math.pow(p, 1 / BOND_BEATS);\n  let beats = 0;\n  for (let i = 0; i < BOND_BEATS; i++) {\n    if (rng.float() < per) beats++;\n    else break;\n  }\n  const ok = beats >= BOND_BEATS;\n  return {\n    ok, p, beats,\n    hearth: ok ? 6 + Math.round(foe.lvl / 2) : (beats >= 3 ? 1 : 0),\n    msg: ok ? 'bonded'\n       : beats === 3 ? 'It very nearly came.'\n       : beats === 2 ? 'It looked back once.'\n       : beats === 1 ? 'It took a step, then thought better of it.'\n       : 'It kept its distance.',\n  };\n}\n\n/**\n * The bond a newly-bonded guardian starts with — better village, warmer welcome.\n * Fed straight into makeGuardian's `bond` option by battle/scene.js.\n */\nexport const startingBond = (ctx = {}) =>\n  Math.min(255, 70 + 4 * Math.max(0, (ctx.villageLevel || 1) - 1) + 2 * Math.min(10, ctx.streak || 0));\n\nconst clamp = (v, a, b) => v < a ? a : v > b ? b : v;\n","deps":{"./species.js":"battle/species.js"}},{"id":"battle/engine.js","code":"// Turn resolution. PURE — no DOM, no state.js, no renderer. Deterministic given B.rng.\n//\n// Contract (hearth/CONTRACTS.md):\n//   newBattle({ party, foe, kind }) -> B\n//   chooseAction(B, side, action)\n//   stepTurn(B) -> Event[]\n//\n// The scene consumes the event list and animates it. Events are ordered exactly as they\n// should be *presented*, so a scene can be a dumb player of the list:\n//\n//   text     {k:'text', s, side?, move?, hold?, punch?}\n//   damage   {k:'damage', side, target, amount, hp, maxhp, eff, crit, missed?, heal?,\n//             cause?, move?, anim?}          amount<0 (with heal:true) is a heal\n//   faint    {k:'faint', side, name}\n//   stat     {k:'stat', side, target, stat, delta, stage, name, anim?}\n//   status   {k:'status', side?, target, status, name, turns?, cured?, anim?}\n//   switch   {k:'switch', side, i, from, to, name}\n//   bond-try {k:'bond-try', charm, beats, p, name}\n//   bond-ok  {k:'bond-ok', species, name, level, hearth, foe, charm}\n//   bond-fail{k:'bond-fail', beats, charm, hearth}\n//   xp       {k:'xp', i, amount, from, to, xpNext, lvl}   (one per level segment)\n//   levelup  {k:'levelup', i, level, gains, stats, name}\n//   evolve   {k:'evolve', i, from, to, fromName, toName, cancellable}\n//   end      {k:'end', outcome:'won'|'lost'|'fled'|'bonded'}\n//\n// `side` is always the ACTOR's side; `target` the side being acted on.\n\nimport { getMove, makeMoveSlot, effectiveness, effLabel, typeMult, STATUS, RULES } from './moves.js';\nimport {\n  SPECIES, STAT_KEYS, STAT_LABEL, isFainted, displayName, recalcStats,\n  movesAt, evolutionFor, commitEvolve, xpNeeded, maxLevel,\n} from './species.js';\nimport { bondAttempt, getCharm, bondPreview } from './capture.js';\nimport { makeRng } from '../core/rng.js';\n\nexport { typeMult, effectiveness, effLabel, STATUS, RULES } from './moves.js';\nexport { commitEvolve } from './species.js';\nexport { bondPreview, bondChance, CHARMS, getCharm } from './capture.js';\n\nconst clamp = (v, a, b) => v < a ? a : v > b ? b : v;\nexport const other = side => side === 'player' ? 'foe' : 'player';\n\nconst volState = () => ({\n  boosts: { atk: 0, def: 0, spa: 0, spd: 0, spe: 0 },\n  charging: null,\n  fainted: false,\n  turnsOut: 0,\n});\n\n// ---------------------------------------------------------------------------\n//  setup\n// ---------------------------------------------------------------------------\n/**\n * @param party  the player's live party array (mutated: hp, xp, level, moves)\n * @param foe    a guardian, or an array of them for a trainer team\n * @param kind   'wild' | 'trainer'\n * @param ctx    { villageLevel, streak, charm, trainer, bag } — read-only context the\n *               engine needs but must not reach into state.js for.\n */\nexport function newBattle({ party, foe, kind = 'wild', seed = 1, rng = null, ctx = {} } = {}) {\n  const foeParty = Array.isArray(foe) ? foe.slice() : [foe];\n  const B = {\n    kind,\n    rng: rng || makeRng(seed >>> 0 || 1),\n    seed,\n    party,\n    active: Math.max(0, party.findIndex(g => !isFainted(g))),\n    foeParty,\n    foeActive: Math.max(0, foeParty.findIndex(g => !isFainted(g))),\n    turn: 0,\n    over: false,\n    outcome: null,\n    bonded: null,\n    needSwitch: null,\n    runAttempts: 0,\n    actions: { player: null, foe: null },\n    vol: { player: volState(), foe: volState() },\n    ctx: {\n      villageLevel: ctx.villageLevel || 1,\n      streak: ctx.streak || 0,\n      charm: ctx.charm || 'charm',\n      trainer: ctx.trainer || null,\n      playerName: ctx.playerName || 'you',\n      ...ctx,\n    },\n    events: [],\n  };\n  // A fresh battle starts clean: no ailment ever follows a guardian into a new fight.\n  for (const g of party) { g.status = null; g.statusTurns = 0; }\n  for (const g of foeParty) { g.status = null; g.statusTurns = 0; }\n  return B;\n}\n\nexport const activeOf = (B, side) =>\n  side === 'player' ? B.party[B.active] : B.foeParty[B.foeActive];\nconst nm = g => displayName(g);\n\n/** {type:'move',id} | {type:'switch',i} | {type:'item',id} | {type:'bond',charm?} | {type:'run'} */\nexport function chooseAction(B, side, action) {\n  B.actions[side] = action;\n  return B;\n}\n\nexport const canRun = B => B.kind === 'wild';\nexport const canBond = B => B.kind === 'wild';\nexport const hasFocus = g => g.moves.some(m => m.focus > 0);\nexport const liveParty = B => B.party.filter(g => !isFainted(g));\n\n// ---------------------------------------------------------------------------\n//  stats\n// ---------------------------------------------------------------------------\nconst stageMul = n => { n = clamp(n, -6, 6); return n >= 0 ? (2 + n) / 2 : 2 / (2 - n); };\n\nexport function statOf(B, side, key) {\n  const g = activeOf(B, side);\n  if (!g) return 1;\n  let v = g.stats[key] * stageMul(B.vol[side].boosts[key] || 0);\n  if (key === 'atk' && g.status === 'scorch') v *= RULES.scorchAtk;\n  if (key === 'def' && g.status === 'soaked') v *= RULES.soakedDef;\n  if (key === 'spe' && g.status === 'tangle') v *= RULES.tangleSpeed;\n  return Math.max(1, Math.floor(v));\n}\n\n/**\n * Damage. Anchored so a level-5 starter exchange lasts 3-5 turns and a level-50 hit\n * takes roughly a third of a health bar.\n */\nfunction rollDamage(B, side, move) {\n  const a = activeOf(B, side), d = activeOf(B, other(side));\n  const phys = move.cat === 'physical';\n  const A = statOf(B, side, phys ? 'atk' : 'spa');\n  const D = statOf(B, other(side), phys ? 'def' : 'spd');\n  const lvlTerm = 2 * a.lvl / 5 + 2;\n  const base = Math.floor(Math.floor(Math.floor(lvlTerm * move.power * A / D) / 50) + 2);\n\n  const eff = move.fx?.noType ? 1 : effectiveness(move.type, d.types);\n  let m = eff;\n  if (!move.fx?.noStab && a.types.includes(move.type)) m *= RULES.stab;\n  if (d.status === 'soaked' && move.type === 'spark') m *= RULES.soakedSparkTaken;\n\n  const critOdds = move.fx?.crit ? RULES.critHighChance : RULES.critChance;\n  const crit = B.rng.float() < critOdds;\n  if (crit) m *= RULES.critMult;\n\n  const rand = RULES.randLo + B.rng.float() * (1 - RULES.randLo);\n  let dmg = Math.floor(base * m * rand);\n  if (eff > 0) dmg = Math.max(RULES.minDamage, dmg);\n  return { dmg, eff, crit };\n}\n\n/** Non-mutating estimate for the move menu (\"this looks effective\"). */\nexport function previewEffect(B, moveId) {\n  const move = getMove(moveId);\n  if (move.cat === 'status') return { eff: 1, label: 'status' };\n  const d = activeOf(B, 'foe');\n  const eff = move.fx?.noType ? 1 : effectiveness(move.type, d.types);\n  return { eff, label: effLabel(eff) };\n}\n\n// ---------------------------------------------------------------------------\n//  the turn\n// ---------------------------------------------------------------------------\nfunction priorityOf(B, side) {\n  const a = B.actions[side];\n  if (!a) return -99;\n  if (a.type !== 'move') return 6;             // switch / item / bond / run go first\n  const slot = activeOf(B, side)?.moves.find(m => m.id === a.id);\n  const move = slot && slot.focus <= 0 ? getMove('struggle') : getMove(a.id);\n  return move.pri;\n}\n\nfunction turnOrder(B) {\n  const sides = ['player', 'foe'];\n  const pri = { player: priorityOf(B, 'player'), foe: priorityOf(B, 'foe') };\n  if (pri.player !== pri.foe) return pri.player > pri.foe ? sides : sides.reverse();\n  const sp = statOf(B, 'player', 'spe'), sf = statOf(B, 'foe', 'spe');\n  if (sp !== sf) return sp > sf ? sides : sides.reverse();\n  return B.rng.chance(0.5) ? sides : sides.reverse();\n}\n\nexport function stepTurn(B) {\n  const ev = [];\n  if (B.over) { ev.push({ k: 'end', outcome: B.outcome }); B.events = ev; return ev; }\n  B.turn++;\n  if (!B.actions.foe) B.actions.foe = aiAction(B);\n  if (!B.actions.player) B.actions.player = aiAction(B, 'player');\n\n  for (const side of turnOrder(B)) {\n    if (B.over || B.needSwitch) break;\n    const actor = activeOf(B, side);\n    if (!actor || isFainted(actor)) continue;\n    resolveAction(B, side, B.actions[side], ev);\n    checkFaints(B, ev);\n  }\n  if (!B.over && !B.needSwitch) { endOfTurn(B, ev); checkFaints(B, ev); }\n\n  B.actions.player = null;\n  B.actions.foe = null;\n  if (B.over) ev.push({ k: 'end', outcome: B.outcome });\n  B.events = ev;\n  return ev;\n}\n\nfunction resolveAction(B, side, action, ev) {\n  switch (action?.type) {\n    case 'move':   return useMove(B, side, action.id, ev);\n    case 'switch': return doSwitch(B, side, action.i, ev);\n    case 'item':   return useItem(B, side, action.id, ev);\n    case 'bond':   return doBond(B, side, action, ev);\n    case 'run':    return doRun(B, side, ev);\n    default:       return useMove(B, side, activeOf(B, side).moves[0]?.id || 'struggle', ev);\n  }\n}\n\n// ---- moves ----------------------------------------------------------------\nfunction useMove(B, side, id, ev) {\n  const g = activeOf(B, side);\n  const tSide = other(side);\n  const vol = B.vol[side];\n  let slot = g.moves.find(m => m.id === id);\n  let move = getMove(id);\n\n  // Out of focus on the chosen move, or on everything: throw yourself at it.\n  if (slot && slot.focus <= 0) { move = getMove('struggle'); slot = null; }\n  if (!slot && !hasFocus(g) && move.id !== 'struggle') { move = getMove('struggle'); }\n\n  // --- status gates, before anything is spent ---\n  if (g.status === 'tangle' && B.rng.float() < RULES.tangleSkip) {\n    ev.push({ k: 'text', s: `${nm(g)} is bound up and cannot move!`, side, hold: 10 });\n    return;\n  }\n  if (g.status === 'dazzled' && B.rng.float() < RULES.dazzledFizzle) {\n    ev.push({ k: 'text', s: `${nm(g)} is seeing spots — the move fizzles out!`, side, hold: 10 });\n    return;\n  }\n\n  // --- two-turn charge ---\n  if (move.fx?.charge && vol.charging !== move.id) {\n    vol.charging = move.id;\n    if (slot) slot.focus = Math.max(0, slot.focus - 1);\n    ev.push({ k: 'text', s: `${nm(g)} ${move.fx.charge}!`, side, move: move.id, hold: 12 });\n    ev.push({ k: 'stat', side, target: side, stat: 'spa', delta: 0, stage: 0, name: nm(g),\n              anim: { fx: move.anim.fx, style: 'self' }, charge: true });\n    return;\n  }\n  const wasCharging = vol.charging === move.id;\n  vol.charging = null;\n  if (!wasCharging && slot) slot.focus = Math.max(0, slot.focus - 1);\n\n  ev.push({ k: 'text', s: `${nm(g)} used ${move.name}!`, side, move: move.id, hold: 8 });\n\n  const target = activeOf(B, tSide);\n\n  // --- accuracy ---\n  if (move.acc !== null && B.rng.float() * 100 >= move.acc) {\n    ev.push({ k: 'damage', side, target: tSide, move: move.id, anim: move.anim,\n              amount: 0, missed: true, hp: target.hp, maxhp: target.maxhp, eff: 1, crit: false });\n    ev.push({ k: 'text', s: `${nm(g)}'s attack went wide!`, hold: 10 });\n    return;\n  }\n\n  if (move.cat === 'status') { statusMove(B, side, move, ev); return; }\n\n  // --- damage ---\n  const hitCount = move.fx?.hits\n    ? B.rng.weighted([[2, 3], [3, 3], [4, 1], [5, 1]])\n    : 1;\n  let landed = 0, lastEff = 1, anyCrit = false, dealt = 0;\n  for (let h = 0; h < hitCount; h++) {\n    if (isFainted(target)) break;\n    const { dmg, eff, crit } = rollDamage(B, side, move);\n    lastEff = eff; anyCrit = anyCrit || crit;\n    target.hp = Math.max(0, target.hp - dmg);\n    dealt += dmg; landed++;\n    ev.push({\n      k: 'damage', side, target: tSide, move: move.id, anim: move.anim,\n      amount: dmg, hp: target.hp, maxhp: target.maxhp, eff, crit,\n      hit: h + 1, hits: hitCount,\n    });\n  }\n  if (hitCount > 1) ev.push({ k: 'text', s: `Hit ${landed} time${landed === 1 ? '' : 's'}!`, hold: 8 });\n  if (anyCrit) ev.push({ k: 'text', s: 'Right on the mark!', hold: 10 });\n  if (lastEff >= 2) ev.push({ k: 'text', s: 'A telling hit!', hold: 12, punch: true });\n  else if (lastEff < 1) ev.push({ k: 'text', s: 'It hardly told...', hold: 10 });\n\n  applySecondary(B, side, move, ev, dealt);\n}\n\nfunction applySecondary(B, side, move, ev, dealt) {\n  const fx = move.fx;\n  if (!fx) return;\n  const g = activeOf(B, side), tSide = other(side), t = activeOf(B, tSide);\n\n  if (fx.drain && dealt > 0 && !isFainted(g)) {\n    const back = Math.max(1, Math.floor(dealt * fx.drain));\n    const gain = Math.min(back, g.maxhp - g.hp);\n    if (gain > 0) {\n      g.hp += gain;\n      ev.push({ k: 'damage', side, target: side, amount: -gain, heal: true,\n                hp: g.hp, maxhp: g.maxhp, eff: 1, crit: false,\n                anim: { fx: 'fx.heart', style: 'self', shake: 0 } });\n      ev.push({ k: 'text', s: `${nm(g)} drew some warmth back.`, hold: 8 });\n    }\n  }\n  if (fx.recoil && dealt > 0) {\n    const hurt = Math.max(1, Math.floor(dealt * fx.recoil));\n    g.hp = Math.max(0, g.hp - hurt);\n    ev.push({ k: 'damage', side, target: side, amount: hurt, cause: 'recoil',\n              hp: g.hp, maxhp: g.maxhp, eff: 1, crit: false,\n              anim: { fx: 'fx.impact', style: 'self', shake: 2 } });\n    ev.push({ k: 'text', s: `${nm(g)} took the shock of it.`, hold: 10 });\n  }\n  if (fx.status && !isFainted(t)) {\n    tryStatus(B, side, tSide, fx.status.id, fx.status.chance ?? 1, ev);\n  }\n  for (const s of fx.stat || []) {\n    const targetSide = s.target === 'self' ? side : tSide;\n    if (s.chance !== undefined && B.rng.float() >= s.chance) continue;\n    if (targetSide === tSide && isFainted(t)) continue;\n    applyStat(B, side, targetSide, s.stat, s.delta, ev);\n  }\n}\n\nfunction statusMove(B, side, move, ev) {\n  const fx = move.fx || {};\n  const g = activeOf(B, side), tSide = other(side);\n  let did = false;\n  if (fx.heal) { doHeal(B, side, fx.heal, !!fx.cure, ev); did = true; }\n  if (fx.status) { tryStatus(B, side, tSide, fx.status.id, fx.status.chance ?? 1, ev); did = true; }\n  for (const s of fx.stat || []) {\n    const targetSide = s.target === 'self' ? side : tSide;\n    if (s.chance !== undefined && B.rng.float() >= s.chance) continue;\n    applyStat(B, side, targetSide, s.stat, s.delta, ev, move.anim);\n    did = true;\n  }\n  if (!did) ev.push({ k: 'text', s: `...but nothing came of it.`, hold: 10 });\n}\n\nconst STATUS_LINE = {\n  scorch: n => `${n} is scorched!`,\n  tangle: n => `${n} is tangled up!`,\n  soaked: n => `${n} is soaked through!`,\n  dazzled: n => `${n} is dazzled!`,\n};\n\nfunction tryStatus(B, side, tSide, id, chance, ev) {\n  const t = activeOf(B, tSide);\n  if (!t || isFainted(t)) return;\n  if (t.status) {\n    if (chance >= 1) {\n      ev.push({ k: 'text', s: `${nm(t)} is already ${STATUS[t.status].name.toLowerCase()}.`, hold: 8 });\n    }\n    return;\n  }\n  if (B.rng.float() >= chance) return;\n  t.status = id;\n  t.statusTurns = B.rng.int(RULES.statusTurns[0], RULES.statusTurns[1]);\n  ev.push({ k: 'status', side, target: tSide, status: id, name: nm(t), turns: t.statusTurns });\n  ev.push({ k: 'text', s: STATUS_LINE[id](nm(t)), hold: 12 });\n}\n\nfunction applyStat(B, side, tSide, stat, delta, ev, anim) {\n  const b = B.vol[tSide].boosts;\n  const t = activeOf(B, tSide);\n  if (!t) return;\n  const before = b[stat] || 0;\n  const after = clamp(before + delta, -6, 6);\n  const label = STAT_LABEL[stat] || stat.toUpperCase();\n  if (after === before) {\n    ev.push({ k: 'text', s: `${nm(t)}'s ${label} cannot go ${delta > 0 ? 'higher' : 'lower'}!`, hold: 10 });\n    return;\n  }\n  b[stat] = after;\n  ev.push({ k: 'stat', side, target: tSide, stat, delta, stage: after, name: nm(t), anim });\n  const word = delta >= 2 ? 'rose sharply' : delta > 0 ? 'rose'\n             : delta <= -2 ? 'fell hard' : 'fell';\n  ev.push({ k: 'text', s: `${nm(t)}'s ${label} ${word}!`, hold: 10 });\n}\n\nfunction doHeal(B, side, frac, cure, ev) {\n  const g = activeOf(B, side);\n  const room = g.maxhp - g.hp;\n  if (room <= 0 && !(cure && g.status)) {\n    ev.push({ k: 'text', s: `${nm(g)} is already at full heart.`, hold: 10 });\n    return;\n  }\n  if (room > 0) {\n    const amt = Math.min(room, Math.max(1, Math.floor(g.maxhp * frac)));\n    g.hp += amt;\n    ev.push({ k: 'damage', side, target: side, amount: -amt, heal: true,\n              hp: g.hp, maxhp: g.maxhp, eff: 1, crit: false,\n              anim: { fx: 'fx.sparkle', style: 'self', shake: 0 } });\n    ev.push({ k: 'text', s: `${nm(g)} steadied and took a breath.`, hold: 10 });\n  }\n  if (cure && g.status) {\n    g.status = null; g.statusTurns = 0;\n    ev.push({ k: 'status', side, target: side, status: null, cured: true, name: nm(g) });\n    ev.push({ k: 'text', s: `${nm(g)} feels well again.`, hold: 10 });\n  }\n}\n\n// ---- switch / item / bond / run -------------------------------------------\nfunction doSwitch(B, side, i, ev) {\n  if (side !== 'player') return;\n  const g = B.party[i];\n  if (i === B.active || !g || isFainted(g)) {\n    ev.push({ k: 'text', s: 'There is nobody to swap in.', hold: 10 });\n    return;\n  }\n  const from = nm(B.party[B.active]);\n  B.active = i;\n  B.vol.player = volState();\n  ev.push({ k: 'switch', side: 'player', i, from, to: nm(g), name: nm(g) });\n  ev.push({ k: 'text', s: `${from}, come back! Your turn, ${nm(g)}!`, hold: 14 });\n}\n\n/** After a faint: swaps in without spending a turn. */\nexport function forceSwitch(B, i) {\n  const ev = [];\n  const g = B.party[i];\n  if (!g || isFainted(g)) return ev;\n  B.active = i;\n  B.vol.player = volState();\n  B.needSwitch = null;\n  ev.push({ k: 'switch', side: 'player', i, from: null, to: nm(g), name: nm(g) });\n  ev.push({ k: 'text', s: `Your turn, ${nm(g)}!`, hold: 14 });\n  return ev;\n}\n\nconst ITEMS = {\n  salve: { name: 'Salve', heal: 24 },\n  poultice: { name: 'Poultice', heal: 60 },\n  tonic: { name: 'Tonic', cure: true },\n};\nfunction useItem(B, side, id, ev) {\n  const it = ITEMS[id];\n  const g = activeOf(B, side);\n  if (!it) { ev.push({ k: 'text', s: 'Nothing happened.', hold: 8 }); return; }\n  ev.push({ k: 'text', s: `You used the ${it.name}.`, hold: 8 });\n  if (it.heal) {\n    const amt = Math.min(g.maxhp - g.hp, it.heal);\n    if (amt <= 0) { ev.push({ k: 'text', s: `${nm(g)} is already at full heart.`, hold: 10 }); return; }\n    g.hp += amt;\n    ev.push({ k: 'damage', side, target: side, amount: -amt, heal: true,\n              hp: g.hp, maxhp: g.maxhp, eff: 1, crit: false,\n              anim: { fx: 'fx.sparkle', style: 'self' } });\n    ev.push({ k: 'text', s: `${nm(g)} looks brighter.`, hold: 10 });\n  }\n  if (it.cure && g.status) {\n    g.status = null; g.statusTurns = 0;\n    ev.push({ k: 'status', side, target: side, status: null, cured: true, name: nm(g) });\n    ev.push({ k: 'text', s: `${nm(g)} feels well again.`, hold: 10 });\n  }\n}\n\nfunction doBond(B, side, action, ev) {\n  if (side !== 'player') return;\n  const foe = activeOf(B, 'foe');\n  if (!canBond(B)) {\n    ev.push({ k: 'text', s: 'This one already belongs with somebody.', hold: 12 });\n    return;\n  }\n  const charm = action.charm || B.ctx.charm || 'charm';\n  ev.push({ k: 'text', s: `You held out the ${getCharm(charm).name} and waited.`, hold: 14 });\n  const res = bondAttempt(foe, { ...B.ctx, charm, playerLevel: activeOf(B, 'player')?.lvl }, B.rng);\n  ev.push({ k: 'bond-try', charm, beats: res.beats, p: res.p, name: nm(foe) });\n  if (res.ok) {\n    ev.push({ k: 'bond-ok', species: foe.species, name: nm(foe), level: foe.lvl,\n              hearth: res.hearth, foe, charm });\n    ev.push({ k: 'text', s: `${nm(foe)} decided to come home with you!`, hold: 20, punch: true });\n    B.over = true; B.outcome = 'bonded'; B.bonded = foe;\n  } else {\n    ev.push({ k: 'bond-fail', beats: res.beats, charm, hearth: res.hearth });\n    ev.push({ k: 'text', s: res.msg, hold: 16 });\n  }\n}\n\nfunction doRun(B, side, ev) {\n  if (side !== 'player') return;\n  if (!canRun(B)) {\n    ev.push({ k: 'text', s: 'There is no walking out of a proper match!', hold: 12 });\n    return;\n  }\n  B.runAttempts++;\n  const ps = statOf(B, 'player', 'spe'), fs = statOf(B, 'foe', 'spe');\n  const odds = (ps * 128) / Math.max(1, fs) + 30 * B.runAttempts;\n  const p = clamp(odds / 256, 0.15, 0.95);\n  if (B.rng.float() < p) {\n    ev.push({ k: 'text', s: 'You backed away slowly, and it let you.', hold: 16 });\n    B.over = true; B.outcome = 'fled';\n  } else {\n    ev.push({ k: 'text', s: 'You could not get clear!', hold: 14 });\n  }\n}\n\n// ---- end of turn ----------------------------------------------------------\nfunction endOfTurn(B, ev) {\n  const order = statOf(B, 'player', 'spe') >= statOf(B, 'foe', 'spe')\n    ? ['player', 'foe'] : ['foe', 'player'];\n  for (const side of order) {\n    const g = activeOf(B, side);\n    if (!g || isFainted(g)) continue;\n    if (g.status === 'scorch') {\n      const amt = Math.max(1, Math.floor(g.maxhp * RULES.scorchTick));\n      g.hp = Math.max(0, g.hp - amt);\n      ev.push({ k: 'damage', side, target: side, amount: amt, cause: 'scorch',\n                hp: g.hp, maxhp: g.maxhp, eff: 1, crit: false,\n                anim: { fx: 'fx.ember', style: 'self', shake: 1 } });\n      ev.push({ k: 'text', s: `The scorch bites at ${nm(g)}.`, hold: 12 });\n      if (isFainted(g)) continue;\n    }\n    if (g.status && g.statusTurns > 0) {\n      g.statusTurns--;\n      if (g.statusTurns <= 0) {\n        const was = g.status;\n        g.status = null;\n        ev.push({ k: 'status', side, target: side, status: null, cured: true, name: nm(g) });\n        ev.push({ k: 'text', s: `${nm(g)} shook off the ${STATUS[was].name.toLowerCase()}.`, hold: 12 });\n      }\n    }\n    B.vol[side].turnsOut++;\n  }\n}\n\n// ---- faints, xp, levels, evolution ---------------------------------------\nfunction checkFaints(B, ev) {\n  const f = activeOf(B, 'foe');\n  if (f && isFainted(f) && !B.vol.foe.fainted) {\n    B.vol.foe.fainted = true;\n    ev.push({ k: 'faint', side: 'foe', name: nm(f) });\n    ev.push({ k: 'text', s: `${nm(f)} has had enough.`, hold: 18 });\n    awardXp(B, f, ev);\n    const next = B.foeParty.findIndex(g => !isFainted(g));\n    if (next < 0) { B.over = true; B.outcome = 'won'; }\n    else {\n      B.foeActive = next;\n      B.vol.foe = volState();\n      const who = B.ctx.trainer?.name || 'The challenger';\n      ev.push({ k: 'switch', side: 'foe', i: next, from: null, to: nm(B.foeParty[next]),\n                name: nm(B.foeParty[next]) });\n      ev.push({ k: 'text', s: `${who} sent out ${nm(B.foeParty[next])}!`, hold: 16 });\n    }\n  }\n  const p = activeOf(B, 'player');\n  if (p && isFainted(p) && !B.vol.player.fainted) {\n    B.vol.player.fainted = true;\n    ev.push({ k: 'faint', side: 'player', name: nm(p) });\n    ev.push({ k: 'text', s: `${nm(p)} has no heart left to give.`, hold: 18 });\n    if (!B.party.some(g => !isFainted(g))) { B.over = true; B.outcome = 'lost'; }\n    else if (!B.over) B.needSwitch = 'player';\n  }\n}\n\nfunction awardXp(B, foe, ev) {\n  const i = B.active;\n  const g = B.party[i];\n  if (!g || isFainted(g)) return;\n  const sp = SPECIES[foe.species];\n  let amount = Math.max(1, Math.floor((sp?.xpBase || 60) * foe.lvl / 7));\n  if (B.kind === 'trainer') amount = Math.floor(amount * 1.5);\n  g.bond = Math.min(255, (g.bond || 0) + 2);\n  gainXp(B, i, amount, ev);\n}\n\n/** Exported so the world can hand out XP for non-battle things too. */\nexport function gainXp(B, i, total, ev = []) {\n  const g = B.party[i];\n  if (!g) return ev;\n  ev.push({ k: 'text', s: `${nm(g)} gained ${total} XP.`, hold: 12 });\n  let left = total, guard = 0;\n  while (left > 0 && guard++ < 300) {\n    if (g.lvl >= maxLevel) { g.xp = 0; break; }\n    const room = g.xpNext - g.xp;\n    if (left < room) {\n      ev.push({ k: 'xp', i, amount: left, from: g.xp, to: g.xp + left, xpNext: g.xpNext, lvl: g.lvl });\n      g.xp += left;\n      left = 0;\n    } else {\n      ev.push({ k: 'xp', i, amount: room, from: g.xp, to: g.xpNext, xpNext: g.xpNext, lvl: g.lvl });\n      left -= room;\n      g.xp = 0;\n      levelUp(B, i, ev);\n    }\n  }\n  return ev;\n}\n\nfunction levelUp(B, i, ev) {\n  const g = B.party[i];\n  const before = { ...g.stats };\n  g.lvl++;\n  recalcStats(g);\n  g.xpNext = xpNeeded(g.lvl, SPECIES[g.species]?.growth);\n  const gains = {};\n  for (const k of STAT_KEYS) gains[k] = g.stats[k] - (before[k] || 0);\n  ev.push({ k: 'levelup', i, level: g.lvl, gains, stats: { ...g.stats }, name: nm(g), maxhp: g.maxhp, hp: g.hp });\n  ev.push({ k: 'text', s: `${nm(g)} grew to Lv${g.lvl}!`, hold: 18, punch: true });\n\n  for (const id of movesAt(g.species, g.lvl)) {\n    if (g.moves.some(m => m.id === id)) continue;\n    if (g.moves.length < 4) {\n      g.moves.push(makeMoveSlot(id));\n      ev.push({ k: 'text', s: `${nm(g)} learned ${getMove(id).name}!`, hold: 16 });\n    } else {\n      ev.push({ k: 'text', s: `${nm(g)} could learn ${getMove(id).name}, but knows four moves.`, hold: 16 });\n    }\n  }\n  const evo = evolutionFor(g);\n  if (evo) {\n    ev.push({ k: 'evolve', i, from: g.species, to: evo.to,\n              fromName: nm(g), toName: evo.toName, reason: evo.reason, cancellable: true });\n  }\n}\n\n// ---------------------------------------------------------------------------\n//  the opponent\n// ---------------------------------------------------------------------------\n/**\n * Picks weighted by expected value rather than strictly best, so a wild guardian is\n * readable but not a solved puzzle. Deterministic through B.rng.\n */\nexport function aiAction(B, side = 'foe') {\n  const g = activeOf(B, side);\n  if (!g) return { type: 'move', id: 'struggle' };\n  const foe = activeOf(B, other(side));\n  const usable = g.moves.filter(m => m.focus > 0);\n  if (!usable.length) return { type: 'move', id: 'struggle' };\n\n  const hurt = 1 - g.hp / Math.max(1, g.maxhp);\n  const scored = usable.map(slot => {\n    const mv = getMove(slot.id);\n    let score;\n    if (mv.cat === 'status') {\n      if (mv.fx?.heal) score = 6 + hurt * hurt * 120;\n      else if (mv.fx?.status) score = foe.status ? 2 : 26;\n      else score = 16;\n    } else {\n      const eff = mv.fx?.noType ? 1 : effectiveness(mv.type, foe.types);\n      const stab = g.types.includes(mv.type) ? RULES.stab : 1;\n      score = mv.power * eff * stab * (mv.acc === null ? 1 : mv.acc / 100) / 10;\n      if (mv.fx?.charge) score *= 0.6;\n      if (mv.fx?.recoil) score *= 0.85;\n    }\n    return [slot.id, Math.max(1, score)];\n  });\n  return { type: 'move', id: B.rng.weighted(scored) };\n}\n\n// ---------------------------------------------------------------------------\n//  helpers the scene and the party UI want\n// ---------------------------------------------------------------------------\nexport const hpFrac = g => g && g.maxhp > 0 ? clamp(g.hp / g.maxhp, 0, 1) : 0;\nexport const hpColorKey = g => {\n  const f = hpFrac(g);\n  return f > 0.5 ? 'good' : f > 0.2 ? 'warn' : 'bad';\n};\nexport function battleSummary(B) {\n  return {\n    turn: B.turn, kind: B.kind, over: B.over, outcome: B.outcome,\n    player: snap(activeOf(B, 'player')),\n    foe: snap(activeOf(B, 'foe')),\n  };\n}\nconst snap = g => g && {\n  species: g.species, name: displayName(g), lvl: g.lvl,\n  hp: g.hp, maxhp: g.maxhp, status: g.status,\n};\n","deps":{"./moves.js":"battle/moves.js","./species.js":"battle/species.js","./capture.js":"battle/capture.js","../core/rng.js":"core/rng.js"}},{"id":"battle/scene.js","code":"// The battle screen: presentation only. The engine decides what happens and hands\n// back an ordered event list; this file turns that list into something that feels\n// like it landed — timed text, hit flashes, screen shake, draining bars, and a\n// bonding sequence that reads as an offer rather than a capture.\n\nimport { R, LAYER } from '../core/renderer.js';\nimport { Input } from '../core/input.js';\nimport { Scenes } from '../core/scene.js';\nimport { Atlas } from '../art/atlas.js';\nimport { Audio } from '../core/audio.js';\nimport { UIx, Hooks } from '../core/bridge.js';\nimport { S, addHearth } from '../state.js';\nimport { Font } from '../core/font.js';\nimport { P, TYPE_COLOR, mix, shade } from '../art/palette.js';\nimport { clamp, ease } from '../core/util.js';\nimport {\n  newBattle, chooseAction, stepTurn, activeOf, canRun, canBond,\n  forceSwitch, aiAction, hpFrac,\n} from './engine.js';\nimport { makeGuardian, displayName, getSpecies, restEasy } from './species.js';\nimport { getMove } from './moves.js';\nimport { CHARMS, bondPreview } from './capture.js';\n\nconst MENU = ['Fight', 'Guardians', 'Bag', 'Run'];\nconst DRAIN = 22;              // frames an HP bar takes to travel its full width\nconst TEXT_HOLD = 8;\n\n// ---------------------------------------------------------------- battle scene\nfunction battleScene(params) {\n  let B = null;\n  let phase = 'intro';          // intro | menu | moves | bag | anim | over\n  let cursor = 0, moveCursor = 0, bagCursor = 0;\n  let queue = [];               // pending engine events\n  let text = '', textShown = 0, textHold = 0;\n  let t = 0, introT = 0;\n  let resolve = null, outcome = null;\n  const shownHp = { player: 1, foe: 1 };   // lags real HP so bars drain visibly\n  const shownXp = { v: 0 };\n  const fx = [];                // {name, x, y, t, frames}\n  const flash = { player: 0, foe: 0 };\n  const nudge = { player: 0, foe: 0 };\n  let bonding = null;           // {t, beats, ok}\n  let evolving = null;\n\n  // --- layout ---\n  const FOE = { x: 196, y: 26 };\n  const PLR = { x: 52, y: 74 };\n\n  function setText(s, hold = TEXT_HOLD) {\n    text = s; textShown = 0; textHold = hold;\n  }\n\n  function begin() {\n    const party = S.party.length ? S.party : demoParty();\n    const foe = params?.foeGuardian\n      || makeGuardian(params?.speciesId || 'leafowl', params?.level || 5, { where: params?.where || 'the tall grass' });\n    B = newBattle({\n      party, foe, kind: params?.kind || 'wild',\n      seed: (Date.now() ^ (S.seed || 1)) >>> 0,\n      ctx: {\n        villageLevel: safeLevel(), streak: S.missions?.streak || 0,\n        charm: 'charm', playerName: S.player.name,\n      },\n    });\n    shownHp.player = hpFrac(activeOf(B, 'player'));\n    shownHp.foe = hpFrac(activeOf(B, 'foe'));\n    shownXp.v = xpFrac(activeOf(B, 'player'));\n    S.seen[B.foeParty[0].species] = S.seen[B.foeParty[0].species] || 'seen';\n    setText(`A wild ${displayName(activeOf(B, 'foe'))} steps out of the grass!`, 26);\n  }\n\n  // --- event consumption -----------------------------------------------------\n  function pump() {\n    if (textHold > 0) { textHold--; return; }\n    if (!queue.length) {\n      if (B.over) { finish(); return; }\n      if (B.needSwitch) { openForcedSwitch(); return; }\n      phase = 'menu';\n      return;\n    }\n    const e = queue.shift();\n    applyEvent(e);\n  }\n\n  function applyEvent(e) {\n    switch (e.k) {\n      case 'text':\n        setText(e.s, e.hold ?? TEXT_HOLD);\n        if (e.punch) { R.shake(3, 8); Audio.sfx('confirm'); }\n        break;\n\n      case 'damage': {\n        const side = e.target;\n        if (e.missed) { Audio.sfx('cancel'); break; }\n        if (!e.heal) {\n          flash[side] = 10;\n          nudge[side] = 8;\n          const power = e.eff >= 2 ? 5 : e.eff < 1 ? 1 : 3;\n          R.shake(power, 10);\n          Audio.sfx('bump', { rate: e.eff >= 2 ? 0.8 : 1.2, gain: 1.2 });\n        } else Audio.sfx('chime');\n        const at = side === 'foe' ? FOE : PLR;\n        spawnFx(e.anim?.fx || 'fx.impact', at.x + 32, at.y + 32);\n        textHold = Math.max(textHold, 12);\n        break;\n      }\n\n      case 'status': Audio.sfx('deny'); textHold = 8; break;\n      case 'stat': {\n        const at = e.target === 'foe' ? FOE : PLR;\n        spawnFx(e.anim?.fx || 'fx.sparkle', at.x + 32, at.y + 40);\n        Audio.sfx('cursor'); textHold = 8; break;\n      }\n\n      case 'faint': {\n        Audio.sfx('deny');\n        textHold = 24;\n        break;\n      }\n\n      case 'switch': shownHp.player = hpFrac(activeOf(B, 'player')); textHold = 10; break;\n\n      case 'xp': shownXp.v = shownXp.v; textHold = 10; break;\n      case 'levelup': {\n        Audio.sfx('chime');\n        spawnFx('fx.star', PLR.x + 32, PLR.y + 10);\n        textHold = 20;\n        break;\n      }\n      case 'evolve': evolving = { t: 0, from: e.from, to: e.to, name: e.name }; textHold = 90; break;\n\n      case 'bond-try': bonding = { t: 0, beats: e.beats ?? 3, ok: false }; Audio.sfx('coin'); textHold = 70; break;\n      case 'bond-ok':\n        bonding = bonding || { t: 0, beats: 3 };\n        bonding.ok = true;\n        Audio.sfx('chime');\n        spawnFx('fx.heart', FOE.x + 32, FOE.y + 24);\n        if (e.hearth) addHearth(e.hearth);\n        S.seen[e.species] = 'bonded';\n        textHold = 30;\n        break;\n      case 'bond-fail': bonding = null; Audio.sfx('cancel'); textHold = 20; break;\n\n      case 'end': outcome = e.outcome; textHold = 20; break;\n      default: textHold = 6;\n    }\n  }\n\n  function spawnFx(name, x, y) {\n    const frames = Atlas.has(name) ? Atlas.frames(name) : 0;\n    if (!frames) return;\n    fx.push({ name, x, y, t: 0, frames });\n  }\n\n  // --- player actions --------------------------------------------------------\n  function submit(action) {\n    chooseAction(B, 'player', action);\n    chooseAction(B, 'foe', aiAction(B, 'foe'));\n    queue = stepTurn(B).slice();\n    phase = 'anim';\n    textHold = 0;\n  }\n\n  async function openForcedSwitch() {\n    phase = 'anim';\n    const live = B.party.map((g, i) => ({ g, i })).filter(o => o.g.hp > 0);\n    if (!live.length) { finish(); return; }\n    let pick = live[0].i;\n    try {\n      const chosen = await Hooks.party.chooseGuardian({ reason: 'faint', party: B.party });\n      if (typeof chosen === 'number' && chosen >= 0 && B.party[chosen]?.hp > 0) pick = chosen;\n    } catch {}\n    queue = forceSwitch(B, pick).slice();\n    shownHp.player = hpFrac(activeOf(B, 'player'));\n  }\n\n  async function finish() {\n    if (phase === 'over') return;\n    phase = 'over';\n    for (const g of B.party) restEasy(g);\n    const result = outcome || B.outcome || 'fled';\n    await UIx.fade('out', 14);\n    Scenes.pop(result);\n    resolve?.(result);\n  }\n\n  // --- update ----------------------------------------------------------------\n  function update() {\n    t++;\n    if (textShown < text.length) textShown += 2;\n    for (let i = fx.length - 1; i >= 0; i--) if (++fx[i].t > fx[i].frames * 4) fx.splice(i, 1);\n    for (const k of ['player', 'foe']) { if (flash[k] > 0) flash[k]--; if (nudge[k] > 0) nudge[k]--; }\n    if (bonding) bonding.t++;\n    if (evolving) evolving.t++;\n\n    // Bars chase their true value so damage reads as a drain, not a jump.\n    const pf = hpFrac(activeOf(B, 'player')), ff = hpFrac(activeOf(B, 'foe'));\n    shownHp.player += clamp(pf - shownHp.player, -1 / DRAIN, 1 / DRAIN);\n    shownHp.foe += clamp(ff - shownHp.foe, -1 / DRAIN, 1 / DRAIN);\n    const xf = xpFrac(activeOf(B, 'player'));\n    shownXp.v += clamp(xf - shownXp.v, -1 / 40, 1 / 40);\n\n    if (phase === 'intro') {\n      introT++;\n      // Long enough for the slide-in to land, short enough not to make anyone wait.\n      if (introT > 26 && (Input.pressed('a') || introT > 54)) { phase = 'anim'; queue = []; textHold = 0; }\n      return;\n    }\n\n    if (phase === 'anim') {\n      // Holding A fast-forwards the beat, which is what impatient players want.\n      if (Input.held('a') && textHold > 2) textHold -= 2;\n      if (textShown < text.length && Input.held('a')) textShown += 3;\n      pump();\n      return;\n    }\n\n    if (phase === 'menu') {\n      const n = MENU.length;\n      if (Input.pressed('down') || Input.pressed('right')) { cursor = (cursor + 1) % n; Audio.sfx('cursor'); }\n      if (Input.pressed('up') || Input.pressed('left')) { cursor = (cursor + n - 1) % n; Audio.sfx('cursor'); }\n      if (Input.pressed('a')) {\n        Audio.sfx('confirm');\n        const pick = MENU[cursor];\n        if (pick === 'Fight') { phase = 'moves'; moveCursor = 0; }\n        else if (pick === 'Guardians') openParty();\n        else if (pick === 'Bag') { phase = 'bag'; bagCursor = 0; }\n        else if (pick === 'Run') {\n          if (!canRun(B)) { setText('There is no running from this one.', 20); phase = 'anim'; }\n          else submit({ type: 'run' });\n        }\n      }\n      return;\n    }\n\n    if (phase === 'moves') {\n      const g = activeOf(B, 'player');\n      const n = Math.max(1, g.moves.length);\n      if (Input.pressed('down')) { moveCursor = (moveCursor + 2) % n; Audio.sfx('cursor'); }\n      if (Input.pressed('up')) { moveCursor = (moveCursor + n - 2) % n; Audio.sfx('cursor'); }\n      if (Input.pressed('right')) { moveCursor = (moveCursor + 1) % n; Audio.sfx('cursor'); }\n      if (Input.pressed('left')) { moveCursor = (moveCursor + n - 1) % n; Audio.sfx('cursor'); }\n      if (Input.pressed('b')) { phase = 'menu'; Audio.sfx('cancel'); }\n      if (Input.pressed('a')) {\n        const m = g.moves[moveCursor];\n        if (!m || m.focus <= 0) { Audio.sfx('deny'); setText('That move has no focus left.', 16); phase = 'anim'; return; }\n        Audio.sfx('confirm');\n        submit({ type: 'move', id: m.id });\n      }\n      return;\n    }\n\n    if (phase === 'bag') {\n      const items = bagItems();\n      if (Input.pressed('down')) { bagCursor = (bagCursor + 1) % items.length; Audio.sfx('cursor'); }\n      if (Input.pressed('up')) { bagCursor = (bagCursor + items.length - 1) % items.length; Audio.sfx('cursor'); }\n      if (Input.pressed('b')) { phase = 'menu'; Audio.sfx('cancel'); }\n      if (Input.pressed('a')) {\n        const it = items[bagCursor];\n        if (!it || it.n <= 0) { Audio.sfx('deny'); return; }\n        Audio.sfx('confirm');\n        if (it.bond) {\n          if (!canBond(B)) { setText('You cannot offer a charm to a friend’s Guardian.', 20); phase = 'anim'; return; }\n          submit({ type: 'bond', charm: it.id });\n        } else submit({ type: 'item', id: it.id });\n      }\n    }\n  }\n\n  async function openParty() {\n    phase = 'anim'; textHold = 2;\n    try {\n      const i = await Hooks.party.chooseGuardian({ reason: 'switch', party: B.party });\n      if (typeof i === 'number' && i >= 0 && i !== B.active && B.party[i]?.hp > 0) {\n        submit({ type: 'switch', i });\n        return;\n      }\n    } catch {}\n    phase = 'menu';\n  }\n\n  // --- render ----------------------------------------------------------------\n  function render() {\n    R.layer(LAYER.GROUND, () => drawBackdrop());\n    R.layer(LAYER.ENTITY, () => {\n      drawBattler('foe');\n      drawBattler('player');\n      drawFx();\n    });\n    R.layer(LAYER.UI, () => {\n      drawPanel('foe');\n      drawPanel('player');\n      drawTextbox();\n      if (phase === 'menu') drawMenu();\n      else if (phase === 'moves') drawMoves();\n      else if (phase === 'bag') drawBag();\n      if (evolving) drawEvolve();\n    });\n  }\n\n  function drawBackdrop() {\n    // An outdoor arena that echoes the overworld rather than a flat colour field.\n    const sky = mix(P.water0, P.paper0, 0.45);\n    R.rect(0, 0, R.W, 96, sky);\n    for (let i = 0; i < 3; i++) {\n      const y = 44 + i * 8;\n      R.rect(0, y, R.W, 8, mix(P.leaf3, sky, 0.72 - i * 0.18));\n    }\n    R.rect(0, 96, R.W, R.H - 96, P.grass2);\n    R.rect(0, 92, R.W, 6, P.grass1);\n    for (let x = 0; x < R.W; x += 4) {\n      R.rect(x, 96 + ((x / 4) % 2), 2, 1, P.grass0);\n      R.rect(x + 2, 118 + ((x / 4) % 3), 2, 1, P.grass3);\n    }\n    // Ground discs the battlers stand on — they anchor the sprites.\n    disc(FOE.x + 32, FOE.y + 60, 42, 12, P.grass1);\n    disc(PLR.x + 32, PLR.y + 62, 52, 14, P.grass1);\n  }\n\n  function disc(cx, cy, rx, ry, c) {\n    for (let y = -ry; y <= ry; y++) {\n      const half = Math.sqrt(Math.max(0, 1 - (y / ry) ** 2)) * rx;\n      R.rect(cx - half, cy + y, half * 2, 1, y < 0 ? mix(c, '#ffffff', 0.12) : c);\n    }\n  }\n\n  function drawBattler(side) {\n    const g = activeOf(B, side);\n    if (!g) return;\n    const at = side === 'foe' ? FOE : PLR;\n    const bob = Math.sin(t / 26 + (side === 'foe' ? 1 : 0)) * 1.5;\n    const slide = phase === 'intro'\n      ? (1 - ease.outCubic(Math.min(1, introT / 34))) * (side === 'foe' ? 90 : -90)\n      : 0;\n    const push = nudge[side] > 0 ? Math.sin(nudge[side] / 8 * Math.PI) * (side === 'foe' ? 4 : -4) : 0;\n    const name = `g.${g.species}.${side === 'foe' ? 'front' : 'back'}`;\n    const img = Atlas.tryGet(name);\n    const x = at.x + slide + push, y = at.y + bob;\n    const fainted = g.hp <= 0;\n    const sink = fainted ? 16 : 0;\n\n    const sh = Atlas.tryGet('fx.shadow.big');\n    if (sh) R.blit(sh, x, at.y + 54, { alpha: fainted ? 0.15 : 0.42 });\n\n    if (!img) { R.rect(x + 8, y + 8, 48, 48, '#ff00ff'); return; }\n    if (bonding && side === 'foe') {\n      const k = Math.min(1, bonding.t / 30);\n      if (bonding.ok && bonding.t > 40) return;\n      R.blit(img, x, y + sink, { alpha: 1 - k * 0.75 });\n      return;\n    }\n    if (evolving && side === 'player') return;   // the evolution overlay owns the sprite\n    if (flash[side] > 0 && flash[side] % 4 < 2) R.silhouette(img, x, y, '#ffffff', 0.9);\n    else R.blit(img, x, y + sink, { alpha: fainted ? 0.4 : 1 });\n  }\n\n  function drawFx() {\n    for (const f of fx) {\n      const img = Atlas.tryGet(f.name, Math.floor(f.t / 4));\n      if (img) R.blit(img, f.x - img.width / 2, f.y - img.height / 2);\n    }\n    if (bonding) {\n      const k = Math.min(1, bonding.t / 26);\n      const cx = PLR.x + 40 + (FOE.x - PLR.x) * ease.outQuad(k);\n      const cy = PLR.y + 20 - Math.sin(k * Math.PI) * 40 + (FOE.y - PLR.y) * k;\n      const img = Atlas.tryGet('fx.charm', Math.floor(bonding.t / 4));\n      if (img) R.blit(img, cx - img.width / 2, cy - img.height / 2);\n      if (bonding.t > 30) {\n        const beat = Math.floor((bonding.t - 30) / 14);\n        for (let i = 0; i < Math.min(beat, bonding.beats); i++) {\n          const h = Atlas.tryGet('ui.heart');\n          if (h) R.blit(h, FOE.x + 18 + i * 12, FOE.y + 66);\n        }\n      }\n    }\n  }\n\n  function drawPanel(side) {\n    const g = activeOf(B, side);\n    if (!g) return;\n    const foe = side === 'foe';\n    const w = foe ? 112 : 124;\n    const h = foe ? 30 : 40;\n    const x = foe ? 8 : R.W - w - 8;\n    const y = foe ? 10 : 92;\n    UIx.panel(x, y, w, h, 'paper');\n\n    R.text(displayName(g), x + 7, y + 5, { color: P.ink2, shadow: false });\n    R.text(`${g.lvl}`, x + w - 8, y + 5, { color: P.ink2, shadow: false, align: 'right' });\n    R.text('Lv', x + w - 19, y + 5, { color: P.ui2, shadow: false, align: 'right' });\n\n    // Type badges carry their name — an unlabelled colour block tells the player nothing.\n    g.types.forEach((ty, i) => {\n      const bx = x + 7 + i * 25, by = y + 16;\n      const b = Atlas.tryGet(`ui.type.${ty}`);\n      if (b) R.blit(b, bx, by);\n      else R.rect(bx, by, 22, 9, TYPE_COLOR[ty] || P.ui2);\n      R.text(ty.slice(0, 3).toUpperCase(), bx + 11, by + 1,\n        { color: '#fffaf0', shadow: shade(TYPE_COLOR[ty] || P.ui2, -0.55), align: 'center' });\n    });\n\n    const barX = x + 7 + g.types.length * 25 + 3;\n    hpBar(barX, y + 18, x + w - 8 - barX, shownHp[side]);\n    if (!foe) {\n      R.text(`${Math.max(0, Math.ceil(shownHp.player * g.maxhp))}/${g.maxhp}`,\n        x + w - 8, y + 26, { color: P.ink2, shadow: false, align: 'right' });\n      R.text('XP', x + 8, y + 32, { color: P.ui2, shadow: false });\n      xpBar(x + 22, y + 34, w - 30, shownXp.v);\n    }\n  }\n\n  function hpBar(x, y, w, frac) {\n    const f = clamp(frac, 0, 1);\n    R.rect(x - 1, y - 1, w + 2, 6, P.ui4);\n    R.rect(x, y, w, 4, '#2c2418');\n    const col = f > 0.5 ? P.hpGood : f > 0.22 ? P.hpWarn : P.hpBad;\n    R.rect(x, y, Math.round(w * f), 4, col);\n    R.rect(x, y, Math.round(w * f), 1, mix(col, '#ffffff', 0.45));\n  }\n\n  function xpBar(x, y, w, frac) {\n    R.rect(x - 1, y - 1, w + 2, 4, P.ui4);\n    R.rect(x, y, w, 2, '#1d2a34');\n    R.rect(x, y, Math.round(w * clamp(frac, 0, 1)), 2, P.xp);\n  }\n\n  function drawTextbox() {\n    const h = 44;\n    UIx.panel(6, R.H - h - 4, R.W - 12, h, 'paper');\n    const lines = Font.wrap(text, R.W - 34);\n    let n = textShown;\n    lines.slice(0, 3).forEach((l, i) => {\n      const limit = Math.max(0, Math.min(l.length, n));\n      n -= l.length;\n      R.text(l, 16, R.H - h + 4 + i * 12, { color: P.ink2, shadow: false, limit });\n    });\n  }\n\n  function drawMenu() {\n    const w = 128, h = 44, x = R.W - w - 6, y = R.H - h - 4;\n    UIx.panel(x, y, w, h, 'paper');\n    MENU.forEach((m, i) => {\n      const mx = x + 14 + (i % 2) * 58, my = y + 8 + Math.floor(i / 2) * 16;\n      const on = i === cursor;\n      if (on) {\n        R.rect(mx - 4, my - 2, 54, 13, mix(P.gold1, P.paper0, 0.55));\n        const c = Atlas.tryGet('ui.cursor');\n        if (c) R.blit(c, mx - 11, my + Math.sin(t / 8) * 0.5);\n        else R.text('▶', mx - 11, my, { color: P.gold3, shadow: false });\n      }\n      R.text(m, mx, my, { color: on ? P.ink : P.ink3, shadow: false });\n    });\n  }\n\n  function drawMoves() {\n    const g = activeOf(B, 'player');\n    const w = R.W - 12, h = 50, x = 6, y = R.H - h - 4;\n    UIx.panel(x, y, w, h, 'paper');\n    const m0 = g.moves[moveCursor];\n    g.moves.forEach((m, i) => {\n      const mx = x + 16 + (i % 2) * 132, my = y + 8 + Math.floor(i / 2) * 15;\n      const on = i === moveCursor;\n      if (on) {\n        R.rect(mx - 5, my - 2, 126, 13, mix(P.gold1, P.paper0, 0.5));\n        const c = Atlas.tryGet('ui.cursor');\n        if (c) R.blit(c, mx - 12, my);\n      }\n      const dim = m.focus <= 0;\n      R.text(m.name, mx, my, { color: dim ? P.ui2 : on ? P.ink : P.ink3, shadow: false });\n      R.text(`${m.focus}/${m.maxFocus ?? m.focus}`, mx + 120, my, { color: P.ui2, shadow: false, align: 'right' });\n    });\n    if (m0) {\n      const b = Atlas.tryGet(`ui.type.${m0.type}`);\n      if (b) R.blit(b, x + 16, y + h - 13);\n      R.text(`POW ${m0.power || '—'}   ACC ${m0.acc ? Math.round(m0.acc * 100) : '—'}`,\n        x + 46, y + h - 12, { color: P.ink3, shadow: false });\n    }\n  }\n\n  function drawBag() {\n    const items = bagItems();\n    const w = 150, h = 52, x = R.W - w - 6, y = R.H - h - 4;\n    UIx.panel(x, y, w, h, 'paper');\n    items.slice(0, 3).forEach((it, i) => {\n      const my = y + 8 + i * 14;\n      const on = i === bagCursor;\n      if (on) {\n        R.rect(x + 8, my - 2, w - 16, 13, mix(P.gold1, P.paper0, 0.5));\n        const c = Atlas.tryGet('ui.cursor');\n        if (c) R.blit(c, x + 3, my);\n      }\n      R.text(it.name, x + 14, my, { color: it.n > 0 ? P.ink2 : P.ui2, shadow: false });\n      R.text(`x${it.n}`, x + w - 12, my, { color: P.ink3, shadow: false, align: 'right' });\n    });\n    if (canBond(B)) {\n      const pv = safeBondPreview();\n      if (pv) R.text(`bond chance ~${Math.round(pv * 100)}%`, x + 14, y + h - 12, { color: P.ui2, shadow: false });\n    }\n  }\n\n  function drawEvolve() {\n    const k = Math.min(1, evolving.t / 90);\n    R.rect(0, 0, R.W, R.H, `rgba(12,10,18,${0.55 * k})`);\n    const from = Atlas.tryGet(`g.${evolving.from}.front`);\n    const to = Atlas.tryGet(`g.${evolving.to}.front`);\n    const cx = R.W / 2 - 32, cy = 40;\n    const flicker = evolving.t % 8 < 4;\n    const img = k < 0.75 ? (flicker ? from : to) : to;\n    if (img) {\n      if (k < 0.85) R.silhouette(img, cx, cy, '#ffffff', 0.95);\n      else R.blit(img, cx, cy);\n    }\n    const g = Atlas.tryGet('fx.evolve', Math.floor(evolving.t / 6) % 6);\n    if (g) R.blit(g, cx + 20, cy + 20);\n  }\n\n  // --- helpers ---------------------------------------------------------------\n  function bagItems() {\n    return [\n      { id: 'charm', name: 'Woven Charm', n: S.bag.charm || 0, bond: true },\n      { id: 'salve', name: 'Warm Salve', n: S.bag.salve || 0 },\n      { id: 'kindling', name: 'Kindling', n: S.bag.kindling || 0 },\n    ];\n  }\n  function safeBondPreview() {\n    try {\n      return bondPreview(activeOf(B, 'foe'), {\n        charm: 'charm', villageLevel: safeLevel(), streak: S.missions?.streak || 0,\n      })?.p ?? null;\n    } catch { return null; }\n  }\n\n  return {\n    enter(p) {\n      params = p || params || {};\n      resolve = params.__resolve || null;\n      begin();\n      phase = 'intro'; introT = 0;\n      if (Audio.hasSong('battle')) Audio.play('battle');\n    },\n    exit() { if (Audio.hasSong('field')) Audio.play('field'); },\n    update, render,\n  };\n}\n\nconst xpFrac = g => {\n  if (!g || !g.xpNext) return 0;\n  return clamp(g.xp / g.xpNext, 0, 1);\n};\n\nconst safeLevel = () => { try { return Hooks.village.level(); } catch { return 1; } };\n\n// A party for `?scene=battle` so the screen is always inspectable, and for a brand\n// new save that somehow reaches a battle before Gran hands one over.\nfunction demoParty() {\n  return [makeGuardian('embercub', 6, { where: 'the hearth' })];\n}\n\n// ---------------------------------------------------------------- registration\nexport function register() {\n  Scenes.register('battle', () => battleScene(null));\n\n  Hooks.install('battle', {\n    canBattle() { return true; },\n    async start(params) {\n      const res = await Scenes.pushAsync('battle', params || {});\n      return res || 'fled';\n    },\n  });\n}\n","deps":{"../core/renderer.js":"core/renderer.js","../core/input.js":"core/input.js","../core/scene.js":"core/scene.js","../art/atlas.js":"art/atlas.js","../core/audio.js":"core/audio.js","../core/bridge.js":"core/bridge.js","../state.js":"state.js","../core/font.js":"core/font.js","../art/palette.js":"art/palette.js","../core/util.js":"core/util.js","./engine.js":"battle/engine.js","./species.js":"battle/species.js","./moves.js":"battle/moves.js","./capture.js":"battle/capture.js"}},{"id":"village/economy.js","code":"// Currencies and the ledger.\n//\n// Two currencies, deliberately different in feel:\n//   coins  — earned in the game world (battles, selling, foraging). Buys materials.\n//   hearth — earned by real families doing real things together. Buys *warmth*:\n//            every building needs some, so the village literally cannot grow on\n//            game-grinding alone. That link is the point of the whole project.\n//\n// Everything that moves money goes through spend()/earn() with a human-readable\n// reason, and lands in a capped ledger so the player can always answer\n// \"where did my coins go?\".\n\nimport { S, addCoins, addHearth } from '../state.js';\nimport { Bus, EV } from '../core/events.js';\n\nexport const CURRENCY = {\n  coins: { id: 'coins', name: 'Coins', short: 'c', icon: 'ui.coin', color: '#f5c877' },\n  hearth: { id: 'hearth', name: 'Hearth', short: 'h', icon: 'ui.hearth', color: '#ff9d4d' },\n};\n\nconst LEDGER_MAX = 40;\n\nfunction bank() {\n  S.village ||= {};\n  if (!Array.isArray(S.village.ledger)) S.village.ledger = [];\n  return S.village.ledger;\n}\n\n/** Normalise anything cost-shaped into {coins, hearth}. */\nexport const cost = (coins = 0, hearth = 0) =>\n  typeof coins === 'object' && coins !== null\n    ? { coins: coins.coins | 0, hearth: coins.hearth | 0 }\n    : { coins: coins | 0, hearth: hearth | 0 };\n\nexport const Economy = {\n  get coins() { return S.coins | 0; },\n  get hearth() { return S.hearth | 0; },\n\n  cost,\n\n  /** Can the player pay this right now? */\n  canAfford(c) {\n    const k = cost(c);\n    return S.coins >= k.coins && S.hearth >= k.hearth;\n  },\n\n  /** What's still missing, as {coins, hearth} of non-negative gaps. */\n  shortfall(c) {\n    const k = cost(c);\n    return {\n      coins: Math.max(0, k.coins - S.coins),\n      hearth: Math.max(0, k.hearth - S.hearth),\n    };\n  },\n\n  /** A kind, specific sentence about why you can't pay yet. */\n  shortfallText(c) {\n    const s = this.shortfall(c);\n    const bits = [];\n    if (s.coins) bits.push(`${s.coins} more coins`);\n    if (s.hearth) bits.push(`${s.hearth} more hearth`);\n    if (!bits.length) return '';\n    return `Needs ${bits.join(' and ')}.`;\n  },\n\n  /** Deduct. Returns false and spends nothing if the player can't afford it. */\n  spend(c, reason = 'spent') {\n    const k = cost(c);\n    if (!this.canAfford(k)) return false;\n    if (k.coins) addCoins(-k.coins);\n    if (k.hearth) addHearth(-k.hearth);\n    this._log(-k.coins, -k.hearth, reason);\n    return true;\n  },\n\n  /** Credit. `gain` is cost-shaped: {coins, hearth}. */\n  earn(gain, reason = 'earned') {\n    const k = cost(gain);\n    if (k.coins) addCoins(k.coins);\n    if (k.hearth) addHearth(k.hearth);\n    if (k.coins || k.hearth) this._log(k.coins, k.hearth, reason);\n    return k;\n  },\n\n  _log(coins, hearth, reason) {\n    const l = bank();\n    l.unshift({ coins, hearth, reason: String(reason).slice(0, 40), day: S.clock?.day ?? 0 });\n    if (l.length > LEDGER_MAX) l.length = LEDGER_MAX;\n    Bus.emit(EV.TOAST, { ledger: true });\n  },\n\n  ledger() { return bank(); },\n  recent(n = 6) { return bank().slice(0, n); },\n\n  /** Lifetime totals, for the village board's little \"where it came from\" line. */\n  totals() {\n    let earnedC = 0, earnedH = 0, spentC = 0, spentH = 0;\n    for (const e of bank()) {\n      if (e.coins > 0) earnedC += e.coins; else spentC -= e.coins;\n      if (e.hearth > 0) earnedH += e.hearth; else spentH -= e.hearth;\n    }\n    return { earnedC, earnedH, spentC, spentH };\n  },\n\n  /** \"120c  8h\" — compact, used inside cards. Omits zero parts. */\n  format(c) {\n    const k = cost(c);\n    const bits = [];\n    if (k.coins) bits.push(`${k.coins}c`);\n    if (k.hearth) bits.push(`${k.hearth}h`);\n    return bits.length ? bits.join('  ') : 'free';\n  },\n\n  /** \"120 coins and 8 hearth\" — for dialogue. */\n  formatLong(c) {\n    const k = cost(c);\n    const bits = [];\n    if (k.coins) bits.push(`${k.coins} coins`);\n    if (k.hearth) bits.push(`${k.hearth} hearth`);\n    return bits.length ? bits.join(' and ') : 'nothing at all';\n  },\n};\n\nexport default Economy;\n","deps":{"../state.js":"state.js","../core/events.js":"core/events.js"}},{"id":"village/buildings.js","code":"// Building definitions, keyed 1:1 to art/names.js BUILDINGS.\n//\n// Footprints, overhang and tier counts are NOT defined here — they come from names.js\n// and are treated as fixed. This file adds the game design on top: what a building\n// costs at each tier, what unlocks it, what it *does for the player*, where it may\n// stand, and who moves in when it's finished.\n//\n// Design rules that keep the build menu legible:\n//   * every entry has a one-line `blurb` (what it is) and per-tier `gives` (what you\n//     get). Never show a cost without showing a benefit.\n//   * every lock has exactly one human sentence: \"Needs Village Level 3.\"\n//   * a few buildings unlock from REAL-WORLD missions, so the family loop visibly\n//     feeds the village. Those say so out loud.\n\nimport { BUILDINGS, buildingById } from '../art/names.js';\nimport { S } from '../state.js';\nimport { Economy } from './economy.js';\n\n// --- design data (id must exist in names.js) ----------------------------------\nconst DESIGN = {\n  hearthstone: {\n    cat: 'core', weight: 3, villager: 'gran', order: 0,\n    blurb: 'The heart of the village. Everything grows outward from here.',\n    costs: [{ coins: 0, hearth: 0 }, { coins: 60, hearth: 8 }, { coins: 180, hearth: 24 }, { coins: 400, hearth: 50 }],\n    gives: [\n      ['The village exists', 'Ground finishing spreads around it'],\n      ['Plaza stones replace bare dirt', 'Room for two more buildings'],\n      ['Lanterns light the plaza at night', 'Banners and planters unlocked'],\n      ['A grand hearth: full plaza', 'Villagers gather here every evening'],\n    ],\n    unlock: {}, place: { rule: 'any' },\n    doorLine: 'The Hearthstone is warm to the touch. The whole village leans toward it.',\n  },\n  cottage: {\n    cat: 'home', weight: 2, villager: 'farmer', order: 1,\n    blurb: 'A small house with a crooked chimney. Somebody will want to live here.',\n    costs: [{ coins: 40, hearth: 2 }, { coins: 120, hearth: 8 }, { coins: 260, hearth: 18 }],\n    gives: [\n      ['A villager moves in', 'Smoke from the chimney'],\n      ['A second villager joins them', 'A laundry line appears'],\n      ['A window box and a porch light', 'The whole lane feels lived-in'],\n    ],\n    unlock: {}, place: { rule: 'any' },\n    doorLine: 'Somebody is humming inside.',\n  },\n  kitchen: {\n    cat: 'home', weight: 2, villager: 'baker', order: 2,\n    blurb: 'A shared kitchen with one very good soup pot.',\n    costs: [{ coins: 60, hearth: 4 }, { coins: 150, hearth: 10 }, { coins: 300, hearth: 20 }],\n    gives: [\n      ['Cook a meal: heal the whole party', 'A warm light in the window'],\n      ['Meals also raise one guardian\\'s bond', 'A second stove; bread on the sill'],\n      ['A feast once a day: full heal + bond', 'The market smells wonderful'],\n    ],\n    unlock: { mission: 'cook-together' }, place: { rule: 'any' },\n    doorLine: 'Something is simmering. It smells like being looked after.',\n  },\n  garden: {\n    cat: 'garden', weight: 1, villager: 'farmer', order: 3,\n    blurb: 'Four tidy rows of soil. Things grow if you remember them.',\n    costs: [{ coins: 30, hearth: 1 }, { coins: 90, hearth: 6 }, { coins: 200, hearth: 14 }],\n    gives: [\n      ['One berry ready each morning', 'Sprouts you can watch grow'],\n      ['Two berries a morning', 'Flowers along the edges'],\n      ['Three berries and a rare seed', 'Bees, and a scarecrow with a hat'],\n    ],\n    unlock: { level: 2, mission: 'water-plants' },\n    place: { rule: 'openGround', note: 'Needs sun: keep one tile clear around it.' },\n    doorLine: 'The soil is dark and damp. Something is definitely coming up.',\n  },\n  workshop: {\n    cat: 'work', weight: 2, villager: 'smith', order: 4,\n    blurb: 'A bench, a vice, and a satisfying amount of sawdust.',\n    costs: [{ coins: 90, hearth: 6 }, { coins: 220, hearth: 14 }, { coins: 420, hearth: 26 }],\n    gives: [\n      ['Craft bonding charms from scrap', 'Building costs drop by 5%'],\n      ['Craft salves and tools', 'Building costs drop by 10%'],\n      ['Craft a Great Charm', 'Building costs drop by 15%'],\n    ],\n    unlock: { level: 2, built: ['cottage'], mission: 'make-something' },\n    place: { rule: 'any' },\n    doorLine: 'Hammering, then a pause, then quieter hammering.',\n  },\n  market: {\n    cat: 'work', weight: 2, villager: 'peddler', order: 5,\n    blurb: 'A striped awning and a peddler who knows everyone\\'s name.',\n    costs: [{ coins: 80, hearth: 5 }, { coins: 190, hearth: 12 }, { coins: 360, hearth: 22 }],\n    gives: [\n      ['Buy and sell goods', 'A daily deal on one item'],\n      ['Better prices; sell rare finds', 'Two stalls and a fruit crate'],\n      ['A travelling trader visits weekly', 'The plaza becomes a proper market'],\n    ],\n    unlock: { level: 3 }, place: { rule: 'nearHearth', maxDist: 9, note: 'Wants to be on the plaza.' },\n    doorLine: '\"Fresh in this morning!\" Everything is, apparently, fresh in this morning.',\n  },\n  library: {\n    cat: 'civic', weight: 2, villager: 'kid', order: 6,\n    blurb: 'A reading nook with too many cushions and exactly enough books.',\n    costs: [{ coins: 100, hearth: 8 }, { coins: 240, hearth: 16 }, { coins: 460, hearth: 28 }],\n    gives: [\n      ['Teach a guardian a forgotten move', 'A reading lamp glows at night'],\n      ['Guardians gain 10% more experience', 'Story hour: villagers gather'],\n      ['Learn about the valley\\'s old names', 'A star chart on the ceiling'],\n    ],\n    unlock: { level: 3, mission: 'read-aloud' }, place: { rule: 'any' },\n    doorLine: 'Someone is reading out loud, doing all the voices.',\n  },\n  infirmary: {\n    cat: 'civic', weight: 2, villager: 'gran', order: 7,\n    blurb: 'The Warmhouse: blankets, broth, and somebody keeping watch.',\n    costs: [{ coins: 120, hearth: 10 }, { coins: 280, hearth: 18 }, { coins: 520, hearth: 30 }],\n    gives: [\n      ['Heal the whole party for free', 'A lantern left on all night'],\n      ['Revive fainted guardians', 'Herbs drying under the eaves'],\n      ['Guardians rest here and gain bond', 'The kindest room in the valley'],\n    ],\n    unlock: { level: 4 }, place: { rule: 'any' },\n    doorLine: '\"Sit down, you look tired. Both of you.\"',\n  },\n  fountain: {\n    cat: 'core', weight: 1, villager: null, order: 8,\n    blurb: 'Stone basin, three spouts, one extremely confident duck.',\n    costs: [{ coins: 70, hearth: 6 }, { coins: 180, hearth: 14 }],\n    gives: [\n      ['The plaza gets a centre', 'Villagers stop and chat here'],\n      ['Lit water at night', 'Toss a coin: a small daily gift'],\n    ],\n    unlock: { level: 4 }, place: { rule: 'nearHearth', maxDist: 8, note: 'Belongs in the plaza.' },\n    doorLine: 'The water is very cold and the duck is very unimpressed.',\n  },\n  gate: {\n    cat: 'civic', weight: 1, villager: 'ranger', order: 9,\n    blurb: 'A timber arch that says: this is a place, and you are welcome in it.',\n    costs: [{ coins: 110, hearth: 8 }, { coins: 260, hearth: 16 }],\n    gives: [\n      ['Opens the north road', 'Travellers start arriving'],\n      ['A ranger keeps watch', 'Safe passage at night'],\n    ],\n    unlock: { level: 5 }, place: { rule: 'farFromHearth', minDist: 6, note: 'Marks the village edge.' },\n    doorLine: 'The road north climbs out of sight. Not today, maybe.',\n  },\n  bathhouse: {\n    cat: 'civic', weight: 3, villager: 'fisher', order: 10,\n    blurb: 'The Spring House. Hot water, cold stone, absolutely no hurrying.',\n    costs: [{ coins: 200, hearth: 16 }, { coins: 460, hearth: 32 }],\n    gives: [\n      ['Rest: full heal and a bond boost', 'Steam drifts across the plaza'],\n      ['Rest also clears every status', 'An outdoor pool under the stars'],\n    ],\n    unlock: { level: 5, mission: 'rest-together' }, place: { rule: 'any' },\n    doorLine: 'Steam, and the sound of somebody sighing happily.',\n  },\n  belltower: {\n    cat: 'core', weight: 3, villager: 'mayor', order: 11,\n    blurb: 'Tall, slightly crooked, and audible from the far ridge.',\n    costs: [{ coins: 260, hearth: 22 }, { coins: 600, hearth: 40 }],\n    gives: [\n      ['Rings when the village grows', 'New family missions every morning'],\n      ['Rings the hours', 'Villagers throw a festival at level 8'],\n    ],\n    unlock: { level: 6 }, place: { rule: 'nearHearth', maxDist: 11, note: 'Should be heard from the plaza.' },\n    doorLine: 'The rope is worn smooth. It would be very easy to pull.',\n  },\n};\n\nexport const CATEGORY = {\n  core: { name: 'Heart', color: '#f5c877' },\n  home: { name: 'Homes', color: '#f0836a' },\n  work: { name: 'Work', color: '#7fb6d9' },\n  civic: { name: 'Care', color: '#a98ada' },\n  garden: { name: 'Growing', color: '#8cc055' },\n};\n\n// --- the merged table ---------------------------------------------------------\nexport const DEFS = BUILDINGS.map(b => {\n  const d = DESIGN[b.id] || {};\n  return {\n    ...b,                          // id, name, w, h, overhang, tiers  (fixed, from names.js)\n    cat: d.cat || 'core',\n    weight: d.weight ?? 1,\n    villager: d.villager ?? null,\n    order: d.order ?? 99,\n    blurb: d.blurb || 'A building.',\n    costs: d.costs || Array.from({ length: b.tiers }, (_, i) => ({ coins: 50 * (i + 1), hearth: 4 * (i + 1) })),\n    gives: d.gives || Array.from({ length: b.tiers }, () => ['Helps the village grow']),\n    unlock: d.unlock || {},\n    place: d.place || { rule: 'any' },\n    doorLine: d.doorLine || 'The door is shut, but kindly.',\n    sprite: t => `b.${b.id}.t${Math.max(1, Math.min(b.tiers, t | 0))}`,\n  };\n}).sort((a, b) => a.order - b.order);\n\nconst BY_ID = new Map(DEFS.map(d => [d.id, d]));\nexport const defFor = id => BY_ID.get(id) || null;\nexport const allDefs = () => DEFS;\n\n// --- built-state queries (read S directly; no cross-module imports) -----------\nexport const builtList = () => (S.village?.buildings || []);\nexport const builtOf = id => builtList().filter(b => b.type === id);\nexport const countOf = id => builtOf(id).length;\nexport const isBuilt = id => countOf(id) > 0;\nexport const bestTier = id => builtOf(id).reduce((m, b) => Math.max(m, b.tier || 1), 0);\nexport const missionDone = id => !!(S.missions?.done || []).some(d => (d.id || d) === id);\n\n/** How many of a type you may own. Cottages and gardens scale with village level. */\nexport function maxCount(id, level) {\n  if (id === 'cottage') return Math.max(1, Math.min(6, level));\n  if (id === 'garden') return Math.max(1, Math.min(4, Math.floor(level / 2) + 1));\n  if (id === 'hearthstone') return 1;\n  return 1;\n}\n\n// --- unlocking ---------------------------------------------------------------\n// Returns exactly one reason string when locked, so the menu never shows a grey\n// row with no explanation.\nexport function unlockState(id, level = S.village?.level || 1) {\n  const def = defFor(id);\n  if (!def) return { unlocked: false, reason: 'Unknown building.' };\n  const u = def.unlock || {};\n\n  if (u.level && level < u.level) {\n    return { unlocked: false, reason: `Needs Village Level ${u.level}.`, kind: 'level', need: u.level };\n  }\n  if (u.built) {\n    for (const need of u.built) {\n      if (!isBuilt(need)) {\n        return { unlocked: false, reason: `Needs a ${defFor(need)?.name || need} first.`, kind: 'built' };\n      }\n    }\n  }\n  if (u.mission && !missionDone(u.mission)) {\n    cons
