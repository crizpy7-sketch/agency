A Story Before Lights Out',\n    'Made up or read from a book. Both are entirely real.',\n    { hearth: 3, repeat: 'daily' }),\n  r('early-night', 'rest', 'An Early Night',\n    'Everyone. Yes, the grown-ups too. Especially the grown-ups.',\n    { hearth: 5, repeat: 'weekly' }),\n  r('stretch-together', 'rest', 'Stretch Together for Five Minutes',\n    'Reach up. Fold down. Wobble. Laugh at the wobbling.',\n    { hearth: 3, repeat: 'daily' }),\n\n  // --- lending a hand --------------------------------------------------------\n  r('help-a-grown-up', 'helping', 'Help a Grown-Up With Their Job',\n    'Carry, hold, fetch, fold. Ask what would actually help.',\n    { hearth: 4, repeat: 'daily' }),\n  r('shopping-list', 'helping', 'Write the Shopping List Together',\n    'You are permitted to add exactly one silly item.',\n    { hearth: 4, repeat: 'weekly' }),\n  r('look-after-animal', 'helping', 'Look After an Animal',\n    'Feed, brush, walk, or simply sit near them for a while.',\n    { hearth: 3, repeat: 'daily' }),\n  r('fix-something', 'helping', 'Fix One Small Broken Thing',\n    'Glue, tape, a screwdriver, and a reasonable amount of patience.',\n    { hearth: 6, coins: 20 }),\n\n  // --- in the valley (in-game) -----------------------------------------------\n  g('walk-the-paths', 'Walk the Village Paths', 'Take five hundred steps around the valley.',\n    'steps', 500, { coins: 40, hearth: 1 }),\n  g('first-friend', 'Make Your First Friend', 'Bond with a guardian out in the tall grass.',\n    'bonded', 1, { hearth: 4, coins: 20 }),\n  g('three-friends', 'Three Friends', 'Bond with three guardians.', 'bonded', 3, { hearth: 6, coins: 40 }),\n  g('meet-neighbours', 'Meet the Neighbours', 'Talk to five people in the village.',\n    'talked', 5, { hearth: 4, coins: 20 }),\n  g('friendly-matches', 'Three Friendly Matches', 'Win three battles.', 'wins', 3, { coins: 60, hearth: 1 }),\n  g('raise-two', 'Raise Two Buildings', 'Build two new things in the village.', 'built', 2, { hearth: 5, coins: 30 }),\n  g('first-upgrade', 'First Upgrade', 'Take any building up a level.', 'upgraded', 1, { hearth: 4, coins: 20 }),\n];\n\nconst BY_ID = new Map(CATALOGUE.map(m => [m.id, m]));\nexport const byId = id => BY_ID.get(id) || null;\n\nconst DONE_MAX = 400;\n\n// --- state helpers -----------------------------------------------------------\nexport function ensureState() {\n  S.missions ||= {};\n  const m = S.missions;\n  if (!Array.isArray(m.active)) m.active = [];\n  if (!Array.isArray(m.done)) m.done = [];\n  if (!Array.isArray(m.dailyPool)) m.dailyPool = [];\n  if (typeof m.streak !== 'number') m.streak = 0;\n  if (typeof m.bestStreak !== 'number') m.bestStreak = m.streak || 0;\n  if (m.lastDay === undefined) m.lastDay = null;\n  m.repeats ||= {};\n  m.counters ||= {};\n  return m;\n}\n\nconst today = () => S.clock?.day ?? 1;\n\nexport const isTracked = id => ensureState().active.some(a => a.id === id);\nexport const entryOf = id => ensureState().active.find(a => a.id === id) || null;\nexport const timesDone = id => ensureState().done.filter(d => d.id === id).length;\n\n/** Is this mission finished *for now*? Dailies come back tomorrow, kindly. */\nexport function isDone(id) {\n  const m = byId(id);\n  const st = ensureState();\n  if (!m) return false;\n  if (m.repeat === 'once') return st.done.some(d => d.id === id);\n  const last = st.repeats[id];\n  if (last === undefined) return false;\n  if (m.repeat === 'daily') return last >= today();\n  if (m.repeat === 'weekly') return today() - last < 7;\n  return false;\n}\n\n/** Progress on a mission: game missions read live counters, real ones read the entry. */\nexport function progressOf(id) {\n  const m = byId(id);\n  if (!m) return 0;\n  if (m.kind === 'game') return Math.min(m.need, ensureState().counters[m.metric] || 0);\n  const e = entryOf(id);\n  if (isDone(id)) return m.need;\n  return e ? Math.min(m.need, e.progress || 0) : 0;\n}\n\nexport const needOf = id => byId(id)?.need || 1;\n\n// --- the daily invitation ----------------------------------------------------\n/**\n * A handful of things offered today. Deterministic per in-game day, so it feels\n * like a morning list rather than a slot machine. Nothing here expires: if you\n * don't feel like today's, every other mission is still on the ALL tab.\n */\nexport function refreshDaily(force = false) {\n  const st = ensureState();\n  const d = today();\n  if (!force && st.poolDay === d && st.dailyPool.length) return st.dailyPool;\n  const bell = (S.village?.buildings || []).some(b => b.type === 'belltower');\n  const size = bell ? 6 : 5;\n  const rng = makeRng((S.seed | 0) + d * 7919);\n\n  const dailies = CATALOGUE.filter(m => m.kind === 'real' && m.repeat === 'daily');\n  const weeklies = CATALOGUE.filter(m => m.kind === 'real' && m.repeat === 'weekly' && !isDone(m.id));\n  const oneOffs = CATALOGUE.filter(m => m.kind === 'real' && m.repeat === 'once' && !isDone(m.id));\n\n  const pool = [];\n  const take = (arr, n) => {\n    const shuffled = rng.shuffle([...arr]);\n    for (const m of shuffled) {\n      if (pool.length >= size) break;\n      if (n-- <= 0) break;\n      if (!pool.includes(m.id)) pool.push(m.id);\n    }\n  };\n  take(dailies, 3);\n  take(oneOffs, 2);\n  take(weeklies, 1);\n  take(dailies, size);           // top up if a category ran dry\n\n  st.dailyPool = pool.slice(0, size);\n  st.poolDay = d;\n  return st.dailyPool;\n}\n\nexport const dailyPool = () => refreshDaily();\n\n// --- listing ----------------------------------------------------------------\n/**\n * tab: 'today' | 'all' | 'game' | 'done'\n * Ordering puts tracked-and-unfinished first, because that is what you came to do.\n */\nexport function list(tab = 'today') {\n  ensureState();\n  let ids;\n  if (tab === 'today') ids = refreshDaily().slice();\n  else if (tab === 'game') ids = CATALOGUE.filter(m => m.kind === 'game').map(m => m.id);\n  else if (tab === 'done') ids = [...new Set(ensureState().done.map(d => d.id))];\n  else ids = CATALOGUE.filter(m => m.kind === 'real').map(m => m.id);\n\n  // Anything you've chosen to track shows up on TODAY too, always.\n  if (tab === 'today') {\n    for (const a of ensureState().active) {\n      const m = byId(a.id);\n      if (m && m.kind === 'real' && !ids.includes(a.id)) ids.unshift(a.id);\n    }\n  }\n  const rows = ids.map(id => rowFor(id)).filter(Boolean);\n  const rank = row => (row.done ? 2 : row.tracked ? 0 : 1);\n  rows.sort((a, b) => rank(a) - rank(b));\n  return rows;\n}\n\nexport function rowFor(id) {\n  const m = byId(id);\n  if (!m) return null;\n  const prog = progressOf(id);\n  return {\n    id, m,\n    cat: CATS[m.cat] || CATS.game,\n    tracked: isTracked(id),\n    done: isDone(id),\n    progress: prog,\n    need: m.need,\n    frac: m.need ? prog / m.need : 0,\n    reward: m.reward,\n    times: timesDone(id),\n  };\n}\n\nexport const rewardText = m => {\n  const bits = [];\n  if (m.reward.hearth) bits.push(`${m.reward.hearth} hearth`);\n  if (m.reward.coins) bits.push(`${m.reward.coins} coins`);\n  return bits.join(' + ') || 'a warm feeling';\n};\n\n/** The label of the one button on the card, so the UI never has to guess. */\nexport function actionLabel(id) {\n  const row = rowFor(id);\n  if (!row) return '';\n  if (row.done) return row.m.repeat === 'daily' ? 'Done today  ★' : 'Completed  ★';\n  if (row.m.kind === 'game') return `In progress  ${row.progress}/${row.need}`;\n  if (!row.tracked) return 'Track Mission';\n  return row.need > 1 ? `Mark a Step  ${row.progress}/${row.need}` : 'Mark Done';\n}\n\n// --- tracking ---------------------------------------------------------------\nexport function track(id) {\n  const m = byId(id);\n  const st = ensureState();\n  if (!m || m.kind === 'game' || isDone(id) || isTracked(id)) return false;\n  st.active.push({ id, progress: 0, need: m.need, acceptedAt: today() });\n  Bus.emit(EV.MISSION_TRACKED, { id, mission: m });\n  try { Audio.sfx('confirm'); } catch {}\n  try { UIx.toast(`Tracking: ${m.title}`, { ms: 2000 }); } catch {}\n  save();\n  return true;\n}\n\nexport function untrack(id) {\n  const st = ensureState();\n  const i = st.active.findIndex(a => a.id === id);\n  if (i < 0) return false;\n  st.active.splice(i, 1);\n  try { Audio.sfx('cancel'); } catch {}\n  save();\n  return true;\n}\n\n/** One step of a multi-step mission. Completes it when the last step lands. */\nexport function bump(id, n = 1) {\n  const m = byId(id);\n  if (!m || isDone(id)) return false;\n  if (!isTracked(id)) track(id);\n  const e = entryOf(id);\n  if (!e) return false;\n  e.progress = Math.min(m.need, (e.progress || 0) + n);\n  if (e.progress >= m.need) return complete(id);\n  try { Audio.sfx('coin'); } catch {}\n  try { UIx.toast(`${m.title}  ${e.progress}/${m.need}`, { ms: 1800 }); } catch {}\n  save();\n  return true;\n}\n\n/**\n * Mark a mission done. Trusted, celebrated, never questioned afterwards.\n * `quiet` skips the toast (used when several land at once).\n */\nexport function complete(id, { quiet = false } = {}) {\n  const m = byId(id);\n  const st = ensureState();\n  if (!m || isDone(id)) return false;\n\n  const d = today();\n  st.done.push({ id, at: Date.now(), day: d });\n  if (st.done.length > DONE_MAX) st.done.splice(0, st.done.length - DONE_MAX);\n  st.repeats[id] = d;\n  const i = st.active.findIndex(a => a.id === id);\n  if (i >= 0) st.active.splice(i, 1);\n  S.stats && (S.stats.missionsDone = (S.stats.missionsDone || 0) + 1);\n\n  // The streak counts days you did something together. It never goes down, so a\n  // missed day costs exactly nothing — it just rests until you come back.\n  if (st.lastDay !== d) {\n    st.streak = (st.streak || 0) + 1;\n    st.bestStreak = Math.max(st.bestStreak || 0, st.streak);\n    st.lastDay = d;\n  }\n\n  Economy.earn(m.reward, `mission: ${m.title}`);\n\n  if (m.unlocks) {\n    S.village ||= {};\n    S.village.unlocked ||= [];\n    if (!S.village.unlocked.includes(m.unlocks)) S.village.unlocked.push(m.unlocks);\n    setFlag('unlock.' + m.unlocks, true);\n  }\n  setFlag('mission.' + id, true);\n\n  try { Audio.sfx(m.kind === 'game' ? 'chime' : 'warm'); } catch {}\n  if (!quiet) {\n    try { UIx.toast(`${m.title}  +${rewardText(m)}`, { ms: 2600, icon: 'ui.hearth' }); } catch {}\n  }\n  Bus.emit(EV.MISSION_DONE, { id, mission: m, reward: m.reward, visible: m.visible });\n  save();\n  return true;\n}\n\n/** The warm words shown after a real-world mission is marked done. */\nexport function celebrationLines(id) {\n  const m = byId(id);\n  if (!m) return [];\n  const out = [`Lovely. ${rewardText(m)} for the village.`];\n  if (m.visible) out.push(m.visible);\n  if (m.unlocks) out.push(`The village can build a new thing now.`);\n  const st = ensureState();\n  if (st.streak >= 2) out.push(`That's ${st.streak} days you've done something together.`);\n  return out;\n}\n\nexport const STREAK_NOTE = 'Streaks never go down here. Miss a day and it just rests.';\n\nexport function streakInfo() {\n  const st = ensureState();\n  const gap = st.lastDay === null ? null : today() - st.lastDay;\n  return {\n    streak: st.streak || 0,\n    best: st.bestStreak || 0,\n    resting: gap !== null && gap > 1,\n    doneToday: gap === 0,\n    note: STREAK_NOTE,\n  };\n}\n\n// --- in-game progress hook --------------------------------------------------\nconst METRIC_ALIAS = {\n  step: 'steps', steps: 'steps', walk: 'steps',\n  bond: 'bonded', bonded: 'bonded', caught: 'bonded',\n  talk: 'talked', talked: 'talked', npc: 'talked',\n  win: 'wins', wins: 'wins', battleWon: 'wins',\n  built: 'built', place: 'built', placed: 'built',\n  upgrade: 'upgraded', upgraded: 'upgraded',\n};\n\n/**\n * Hooks.missions.note(kind, payload) — any gameplay event a mission might count.\n * Game missions complete themselves here; real-world ones are never touched by\n * this path, so nothing the player does in the game can mark a family mission done.\n */\nexport function note(kind, payload = {}) {\n  const metric = METRIC_ALIAS[kind];\n  if (!metric) return false;\n  const st = ensureState();\n  const n = Math.max(1, payload.n || payload.count || 1);\n  st.counters[metric] = (st.counters[metric] || 0) + n;\n  let any = false;\n  for (const m of CATALOGUE) {\n    if (m.kind !== 'game' || m.metric !== metric) continue;\n    if (isDone(m.id)) continue;\n    if ((st.counters[metric] || 0) >= m.need) { complete(m.id); any = true; }\n  }\n  return any;\n}\n\nexport function stats() {\n  const st = ensureState();\n  const real = st.done.filter(d => byId(d.id)?.kind === 'real').length;\n  return {\n    total: st.done.length,\n    real,\n    game: st.done.length - real,\n    tracked: st.active.length,\n    todayCount: refreshDaily().filter(id => !isDone(id)).length,\n    ...streakInfo(),\n  };\n}\n\nexport const Missions = {\n  CATALOGUE, CATS, byId, list, rowFor, actionLabel, rewardText, celebrationLines,\n  ensureState, isDone, isTracked, progressOf, needOf, timesDone,\n  track, untrack, bump, complete, note, refreshDaily, dailyPool, streakInfo, stats,\n  count: CATALOGUE.length,\n  realCount: CATALOGUE.filter(m => m.kind === 'real').length,\n};\n\nexport function register() {\n  ensureState();\n  refreshDaily();\n  Bus.on(EV.DAY_CHANGED, () => refreshDaily(true));\n  Hooks.install('missions', {\n    note,\n    activeCount() { return ensureState().active.length; },\n    todayCount() { return refreshDaily().filter(id => !isDone(id)).length; },\n    list(tab) { return list(tab); },\n    complete, track, streak() { return streakInfo(); },\n    catalogue: CATALOGUE,\n  });\n  if (typeof window !== 'undefined') window.__missions = Missions;\n  return Missions;\n}\n\nexport default Missions;\n","deps":{"../state.js":"state.js","../core/events.js":"core/events.js","../core/bridge.js":"core/bridge.js","../core/audio.js":"core/audio.js","../core/rng.js":"core/rng.js","../village/economy.js":"village/economy.js"}},{"id":"missions/missionui.js","code":"// The mission board.\n//\n// Tone is the whole job here: these are real things a family does together, offered\n// warmly and trusted when the player says they're done. No timers, no scolding, no\n// red overdue state. A missed day pauses the streak; it never punishes.\n\nimport { R, LAYER } from '../core/renderer.js';\nimport { Input } from '../core/input.js';\nimport { Scenes } from '../core/scene.js';\nimport { Atlas } from '../art/atlas.js';\nimport { Audio } from '../core/audio.js';\nimport { UIx } from '../core/bridge.js';\nimport { Font } from '../core/font.js';\nimport { S } from '../state.js';\nimport { P, mix, shade } from '../art/palette.js';\nimport { clamp, ease } from '../core/util.js';\nimport * as M from './missions.js';\n\nconst TABS = [\n  { id: 'today', label: 'Today' },\n  { id: 'real', label: 'All' },\n  { id: 'game', label: 'In Emberhollow' },\n  { id: 'done', label: 'Done' },\n];\n\nconst ROW_H = 26;\nconst LIST_X = 8, LIST_Y = 34, LIST_W = 178, LIST_H = 132;\n\nfunction missionScene(params) {\n  let tab = Math.max(0, TABS.findIndex(t => t.id === (params?.tab || 'today')));\n  let rows = [];\n  let sel = 0, scroll = 0, t = 0;\n  let busy = false;\n  const pop = { i: -1, t: 0 };     // celebration flash on the row just completed\n\n  function refresh() {\n    rows = M.list(TABS[tab].id);\n    sel = clamp(sel, 0, Math.max(0, rows.length - 1));\n    const visible = Math.floor(LIST_H / ROW_H);\n    if (sel < scroll) scroll = sel;\n    if (sel >= scroll + visible) scroll = sel - visible + 1;\n  }\n\n  async function activate() {\n    const row = rows[sel];\n    if (!row) return;\n    busy = true;\n    try {\n      if (row.m.kind === 'game') {\n        await UIx.say(`${row.m.title} — ${row.m.desc}`, { speaker: 'Emberhollow' });\n        return;\n      }\n      if (row.done && row.m.repeat !== 'daily') {\n        await UIx.say('Already done. That one counted.', { speaker: 'Hearth Board' });\n        return;\n      }\n      if (!row.tracked) {\n        M.track(row.id);\n        Audio.sfx('confirm');\n        UIx.toast('Tracking: ' + row.m.title, { ms: 1800 });\n        refresh();\n        return;\n      }\n      // Tracked already: this is the \"we did it\" moment.\n      const yes = await UIx.ask('Did you do it together?', ['Yes, we did', 'Not yet'],\n        { speaker: row.m.title });\n      if (yes !== 0) { Audio.sfx('cancel'); return; }\n      M.complete(row.id);\n      S.stats.missionsDone = (S.stats.missionsDone || 0) + 1;\n      Audio.sfx('chime');\n      pop.i = sel; pop.t = 40;\n      refresh();\n      await UIx.say(warmClose(row), { speaker: 'Gran Willow' });\n    } finally { busy = false; }\n  }\n\n  function update() {\n    t++;\n    if (pop.t > 0) pop.t--;\n    if (busy || UIx.busy) return;\n\n    if (Input.pressed('b')) { Audio.sfx('cancel'); Scenes.pop(); return; }\n    if (Input.pressed('left')) { tab = (tab + TABS.length - 1) % TABS.length; sel = 0; scroll = 0; Audio.sfx('cursor'); refresh(); }\n    if (Input.pressed('right')) { tab = (tab + 1) % TABS.length; sel = 0; scroll = 0; Audio.sfx('cursor'); refresh(); }\n    if (Input.pressed('down') && rows.length) { sel = (sel + 1) % rows.length; Audio.sfx('cursor'); refresh(); }\n    if (Input.pressed('up') && rows.length) { sel = (sel + rows.length - 1) % rows.length; Audio.sfx('cursor'); refresh(); }\n    if (Input.pressed('a')) activate();\n    if (Input.pressed('select') && rows[sel]?.tracked) {\n      M.untrack(rows[sel].id); Audio.sfx('cancel'); refresh();\n    }\n  }\n\n  function render() {\n    R.layer(LAYER.GROUND, () => {\n      // A corkboard, not a spreadsheet.\n      R.rect(0, 0, R.W, R.H, mix(P.wood3, P.ink, 0.35));\n      for (let y = 0; y < R.H; y += 2) R.rect(0, y, R.W, 1, y % 4 ? mix(P.wood2, P.ink, 0.5) : mix(P.wood3, P.ink, 0.42));\n      R.rect(0, 0, R.W, 24, mix(P.wood4, P.ink, 0.3));\n      R.rect(0, 23, R.W, 1, P.gold3);\n    });\n\n    R.layer(LAYER.UI, () => {\n      drawHeader();\n      drawList();\n      drawDetail();\n      drawFooter();\n    });\n  }\n\n  function drawHeader() {\n    R.text('FAMILY MISSIONS', 8, 6, { color: P.gold1 });\n\n    // Right-hand cluster is laid out from the right edge inwards so the streak\n    // label and the hearth counter can never collide.\n    const streak = S.missions?.streak || 0;\n    const streakText = streak > 0 ? `${streak} day streak` : 'start a streak';\n    R.text(streakText, R.W - 8, 6, { color: streak > 0 ? P.ember0 : P.ui2, align: 'right' });\n    const hx = R.W - 12 - Font.measure(streakText) - Font.measure(String(S.hearth)) - 12;\n    const hi = Atlas.tryGet('ui.hearth');\n    if (hi) R.blit(hi, hx, 5);\n    R.text(String(S.hearth), hx + 12, 6, { color: P.gold0 });\n\n    // Tabs are measured, not evenly spaced — 'In Emberhollow' is far wider than 'All'.\n    let tx = 8;\n    TABS.forEach((tb, i) => {\n      const w = Font.measure(tb.label);\n      const on = i === tab;\n      if (on) R.rect(tx - 3, 24, w + 6, 10, P.gold3);\n      R.text(tb.label, tx, 25, { color: on ? P.gold0 : P.ui2 });\n      tx += w + 12;\n    });\n  }\n\n  function drawList() {\n    UIx.panel(LIST_X - 2, LIST_Y - 2, LIST_W + 4, LIST_H + 4, 'paper');\n    if (!rows.length) {\n      R.text('Nothing here today.', LIST_X + 10, LIST_Y + 16, { color: P.ink3, shadow: false });\n      R.text('Come back tomorrow.', LIST_X + 10, LIST_Y + 28, { color: P.ui2, shadow: false });\n      return;\n    }\n    const visible = Math.floor(LIST_H / ROW_H);\n    for (let i = 0; i < visible; i++) {\n      const idx = scroll + i;\n      const row = rows[idx];\n      if (!row) break;\n      drawRow(row, idx, LIST_X + 2, LIST_Y + 2 + i * ROW_H);\n    }\n    if (scroll > 0) {\n      const a = Atlas.tryGet('ui.arrow.up');\n      if (a) R.blit(a, LIST_X + LIST_W - 12, LIST_Y - 1);\n    }\n    if (scroll + visible < rows.length) {\n      const a = Atlas.tryGet('ui.arrow.down');\n      if (a) R.blit(a, LIST_X + LIST_W - 12, LIST_Y + LIST_H - 6);\n    }\n  }\n\n  function drawRow(row, idx, x, y) {\n    const on = idx === sel;\n    const celebrating = pop.i === idx && pop.t > 0;\n    const bg = row.done ? mix(P.paper2, '#7ed957', 0.18)\n      : row.tracked ? mix(P.paper1, P.gold1, 0.35) : P.paper1;\n    R.rect(x, y, LIST_W - 4, ROW_H - 3, celebrating && pop.t % 8 < 4 ? P.gold0 : bg);\n    R.rect(x, y, 2, ROW_H - 3, row.cat?.color || P.gold2);        // category stripe\n    if (on) {\n      R.stroke(x - 1, y - 1, LIST_W - 2, ROW_H - 1, P.gold3);\n      const c = Atlas.tryGet('ui.cursor');\n      if (c) R.blit(c, x - 8, y + 6 + Math.sin(t / 9) * 0.6);\n    }\n\n    const title = row.m.title;\n    R.text(title.length > 26 ? title.slice(0, 25) + '…' : title, x + 7, y + 3,\n      { color: row.done ? P.ui2 : P.ink2, shadow: false });\n\n    if (row.done) {\n      const chk = Atlas.tryGet('ui.badge.check');\n      if (chk) R.blit(chk, x + LIST_W - 18, y + 3);\n    } else if (row.need > 1) {\n      const bw = 48;\n      R.rect(x + 7, y + 15, bw, 4, P.ui1);\n      R.rect(x + 7, y + 15, Math.round(bw * clamp(row.frac, 0, 1)), 4, P.gold2);\n      R.text(`${row.progress}/${row.need}`, x + 60, y + 13, { color: P.ink3, shadow: false });\n    } else {\n      R.text(row.tracked ? 'tracking' : (row.cat?.name || ''), x + 7, y + 13,\n        { color: row.tracked ? P.gold3 : P.ui2, shadow: false });\n    }\n\n    const rw = M.rewardText(row.m);\n    if (rw) R.text(rw, x + LIST_W - 8, y + 13, { color: P.ink3, shadow: false, align: 'right' });\n  }\n\n  function drawDetail() {\n    const x = LIST_X + LIST_W + 6, w = R.W - x - 8;\n    UIx.panel(x, LIST_Y - 2, w, LIST_H + 4, 'paper');\n    const row = rows[sel];\n    if (!row) return;\n\n    const lines = Font.wrap(row.m.desc, w - 16);\n    R.text(row.cat?.name || 'Mission', x + 8, LIST_Y + 4, { color: row.cat?.color || P.gold3, shadow: false });\n    let y = LIST_Y + 18;\n    for (const l of Font.wrap(row.m.title, w - 16)) { R.text(l, x + 8, y, { color: P.ink, shadow: false }); y += 11; }\n    y += 3;\n    for (const l of lines.slice(0, 5)) { R.text(l, x + 8, y, { color: P.ink3, shadow: false }); y += 10; }\n\n    y = LIST_Y + LIST_H - 34;\n    R.rect(x + 6, y - 4, w - 12, 1, P.ui1);\n    R.text('Reward', x + 8, y, { color: P.ui2, shadow: false });\n    R.text(M.rewardText(row.m) || '—', x + w - 8, y, { color: P.gold3, shadow: false, align: 'right' });\n    // The visible change is the point of the whole loop — show it, don't bury it.\n    if (row.m.reward?.visible) {\n      let vy = y + 11;\n      for (const l of Font.wrap(row.m.reward.visible, w - 16).slice(0, 2)) {\n        R.text(l, x + 8, vy, { color: P.leaf3, shadow: false }); vy += 10;\n      }\n    } else if (row.times > 0) {\n      R.text(`Done ${row.times}x before`, x + 8, y + 11, { color: P.ui2, shadow: false });\n    }\n  }\n\n  function drawFooter() {\n    R.rect(0, R.H - 12, R.W, 12, mix(P.wood4, P.ink, 0.3));\n    const row = rows[sel];\n    const action = row ? M.actionLabel(row.id) : '';\n    R.text(`◀ ▶ tabs    A ${action || 'select'}    B back`, 6, R.H - 10, { color: P.ui1 });\n  }\n\n  return {\n    enter() { M.ensureState(); M.refreshDaily(); refresh(); },\n    update, render,\n  };\n}\n\n// Gran's closing line, varied so completing missions never feels like a form submit.\nfunction warmClose(row) {\n  const lines = [\n    'That is the kind of thing this village is made of.',\n    'The Hearthstone felt that one. So did I.',\n    'Good. Now sit down, both of you, and have something warm.',\n    'Small things, done together. That is the whole trick.',\n    'I will add it to the ledger. The good ledger.',\n  ];\n  const i = (row.id.length + (S.missions?.done?.length || 0)) % lines.length;\n  return lines[i];\n}\n\nexport function register() {\n  Scenes.register('missions', p => missionScene(p));\n}\n","deps":{"../core/renderer.js":"core/renderer.js","../core/input.js":"core/input.js","../core/scene.js":"core/scene.js","../art/atlas.js":"art/atlas.js","../core/audio.js":"core/audio.js","../core/bridge.js":"core/bridge.js","../core/font.js":"core/font.js","../state.js":"state.js","../art/palette.js":"art/palette.js","../core/util.js":"core/util.js","./missions.js":"missions/missions.js"}},{"id":"dev/minimal-ui.js","code":"// Foundation-provided minimal UI so dialogue, choices, toasts, and fades work from the\n// very first commit. ui/textbox.js etc. overwrite these via UIx.install(); this only\n// runs when the real UI hasn't landed yet.\n\nimport { R } from '../core/renderer.js';\nimport { Scenes } from '../core/scene.js';\nimport { Input } from '../core/input.js';\nimport { Font } from '../core/font.js';\nimport { UIx } from '../core/bridge.js';\nimport { Audio } from '../core/audio.js';\nimport { P } from '../art/palette.js';\n\nconst BOX = { x: 6, y: 122, w: 308, h: 52 };\nlet busy = false;\nconst toasts = [];\n\nfunction panel(x, y, w, h) {\n  R.rect(x, y, w, h, P.ui4);\n  R.rect(x + 1, y + 1, w - 2, h - 2, P.ui2);\n  R.rect(x + 2, y + 2, w - 4, h - 4, P.paper1);\n  R.rect(x + 3, y + 3, w - 6, h - 6, P.paper0);\n  R.rect(x + 3, y + 3, w - 6, 1, '#fffdf4');\n}\n\nfunction textboxScene({ text, speaker, choices }) {\n  const lines = Font.wrap(text, BOX.w - 20);\n  let shown = 0, page = 0, done = false, pick = 0, t = 0;\n  const PER_PAGE = 3;\n  const pageLines = () => lines.slice(page * PER_PAGE, page * PER_PAGE + PER_PAGE);\n  const pageChars = () => pageLines().join('').length;\n\n  return {\n    pausesBelow: false, drawsBelow: true,\n    update() {\n      t++;\n      if (shown < pageChars()) { shown += 2; if (t % 2 === 0) Audio.sfx('text'); return; }\n      const morePages = (page + 1) * PER_PAGE < lines.length;\n      if (choices && !morePages) {\n        if (Input.pressed('down')) { pick = (pick + 1) % choices.length; Audio.sfx('cursor'); }\n        if (Input.pressed('up')) { pick = (pick + choices.length - 1) % choices.length; Audio.sfx('cursor'); }\n        if (Input.pressed('a')) { Audio.sfx('confirm'); Scenes.pop(pick); }\n        if (Input.pressed('b')) { Audio.sfx('cancel'); Scenes.pop(-1); }\n        return;\n      }\n      if (Input.pressed('a') || Input.pressed('b')) {\n        if (morePages) { page++; shown = 0; Audio.sfx('cursor'); }\n        else { Audio.sfx('confirm'); Scenes.pop(); }\n      }\n    },\n    render() {\n      R.layer(5, () => {\n        const h = choices ? BOX.h + choices.length * 11 : BOX.h;\n        const y = choices ? BOX.y - choices.length * 11 : BOX.y;\n        panel(BOX.x, y, BOX.w, h);\n        if (speaker) {\n          const w = Font.measure(speaker) + 12;\n          panel(BOX.x + 6, y - 11, w, 15);\n          R.text(speaker, BOX.x + 12, y - 7, { color: P.gold3, shadow: false });\n        }\n        let n = shown;\n        pageLines().forEach((l, i) => {\n          const limit = Math.max(0, Math.min(l.length, n));\n          n -= l.length;\n          R.text(l, BOX.x + 10, y + 10 + i * 12, { color: P.ink2, shadow: false, limit });\n        });\n        if (choices && shown >= pageChars()) {\n          choices.forEach((c, i) => {\n            const cy = y + 10 + PER_PAGE * 12 + i * 11;\n            R.text(c, BOX.x + 22, cy, { color: i === pick ? P.gold3 : P.ink2, shadow: false });\n            if (i === pick) R.text('▶', BOX.x + 12, cy, { color: P.gold2, shadow: false });\n          });\n        } else if (shown >= pageChars()) {\n          if (Math.floor(t / 18) % 2 === 0) {\n            R.text('▼', BOX.x + BOX.w - 16, y + h - 16, { color: P.gold2, shadow: false });\n          }\n        }\n      });\n    },\n  };\n}\n\nfunction fadeScene(dir, frames, onDone) {\n  let f = 0;\n  return {\n    pausesBelow: false, drawsBelow: true,\n    update() { if (++f >= frames) { Scenes.pop(); onDone?.(); } },\n    render() {\n      R.layer(5, ctx => {\n        const a = dir === 'out' ? f / frames : 1 - f / frames;\n        ctx.globalAlpha = Math.max(0, Math.min(1, a));\n        R.rect(0, 0, R.W, R.H, '#0b0e14');\n        ctx.globalAlpha = 1;\n      });\n    },\n  };\n}\n\nexport function installMinimalUI() {\n  if (UIx.real) return false;\n  globalThis.__R = R;\n  Scenes.register('__textbox', p => textboxScene(p || {}));\n\n  // real:false keeps this replaceable by ui/textbox.js when that lands.\n  UIx.install({\n    get busy() { return busy; },\n    async say(text, opts = {}) {\n      busy = true;\n      await Scenes.pushAsync('__textbox', { text, speaker: opts.speaker });\n      busy = false;\n    },\n    async ask(text, choices, opts = {}) {\n      busy = true;\n      const r = await Scenes.pushAsync('__textbox', { text, speaker: opts.speaker, choices });\n      busy = false;\n      return r ?? -1;\n    },\n    async confirm(text) { return (await UIx.ask(text, ['Yes', 'No'])) === 0; },\n    toast(text, opts = {}) { toasts.push({ text, life: opts.ms ? opts.ms / 16 : 110, icon: opts.icon }); },\n    async fade(dir, frames = 16) {\n      await new Promise(res => {\n        Scenes.register('__fade', () => fadeScene(dir, frames, res));\n        Scenes.push('__fade');\n      });\n    },\n    async iris(dir) { return UIx.fade(dir, 14); },\n    async battleFx() { await UIx.fade('out', 12); await UIx.fade('in', 12); },\n    async doorway(dir) { return UIx.fade(dir, 12); },\n    panel,\n    drawToasts,\n  }, { real: false });\n  return true;\n}\n\n// Drawn by the overworld HUD fallback.\nfunction drawToasts() {\n  for (let i = toasts.length - 1; i >= 0; i--) {\n    const t = toasts[i];\n    if (--t.life <= 0) { toasts.splice(i, 1); continue; }\n  }\n  toasts.slice(0, 3).forEach((t, i) => {\n    const w = Font.measure(t.text) + 16;\n    const y = 8 + i * 16;\n    const slide = Math.min(1, (110 - t.life) / 8) * Math.min(1, t.life / 8);\n    R.layer(5, () => {\n      const x = R.W - 6 - w * Math.max(0.001, slide);\n      panel(x, y, w * Math.max(0.001, slide), 14);\n      if (slide > 0.9) R.text(t.text, x + 8, y + 3, { color: P.ink2, shadow: false });\n    });\n  });\n}\n","deps":{"../core/renderer.js":"core/renderer.js","../core/scene.js":"core/scene.js","../core/input.js":"core/input.js","../core/font.js":"core/font.js","../core/bridge.js":"core/bridge.js","../core/audio.js":"core/audio.js","../art/palette.js":"art/palette.js"}},{"id":"dev/fallback.js","code":"// Foundation fallbacks: placeholders for any scene a feature module hasn't registered\n// yet, plus a smoke scene that shows the engine, font, palette, and atlas at a glance.\n// These exist so the build is always launchable — critics can screenshot any entry point.\n\nimport { R } from '../core/renderer.js';\nimport { Scenes } from '../core/scene.js';\nimport { Input } from '../core/input.js';\nimport { Atlas } from '../art/atlas.js';\nimport { P, RAMP } from '../art/palette.js';\nimport { Loop } from '../core/loop.js';\nimport { S } from '../state.js';\n\nconst EXPECTED = ['title', 'overworld', 'battle', 'village', 'build', 'missions', 'party', 'pause', 'dex'];\n\nexport function registerFallbacks(loaded) {\n  Scenes.register('smoke', () => smokeScene(loaded));\n  for (const name of EXPECTED) {\n    if (!Scenes.has(name)) Scenes.register(name, () => stubScene(name, loaded));\n  }\n}\n\nfunction stubScene(name, loaded) {\n  let t = 0;\n  return {\n    enter() { t = 0; },\n    update() {\n      t++;\n      if (Input.pressed('b') && Scenes.stack.length > 1) Scenes.pop();\n      if (Input.pressed('a')) Scenes.push('smoke');\n      if (Input.pressed('start')) Scenes.reset('title');\n    },\n    render() {\n      R.layer(0, ctx => {\n        // Soft dev backdrop — deliberately unlike the real game so it can't be mistaken for it.\n        for (let y = 0; y < R.H; y += 8) {\n          R.rect(0, y, R.W, 8, y % 16 === 0 ? '#161b26' : '#131822');\n        }\n      });\n      R.layer(5, ctx => {\n        panel(6, 6, R.W - 12, R.H - 12);\n        R.text('NOT BUILT YET', R.W / 2, 20, { align: 'center', color: P.gold1 });\n        R.text(`scene: ${name}`, R.W / 2, 34, { align: 'center', color: P.paper1 });\n\n        const miss = loaded.missing.length ? loaded.missing.join(', ') : 'none';\n        const lines = [\n          `loaded  ${l /state.js":"state.js"}},{"id":"main.js","code":"// Boot sequence and top-level wiring.\n//\n// Deliberately fault-tolerant: every feature module is soft-imported. A module that is\n// missing or throws degrades to a placeholder instead of taking the game down, so\n// pieces can land independently and the build is always launchable and screenshottable.\n\nimport { R } from './core/renderer.js';\nimport { Input, initInput } from './core/input.js';\nimport { Scenes } from './core/scene.js';\nimport { startLoop, Loop } from './core/loop.js';\nimport { buildFont, Font } from './core/font.js';\nimport { Audio, defineCoreSfx } from './core/audio.js';\nimport { Atlas } from './art/atlas.js';\nimport { P } from './art/palette.js';\nimport { S, load, save, hasSave, resetSave, defaults, adopt } from './state.js';\nimport { Bus, EV } from './core/events.js';\nimport { makeRng } from './core/rng.js';\n\nexport const Q = new URLSearchParams(location.search);\nexport const DEV = Q.has('dev');\n\nconst loaded = { modules: [], missing: [], failed: [] };\n\nasync function soft(path, label) {\n  try {\n    const m = await import(path);\n    loaded.modules.push(label);\n    return m;\n  } catch (err) {\n    if (err && /Failed to fetch|Cannot find|404|Importing a module script failed/i.test(String(err.message))) {\n      loaded.missing.push(label);\n    } else {\n      loaded.failed.push({ label, err: String(err.message || err) });\n      console.error(`[boot] ${label} failed`, err);\n    }\n    return null;\n  }\n}\n\nexport async function boot({ veil, startBtn, setBoot }) {\n  // Exposed first so the harness can still drive and inspect a build that fails to boot.\n  window.__frames = frameWait;\n  setBoot('lighting the font…', 6);\n  const canvas = document.getElementById('screen');\n  R.init(canvas);\n  buildFont();\n  initInput();\n  defineCoreSfx();\n\n  // ---- art registration (modules self-register painters into the Atlas) ----\n  setBoot('drawing the world…', 16);\n  const art
