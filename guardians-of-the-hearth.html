song(108, 4, {\n    lead: t(SOFT, `\n      c5 e5 g5 e5 c5 e5 g5 e5  a4 c5 e5 c5 a4 c5 e5 c5\n      f4 a4 c5 a4 f4 a4 c5 a4  g4 b4 d5 b4 g4 b4 d5 b4`, { gain: 0.10, legato: 0.7 }),\n    harm: t(LEAD, `. . . . g5 - - .  . . . . e5 - - .  . . . . c5 - - .  . . . . d5 - - .`, { gain: 0.09 }),\n    bass: t(BASS, `c3 - - - - - - .  a2 - - - - - - .  f2 - - - - - - .  g2 - - - - - - .`),\n  }));\n\n  // ---- home: the kettle is on ------------------------------------------------------\n  Audio.defineSong('home', song(78, 2, {\n    lead: t(SOFT, `\n      e4 - g4 - c5 - - .  b4 - g4 - e4 - - .\n      f4 - a4 - c5 - - .  g4 - e4 - c4 - - .`, { gain: 0.14 }),\n    pad: t(PAD, `c4 - - - - - - - g3 - - - - - - -  f3 - - - - - - - c4 - - - - - - -`),\n    bass: t(BASS, `c3 - - - - - - .  g2 - - - - - - .  f2 - - - - - - .  c3 - - - - - - .`, { gain: 0.15 }),\n  }));\n\n  // ---- shop / workshop: busy hands --------------------------------------------------\n  Audio.defineSong('shop', song(132, 2, {\n    lead: t(LEAD, `\n      g4 a4 b4 . g4 . d5 .  c5 b4 a4 . g4 - - .\n      f4 g4 a4 . f4 . c5 .  b4 a4 g4 . f4 - - .`, { gain: 0.12 }),\n    bass: t(BASS, `g2 . d3 . g2 . b2 .  c3 . g2 . c3 . e3 .`),\n    perc: t(PERC, `x . x x . x . x`),\n  }));\n\n  // ---- battle: urgent, but never mean -----------------------------------------------\n  Audio.defineSong('battle', song(152, 2, {\n    lead: t(LEAD, `\n      a4 . a4 . c5 . e5 .  d5 . c5 . b4 - - .\n      g4 . g4 . b4 . d5 .  c5 . b4 . a4 - - .\n      a4 . c5 . e5 . a5 .  g5 . e5 . d5 - - .\n      f5 . e5 . d5 . c5 .  b4 . c5 . a4 - - .`, { gain: 0.14, filter: 3200 }),\n    harm: t(SOFT, `e4 - c4 - e4 - a4 -  d4 - b3 - d4 - g4 -`, { gain: 0.075 }),\n    bass: t(BASS, `\n      a2 a2 . a2 a2 . a2 .  g2 g2 . g2 g2 . g2 .\n      f2 f2 . f2 f2 . f2 .  e2 e2 . e2 e2 . e2 .`, { gain: 0.22, legato: 0.6 }),\n    perc: t(PERC, `X . x . X x x .  X . x . X x x x`, { gain: 0.1 }),\n  }));\n\n  // ---- victory: short, warm, over quickly ---------------------------------------------\n  Audio.defineSong('victory', song(140, 2, {\n    lead: t(LEAD, `c5 e5 g5 c6 - - - .  a5 g5 e5 g5 - - - .`, { gain: 0.16 }),\n    bass: t(BASS, `c3 - g2 - c3 - - .  f2 - c3 - g2 - - .`),\n  }));\n\n  defineExtraSfx();\n}\n\n// A few effects the world and battle reach for that the core kit doesn't cover.\nfunction defineExtraSfx() {\n  Audio.defineSfx('grass', { voices: [{ noise: true, dur: 0.09, hp: 2200, gain: 0.06, curve: 1.8 }] });\n  Audio.defineSfx('ledge', { voices: [\n    { wave: 'triangle', f: 300, f2: 520, dur: 0.10, gain: 0.10 },\n    { at: 0.14, noise: true, dur: 0.07, lp: 900, gain: 0.08 },\n  ] });\n  Audio.defineSfx('bond', { voices: [\n    { wave: 'triangle', f: 523, dur: 0.12, gain: 0.11 },\n    { at: 0.11, wave: 'triangle', f: 659, dur: 0.12, gain: 0.11 },\n    { at: 0.22, wave: 'triangle', f: 880, dur: 0.26, gain: 0.13 },\n  ] });\n  Audio.defineSfx('evolve', { voices: [\n    { wave: 'sawtooth', f: 220, f2: 880, dur: 0.7, gain: 0.08, exp: true },\n    { at: 0.6, wave: 'square', f: 1046, dur: 0.3, gain: 0.10 },\n  ] });\n  Audio.defineSfx('faint', { voices: [{ wave: 'square', f: 400, f2: 90, dur: 0.5, gain: 0.11, exp: true }] });\n  Audio.defineSfx('levelup', { voices: [\n    { wave: 'square', f: 659, dur: 0.08, gain: 0.10 },\n    { at: 0.08, wave: 'square', f: 880, dur: 0.08, gain: 0.10 },\n    { at: 0.16, wave: 'square', f: 1318, dur: 0.24, gain: 0.12 },\n  ] });\n}\n","deps":{"../core/audio.js":"core/audio.js"}},{"id":"ui/frame.js","code":"// Nine-slice window frames and the shared chrome vocabulary for every UI screen.\n//\n// Two rules drive this file:\n//  1. Chrome must look intentional even with zero atlas art. Every `ui.*` sprite is\n//     optional (Atlas.tryGet) and has a hand-drawn procedural fallback, so text feel\n//     and menu feel are judgeable before ART lands.\n//  2. Readability is not a judgement call. A style owns its ink + shadow colours and\n//     `Frame.write` uses them, so light-on-light text can't creep in. When atlas art\n//     IS present we sample the frame's centre pixel and flip ink to match, which means\n//     a dark `ui.frame` from ART still gets light text.\n\nimport { R } from '../core/renderer.js';\nimport { Atlas } from '../art/atlas.js';\nimport { P, TYPE_COLOR, mix, Px } from '../art/palette.js';\nimport { Scenes } from '../core/scene.js';\nimport { Input } from '../core/input.js';\nimport { clamp } from '../core/util.js';\n\nconst CORNER = 8;                       // nine-slice corner size (ui.frame is 24x24)\n\n// ---- style table -----------------------------------------------------------------\n// ink/sub/shadow are the text tokens; everything else is procedural chrome.\nconst STYLES = {\n  paper: {\n    atlas: 'ui.frame',\n    border: P.ink, mid: P.ui2, fill: P.paper0, hi: '#fffdf4', lo: P.paper2,\n    ink: P.ink2, sub: P.ink3, shadow: false, accent: P.gold3, sel: P.gold0, selEdge: P.gold2,\n  },\n  dark: {\n    atlas: 'ui.frame.dark',\n    border: '#0f0a07', mid: P.ink3, fill: P.ui4, hi: '#4a3826', lo: '#150e09',\n    ink: P.ui0, sub: P.ui1, shadow: P.black, accent: P.gold1, sel: P.ink3, selEdge: P.gold2,\n  },\n  gold: {\n    atlas: 'ui.frame.gold',\n    border: P.ink, mid: P.gold3, fill: P.gold1, hi: P.gold0, lo: P.gold2,\n    ink: P.ink, sub: P.ink2, shadow: false, accent: P.ink, sel: P.gold0, selEdge: P.ink2,\n  },\n  // Translucent plaque for the overworld HUD — never covers the world, always readable.\n  hud: {\n    atlas: null,\n    border: '#0d0a12', mid: '#241c2c', fill: '#191320', hi: '#3a2f46', lo: '#100b16',\n    ink: P.ui0, sub: P.ui1, shadow: P.black, accent: P.gold1, sel: P.ink3, selEdge: P.gold2,\n    alpha: 0.74,\n  },\n};\n\nconst inkCache = new Map();\n\n// Centre-pixel luminance of an atlas frame decides its text colours. This is the\n// guard against light-on-light: whatever ART ships, the ink follows the fill.\nfunction sampledInk(name) {\n  if (inkCache.has(name)) return inkCache.get(name);\n  let out = null;\n  try {\n    const img = Atlas.tryGet(name);\n    if (img && img.width >= 3 && img.height >= 3) {\n      const d = img.getContext('2d')\n        .getImageData(img.width >> 1, img.height >> 1, 1, 1).data;\n      if (d[3] > 40) {\n        const lum = (0.299 * d[0] + 0.587 * d[1] + 0.114 * d[2]) / 255;\n        out = lum > 0.55\n          ? { ink: P.ink2, sub: P.ink3, shadow: false }\n          : { ink: P.ui0, sub: P.ui1, shadow: P.ink };\n      }\n    }\n  } catch { /* tainted or missing: keep the declared tokens */ }\n  inkCache.set(name, out);\n  return out;\n}\n\n// 1px-cut corners: three rects instead of one give a soft \"rounded\" pixel edge.\nfunction rrect(x, y, w, h, color) {\n  if (w <= 0 || h <= 0) return;\n  R.rect(x, y + 1, w, h - 2, color);\n  R.rect(x + 1, y, w - 2, 1, color);\n  R.rect(x + 1, y + h - 1, w - 2, 1, color);\n}\n\nfunction procPanel(x, y, w, h, s) {\n  rrect(x, y, w, h, s.border);\n  rrect(x + 1, y + 1, w - 2, h - 2, s.mid);\n  rrect(x + 2, y + 2, w - 4, h - 4, s.fill);\n  // inner bevel: light top, shaded bottom-right — reads as a raised card\n  R.rect(x + 3, y + 2, w - 6, 1, s.hi);\n  R.rect(x + 2, y + 3, 1, h - 6, s.hi);\n  R.rect(x + 3, y + h - 3, w - 6, 1, s.lo);\n  R.rect(x + w - 3, y + 3, 1, h - 6, s.lo);\n}\n\nfunction nineSlice(img, x, y, w, h, c = CORNER) {\n  const ctx = R.ctx, sw = img.width, sh = img.height;\n  const mw = sw - c * 2, mh = sh - c * 2;\n  if (mw <= 0 || mh <= 0 || w < c * 2 || h < c * 2) return false;\n  const iw = w - c * 2, ih = h - c * 2;\n  ctx.drawImage(img, 0, 0, c, c, x, y, c, c);\n  ctx.drawImage(img, sw - c, 0, c, c, x + w - c, y, c, c);\n  ctx.drawImage(img, 0, sh - c, c, c, x, y + h - c, c, c);\n  ctx.drawImage(img, sw - c, sh - c, c, c, x + w - c, y + h - c, c, c);\n  for (let dx = 0; dx < iw; dx += mw) {\n    const tw = Math.min(mw, iw - dx);\n    ctx.drawImage(img, c, 0, tw, c, x + c + dx, y, tw, c);\n    ctx.drawImage(img, c, sh - c, tw, c, x + c + dx, y + h - c, tw, c);\n  }\n  for (let dy = 0; dy < ih; dy += mh) {\n    const th = Math.min(mh, ih - dy);\n    ctx.drawImage(img, 0, c, c, th, x, y + c + dy, c, th);\n    ctx.drawImage(img, sw - c, c, c, th, x + w - c, y + c + dy, c, th);\n    for (let dx = 0; dx < iw; dx += mw) {\n      const tw = Math.min(mw, iw - dx);\n      ctx.drawImage(img, c, c, tw, th, x + c + dx, y + c + dy, tw, th);\n    }\n  }\n  return true;\n}\n\nlet backdropCache = null;\n\nexport const Frame = {\n  CORNER,\n\n  /** Resolved style tokens: {ink, sub, shadow, accent, sel, ...}. */\n  style(name = 'paper') {\n    const s = STYLES[name] || STYLES.paper;\n    const sampled = s.atlas ? sampledInk(s.atlas) : null;\n    return sampled ? { ...s, ...sampled } : s;\n  },\n\n  /**\n   * Nine-slice window. `style` is 'paper'|'dark'|'gold'|'hud' or\n   * {style, alpha, shadow:false}. Returns the resolved style tokens.\n   */\n  panel(x, y, w, h, style) {\n    const o = (style && typeof style === 'object') ? style : { style };\n    const s = this.style(o.style);\n    const ctx = R.ctx, prev = ctx.globalAlpha;\n    const alpha = (o.alpha === undefined ? (s.alpha === undefined ? 1 : s.alpha) : o.alpha);\n    x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);\n    if (o.shadow !== false) {\n      ctx.globalAlpha = prev * 0.2;\n      rrect(x + 2, y + 3, w, h, '#05040a');\n      ctx.globalAlpha = prev;\n    }\n    ctx.globalAlpha = prev * alpha;\n    const img = s.atlas ? Atlas.tryGet(s.atlas) : null;\n    if (!(img && nineSlice(img, x, y, w, h))) procPanel(x, y, w, h, s);\n    ctx.globalAlpha = prev;\n    return s;\n  },\n\n  /** Speech bubble: a paper panel with a tail. tailX is absolute screen x. */\n  bubble(x, y, w, h, tailX) {\n    const s = this.panel(x, y, w, h, 'paper');\n    if (tailX === undefined) return s;\n    const tx = Math.round(clamp(tailX, x + 6, x + w - 12));\n    const img = Atlas.tryGet('ui.tail');\n    if (img) { R.blit(img, tx - (img.width >> 1), y + h - 1); return s; }\n    // procedural tail: 6 rows narrowing, in the panel's own colours\n    for (let i = 0; i < 6; i++) {\n      const half = 4 - Math.floor(i * 0.7);\n      if (half <= 0) break;\n      R.rect(tx - half, y + h - 2 + i, half * 2, 1, i > 3 ? s.mid : s.fill);\n      R.rect(tx - half - 1, y + h - 2 + i, 1, 1, s.border);\n      R.rect(tx + half, y + h - 2 + i, 1, 1, s.border);\n    }\n    return s;\n  },\n\n  /** Small nameplate tab (speaker names, screen titles). Returns its width. */\n  tab(x, y, label, style = 'gold', opts = {}) {\n    const w = opts.w || R.measure(label) + 14;\n    const h = opts.h || 14;\n    const s = this.panel(x, y, w, h, { style, shadow: opts.shadow });\n    R.text(label, x + 7, y + Math.round((h - 7) / 2), { color: opts.color || s.ink, shadow: s.shadow });\n    return w;\n  },\n\n  /** Title row inside a panel: label plus a hairline divider. */\n  title(x, y, w, label, style = 'paper', right) {\n    const s = this.style(style);\n    R.text(label, x, y, { color: s.accent, shadow: s.shadow });\n    if (right) R.text(right, x + w, y, { color: s.sub, shadow: s.shadow, align: 'right' });\n    R.rect(x, y + 10, w, 1, s.mid);\n    return s;\n  },\n\n  /** Text in a style's own ink. Use this instead of R.text on panels. */\n  write(str, x, y, style = 'paper', o = {}) {\n    const s = typeof style === 'object' ? style : this.style(style);\n    const opt = {\n      color: o.color || s.ink,\n      shadow: o.shadow !== undefined ? o.shadow : s.shadow,\n    };\n    if (o.align) opt.align = o.align;\n    if (o.limit !== undefined) opt.limit = o.limit;\n    if (o.alpha !== undefined) opt.alpha = o.alpha;\n    return R.text(str, x, y, opt);\n  },\n\n  /**\n   * Value bar with pixel end-caps. colorSet: 'hp'|'xp'|'bond' or a colour string.\n   * opts: {h, bg, ease (0..1 drawn fraction override)}\n   */\n  bar(x, y, w, value, max, colorSet = 'hp', opts = {}) {\n    const h = opts.h || 6;\n    const t = clamp(max > 0 ? value / max : 0, 0, 1);\n    let c = colorSet;\n    if (colorSet === 'hp') c = t > 0.5 ? P.hpGood : t > 0.21 ? P.hpWarn : P.hpBad;\n    else if (colorSet === 'xp') c = P.xp;\n    else if (colorSet === 'bond') c = P.bloom1;\n    x = Math.round(x); y = Math.round(y); w = Math.round(w);\n    rrect(x, y, w, h, P.ink);\n    R.rect(x + 1, y + 1, w - 2, h - 2, opts.bg || '#5a4a3a');\n    const fw = Math.round((w - 2) * t);\n    if (fw > 0) {\n      R.rect(x + 1, y + 1, fw, h - 2, c);\n      R.rect(x + 1, y + 1, fw, 1, mix(c, '#ffffff', 0.45));\n      R.rect(x + 1, y + h - 2, fw, 1, mix(c, '#000000', 0.28));\n    }\n    return t;\n  },\n\n  /** Menu cursor. Bobs 1px on a 16-frame cycle so it always looks alive. */\n  cursor(x, y, t = 0, color = P.gold2) {\n    const bob = (Math.floor(t / 16) % 2) ? 1 : 0;\n    const img = Atlas.tryGet('ui.cursor');\n    if (img) { R.blit(img, x + bob, y); return; }\n    R.text('▶', x + bob, y, { color, shadow: P.ink });\n  },\n\n  /** Scroll affordances for a list. */\n  arrows(cx, top, bottom, up, down, t = 0) {\n    const blink = (Math.floor(t / 20) % 2) === 0;\n    if (up) R.text('▲', cx, top + (blink ? 0 : 1), { color: P.gold2, shadow: P.ink, align: 'center' });\n    if (down) R.text('▼', cx, bottom - (blink ? 0 : 1), { color: P.gold2, shadow: P.ink, align: 'center' });\n  },\n\n  /** Full-screen dim, for menus that float over the world. */\n  dim(alpha = 0.45, color = '#0b0e14') {\n    const ctx = R.ctx, prev = ctx.globalAlpha;\n    ctx.globalAlpha = prev * alpha;\n    R.rect(0, 0, R.W, R.H, color);\n    ctx.globalAlpha = prev;\n  },\n\n  /** Warm storybook backdrop for full-screen UI screens. Cached canvas, one blit. */\n  backdrop() {\n    if (!backdropCache) {\n      const c = document.createElement('canvas');\n      c.width = R.W; c.height = R.H;\n      const x = c.getContext('2d');\n      for (let y = 0; y < R.H; y++) {\n        x.fillStyle = mix('#3b2c22', '#221a16', y / R.H);\n        x.fillRect(0, y, R.W, 1);\n      }\n      x.fillStyle = 'rgba(255,232,180,0.045)';\n      for (let y = 0; y < R.H; y += 4) for (let i = (y / 4) % 2 ? 0 : 2; i < R.W; i += 4) x.fillRect(i, y, 1, 1);\n      x.fillStyle = 'rgba(255,180,90,0.05)';\n      for (let i = 0; i < 26; i++) {\n        const r = 10 + (i * 7) % 26;\n        x.beginPath(); x.arc((i * 53) % R.W, (i * 37) % R.H, r, 0, Math.PI * 2); x.fill();\n      }\n      backdropCache = c;\n    }\n    R.blit(backdropCache, 0, 0);\n  },\n\n  /** Type badge. Uses ui.type.* when ART has it, else a legible pill. */\n  typePill(x, y, type, opts = {}) {\n    const img = Atlas.tryGet('ui.type.' + type);\n    if (img && !opts.noAtlas) { R.blit(img, x, y); return img.width; }\n    const label = (type || '?').toUpperCase();\n    const w = opts.w || R.measure(label) + 8;\n    const c = TYPE_COLOR[type] || P.rock3;\n    rrect(x, y, w, 11, P.ink);\n    rrect(x + 1, y + 1, w - 2, 9, c);\n    R.rect(x + 2, y + 1, w - 4, 1, mix(c, '#ffffff', 0.4));\n    const lum = lumOf(c);\n    R.text(label, x + 4, y + 2, { color: lum > 0.55 ? P.ink : P.ui0, shadow: false });\n    return w;\n  },\n\n  /** 8x8 icons. Atlas first, hand-drawn fallback second. */\n  icon(name, x, y, opts = {}) {\n    const img = Atlas.tryGet(name, opts.frame || 0);\n    if (img) { R.blit(img, x, y, opts.alpha !== undefined ? { alpha: opts.alpha } : undefined); return img.width; }\n    const f = ICONS[name];\n    if (!f) return 0;\n    const ctx = R.ctx, prev = ctx.globalAlpha;\n    if (opts.alpha !== undefined) ctx.globalAlpha = prev * opts.alpha;\n    f(Math.round(x), Math.round(y), opts);\n    ctx.globalAlpha = prev;\n    return 8;\n  },\n\n  /** Inset well (portraits, sprite cells, minimap interiors). */\n  well(x, y, w, h, style = 'paper') {\n    const s = this.style(style);\n    rrect(x, y, w, h, s.border);\n    rrect(x + 1, y + 1, w - 2, h - 2, style === 'paper' ? P.paper2 : s.lo);\n    R.rect(x + 2, y + 1, w - 4, 1, style === 'paper' ? P.paper3 : '#000');\n    return s;\n  },\n\n  rrect,\n  lum: lumOf,\n};\n\nfunction lumOf(c) {\n  const s = String(c).replace('#', '');\n  const n = s.length === 3 ? s.split('').map(x => x + x).join('') : s;\n  const r = parseInt(n.slice(0, 2), 16), g = parseInt(n.slice(2, 4), 16), b = parseInt(n.slice(4, 6), 16);\n  return (0.299 * r + 0.587 * g + 0.114 * b) / 255;\n}\n\n// ---- procedural icon fallbacks (8x8) ---------------------------------------------\nconst ICONS = {\n  'ui.coin'(x, y) {\n    R.rect(x + 2, y, 4, 1, P.gold3); R.rect(x + 2, y + 7, 4, 1, P.gold3);\n    R.rect(x, y + 2, 1, 4, P.gold3); R.rect(x + 7, y + 2, 1, 4, P.gold3);\n    R.rect(x + 1, y + 1, 1, 1, P.gold3); R.rect(x + 6, y + 1, 1, 1, P.gold3);\n    R.rect(x + 1, y + 6, 1, 1, P.gold3); R.rect(x + 6, y + 6, 1, 1, P.gold3);\n    R.rect(x + 2, y + 1, 4, 6, P.gold1); R.rect(x + 1, y + 2, 6, 4, P.gold1);\n    R.rect(x + 2, y + 2, 2, 1, P.gold0); R.rect(x + 2, y + 3, 1, 1, P.gold0);\n    R.rect(x + 3, y + 3, 2, 2, P.gold2);\n  },\n  'ui.hearth'(x, y) {\n    R.rect(x + 3, y, 2, 1, P.ember0);\n    R.rect(x + 2, y + 1, 4, 2, P.ember1);\n    R.rect(x + 1, y + 3, 6, 3, P.ember2);\n    R.rect(x + 3, y + 2, 2, 3, P.ember0);\n    R.rect(x + 2, y + 6, 4, 1, P.ember3);\n    R.rect(x + 1, y + 7, 6, 1, P.ink);\n  },\n  'ui.heart'(x, y, o) {\n    const c = o?.color || P.bloom1;\n    R.rect(x + 1, y + 2, 2, 1, c); R.rect(x + 5, y + 2, 2, 1, c);\n    R.rect(x + 1, y + 3, 6, 2, c); R.rect(x + 2, y + 5, 4, 1, c); R.rect(x + 3, y + 6, 2, 1, c);\n    R.rect(x + 2, y + 3, 1, 1, mix(c, '#fff', 0.5));\n  },\n  'ui.star'(x, y, o) { R.text('★', x, y - 1, { color: o?.color || P.spark1, shadow: P.ink }); },\n  'ui.ball'(x, y, o) {\n    const c = o?.color || P.ember2;\n    R.rect(x + 2, y, 4, 1, P.ink); R.rect(x + 2, y + 7, 4, 1, P.ink);\n    R.rect(x, y + 2, 1, 4, P.ink); R.rect(x + 7, y + 2, 1, 4, P.ink);\n    R.rect(x + 1, y + 1, 1, 1, P.ink); R.rect(x + 6, y + 1, 1, 1, P.ink);\n    R.rect(x + 1, y + 6, 1, 1, P.ink); R.rect(x + 6, y + 6, 1, 1, P.ink);\n    R.rect(x + 2, y + 1, 4, 3, c); R.rect(x + 1, y + 2, 6, 2, c);\n    R.rect(x + 1, y + 4, 6, 2, P.paper0); R.rect(x + 2, y + 4, 4, 3, P.paper0);\n    R.rect(x + 1, y + 3, 6, 1, P.ink);\n    R.rect(x + 3, y + 3, 2, 2, P.gold0); R.stroke(x + 3, y + 3, 2, 2, P.ink);\n  },\n  'ui.ball.empty'(x, y) {\n    R.rect(x + 2, y, 4, 1, P.ink3); R.rect(x + 2, y + 7, 4, 1, P.ink3);\n    R.rect(x, y + 2, 1, 4, P.ink3); R.rect(x + 7, y + 2, 1, 4, P.ink3);\n    R.rect(x + 1, y + 1, 1, 1, P.ink3); R.rect(x + 6, y + 1, 1, 1, P.ink3);\n    R.rect(x + 1, y + 6, 1, 1, P.ink3); R.rect(x + 6, y + 6, 1, 1, P.ink3);\n  },\n  'ui.badge.check'(x, y) {\n    R.rect(x + 1, y + 4, 2, 2, P.hpGood); R.rect(x + 2, y + 5, 2, 2, P.hpGood);\n    R.rect(x + 3, y + 4, 2, 2, P.hpGood); R.rect(x + 4, y + 2, 2, 2, P.hpGood);\n    R.rect(x + 5, y + 1, 2, 2, P.hpGood);\n  },\n  'ui.badge.lock'(x, y) {\n    R.rect(x + 2, y + 1, 4, 2, P.rock1); R.rect(x + 3, y + 2, 2, 1, P.ink);\n    R.rect(x + 1, y + 3, 6, 5, P.gold2); R.stroke(x + 1, y + 3, 6, 5, P.ink);\n    R.rect(x + 3, y + 5, 2, 2, P.ink);\n  },\n  'ui.badge.new'(x, y) {\n    R.rect(x, y + 1, 8, 6, P.roof1); R.stroke(x, y + 1, 8, 6, P.ink);\n    R.rect(x + 1, y + 2, 1, 4, P.paper0); R.rect(x + 2, y + 3, 1, 1, P.paper0);\n    R.rect(x + 3, y + 2, 1, 4, P.paper0);\n    R.rect(x + 5, y + 2, 3, 1, P.paper0); R.rect(x + 5, y + 4, 2, 1, P.paper0); R.rect(x + 5, y + 6, 3, 1, P.paper0);\n  },\n  'ui.arrow.up'(x, y) { R.text('▲', x, y - 1, { color: P.gold2, shadow: P.ink }); },\n  'ui.arrow.down'(x, y) { R.text('▼', x, y - 1, { color: P.gold2, shadow: P.ink }); },\n};\n\n// ---- season / sky icons used by the HUD and the title ----------------------------\nexport function seasonIcon(x, y, season) {\n  x = Math.round(x); y = Math.round(y);\n  if (season === 'summer') {\n    R.rect(x + 2, y + 2, 4, 4, P.spark1); R.rect(x + 3, y + 1, 2, 6, P.spark1); R.rect(x + 1, y + 3, 6, 2, P.spark1);\n    R.rect(x + 3, y + 3, 2, 2, P.gold0);\n    R.rect(x, y, 1, 1, P.spark2); R.rect(x + 7, y, 1, 1, P.spark2); R.rect(x, y + 7, 1, 1, P.spark2); R.rect(x + 7, y + 7, 1, 1, P.spark2);\n  } else if (season === 'autumn') {\n    R.rect(x + 3, y + 1, 3, 1, P.ember1); R.rect(x + 2, y + 2, 5, 2, P.ember2);\n    R.rect(x + 1, y + 4, 5, 2, P.ember1); R.rect(x + 1, y + 6, 3, 1, P.ember3);\n    R.rect(x + 4, y + 3, 1, 3, P.soil2);\n  } else if (season === 'winter') {\n    R.rect(x + 3, y, 2, 8, P.water0); R.rect(x, y + 3, 8, 2, P.water0);\n    R.rect(x + 1, y + 1, 1, 1, P.water1); R.rect(x + 6, y + 1, 1, 1, P.water1);\n    R.rect(x + 1, y + 6, 1, 1, P.water1); R.rect(x + 6, y + 6, 1, 1, P.water1);\n  } else {\n    R.rect(x + 3, y + 1, 2, 2, P.bloom0); R.rect(x + 1, y + 3, 2, 2, P.bloom1);\n    R.rect(x + 5, y + 3, 2, 2, P.bloom1); R.rect(x + 3, y + 5, 2, 2, P.bloom0);\n    R.rect(x + 3, y + 3, 2, 2, P.spark1);\n  }\n}\n\nexport function skyIcon(x, y, hour) {\n  x = Math.round(x); y = Math.round(y);\n  const day = hour >= 6 && hour < 19;\n  if (day) {\n    R.rect(x + 2, y + 2, 4, 4, P.gold0); R.rect(x + 3, y + 1, 2, 6, P.gold0); R.rect(x + 1, y + 3, 6, 2, P.gold0);\n    R.rect(x + 3, y + 3, 2, 2, '#fffbe8');\n  } else {\n    R.rect(x + 2, y + 1, 4, 6, P.paper1); R.rect(x + 1, y + 2, 6, 4, P.paper1);\n    R.rect(x + 4, y, 4, 8, '#00000000');\n    R.rect(x + 4, y + 1, 4, 6, P.shade); R.rect(x + 5, y, 3, 8, P.shade);\n    R.rect(x + 2, y + 2, 1, 1, '#ffffff');\n  }\n}\n\n// ---- the chrome showcase scene (dev/capture only) --------------------------------\n// Registered as `__panels`: proves the readability rule on every style we support.\nfunction panelsScene() {\n  let t = 0;\n  return {\n    update() { t++; if (Input.pressed('b') && Scenes.stack.length > 1) Scenes.pop(); },\n    render() {\n      R.layer(5, () => {\n        Frame.backdrop();\n        const body = 'Text on this panel style, at size.';\n        let x = 6;\n        for (const st of ['paper', 'dark', 'gold']) {\n          const s = Frame.panel(x, 6, 100, 84, st);\n          Frame.title(x + 6, 12, 88, st.toUpperCase(), st, 'Aa');\n          Frame.write(body, x + 6, 26, s);\n          Frame.write('Lv 12  24/31 HP', x + 6, 38, s);\n          Frame.bar(x + 6, 50, 60, 24, 31, 'hp');\n          Frame.bar(x + 6, 58, 60, 8, 20, 'xp');\n          Frame.typePill(x + 6, 68, 'ember');\n          Frame.icon('ui.coin', x + 46, 69); Frame.icon('ui.hearth', x + 58, 69);\n          Frame.icon('ui.ball', x + 70, 69); Frame.icon('ui.badge.check', x + 82, 69);\n          x += 104;\n        }\n        const s = Frame.panel(6, 96, 150, 34, 'hud');\n        Frame.write('hud plaque - translucent', 12, 102, s);\n        Frame.write('over the world, still legible', 12, 114, s, { color: s.sub });\n        Frame.bubble(164, 96, 148, 40, 210);\n        Frame.write('A bubble with a tail, for signs', 170, 104, 'paper');\n        Frame.write('and little asides.', 170, 116, 'paper');\n        Frame.tab(6, 138, 'Speaker tab', 'gold');\n        Frame.tab(96, 138, 'paper tab', 'paper');\n        Frame.tab(186, 138, 'dark tab', 'dark');\n        Frame.write('B backs out - t' + t, 6, 160, 'dark', { color: P.ui1 });\n      });\n    },\n  };\n}\n\nexport function register() {\n  globalThis.__R = R;                    // keeps bridge's own fallback panel working\n  Scenes.register('__panels', panelsScene);\n}\n\nexport default Frame;\n","deps":{"../core/renderer.js":"core/renderer.js","../art/atlas.js":"art/atlas.js","../art/palette.js":"art/palette.js","../core/scene.js":"core/scene.js","../core/input.js":"core/input.js","../core/util.js":"core/util.js"}},{"id":"core/bridge.js","code":"// Late-binding facade for every cross-piece call.\n//\n// Why: art, world, battle, village, missions, and ui are built in parallel. If world\n// imported village directly, a half-landed village would take the world down. Instead\n// each piece installs its implementation here at register() time, and callers get a\n// safe no-op until it does. Nothing outside a piece's own folder should be imported\n// directly — go through UIx or Hooks.\n\n// ---- UI facade -------------------------------------------------------------------\n// ui/textbox.js, ui/hud.js and ui/transition.js replace these via UIx.install().\nexport const UIx = {\n  /** True once the real ui/* modules have installed (minimal-ui leaves it false). */\n  real: false,\n\n  /** Typewriter dialogue box. Resolves when the player has read it through. */\n  async say(text, opts) { console.info('[say]', text); },\n  async sayMany(lines, opts) { for (const l of lines) await this.say(l, opts); },\n  /** Returns the chosen index, or -1 if cancelled. */\n  async ask(text, choices, opts) { return 0; },\n  async confirm(text) { return true; },\n  get busy() { return false; },\n\n  toast(text, opts) { console.info('[toast]', text); },\n\n  async fade(dir, frames) {},\n  async iris(dir, cx, cy) {},\n  async battleFx() {},\n  async doorway(dir) {},\n  get transitioning() { return false; },\n\n  /** Nine-slice panel. Fallback draws a plain readable box. */\n  panel(x, y, w, h, style) { fallbackPanel(x, y, w, h, style); },\n\n  // Copies property *descriptors*, so an implementation may supply getters\n  // (e.g. `get busy()`) over the facade's own getters. Object.assign cannot.\n  install(impl, { real = true } = {}) {\n    for (const k of Reflect.ownKeys(impl)) {\n      if (k === 'real') continue;\n      Object.defineProperty(UIx, k, Object.getOwnPropertyDescriptor(impl, k));\n    }\n    if (real) UIx.real = true;\n  },\n};\n\n// ---- cross-piece hooks -----------------------------------------------------------\nconst noop = () => {};\n\nexport const Hooks = {\n  /** village/village.js */\n  village: {\n    /** Called by world after a map loads: stamp solids, doors, and ground finishing. */\n    applyTo(map) {},\n    /** LAYER.MID ground finishing (plaza, paths) for the current map. */\n    drawGround(map, cam) {},\n    /** Push building sprites into the y-sorted entity layer. */\n    drawSprites(map, cam, sortEntity) {},\n    /** Return an async handler if the tile in front of the player is a village thing. */\n    interact(map, x, y) { return null; },\n    /** True if this map tile is blocked by a building. */\n    solid(map, x, y) { return false; },\n    /** Village level, for HUD and gating. */\n    level() { return 1; },\n    /** Enter placement mode for a building type. */\n    openBuildMode(type) {},\n  },\n\n  /** missions/missions.js */\n  missions: {\n    /** Progress hook: any gameplay event that a mission might count. */\n    note(kind, payload) {},\n    activeCount() { return 0; },\n    todayCount() { return 0; },\n    list() { return []; },\n  },\n\n  /** battle/scene.js — how the world starts a battle. Resolves with 'won'|'lost'|'fled'|'bonded'. */\n  battle: {\n    async start(params) { console.info('[battle] not built', params); return 'fled'; },\n    canBattle() { return false; },\n  },\n\n  /** world/overworld.js — how village/missions/battle move or refresh the world. */\n  world: {\n    async warpTo(map, x, y, dir) {},\n    refresh() {},\n    playerTile() { return { x: 0, y: 0, dir: 'down', map: 'village' }; },\n    currentMap() { return null; },\n    lockInput(v) {},\n  },\n\n  /** ui/hud.js — the overworld HUD. The world calls draw() every frame. */\n  hud: {\n    draw(map) {},\n    invalidateMinimap() {},\n  },\n\n  /** ui/party.js — party & guardian screens, used by battle and the pause menu. */\n  party: {\n    async openParty(opts) { return -1; },\n    async openSummary(guardian) {},\n    async chooseGuardian(opts) { return -1; },\n  },\n\n  install(slot, impl) {\n    if (!this[slot]) throw new Error(`[bridge] unknown hook slot \"${slot}\"`);\n    for (const k of Reflect.ownKeys(impl)) {\n      Object.defineProperty(this[slot], k, Object.getOwnPropertyDescriptor(impl, k));\n    }\n    installed.add(slot);\n  },\n\n  get installedSlots() { return [...installed]; },\n};\n\nconst installed = new Set();\n\n// Minimal readable panel so fallbacks never look like a crash.\nfunction fallbackPanel(x, y, w, h) {\n  // Imported lazily to avoid a cycle with the renderer.\n  const R = globalThis.__R;\n  if (!R) return;\n  R.rect(x, y, w, h, '#4a3826');\n  R.rect(x + 1, y + 1, w - 2, h - 2, '#e0cfa6');\n  R.rect(x + 2, y + 2, w - 4, h - 4, '#f8f0d8');\n  R.stroke(x, y, w, h, '#241a12');\n}\n","deps":{}},{"id":"ui/textbox.js","code":"// Dialogue.\n//\n// Every line of story in the game passes through here, so the details matter more\n// than anywhere else: characters land at a tunable rate with a soft click, holding a\n// button fast-forwards, B skips to the end of the page before it advances, pages\n// break cleanly and never mid-word, and the speaker gets a nameplate and a portrait\n// so you always know who is talking.\n\nimport { R, LAYER } from '../core/renderer.js';\nimport { Input } from '../core/input.js';\nimport { Scenes } from '../core/scene.js';\nimport { Atlas } from '../art/atlas.js';\nimport { Audio } from '../core/audio.js';\nimport { UIx } from '../core/bridge.js';\nimport { Font } from '../core/font.js';\nimport { S } from '../state.js';\nimport { P, mix, shade } from '../art/palette.js';\nimport { clamp, ease } from '../core/util.js';\nimport { Frame } from './frame.js';\n\n// Characters per frame at each text-speed setting. 1 = slow, 2 = normal, 3 = fast.\nconst SPEED = [0, 0.7, 1.4, 2.6];\nconst BOX = { x: 6, w: 308, h: 50 };\nconst OPEN = 7;              // frames the box takes to open — short, but it reads\n\nlet busy = false;\n\n// Portraits are drawn from the character sprite we already have, cropped to the\n// head and scaled up. That keeps one source of truth for what everyone looks like.\nfunction portrait(who, x, y) {\n  const img = Atlas.tryGet(`c.${who}.down`, 0);\n  if (!img) return false;\n  Frame.panel(x, y, 34, 34, 'gold');\n  const ctx = R.ctx;\n  ctx.save();\n  ctx.beginPath();\n  ctx.rect(x + 3, y + 3, 28, 28);\n  ctx.clip();\n  // 16x24 sprite, head is roughly the top 14px; scale x2 and centre on the face.\n  ctx.imageSmoothingEnabled = false;\n  ctx.drawImage(img, 1, 1, 14, 14, x + 3, y + 3, 28, 28);\n  ctx.restore();\n  return true;\n}\n\nfunction textboxScene(params) {\n  const { text, speaker, choices, portraitOf } = params || {};\n  const hasPortrait = portraitOf && Atlas.has(`c.${portraitOf}.down`);\n  const padL = hasPortrait ? 46 : 12;\n  const wrapW = BOX.w - padL - 14;\n  const lines = Font.wrap(String(text ?? ''), wrapW);\n  const PER_PAGE = 3;\n\n  let page = 0, shown = 0, t = 0, open = 0, pick = 0, closing = 0;\n\n  const pageLines = () => lines.slice(page * PER_PAGE, page * PER_PAGE + PER_PAGE);\n  const pageLen = () => pageLines().join('').length;\n  const morePages = () => (page + 1) * PER_PAGE < lines.length;\n  const typed = () => shown >= pageLen();\n  const boxH = () => BOX.h + (choices && !morePages() ? choices.length * 12 + 4 : 0);\n  const boxY = () => R.H - boxH() - 4;\n\n  function advance() {\n    if (morePages()) { page++; shown = 0; Audio.sfx('cursor', { gain: 0.6 }); }\n    else { Audio.sfx('confirm'); closing = 1; }\n  }\n\n  return {\n    pausesBelow: false, drawsBelow: true,\n\n    update() {\n      t++;\n      if (closing) { if (++closing > OPEN) Scenes.pop(choices ? pick : undefined); return; }\n      if (open < OPEN) { open++; return; }\n\n      if (!typed()) {\n        const rate = SPEED[clamp(S.settings.textSpeed || 2, 1, 3)];\n        // Holding either button fast-forwards; B alone snaps to the end of the page.\n        const fast = Input.held('a') || Input.held('b');\n        shown += fast ? rate * 3.5 : rate;\n        if (Input.pressed('b')) shown = pageLen();\n        if (t % 3 === 0) Audio.sfx('text', { gain: 0.5 });\n        return;\n      }\n\n      if (choices && !morePages()) {\n        if (Input.pressed('down')) { pick = (pick + 1) % choices.length; Audio.sfx('cursor'); }\n        if (Input.pressed('up')) { pick = (pick + choices.length - 1) % choices.length; Audio.sfx('cursor'); }\n        if (Input.pressed('a')) { Audio.sfx('confirm'); closing = 1; }\n        if (Input.pressed('b')) { Audio.sfx('cancel'); pick = -1; closing = 1; }\n        return;\n      }\n      if (Input.pressed('a') || Input.pressed('b')) advance();\n    },\n\n    render() {\n      R.layer(LAYER.UI, () => {\n        const k = closing ? 1 - closing / OPEN : ease.outCubic(open / OPEN);\n        const h = Math.max(2, Math.round(boxH() * k));\n        const y = R.H - h - 4;\n        const full = k > 0.92;\n\n        Frame.panel(BOX.x, y, BOX.w, h, 'paper');\n        if (!full) return;                     // don't draw contents mid-open\n\n        if (speaker) Frame.tab(BOX.x + 8, y - 9, speaker, 'gold');\n        if (hasPortrait) portrait(portraitOf, BOX.x + 6, y + 8);\n\n        let n = shown;\n        pageLines().forEach((l, i) => {\n          const limit = Math.max(0, Math.min(l.length, Math.floor(n)));\n          n -= l.length;\n          Frame.write(l, BOX.x + padL, y + 9 + i * 12, 'paper', { limit });\n        });\n\n        if (choices && typed() && !morePages()) {\n          const cy0 = y + 9 + PER_PAGE * 12;\n          choices.forEach((c, i) => {\n            const cy = cy0 + i * 12;\n            const on = i === pick;\n            if (on) R.rect(BOX.x + padL - 4, cy - 2, BOX.w - padL - 10, 12, mix(P.gold1, P.paper0, 0.5));\n            Frame.write(c, BOX.x + padL + 8, cy, 'paper', { color: on ? P.ink : P.ink3 });\n            if (on) Frame.cursor(BOX.x + padL - 2, cy, t);\n          });\n        } else if (typed()) {\n          // The advance chevron bobs rather than blinks — easier to notice, less nagging.\n          const bob = Math.round(Math.sin(t / 9) * 1);\n          R.text(morePages() ? '▼' : '▼', BOX.x + BOX.w - 16, y + h - 15 + bob,\n            { color: P.gold3, shadow: false });\n        }\n      });\n    },\n  };\n}\n\nexport function register() {\n  Scenes.register('__say', p => textboxScene(p));\n\n  UIx.install({\n    get busy() { return busy; },\n\n    async say(text, opts = {}) {\n      busy = true;\n      try {\n        await Scenes.pushAsync('__say', {\n          text, speaker: opts.speaker,\n          portraitOf: opts.portrait || opts.who || speakerToWho(opts.speaker),\n        });\n      } finally { busy = false; }\n    },\n\n    async sayMany(lines, opts = {}) {\n      for (const l of lines) await UIx.say(l, opts);\n    },\n\n    async ask(text, choices, opts = {}) {\n      busy = true;\n      try {\n        const r = await Scenes.pushAsync('__say', {\n          text, speaker: opts.speaker, choices,\n          portraitOf: opts.portrait || speakerToWho(opts.speaker),\n        });\n        return r === undefined ? -1 : r;\n      } finally { busy = false; }\n    },\n\n    async confirm(text, opts = {}) {\n      return (await UIx.ask(text, ['Yes', 'No'], opts)) === 0;\n    },\n\n    panel(x, y, w, h, style) { return Frame.panel(x, y, w, h, style); },\n  });\n}\n\n// Maps a display name back to a sprite so `say('...', {speaker:'Gran Willow'})`\n// gets the right portrait without every caller knowing sprite ids.\nconst BY_NAME = {\n  'Mayor Bramble': 'mayor', 'Gran Willow': 'gran', 'Pip': 'kid', 'Odell': 'farmer',\n  'Hesta': 'smith', 'Marrow': 'baker', 'Quill': 'fisher', 'Sable': 'ranger',\n  'Nettle': 'weaver', 'Cobb': 'peddler', 'Wick': 'twin', 'Ash-of-the-North': 'rival',\n};\nfunction speakerToWho(speaker) {\n  if (!speaker) return null;\n  if (BY_NAME[speaker]) return BY_NAME[speaker];\n  const low = String(speaker).toLowerCase();\n  return Atlas.has(`c.${low}.down`) ? low : null;\n}\n","deps":{"../core/renderer.js":"core/renderer.js","../core/input.js":"core/input.js","../core/scene.js":"core/scene.js","../art/atlas.js":"art/atlas.js","../core/audio.js":"core/audio.js","../core/bridge.js":"core/bridge.js","../core/font.js":"core/font.js","../state.js":"state.js","../art/palette.js":"art/palette.js","../core/util.js":"core/util.js","./frame.js":"ui/frame.js"}},{"id":"world/daynight.js","code":"// The clock, the seasons, the weather, and the light they produce.\n//\n// One in-game minute per real second: a full day is 24 real minutes, so a play\n// session sees dawn, noon, dusk, and night without anyone waiting around.\n\nimport { S } from '../state.js';\nimport { Bus, EV } from '../core/events.js';\nimport { R } from '../core/renderer.js';\nimport { tintFor } from '../art/palette.js';\nimport { Atlas } from '../art/atlas.js';\nimport { makeRng } from '../core/rng.js';\n\nexport const FRAMES_PER_MINUTE = 60;      // 1 in-game minute per real second\nexport const SEASONS = ['spring', 'summer', 'autumn', 'winter'];\nexport const DAYS_PER_SEASON = 7;\n\nlet acc = 0;\nconst rng = makeRng(4242);\nconst drops = [];\n\nexport function tickClock(n = 1) {\n  const c = S.clock;\n  acc += n;\n  while (acc >= FRAMES_PER_MINUTE) {\n    acc -= FRAMES_PER_MINUTE;\n    c.minute++;\n    if (c.minute >= 60) {\n      c.minute = 0;\n      c.hour++;\n      if (c.hour >= 24) {\n        c.hour = 0;\n        c.day++;\n        Bus.emit(EV.DAY_CHANGED, { day: c.day });\n        rollWeather();\n        if ((c.day - 1) % DAYS_PER_SEASON === 0) {\n          const i = (SEASONS.indexOf(c.season) + 1) % SEASONS.length;\n          c.season = SEASONS[i];\n          Bus.emit(EV.SEASON_CHANGED, c.season);\n        }\n      }\n    }\n  }\n}\n\nfunction rollWeather() {\n  const c = S.clock;\n  const r = rng.float();\n  if (c.season === 'winter') c.weather = r < 0.32 ? 'snow' : 'clear';\n  else if (c.season === 'autumn') c.weather = r < 0.28 ? 'rain' : r < 0.34 ? 'storm' : 'clear';\n  else c.weather = r < 0.18 ? 'rain' : 'clear';\n}\n\nexport const isNight = () => S.clock.hour >= 19 || S.clock.hour < 6;\nexport const clockText = () => `${String(S.clock.hour).padStart(2, '0')}:${String(S.clock.minute).padStart(2, '0')}`;\nexport const timeOfDay = () => {\n  const h = S.clock.hour;\n  if (h < 6) return 'night';\n  if (h < 9) return 'dawn';\n  if (h < 17) return 'day';\n  if (h < 20) return 'dusk';\n  return 'night';\n};\n\n/** Screen tint for the current moment. Drawn on LAYER.WEATHER by the overworld. */\nexport function drawLighting(map) {\n  const c = S.clock;\n  const { color, alpha, mode } = tintFor(c.hour + c.minute / 60, c.season, c.weather);\n  if (map?.indoor) {\n    // Interiors keep their own warm light; only the deep night reaches inside.\n    const a = Math.min(alpha, 0.28);\n    if (a > 0.02) R.tintScreen('#20263a', a, 'multiply');\n    return;\n  }\n  if (alpha > 0.01) R.tintScreen(color, alpha, mode);\n}\n\n/** Falling weather particles, screen-space so they cost nothing to scroll. */\nexport function drawWeather() {\n  const w = S.clock.weather;\n  if (w === 'clear') return;\n  const snow = w === 'snow';\n  const want = w === 'storm' ? 90 : snow ? 60 : 70;\n  while (drops.length < want) {\n    drops.push({\n      x: rng.float() * (R.W + 40) - 20, y: rng.float() * R.H,\n      v: snow ? 0.4 + rng.float() * 0.5 : 3.2 + rng.float() * 2.2,\n      d: snow ? (rng.float() - 0.5) * 0.5 : -1.1,\n      p: rng.float() * 6.28, f: Math.floor(rng.float() * 4),\n    });\n  }\n  while (drops.length > want) drops.pop();\n\n  const img = Atlas.tryGet(snow ? 'fx.snow' : 'fx.rain', 0);\n  for (const d of drops) {\n    d.y += d.v;\n    d.x += d.d + (snow ? Math.sin(d.p += 0.04) * 0.4 : 0);\n    if (d.y > R.H) { d.y = -6; d.x = rng.float() * (R.W + 40) - 20; }\n    if (d.x < -20) d.x = R.W + 10;\n    if (img) R.blit(img, d.x, d.y, { alpha: snow ? 0.85 : 0.6 });\n    else R.rect(d.x, d.y, 1, snow ? 1 : 4, snow ? '#eef6ff' : '#9fc9e8');\n  }\n  if (S.clock.weather === 'storm' && rng.float() < 0.006) R.flash('#dfe8ff', 4);\n}\n\n/** Warm pools of light under lit lamps and windows once the sun is down. */\nexport function drawNightGlow(map, cam) {\n  if (!isNight() || map?.indoor) return;\n  // Deliberately gentle. A lamp should pool warmth on the ground, not bleach\n  // whatever is standing under it.\n  const deep = S.clock.hour >= 21 || S.clock.hour < 5;\n  const a = deep ? 0.20 : 0.13;\n  for (const p of map.findTag('lamp')) {\n    // Pool the light on the ground BELOW the lamp, wide and soft. Centring a tight,\n    // strong glow on the fitting itself just blows the fitting out to white.\n    const x = p.x * 16 + 8 - cam.x, y = p.y * 16 + 18 - cam.y;\n    if (x < -50 || y < -50 || x > R.W + 50 || y > R.H + 50) continue;\n    R.glow(x, y, 38, `rgba(255,204,128,${a})`, 0.5);\n  }\n  for (const st of map.structures || []) {\n    const x = (st.x + st.w / 2) * 16 - cam.x, y = (st.y - st.overhang / 2) * 16 - cam.y;\n    if (x < -60 || y < -60 || x > R.W + 60 || y > R.H + 60) continue;\n    R.glow(x, y, 22, 'rgba(255,190,104,0.26)', 0.5);\n  }\n}\n\n/** Which lamp art to use — the lit variant only after dark. */\nexport const lampTile = () => (isNight() ? 't.lamp.lit' : 't.lamp');\n\nexport function register() {\n  // Weather should already match the season on a fresh save.\n  if (!S.clock.weather) rollWeather();\n}\n","deps":{"../state.js":"state.js","../core/events.js":"core/events.js","../core/renderer.js":"core/renderer.js","../art/palette.js":"art/palette.js","../art/atlas.js":"art/atlas.js","../core/rng.js":"core/rng.js"}},{"id":"ui/hud.js","code":"// The overworld HUD.\n//\n// It has to answer \"when is it, what do I have, how is my team, where am I\" without\n// getting in the way of the world. So: small, cornered, semi-transparent, and it\n// shrinks out of the way whenever dialogue is open.\n\nimport { R, LAYER } from '../core/renderer.js';\nimport { Atlas } from '../art/atlas.js';\nimport { UIx, Hooks } from '../core/bridge.js';\nimport { Font } from '../core/font.js';\nimport { S } from '../state.js';\nimport { P, mix, shade } from '../art/palette.js';\nimport { clamp, ease } from '../core/util.js';\nimport { Frame, seasonIcon, skyIcon } from './frame.js';\nimport { clockText, timeOfDay } from '../world/daynight.js';\n\nconst toasts = [];\nlet hide = 0;            // 0 = fully shown, 1 = fully tucked away\nlet t = 0;\n\n// --- minimap -----------------------------------------------------------------\n// Rebuilt only when the map changes: 1px per tile, colour-coded by walkability so\n// it reads as a map rather than a thumbnail of the tiles.\nlet miniFor = null, mini = null;\n\nfunction buildMinimap(map) {\n  const c = document.createElement('canvas');\n  c.width = map.w; c.height = map.h;\n  const x = c.getContext('2d');\n  const img = x.createImageData(map.w, map.h);\n  const put = (i, hex, a = 255) => {\n    img.data[i] = parseInt(hex.slice(1, 3), 16);\n    img.data[i + 1] = parseInt(hex.slice(3, 5), 16);\n    img.data[i + 2] = parseInt(hex.slice(5, 7), 16);\n    img.data[i + 3] = a;\n  };\n  for (let yy = 0; yy < map.h; yy++) {\n    for (let xx = 0; xx < map.w; xx++) {\n      const i = (yy * map.w + xx) * 4;\n      if (map.isWater(xx, yy)) put(i, '#2b7fae');\n      else if (map.solid(xx, yy)) put(i, '#3d2f22');\n      else if (map.isGrass(xx, yy)) put(i, '#4f8b31');\n      else if (map.tag(xx, yy) === 'door') put(i, '#f5c877');\n      else put(i, '#8cc055');\n    }\n  }\n  x.putImageData(img, 0, 0);\n  return c;\n}\n\nfunction drawMinimap(map, x, y, w, h) {\n  if (!map) return;\n  if (miniFor !== map.id) { mini = buildMinimap(map); miniFor = map.id; }\n  Frame.panel(x, y, w, h, { style: 'dark', alpha: 0.82 });\n  const iw = w - 6, ih = h - 6;\n  const s = Math.min(iw / map.w, ih / map.h);\n  const dw = Math.max(1, Math.round(map.w * s)), dh = Math.max(1, Math.round(map.h * s));\n  const dx = Math.round(x + 3 + (iw - dw) / 2), dy = Math.round(y + 3 + (ih - dh) / 2);\n  const ctx = R.ctx;\n  ctx.imageSmoothingEnabled = false;\n  ctx.globalAlpha = 0.85;\n  ctx.drawImage(mini, dx, dy, dw, dh);\n  ctx.globalAlpha = 1;\n  // The player pip blinks so it's findable on a busy map.\n  const px = dx + Math.round(S.player.x * s), py = dy + Math.round(S.player.y * s);\n  if (Math.floor(t / 18) % 2 === 0) R.rect(px - 1, py - 1, 3, 3, '#fff6c4');\n  R.rect(px, py, 1, 1, P.ember1);\n}\n\n// --- the bar -----------------------------------------------------------------\nfunction drawTop(map) {\n  const y = Math.round(2 - hide * 24);\n  if (y < -20) return;\n\n  // time + season\n  const w1 = 78;\n  Frame.panel(4, y, w1, 16, { style: 'hud', alpha: 0.86 });\n  skyIcon(8, y + 4, S.clock.hour);\n  Frame.write(clockText(), 20, y + 5, 'hud');\n  seasonIcon(48, y + 4, S.clock.season);\n  Frame.write(`d${S.clock.day}`, 60, y + 5, 'hud');\n\n  // currencies\n  const coins = String(S.coins), hearth = String(S.hearth);\n  const w2 = 30 + Font.measure(coins) + Font.measure(hearth);\n  const x2 = 4 + w1 + 4;\n  Frame.panel(x2, y, w2, 16, { style: 'hud', alpha: 0.86 });\n  const ci = Atlas.tryGet('ui.coin');\n  if (ci) R.blit(ci, x2 + 4, y + 3);\n  Frame.write(coins, x2 + 16, y + 5, 'hud');\n  const hi = Atlas.tryGet('ui.hearth');\n  const hx = x2 + 20 + Font.measure(coins);\n  if (hi) R.blit(hi, hx, y + 3);\n  Frame.write(hearth, hx + 12, y + 5, 'hud');\n\n  // party health pips\n  if (S.party.length) {\n    const pw = 8 + S.party.length * 10;\n    const x3 = x2 + w2 + 4;\n    Frame.panel(x3, y, pw, 16, { style: 'hud', alpha: 0.86 });\n    S.party.forEach((g, i) => {\n      const f = g.maxhp ? clamp(g.hp / g.maxhp, 0, 1) : 0;\n      const px = x3 + 5 + i * 10;\n      R.rect(px, y + 4, 6, 8, '#241a12');\n      const col = f > 0.5 ? P.hpGood : f > 0.22 ? P.hpWarn : P.hpBad;\n      const fh = Math.max(f > 0 ? 1 : 0, Math.round(6 * f));\n      R.rect(px + 1, y + 10 - fh, 4, fh, col);\n    });\n  }\n}\n\n// --- toasts ------------------------------------------------------------------\nfunction drawToasts() {\n  for (let i = toasts.length - 1; i >= 0; i--) {\n    if (--toasts[i].life <= 0) toasts.splice(i, 1);\n  }\n  toasts.slice(0, 3).forEach((to, i) => {\n    const w = Font.measure(to.text) + (to.icon ? 26 : 16);\n    const y = 22 + i * 18;\n    // Slide in, hold, slide out — driven off remaining life so it never pops.\n    const inK = ease.outCubic(clamp((to.total - to.life) / 8, 0, 1));\n    const outK = ease.outCubic(clamp(to.life / 8, 0, 1));\n    const k = Math.min(inK, outK);\n    if (k <= 0.02) return;\n    const x = R.W - 6 - w * k;\n    Frame.panel(x, y, w * k, 15, { style: 'gold', alpha: k });\n    if (k > 0.85) {\n      let tx = x + 8;\n      if (to.icon) { const im = Atlas.tryGet(to.icon); if (im) { R.blit(im, tx, y + 3); tx += 14; } }\n      Frame.write(to.text, tx, y + 4, 'gold');\n    }\n  });\n}\n\n// --- public ------------------------------------------------------------------\nexport const HUD = {\n  toast(text, opts = {}) {\n    const life = Math.round((opts.ms || 2000) / 16);\n    toasts.push({ text: String(text), icon: opts.icon, life, total: life });\n  },\n\n  draw(map) {\n    t++;\n    // Tuck away while anything is talking, so dialogue owns the screen.\n    const want = UIx.busy ? 1 : 0;\n    hide += clamp(want - hide, -0.14, 0.14);\n\n    R.layer(LAYER.UI, () => {\n      drawTop(map);\n      if (hide < 0.5 && map && !map.indoor) {\n        const mw = 54, mh = 44;\n        drawMinimap(map, R.W - mw - 4, R.H - mh - 4 + Math.round(hide * 60), mw, mh);\n      }\n      drawToasts();\n    });\n  },\n\n  invalidateMinimap() { miniFor = null; },\n};\n\nexport function register() {\n  Hooks.install('hud', { draw: map => HUD.draw(map) });\n  UIx.install({ toast: (text, opts) => HUD.toast(text, opts), drawToasts: () => {} });\n}\n","deps":{"../core/renderer.js":"core/renderer.js","../art/atlas.js":"art/atlas.js","../core/bridge.js":"core/bridge.js","../core/font.js":"core/font.js","../state.js":"state.js","../art/palette.js":"art/palette.js","../core/util.js":"core/util.js","./frame.js":"ui/frame.js","../world/daynight.js":"world/daynight.js"}},{"id":"ui/transition.js","code":"// Scene transitions.\n//\n// The battle transition is the one that has to earn its keep: it is the moment the\n// world hands over, and a plain fade wastes it. Ours is an original hearth-ember\n// flourish — rings of embers rush out from the player, the screen snaps twice, then\n// the world burns away to black. No screen ever gets stuck: every transition\n// resolves exactly once, and the scene pops itself even if interrupted.\n\nimport { R, LAYER } from '../core/renderer.js';\nimport { Scenes } from '../core/scene.js';\nimport { Audio } from '../core/audio.js';\nimport { UIx } from '../core/bridge.js';\nimport { P, mix } from '../art/palette.js';\nimport { clamp, ease } from '../core/util.js';\nimport { makeRng } from '../core/rng.js';\n\nconst rng = makeRng(31337);\nlet active = false;\n\n// A transition is a scene so it draws above the world and blocks input beneath it.\nfunction fxScene(kind, frames, opts, done) {\n  let f = 0;\n  const embers = [];\n  if (kind === 'battle') {\n    for (let i = 0; i < 46; i++) {\n      const a = rng.range(0, Math.PI * 2);\n      // Slow enough to stay on screen for the whole transition — the first pass\n      // had them off the edge before anyone could see them.\n      embers.push({ a, sp: rng.range(0.9, 2.6), r0: rng.range(0, 10), size: rng.float() < 0.35 ? 2 : 1 });\n    }\n  }\n\n  return {\n    pausesBelow: true, drawsBelow: true,\n    update() {\n      if (++f >= frames) { Scenes.pop(); done(); }\n    },\n    render() {\n      R.layer(LAYER.UI, ctx => {\n        const k = clamp(f / frames, 0, 1);\n\n        if (kind === 'fade' || kind === 'doorway') {\n          const a = opts.dir === 'out' ? k : 1 - k;\n          ctx.globalAlpha = a;\n          R.rect(0, 0, R.W, R.H, opts.color || '#0b0e14');\n          ctx.globalAlpha = 1;\n          return;\n        }\n\n        if (kind === 'iris') {\n          const a = opts.dir === 'out' ? k : 1 - k;\n          const maxR = Math.hypot(R.W, R.H) / 2 + 8;\n          const r = (1 - ease.inOutCubic(a)) * maxR;\n          const cx = opts.cx ?? R.W / 2, cy = opts.cy ?? R.H / 2;\n          ctx.save();\n          ctx.beginPath();\n          ctx.rect(0, 0, R.W, R.H);\n          ctx.arc(cx, cy, Math.max(0, r), 0, Math.PI * 2, true);\n          ctx.fillStyle = '#0b0e14';\n          ctx.fill('evenodd');\n          ctx.restore();\n          return;\n        }\n\n        // --- battle ---\n        const cx = R.W / 2, cy = R.H / 2;\n        // One soft snap, not two hard ones. Repeated full-screen white flashes are a\n        // photosensitivity risk, and a partial-alpha wash reads just as sharply.\n        if (f >= 3 && f <= 6) {\n          ctx.globalAlpha = 0.5 - (f - 3) * 0.12;\n          R.rect(0, 0, R.W, R.H, '#fff3d0');\n          ctx.globalAlpha = 1;\n        }\n        // Ember rings rushing outward.\n        ctx.globalAlpha = clamp(1 - k * 0.3, 0, 1);\n        for (const e of embers) {\n          const d = e.r0 + e.sp * f;\n          const x = cx + Math.cos(e.a) * d;\n          const y = cy + Math.sin(e.a) * d * 0.72;\n          const c = d < 40 ? P.spark0 : d < 80 ? P.ember0 : P.ember2;\n          R.rect(x, y, e.size, e.size, c);\n        }\n        ctx.globalAlpha = 1;\n        // Expanding ring outline.\n        for (const mult of [1, 0.62]) {\n          const r = k * 150 * mult;\n          ctx.strokeStyle = mult === 1 ? P.ember1 : P.gold0;\n          ctx.lineWidth = 2;\n          ctx.beginPath();\n          ctx.ellipse(cx, cy, r, r * 0.72, 0, 0, Math.PI * 2);\n          ctx.stroke();\n        }\n        // Then the world burns away from the edges inward.\n        if (k > 0.55) {\n          const b = ease.inQuad((k - 0.55) / 0.45);\n          const inset = (1 - b) * (R.W / 2);\n          ctx.fillStyle = '#0b0e14';\n          ctx.fillRect(0, 0, inset, R.H);\n          ctx.fillRect(R.W - inset, 0, inset, R.H);\n          ctx.fillRect(0, 0, R.W, inset * (R.H / R.W));\n          ctx.fillRect(0, R.H - inset * (R.H / R.W), R.W, inset * (R.H / R.W));\n        }\n      });\n    },\n  };\n}\n\nlet seq = 0;\nfunction run(kind, frames, opts = {}) {\n  return new Promise(res => {\n    active = true;\n    const name = `__fx${seq++}`;\n    let settled = false;\n    const done = () => { if (settled) return; settled = true; active = false; res(); };\n    Scenes.register(name, () => fxScene(kind, frames, opts, done));\n    Scenes.push(name);\n    // Safety net: if the scene is popped from underneath us, still resolve.\n    setTimeout(done, (frames + 30) * 17);\n  });\n}\n\nexport const Transition = {\n  get active() { return active; },\n  fade(dir = 'out', frames = 14, color) { return run('fade', frames, { dir, color }); },\n  iris(dir = 'out', cx, cy) { return run('iris', 20, { dir, cx, cy }); },\n  doorway(dir = 'out') { return run('doorway', 12, { dir }); },\n  async battle() {\n    Audio.sfx('chime', { rate: 0.7 });\n    Audio.duck(900);\n    await run('battle', 42);\n  },\n};\n\nexport function register() {\n  UIx.install({\n    fade: (dir, frames) => Transition.fade(dir, frames),\n    iris: (dir, cx, cy) => Transition.iris(dir, cx, cy),\n    doorway: dir => Transition.doorway(dir),\n    battleFx: () => Transition.battle(),\n    get transitioning() { return active; },\n  });\n}\n","deps":{"../core/renderer.js":"core/renderer.js","../core/scene.js":"core/scene.js","../core/audio.js":"core/audio.js","../core/bridge.js":"core/bridge.js","../art/palette.js":"art/palette.js","../core/util.js":"core/util.js","../core/rng.js":"core/rng.js"}},{"id":"battle/moves.js","code":"// The move catalogue, the type chart, and the four statuses.\n//\n// PURE MODULE — no DOM, no imports outside battle/. Node-testable.\n//\n// ============================================================================\n//  THE HEARTH TYPE CHART  (ours, not anybody else's)\n// ============================================================================\n//\n//  Two rings and a rare ninth type. Everything below is 2.0x one way and 0.5x\n//  the other way, so \"the thing that beats me also shrugs off my attacks\" is a\n//  single rule the player can feel out in three battles.\n//\n//  PRIMARY RING (five, the workhorse cycle):\n//\n//      ember ─▶ leaf ─▶ stone ─▶ spark ─▶ tide ─▶ ember\n//       fire burns the bough · roots split the rock · rock grounds the bolt\n//       the bolt boils the water · the water drowns the fire\n//\n//  SECONDARY RING (three, the mood cycle):\n//\n//      gale ─▶ bloom ─▶ dusk ─▶ gale\n//       the gale strips the petals · the blossom opens against the dark\n//       the dark stills the wind\n//\n//  BRIDGES (the off-diagonal spice — this is where the chart gets interesting):\n//      ember ─▶ gale     a breeze only ever feeds a fire\n//      gale  ─▶ leaf     a hard wind strips the boughs bare\n//      bloom ─▶ tide     roots drink the tide dry\n//      stone ─▶ bloom    stony ground starves a blossom\n//      leaf  ─▶ tide     the thicket soaks up the flood\n//      tide  ─▶ hearth   water drowns a hearth\n//\n//  HEARTH (the village-affinity type — rare, only the Hearthling line has it):\n//      hearth ◀─▶ dusk   MUTUAL 2.0x. This is deliberate: the Hearthling and the\n//                        drake line are written as rivals, so that matchup is a\n//                        coin-flip knife fight rather than a wall.\n//      hearth resists ember, leaf and bloom (0.5x) — the homely elements can't\n//      hurt a hearth. It is otherwise neutral into everything, which is what\n//      makes it a safe, kind pick for a first guardian.\n//\n//  FLAVOUR RESISTANCES (0.5x, on top of the reverse-of-strong rule):\n//      ember → stone   rock does not burn\n//      gale  → stone   wind does not move a boulder\n//      dusk  → dusk    shadows simply blend\n//      spark → spark   a charged hide shrugs off a bolt\n//      leaf  → leaf    bark against bark\n//\n//  There are NO immunities (0x). Being unable to act at all is not fun, and a\n//  0.5x floor keeps every guardian usable in every fight.\n//\n//  Resulting balance — weaknesses per type:\n//      ember 1 (tide)            leaf 2 (ember, gale)\n//      tide 3 (leaf,spark,bloom) stone 2 (leaf, dusk)\n//      gale 2 (ember, dusk)      spark 1 (stone)\n//      bloom 3 (ember,stone,gale) dusk 3 (bloom, spark, hearth)\n//      hearth 2 (tide, dusk)\n//  ember / spark / hearth are the sturdy ones; tide / bloom / dusk hit hard and\n//  bruise easily. The three starters form their own clean triangle:\n//      ember ▶ leaf ▶ tide ▶ ember.\n// ============================================================================\n\nexport const TYPES = ['ember', 'leaf', 'tide', 'stone', 'gale', 'spark', 'bloom', 'dusk', 'hearth'];\n\n/** att -> defenders it hits for 2.0x. */\nexport const STRONG = {\n  ember:  ['leaf', 'bloom', 'gale'],\n  leaf:   ['stone', 'tide'],\n  tide:   ['ember', 'hearth'],\n  stone:  ['spark', 'bloom'],\n  gale:   ['bloom', 'leaf'],\n  spark:  ['tide', 'dusk'],\n  bloom:  ['dusk', 'tide'],\n  dusk:   ['gale', 'stone', 'hearth'],\n  hearth: ['dusk'],\n};\n\n/** Extra 0.5x on top of the automatic reverse-of-STRONG resistances. */\nexport const EXTRA_RESIST = {\n  ember: ['stone'],\n  gale:  ['stone'],\n  dusk:  ['dusk'],\n  spark: ['spark'],\n  leaf:  ['leaf'],\n  hearth: [],\n};\n/** Defenders that soften these attacking types (the hearth's homely armour). */\nconst HEARTH_RESISTS = ['ember', 'leaf', 'bloom'];\n\n// Realised once at load so the hot path is a two-key lookup, never a search.\nconst CHART = (() => {\n  const m = {};\n  for (const a of TYPES) {\n    m[a] = {};\n    for (const d of TYPES) m[a][d] = 1;\n  }\n  for (const a of TYPES) for (const d of STRONG[a] || []) m[a][d] = 2;\n  // reverse-of-strong: attacking into your own predator is resisted\n  for (const a of TYPES) for (const d of STRONG[a] || []) {\n    if (m[d][a] === 1) m[d][a] = 0.5;\n  }\n  for (const a of TYPES) for (const d of EXTRA_RESIST[a] || []) m[a][d] = 0.5;\n  for (const a of HEARTH_RESISTS) if (m[a].hearth === 1) m[a].hearth = 0.5;\n  return m;\n})();\n\nexport function typeMult(att, def) {\n  const row = CHART[att];\n  if (!row) return 1;\n  const v = row[def];\n  return v === undefined ? 1 : v;\n}\n/** Combined multiplier against a (possibly dual-typed) defender. */\nexport function effectiveness(att, defTypes) {\n  let m = 1;\n  for (const d of defTypes) m *= typeMult(att, d);\n  return m;\n}\nexport const effLabel = m =>\n  m >= 2 ? 'super' : m > 1 ? 'good' : m === 1 ? 'neutral' : m > 0 ? 'weak' : 'none';\n\n// ============================================================================\n//  STATUSES — ours: scorch, tangle, soaked, dazzled.\n//  All four are timed (3-5 turns) and all four clear when the battle ends. This\n//  game is meant to feel kind: nothing follows you out of a fight.\n// ============================================================================\nexport const STATUS = {\n  scorch:  { id: 'scorch',  name: 'Scorch',  tag: 'SCH', color: '#ef6b2a',\n             blurb: 'singed — loses a little heart each turn and hits softer' },\n  tangle:  { id: 'tangle',  name: 'Tangle',  tag: 'TNG', color: '#4f8b31',\n             blurb: 'bound up — much slower, and sometimes cannot move' },\n  soaked:  { id: 'soaked',  name: 'Soaked',  tag: 'SOK', color: '#2b7fae',\n             blurb: 'drenched — guards weakly and conducts spark' },\n  dazzled: { id: 'dazzled', name: 'Dazzled', tag: 'DAZ', color: '#e8b52c',\n             blurb: 'seeing spots — moves fizzle out about a third of the time' },\n};\nexport const STATUS_IDS = Object.keys(STATUS);\n\n/** Numbers the engine reads. Keep them here so tuning is one file. */\nexport const RULES = {\n  scorchTick: 1 / 16,      // fraction of max HP lost at end of turn\n  scorchAtk: 0.75,         // physical attack multiplier while scorched\n  tangleSpeed: 0.5,\n  tangleSkip: 0.25,        // chance to lose the turn\n  soakedDef: 0.75,\n  soakedSparkTaken: 1.25,\n  dazzledFizzle: 1 / 3,\n  statusTurns: [3, 5],     // inclusive range rolled on application\n  critChance: 1 / 16,\n  critHighChance: 1 / 8,\n  critMult: 1.75,\n  stab: 1.5,\n  randLo: 0.85,\n  minDamage: 1,\n};\n\n// ============================================================================\n//  MOVES\n//  cat: 'physical' (atk vs def) | 'spirit' (spa vs spd) | 'status'\n//  focus: our PP. Running out of focus on every move falls back to Struggle.\n//  anim.fx  — an fx.* name from art/names.js\n//  anim.style — how battle/scene.js stages it:\n//      'burst'      bloom of particles on the target\n//      'projectile' particles travel attacker -> target\n//      'slash'      a quick cross-cut over the target\n//      'wave'       a horizontal sweep across the target\n//      'self'       plays on the user (buffs, heals, charges)\n//      'beam'       a bright line drawn from user to target\n//  fx — declarative effects the engine interprets (see applyMoveEffects).\n// ============================================================================\nconst M = [];\nconst move = (id, name, type, cat, o = {}) => {\n  M.push({\n    id, name, type, cat,\n    power: o.power || 0,\n    acc: o.acc === undefined ? 100 : o.acc,   // null = never misses\n    pri: o.pri || 0,\n    focus: o.focus || 20,\n    anim: o.anim || { fx: 'fx.impact', style: 'burst', shake: 2 },\n    fx: o.fx || null,\n    desc: o.desc || '',\n  });\n};\n\n// ---- EMBER ----------------------------------------------------------------\nmove('cinder_nip', 'Cinder Nip', 'ember', 'physical', {\n  power: 40, focus: 30, anim: { fx: 'fx.ember', style: 'burst', shake: 2 },\n  desc: 'A quick singeing nip.' });\nmove('bristle', 'Bristle', 'ember', 'status', {\n  focus: 25, anim: { fx: 'fx.sparkle', style: 'self' },\n  fx: { stat: [{ stat: 'atk', delta: 1, target: 'self' }] },\n  desc: 'Fluffs up. Raises the user\\'s Attack.' });\nmove('flare', 'Flare', 'ember', 'spirit', {\n  power: 60, acc: 95, focus: 20, anim: { fx: 'fx.ember', style: 'projectile', shake: 3 },\n  fx: { status: { id: 'scorch', chance: 0.15 } },\n  desc: 'A curl of flame that sometimes scorches.' });\nmove('scorch_mark', 'Scorch Mark', 'ember', 'status', {\n  acc: 90, focus: 15, anim: { fx: 'fx.ember', style: 'burst' },\n  fx: { status: { id: 'scorch', chance: 1 } },\n  desc: 'Brands the foe. Always scorches.' });\nmove('blaze_rush', 'Blaze Rush', 'ember', 'physical', {\n  power: 95, acc: 90, focus: 10, anim: { fx: 'fx.ember', style: 'slash', shake: 5 },\n  fx: { recoil: 0.25 },\n  desc: 'A headlong charge. The user takes a quarter of the damage dealt.' });\nmove('sunflare', 'Sun Flare', 'ember', 'spirit', {\n  power: 115, acc: 90, focus: 5, anim: { fx: 'fx.ring', style: 'beam', shake: 6 },\n  fx: { charge: 'basks in the light' },\n  desc: 'Gathers light for a turn, then lets go.' });\nmove('sunspire', 'Sunspire', 'ember', 'spirit', {\n  power: 100, acc: 95, focus: 5, anim: { fx: 'fx.ring', style: 'burst', shake: 6 },\n  fx: { status: { id: 'scorch', chance: 0.3 } },\n  desc: 'PYRELION\\'S OWN. A pillar of dawn-fire.' });\n\n// ---- LEAF -----------------------------------------------------------------\nmove('leaf_dart', 'Leaf Dart', 'leaf', 'physical', {\n  power: 40, focus: 30, anim: { fx: 'fx.leaf', style: 'projectile', shake: 2 },\n  desc: 'Flicks a stiff leaf like a blade.' });\nmove('thornlash', 'Thornlash', 'leaf', 'physical', {\n  power: 65, acc: 95, focus: 20, anim: { fx: 'fx.slash', style: 'slash', shake: 3 },\n  fx: { status: { id: 'tangle', chance: 0.1 } },\n  desc: 'A whipping vine that can snag.' });\nmove('bindvine', 'Bindvine', 'leaf', 'status', {\n  acc: 90, focus: 20, anim: { fx: 'fx.leaf', style: 'burst' },\n  fx: { status: { id: 'tangle', chance: 1 } },\n  desc: 'Roots wind round the foe. Always tangles.' });\nmove('canopy_crash', 'Canopy Crash', 'leaf', 'physical', {\n  power: 90, acc: 85, focus: 10, anim: { fx: 'fx.leaf', style: 'burst', shake: 5 },\n  fx: { stat: [{ stat: 'def', delta: -1, target: 'self' }] },\n  desc: 'Drops the whole canopy. Leaves the user open.' });\nmove('bough_embrace', 'Bough Embrace', 'leaf', 'physical', {\n  power: 85, focus: 10, anim: { fx: 'fx.leaf', style: 'wave', shake: 4 },\n  fx: { stat: [{ stat: 'def', delta: 1, target: 'self' }] },\n  desc: 'GROVEWING\\'S OWN. Strikes and settles into a guard.' });\n\n// ---- TIDE -----------------------------------------------------------------\nmove('droplet', 'Droplet', 'tide', 'spirit', {\n  power: 40, focus: 30, anim: { fx: 'fx.bubble', style: 'projectile', shake: 2 },\n  desc: 'A single well-aimed bead of water.' });\nmove('undertow', 'Undertow', 'tide', 'status', {\n  focus: 20, anim: { fx: 'fx.bubble', style: 'wave' },\n  fx: { stat: [{ stat: 'spe', delta: -1, target: 'foe' }] },\n  desc: 'Drags at the foe\\'s footing. Lowers Speed.' });\nmove('brinespray', 'Brine Spray', 'tide', 'spirit', {\n  power: 60, focus: 20, anim: { fx: 'fx.splash', style: 'wave', shake: 3 },\n  fx: { status: { id: 'soaked', chance: 0.2 } },\n  desc: 'A stinging spray that can soak.' });\nmove('tidebreak', 'Tidebreak', 'tide', 'spirit', {\n  power: 90, acc: 90, focus: 10, anim: { fx: 'fx.splash', style: 'burst', shake: 5 },\n  desc: 'A wave that folds over the foe.' });\nmove('tidal_lull', 'Tidal Lull', 'tide', 'spirit', {\n  power: 85, focus: 10, anim: { fx: 'fx.bubble', style: 'wave', shake: 4 },\n  fx: { status: { id: 'soaked', chance: 1 } },\n  desc: 'TORRENTIDE\\'S OWN. A slow swell that always soaks.' });\n\n// ---- STONE ----------------------------------------------------------------\nmove('pebble_toss', 'Pebble Toss', 'stone', 'physical', {\n  power: 40, focus: 30, anim: { fx: 'fx.rock', style: 'projectile', shake: 2 },\n  desc: 'Lobs a well-chosen pebble.' });\nmove('shell_up', 'Shell Up', 'stone', 'status', {\n  focus: 20, anim: { fx: 'fx.sparkle', style: 'self' },\n  fx: { stat: [{ stat: 'def', delta: 2, target: 'self' }] },\n  desc: 'Tucks in hard. Raises Defence sharply.' });\nmove('stonecall', 'Stonecall', 'stone', 'physical', {\n  power: 65, acc: 95, focus: 20, anim: { fx: 'fx.rock', style: 'burst', shake: 4 },\n  desc: 'Calls loose stone down on the foe.' });\nmove('boulder_dive', 'Boulder Dive', 'stone', 'physical', {\n  power: 100, acc: 85, focus: 10, anim: { fx: 'fx.rock', style: 'slash', shake: 6 },\n  fx: { recoil: 1 / 3 },\n  desc: 'A whole-body slam. Hurts to throw.' });\nmove('bedrock_vow', 'Bedrock Vow', 'stone', 'physical', {\n  power: 95, focus: 10, anim: { fx: 'fx.rock', style: 'burst', shake: 6 },\n  fx: { stat: [{ stat: 'def', delta: 1, target: 'self' }, { stat: 'spd', delta: 1, target: 'self' }] },\n  desc: 'CRAGNOX\\'S OWN. Strike, then set like bedrock.' });\n\n// ---- GALE -----------------------------------------------------------------\nmove('gust_nip', 'Gust Nip', 'gale', 'physical', {\n  power: 40, focus: 30, anim: { fx: 'fx.wind', style: 'wave', shake: 2 },\n  desc: 'A snapping little crosswind.' });\nmove('quickstep', 'Quickstep', 'gale', 'physical', {\n  power: 40, pri: 1, focus: 25, anim: { fx: 'fx.wind', style: 'slash', shake: 2 },\n  desc: 'Always strikes first.' });\nmove('swiftshift', 'Swiftshift', 'gale', 'status', {\n  focus: 20, anim: { fx: 'fx.wind', style: 'self' },\n  fx: { stat: [{ stat: 'spe', delta: 2, target: 'self' }] },\n  desc: 'Finds the draught. Raises Speed sharply.' });\nmove('wingflurry', 'Wingflurry', 'gale', 'physical', {\n  power: 22, acc: 90, focus: 20, anim: { fx: 'fx.wind', style: 'slash', shake: 2 },\n  fx: { hits: [2, 5] },\n  desc: 'Two to five quick beats.' });\nmove('skyshear', 'Skyshear', 'gale', 'spirit', {\n  power: 75, acc: 95, focus: 15, anim: { fx: 'fx.wind', style: 'beam', shake: 4 },\n  fx: { status: { id: 'dazzled', chance: 0.2 } },\n  desc: 'A thin blade of moving air.' });\nmove('hush_of_wings', 'Hush of Wings', 'gale', 'spirit', {\n  power: 80, pri: 1, focus: 10, anim: { fx: 'fx.wind', style: 'wave', shake: 3 },\n  desc: 'ZEPHYRIX\\'S OWN. Silent, and always first.' });\n\n// ---- SPARK ----------------------------------------------------------------\nmove('static_nip', 'Static Nip', 'spark', 'physical', {\n  power: 40, focus: 30, anim: { fx: 'fx.spark', style: 'burst', shake: 2 },\n  desc: 'A prickle of stored charge.' });\nmove('glimmer', 'Glimmer', 'spark', 'status', {\n  acc: 95, focus: 20, anim: { fx: 'fx.sparkle', style: 'burst' },\n  fx: { status: { id: 'dazzled', chance: 1 } },\n  desc: 'A burst of light. Always dazzles.' });\nmove('arcbolt', 'Arcbolt', 'spark', 'spirit', {\n  power: 65, focus: 20, anim: { fx: 'fx.spark', style: 'beam', shake: 3 },\n  fx: { status: { id: 'dazzled', chance: 0.15 } },\n  desc: 'A clean arc from paw to foe.' });\nmove('voltlash', 'Voltlash', 'spark', 'spirit', {\n  power: 95, acc: 90, focus: 10, anim: { fx: 'fx.spark', style: 'beam', shake: 5 },\n  desc: 'Lets the whole charge go at once.' });\nmove('thundermane', 'Thundermane', 'spark', 'spirit', {\n  power: 95, acc: 90, focus: 5, anim: { fx: 'fx.spark', style: 'burst', shake: 6 },\n  fx: { status: { id: 'dazzled', chance: 0.3 } },\n  desc: 'VOLTMANE\\'S OWN. The mane stands and the air cracks.' });\n\n// ---- BLOOM ----------------------------------------------------------------\nmove('petal_brush', 'Petal Brush', 'bloom', 'physical', {\n  power: 40, focus: 30, anim: { fx: 'fx.petal', style: 'wave', shake: 2 },\n  desc: 'Sweeps the foe with soft, sharp petals.' });\nmove('sunbask', 'Sunbask', 'bloom', 'status', {\n  focus: 10, anim: { fx: 'fx.sparkle', style: 'self' },\n  fx: { heal: 0.5 },\n  desc: 'Drinks the sun. Restores half the user\\'s heart.' });\nmove('pollen_haze', 'Pollen Haze', 'bloom', 'status', {\n  acc: 90, focus: 20, anim: { fx: 'fx.petal', style: 'burst' },\n  fx: { status: { id: 'tangle', chance: 1 } },\n  desc: 'Heavy pollen. Always tangles.' });\nmove('bloomburst', 'Bloomburst', 'bloom', 'spirit', {\n  power: 70, focus: 15, anim: { fx: 'fx.petal', style: 'burst', shake: 4 },\n  fx: { stat: [{ stat: 'spd', delta: -1, target: 'foe', chance: 0.3 }] },\n  desc: 'Opens all at once. May soften the foe\\'s Spirit guard.' });\nmove('radiant_bloom', 'Radiant Bloom', 'bloom', 'spirit', {\n  power: 100, acc: 95, focus: 5, anim: { fx: 'fx.petal', style: 'burst', shake: 6 },\n  fx: { status: { id: 'dazzled', chance: 0.2 } },\n  desc: 'FLORADIANT\\'S OWN. Every bud opens at the same instant.' });\n\n// ---- DUSK -----------------------------------------------------------------\nmove('shade_nip', 'Shade Nip', 'dusk', 'physical', {\n  power: 40, focus: 30, anim: { fx: 'fx.dusk', style: 'burst', shake: 2 },\n  desc: 'Bites from the wrong side of the light.' });\nmove('dim_veil', 'Dim Veil', 'dusk', 'status', {\n  focus: 20, anim: { fx: 'fx.dusk', style: 'wave' },\n  fx: { stat: [{ stat: 'atk', delta: -1, target: 'foe' }] },\n  desc: 'Draws the dark in. Lowers the foe\\'s Attack.' });\nmove('nightbite', 'Nightbite', 'dusk', 'physical', {\n  power: 65, focus: 20, anim: { fx: 'fx.slash', style: 'slash', shake: 3 },\n  fx: { crit: 1 },\n  desc: 'Finds the soft place. Lands critically often.' });\nmove('gloomsurge', 'Gloomsurge', 'dusk', 'spirit', {\n  power: 90, acc: 90, focus: 10, anim: { fx: 'fx.dusk', style: 'beam', shake: 5 },\n  fx: { drain: 0.5 },\n  desc: 'Siphons half of what it deals back to the user.' });\nmove('duskbrand', 'Duskbrand', 'dusk', 'physical', {\n  power: 95, focus: 5, anim: { fx: 'fx.dusk', style: 'slash', shake: 6 },\n  fx: { status: { id: 'dazzled', chance: 0.2 } },\n  desc: 'DRAKEMBER\\'S OWN. A brand that leaves the eyes swimming.' });\n\n// ---- HEARTH ---------------------------------------------------------------\nmove('warm_nuzzle', 'Warm Nuzzle', 'hearth', 'physical', {\n  power: 40, focus: 30, anim: { fx: 'fx.heart', style: 'burst', shake: 2 },\n  desc: 'A headbutt that somehow feels like a hug.' });\nmove('mend', 'Mend', 'hearth', 'status', {\n  focus: 10, anim: { fx: 'fx.heart', style: 'self' },\n  fx: { heal: 0.5, cure: true },\n  desc: 'Restores half the user\\'s heart and clears any ailment.' });\nmove('kindle_song', 'Kindle Song', 'hearth', 'status', {\n  focus: 15, anim: { fx: 'fx.star', style: 'self' },\n  fx: { stat: [{ stat: 'spa', delta: 1, target: 'self' }, { stat: 'spd', delta: 1, target: 'self' }] },\n  desc: 'Hums the village song. Raises both Spirit stats.' });\nmove('hearthlight', 'Hearthlight', 'hearth', 'spirit', {\n  power: 70, focus: 15, anim: { fx: 'fx.ring', style: 'beam', shake: 4 },\n  desc: 'A steady, warm light with weight behind it.' });\nmove('hearthbond', 'Hearthbond', 'hearth', 'spirit', {\n  power: 90, focus: 5, anim: { fx: 'fx.heart', style: 'beam', shake: 5 },\n  fx: { drain: 0.5 },\n  desc: 'HEARTHLING\\'S OWN. Shares the warmth, and takes some back.' });\n\n// ---- last resort ---------------------------------------------------------\nmove('struggle', 'Struggle', 'hearth', 'physical', {\n  power: 40, acc: null, focus: 1, anim: { fx: 'fx.impact', style: 'slash', shake: 4 },\n  fx: { recoil: 0.25, noStab: true, noType: true },\n  desc: 'Thrown when there is no focus left for anything else.' });\n\nexport const MOVES = Object.freeze(Object.fromEntries(M.map(m => [m.id, Object.freeze(m)])));\nexport const MOVE_LIST = Object.freeze(M.map(m => m.id));\nexport const getMove = id => MOVES[id] || MOVES.struggle;\nexport const moveExists = id => !!MOVES[id];\n\n/** Instance of a move as it lives on a guardian. */\nexport const makeMoveSlot = id => {\n  const m = getMove(id);\n  return { id: m.id, focus: m.focus, maxFocus: m.focus };\n};\n","deps":{}},{"id":"battle/species.js","code":"// The eighteen guardians: stats, growth, learnsets, evolutions, bond rates, dex text,\n// and the factory that turns a species id + level into a party member.\n//\n// PURE MODULE — no DOM. The only import outside battle/ is art/names.js, which is the\n// canonical (foundation-owned) roster; reading it means battle can never invent an id\n// or a sprite name that art doesn't know about.\n\nimport { GUARDIANS } from '../art/names.js';\nimport { getMove, makeMoveSlot } from './moves.js';\n\n// ---------------------------------------------------------------------------\n//  stat + xp maths\n// ---------------------------------------------------------------------------\n// Level 5 starter: ~21 HP, ~10 attack.  Level 50 final stage: ~155 HP, ~110 attack.\n// Those two anchors are what keep a level-5 fight at 3-5 turns and stop a level-50\n// hit from one-shotting.\nexport const maxLevel = 100;\n\nexport const hpAt = (base, lvl) => Math.floor((2 * base + 30) * lvl / 100) + lvl + 10;\nexport const statAt = (base, lvl) => Math.floor((2 * base + 10) * lvl / 100) + 5;\n\nconst CURVE = { fast: 0.8, medium: 1, slow: 1.25 };\n/** Total xp needed to *reach* `lvl` from level 1. */\nexport const xpTotal = (lvl, growth = 'medium') =>\n  Math.floor((CURVE[growth] || 1) * Math.pow(Math.max(1, lvl), 3));\n/** XP needed to go from `lvl` to `lvl+1`. `g.xp` counts up to this, then resets. */\nexport const xpNeeded = (lvl, growth = 'medium') =>\n  lvl >= maxLevel ? Infinity : Math.max(1, xpTotal(lvl + 1, growth) - xpTotal(lvl, growth));\n\n// ---------------------------------------------------------------------------\n//  the roster\n// ---------------------------------------------------------------------------\n// base: [hp, atk, def, spa, spd, spe]\n// bondRate: 0-255, the raw trust ceiling. High = takes to you easily.\n// xpBase: how much a foe of this species is worth.\n// evo: { to, level } | { to, level, bond } | { to, condition:'…' }\nconst S = [\n  {\n    id: 'embercub', base: [45, 52, 43, 60, 50, 65], growth: 'medium',\n    bondRate: 100, xpBase: 62, evo: { to: 'emberlynx', level: 16 },\n    dex: 'Sleeps curled in the ashes of a cold hearth. Its fur is always a little too warm to hold for long.',\n    learn: {\n      1: ['cinder_nip', 'bristle'], 4: ['pebble_toss'], 8: ['flare'],\n      12: ['scorch_mark'], 16: ['quickstep'], 21: ['blaze_rush'], 27: ['sunflare'],\n    },\n  },\n  {\n    id: 'emberlynx', base: [60, 70, 55, 80, 65, 85], growth: 'medium',\n    bondRate: 45, xpBase: 142, evo: { to: 'pyrelion', level: 34 },\n    dex: 'Runs the ridge lines at dusk. Villagers leave a bowl of milk out and find it warm at dawn.',\n    learn: {\n      1: ['cinder_nip', 'bristle', 'flare'], 12: ['scorch_mark'], 16: ['quickstep'],\n      22: ['blaze_rush'], 29: ['sunflare'], 36: ['stonecall'], 42: ['sunspire'],\n    },\n  },\n  {\n    id: 'pyrelion', base: [82, 95, 75, 105, 85, 100], growth: 'slow',\n    bondRate: 25, xpBase: 232, evo: null,\n    dex: 'The old bonfire-keeper of the high country. Where it lies down, spring comes early.',\n    learn: {\n      1: ['cinder_nip', 'flare', 'scorch_mark', 'sunspire'], 22: ['blaze_rush'],\n      29: ['sunflare'], 36: ['stonecall'], 44: ['bedrock_vow'], 50: ['sunspire'],\n    },\n  },\n  {\n    id: 'leafowl', base: [50, 45, 50, 58, 55, 62], growth: 'medium',\n    bondRate: 120, xpBase: 60, evo: { to: 'grovewing', level: 18 },\n    dex: 'Its feathers are shaped like young beech leaves, so it vanishes the moment it stops moving.',\n    learn: {\n      1: ['leaf_dart', 'gust_nip'], 5: ['bindvine'], 9: ['thornlash'],\n      13: ['swiftshift'], 18: ['wingflurry'], 24: ['canopy_crash'], 30: ['skyshear'],\n    },\n  },\n  {\n    id: 'grovewing', base: [72, 68, 75, 85, 80, 80], growth: 'medium',\n    bondRate: 45, xpBase: 168, evo: null,\n    dex: 'Nests only in trees older than the village. It remembers every path through the wood.',\n    learn: {\n      1: ['leaf_dart', 'gust_nip', 'bindvine', 'thornlash'], 18: ['wingflurry'],\n      25: ['canopy_crash'], 31: ['skyshear'], 38: ['bough_embrace'], 45: ['hush_of_wings'],\n    },\n  },\n  {\n    id: 'aquarabbit', base: [52, 50, 48, 55, 58, 60], growth: 'medium',\n    bondRate: 120, xpBase: 61, evo: { to: 'torrentide', level: 18 },\n    dex: 'Drums on the surface of a pond with its hind feet to call the rain in.',\n    learn: {\n      1: ['droplet', 'warm_nuzzle'], 5: ['undertow'], 9: ['brinespray'],\n      14: ['quickstep'], 18: ['sunbask'], 24: ['tidebreak'], 31: ['tidal_lull'],\n    },\n  },\n  {\n    id: 'torrentide', base: [78, 72, 78, 88, 85, 72], growth: 'medium',\n    bondRate: 45, xpBase: 172, evo: null,\n    dex: 'Carries a whole tide-pool in the hollow of its back, small crabs and all.',\n    learn: {\n      1: ['droplet', 'undertow', 'brinespray', 'tidal_lull'], 18: ['sunbask'],\n      25: ['tidebreak'], 32: ['bloomburst'], 40: ['tidal_lull'], 46: ['bedrock_vow'],\n    },\n  },\n  {\n    id: 'terranox', base: [58, 60, 68, 40, 45, 35], growth: 'medium',\n    bondRate: 140, xpBase: 58, evo: { to: 'cragnox', level: 20 },\n    dex: 'Sits so still that moss grows on its shoulders. It is not asleep. It is thinking.',\n    learn: {\n      1: ['pebble_toss', 'shell_up'], 6: ['warm_nuzzle'], 10: ['stonecall'],\n      15: ['bristle'], 20: ['dim_veil'], 26: ['boulder_dive'], 33: ['bedrock_vow'],\n    },\n  },\n  {\n    id: 'cragnox', base: [85, 90, 105, 52, 62, 45], growth: 'slow',\n    bondRate: 40, xpBase: 178, evo: null,\n    dex: 'A walking piece of the ridge. Children are allowed to draw on it with chalk.',\n    learn: {\n      1: ['pebble_toss', 'shell_up', 'stonecall', 'bedrock_vow'], 20: ['dim_veil'],\n      27: ['boulder_dive'], 34: ['bristle'], 41: ['bedrock_vow'], 48: ['boulder_dive'],\n    },\n  },\n  {\n    id: 'wisplet', base: [42, 40, 38, 55, 50, 78], growth: 'fast',\n    bondRate: 190, xpBase: 52, evo: { to: 'zephyrix', level: 20 },\n    dex: 'Barely there. You mostly notice it by the way the washing on the line lifts.',\n    learn: {\n      1: ['gust_nip', 'swiftshift'], 5: ['quickstep'], 9: ['wingflurry'],\n      14: ['glimmer'], 20: ['skyshear'], 27: ['undertow'], 34: ['hush_of_wings'],\n    },\n  },\n  {\n    id: 'zephyrix', base: [66, 62, 58, 84, 74, 110], growth: 'fast',\n    bondRate: 45, xpBase: 158, evo: null,\n    dex: 'Outruns its own sound. The hush that arrives before it is how you know it is coming.',\n    learn: {\n      1: ['gust_nip', 'swiftshift', 'quickstep', 'hush_of_wings'], 20: ['skyshear'],\n      28: ['wingflurry'], 35: ['glimmer'], 42: ['voltlash'], 48: ['hush_of_wings'],\n    },\n  },\n  {\n    id: 'voltkit', base: [45, 48, 42, 62, 50, 72], growth: 'medium',\n    bondRate: 150, xpBase: 56, evo: { to: 'voltmane', level: 22 },\n    dex: 'Sheds sparks when it is pleased. It is pleased very often.',\n    learn: {\n      1: ['static_nip', 'glimmer'], 5: ['quickstep'],
