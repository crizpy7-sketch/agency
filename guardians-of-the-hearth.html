t m = MISSION_HINT[u.mission] || 'a family mission';\n    return { unlocked: false, reason: `Unlocks when your family does: ${m}`, kind: 'mission', mission: u.mission };\n  }\n  if (u.flag && !S.flags?.[u.flag]) {\n    return { unlocked: false, reason: 'Not yet — the village isn\\'t ready.', kind: 'flag' };\n  }\n  return { unlocked: true, reason: '' };\n}\n\n// Short, warm phrasing of the mission that gates a building. Kept here (not in\n// missions.js) so buildings.js has zero cross-module imports.\nconst MISSION_HINT = {\n  'cook-together': 'cook a meal together',\n  'read-aloud': 'read a chapter out loud',\n  'make-something': 'make something with your hands',\n  'rest-together': 'twenty quiet minutes together',\n  'water-plants': 'water the plants',\n};\nexport const missionHint = id => MISSION_HINT[id] || null;\n\n/** Full row of info the build menu needs, in one call. */\nexport function buildRow(id, level) {\n  const def = defFor(id);\n  const lock = unlockState(id, level);\n  const have = countOf(id);\n  const cap = maxCount(id, level);\n  const c = costToBuild(id, level);\n  const affordable = Economy.canAfford(c);\n  let state = 'ready';\n  if (!lock.unlocked) state = 'locked';\n  else if (have >= cap) state = 'full';\n  else if (!affordable) state = 'poor';\n  return { def, lock, have, cap, cost: c, affordable, state };\n}\n\n/** Cost of a fresh tier-1 build (with the workshop discount applied). */\nexport function costToBuild(id) {\n  const def = defFor(id);\n  if (!def) return { coins: 0, hearth: 0 };\n  return discount(def.costs[0]);\n}\n\n/** Cost of taking an existing building from `tier` to `tier + 1`. */\nexport function costToUpgrade(id, tier) {\n  const def = defFor(id);\n  if (!def || tier >= def.tiers) return null;\n  return discount(def.costs[tier] || def.costs[def.costs.length - 1]);\n}\n\n/** Workshop tiers shave build costs — a concrete, legible reason to upgrade it. */\nexport function discountPct() {\n  const t = bestTier('workshop');\n  return t ? [0, 5, 10, 15][Math.min(3, t)] : 0;\n}\nfunction discount(c) {\n  const pct = discountPct();\n  if (!pct) return { coins: c.coins | 0, hearth: c.hearth | 0 };\n  return { coins: Math.max(0, Math.round(c.coins * (1 - pct / 100))), hearth: c.hearth | 0 };\n}\n\nexport const benefitsFor = (id, tier) => {\n  const def = defFor(id);\n  if (!def) return [];\n  return def.gives[Math.max(0, Math.min(def.gives.length - 1, (tier | 0) - 1))] || [];\n};\n\n/** Everything a building will *newly* give you at the next tier. */\nexport const gainsFrom = (id, tier) => benefitsFor(id, tier + 1);\n\n// --- placement rules ---------------------------------------------------------\n/** Human sentence describing where this can go — shown live in build mode. */\nexport function placeNote(id) {\n  const def = defFor(id);\n  const p = def?.place || {};\n  if (p.note) return p.note;\n  return 'Anywhere with room for its footprint.';\n}\n\n/**\n * Rule check only — geometry (overlap / bounds / solid tiles) lives in village.js.\n * `ctx` supplies { hearth: {x,y}, neighbours(x,y,w,h) -> count }.\n */\nexport function ruleOk(id, x, y, ctx) {\n  const def = defFor(id);\n  const p = def?.place || {};\n  const hx = ctx.hearth?.x ?? x, hy = ctx.hearth?.y ?? y;\n  const d = Math.hypot((x + def.w / 2) - hx, (y + def.h / 2) - hy);\n  if (p.rule === 'nearHearth' && d > (p.maxDist ?? 9)) {\n    return { ok: false, reason: `${def.name} belongs closer to the Hearthstone.` };\n  }\n  if (p.rule === 'farFromHearth' && d < (p.minDist ?? 6)) {\n    return { ok: false, reason: `${def.name} marks the village edge — further out.` };\n  }\n  if (p.rule === 'openGround' && ctx.neighbours && ctx.neighbours(x, y, def.w, def.h) > 0) {\n    return { ok: false, reason: `${def.name} needs a clear tile all around it.` };\n  }\n  return { ok: true, reason: '' };\n}\n\n// --- \"what should I build next?\" ---------------------------------------------\n/**\n * The single most useful thing the board can tell you. Prefers: something you can\n * afford right now; else the cheapest unlocked thing; else the nearest lock and\n * exactly what would open it.\n */\nexport function suggestion(level) {\n  const rows = DEFS.filter(d => d.id !== 'hearthstone').map(d => buildRow(d.id, level));\n  const ready = rows.filter(r => r.state === 'ready');\n  if (ready.length) {\n    ready.sort((a, b) => (a.cost.coins + a.cost.hearth * 8) - (b.cost.coins + b.cost.hearth * 8));\n    return { kind: 'build', row: ready[0], text: `Build a ${ready[0].def.name} — ${Economy.format(ready[0].cost)}` };\n  }\n  const poor = rows.filter(r => r.state === 'poor');\n  if (poor.length) {\n    poor.sort((a, b) => (a.cost.coins + a.cost.hearth * 8) - (b.cost.coins + b.cost.hearth * 8));\n    const r = poor[0];\n    return { kind: 'save', row: r, text: `Saving for a ${r.def.name}. ${Economy.shortfallText(r.cost)}` };\n  }\n  const locked = rows.filter(r => r.state === 'locked');\n  if (locked.length) {\n    const byMission = locked.find(r => r.lock.kind === 'mission');\n    const r = byMission || locked[0];\n    return { kind: 'locked', row: r, text: `${r.def.name}: ${r.lock.reason}` };\n  }\n  return { kind: 'upgrade', row: null, text: 'Everything is built — upgrade what you love most.' };\n}\n\n/** Buildings that can be upgraded right now, cheapest first. */\nexport function upgradeCandidates() {\n  const out = [];\n  for (const b of builtList()) {\n    const def = defFor(b.type);\n    if (!def) continue;\n    const tier = b.tier || 1;\n    if (tier >= def.tiers) continue;\n    const c = costToUpgrade(b.type, tier);\n    out.push({ b, def, tier, next: tier + 1, cost: c, affordable: Economy.canAfford(c) });\n  }\n  out.sort((a, b) => (a.cost.coins + a.cost.hearth * 8) - (b.cost.coins + b.cost.hearth * 8));\n  return out;\n}\n\nexport default { DEFS, defFor, unlockState, buildRow, costToBuild, costToUpgrade, suggestion };\n","deps":{"../art/names.js":"art/names.js","../state.js":"state.js","./economy.js":"village/economy.js"}},{"id":"village/village.js","code":"// The village model, and the Hooks.village implementation.\n//\n// The village is NOT a separate screen. Buildings live on the `village` overworld map\n// at real tile coordinates and the player walks among them. World calls into us:\n//\n//   applyTo(map)                     on map load  — reserve tiles, rebuild layout\n//   drawGround(map, cam)             LAYER.MID    — plaza, paths, planted decor\n//   drawSprites(map, cam, sortEntity)             — buildings + villagers, y-sorted\n//   solid(map, x, y)                 collision    — footprints block, doors don't\n//   interact(map, x, y)              A pressed    — doors, plots, the Hearthstone\n//\n// Everything is drawn from S.village.buildings, so a save is the village.\n//\n// The headline feature is VISIBLE TRANSFORMATION. Village level drives:\n//   * how far the ground finishing spreads from the Hearthstone (dirt -> gravel ->\n//     cobble -> plaza), and how fine the material gets\n//   * paths joining every door to the plaza\n//   * lamps (which light at night), banners, planters, benches, laundry, beehives\n//   * how many villagers walk around, and who they are\n//   * chimney smoke and warm windows after dark\n// A level-1 village and a level-6 village must not be mistakable for each other.\n\nimport { R, LAYER } from '../core/renderer.js';\nimport { Scenes } from '../core/scene.js';\nimport { Loop } from '../core/loop.js';\nimport { Atlas } from '../art/atlas.js';\nimport { P, mix, seasonize } from '../art/palette.js';\nimport { hash2, makeRng } from '../core/rng.js';\nimport { Bus, EV } from '../core/events.js';\nimport { UIx, Hooks } from '../core/bridge.js';\nimport { Audio } from '../core/audio.js';\nimport { S, save, setFlag } from '../state.js';\nimport { clamp, DIRS } from '../core/util.js';\nimport { Economy } from './economy.js';\nimport {\n  DEFS, defFor, builtList, unlockState, costToBuild, costToUpgrade, maxCount,\n  ruleOk, benefitsFor, CATEGORY, countOf,\n} from './buildings.js';\n\nexport const VILLAGE_MAP = 'village';\nconst TILE = 16;\n\n// Where the Hearthstone stands if the world map doesn't tell us otherwise. The\n// default player spawn is (22,24), four tiles south of this door.\nconst DEFAULT_HEARTH = { x: 21, y: 19 };\n\n// Suggested plots, as offsets from the Hearthstone origin. Build mode snaps its\n// cursor to the first valid one, so \"where do I put this?\" is never a blank stare.\nconst PLOTS = [\n  { dx: -7, dy: 0 }, { dx: 5, dy: 0 }, { dx: -8, dy: -4 }, { dx: 5, dy: -4 },\n  { dx: -7, dy: 4 }, { dx: 5, dy: 4 }, { dx: -3, dy: 7 }, { dx: 2, dy: 7 },\n  { dx: -11, dy: 2 }, { dx: 9, dy: 2 }, { dx: 0, dy: -7 }, { dx: -5, dy: -8 },\n  { dx: 4, dy: -8 }, { dx: -11, dy: -3 }, { dx: 9, dy: -3 }, { dx: -1, dy: 10 },\n];\n\n// --- village level -----------------------------------------------------------\n// Points come from what you have actually made: each building's weight times its\n// tier, plus one point per two family missions finished. Thresholds are shown in\n// the board so the number is never mysterious.\nexport const LEVEL_POINTS = [0, 0, 6, 14, 26, 42, 62, 88, 120, 160];\nexport const MAX_LEVEL = LEVEL_POINTS.length - 1;\n\nexport function points() {\n  let p = 0;\n  for (const b of builtList()) {\n    const def = defFor(b.type);\n    if (!def) continue;\n    p += def.weight * Math.max(1, b.tier || 1);\n  }\n  p += Math.floor(((S.missions?.done || []).length) / 2);\n  return p;\n}\n\nexport function levelFor(p) {\n  let lv = 1;\n  for (let i = 2; i <= MAX_LEVEL; i++) if (p >= LEVEL_POINTS[i]) lv = i;\n  return lv;\n}\n\nexport function level() { return levelFor(points()); }\n\nexport function progress() {\n  const p = points(), lv = level();\n  const at = LEVEL_POINTS[lv] || 0;\n  const next = lv >= MAX_LEVEL ? null : LEVEL_POINTS[lv + 1];\n  return {\n    points: p, level: lv, from: at, next,\n    frac: next === null ? 1 : clamp((p - at) / Math.max(1, next - at), 0, 1),\n    remaining: next === null ? 0 : next - p,\n  };\n}\n\n/** What opens up at a given level — used by the level-up banner and the build menu. */\nexport function unlocksAt(lv) {\n  return DEFS.filter(d => (d.unlock?.level || 0) === lv).map(d => d.name);\n}\n\n// --- state ------------------------------------------------------------------\nexport function ensureState() {\n  S.village ||= {};\n  const v = S.village;\n  if (!Array.isArray(v.buildings)) v.buildings = [];\n  if (!Array.isArray(v.unlocked)) v.unlocked = ['hearthstone'];\n  if (!Array.isArray(v.decor)) v.decor = [];\n  if (!Array.isArray(v.paths)) v.paths = [];\n  if (!Array.isArray(v.ledger)) v.ledger = [];\n  if (!v.nextId) v.nextId = 1;\n  // The village always has a heart.\n  if (!v.buildings.some(b => b.type === 'hearthstone')) {\n    v.buildings.unshift({\n      id: 'b0', type: 'hearthstone', x: DEFAULT_HEARTH.x, y: DEFAULT_HEARTH.y,\n      tier: 1, builtAt: 0, flip: false,\n    });\n  }\n  for (const b of v.buildings) { b.tier = Math.max(1, b.tier || 1); b.id ||= 'b' + (v.nextId++); }\n  v.level = level();\n  return v;\n}\n\nexport const hearth = () => {\n  ensureState();\n  return S.village.buildings.find(b => b.type === 'hearthstone')\n    || { type: 'hearthstone', x: DEFAULT_HEARTH.x, y: DEFAULT_HEARTH.y, tier: 1 };\n};\n\n/** Plaza centre: the tile just in front of the Hearthstone door. */\nexport function plazaCentre() {\n  const h = hearth(), d = defFor('hearthstone');\n  return { x: h.x + Math.floor((d.w - 1) / 2), y: h.y + d.h };\n}\n\nexport const doorOf = b => {\n  const d = defFor(b.type);\n  return { x: b.x + Math.floor((d.w - 1) / 2), y: b.y + d.h - 1 };\n};\nexport const frontOf = b => { const dd = doorOf(b); return { x: dd.x, y: dd.y + 1 }; };\nexport const footprintOf = b => { const d = defFor(b.type); return { x: b.x, y: b.y, w: d.w, h: d.h }; };\n\nexport function buildingAt(x, y) {\n  for (const b of builtList()) {\n    const d = defFor(b.type);\n    if (!d) continue;\n    if (x >= b.x n\nexport function invalidate() { cache.sig = null; }\n\nfunction ensureLayout(map) {\n  const sig = signature() + '|' + (map?.id || '-');\n  if (cache.sig === sig) return cache;\n  cache.sig = sig;\n  cache.lv = level();\n  cache.mapId = map?.id || '-';\n  buildSolids();\n  buildFinish(map);\n  buildPaths(map);\n  buildDecor(map);\n  buildVillagers();\n  return cache;\n}\n\nfunction buildSolids() {\n  cache.solid.clear();\n  cache.doors.clear();\n  for (const b of builtList()) {\n    const d = defFor(b.type);\n    if (!d) continue;\n    const dd = doorOf(b);\n    for (let yy = b.y; yy < b.y + d.h; yy++) {\n      for (let xx = b.x; xx < b.x + d.w; xx++) {\n        if (xx === dd.x && yy === dd.y) continue;      // doors are walkable\n        cache.solid.add(xx + ',' + yy);\n      }\n    }\n    cache.doors.set(dd.x + ',' + dd.y, b);\n  }\n}\n\n// Radius of finished ground, by village level. This one array is the single most\n// visible expression of progress in the whole game.\n// Deliberately smaller than the screen even at max level: a village that has paved\n// every tile in view has stopped reading as a village in a landscape.\nconst FINISH_R = [0, 2.2, 3.4, 4.6, 5.8, 7.0, 8.2, 9.4, 10.6, 11.6];\n\nfunction finishRadius(lv) { return FINISH_R[clamp(lv, 0, MAX_LEVEL)] || 0; }\n\nfunction buildFinish(map) {\n  cache.finish.length = 0;\n  cache.finishSet.clear();\n  const lv = cache.lv;\n  const c = plazaCentre();\n  const r = finishRadius(lv);\n  if (r <= 0) return;\n  const R2 = Math.ceil(r) + 1;\n  for (let y = c.y - R2; y <= c.y + R2; y++) {\n    for (let x = c.x - R2 - 3; x <= c.x + R2 + 3; x++) {\n      if (!inBounds(map, x, y)) continue;\n      // Wider than tall: the plaza reads better on a 16:9 screen.\n      const d = Math.hypot((x - c.x) * 0.72, (y - c.y) * 1.0);\n      // A soft, hashed edge so the boundary never looks like a compass circle.\n      const wobble = (hash2(x, y, 11) - 0.5) * 1.4;\n      const edge = (d + wobble) / r;\n      if (edge > 1) cont le hash, so\n  // the inner spots are always chosen first and never move.\n  const cands = [];\n  for (const t of cache.finish) {\n    const k = t.x + ',' + t.y;\n    if (cache.solid.has(k)) continue;\n    if (cache.pathSet.has(k)) continue;\n    if (t.x === c.x && t.y === c.y) continue;\n    const d = Math.hypot(t.x - c.x, t.y - c.y);\n    const nearPath = ['0,-1', '1,0', '0,1', '-1,0'].some(o => {\n      const [ox, oy] = o.split(',').map(Number);\n      return cache.pathSet.has((t.x + ox) + ',' + (t.y + oy));\n    });\n    cands.push({ x: t.x, y: t.y, d, nearPath, h: hash2(t.x, t.y, 3) });\n  }\n  cands.sort((a, b) => a.d - b.d || a.h - b.h);\n\n  const doorSpots = [];\n  for (const b of builtList()) {\n    const dd = doorOf(b);\n    for (const ox of [-1, 1]) {\n      const x = dd.x + ox, y = dd.y + 1;\n      if (!inBounds(map, x, y)) continue;\n      const k = x + ',' + y;\n      if (cache.solid.has(k) || cache.pathSet.has(k) || baseSolid(map, x, y)) continue;\n      doorSpots.push({ x, y, d: 0, nearPath: true, h: hash2(x, y, 5) });\n    }\n  }\n  doorSpots.sort((a, b) => a.h - b.h);\n\n  const pick = (where) => {\n    const pool = where === 'door' ? doorSpots : cands;\n    for (const s of pool) {\n      const k = s.x + ',' + s.y;\n      if (used.has(k)) continue;\n      if (where === 'path' && !s.nearPath) continue;\n      if (where === 'edge' && s.d < 2.2) continue;\n      used.add(k);\n      return s;\n    }\n    // Fall back to any free candidate rather than silently dropping decor.\n    for (const s of cands) {\n      const k = s.x + ',' + s.y;\n      if (!used.has(k)) { used.add(k); return s; }\n    }\n    return null;\n  };\n\n  for (const plan of DECOR_PLAN) {\n    if (plan.lv > lv) continue;\n    for (let i = 0; i < plan.n; i++) {\n      const s = pick(plan.where);\n      if (!s) break;\n      const item = { x: s.x, y: s.y, name: plan.name, lamp: !!plan.lamp, anim: plan.anim || 1 };\n      cache.decor.push(item);\n      if (item.lamp) cache.lamps.push(item);\n    }\n  }\n  // Player-placed decor from state (kept for future decorating tools).\n  for (const d of (S.village.decor || [])) {\n    if (d && typeof d.x === 'number') cache.decor.push({ x: d.x, y: d.y, name: d.name, lamp: !!d.lamp, anim: d.anim || 1 });\n  }\n}\n\n// --- villagers ---------------------------------------------------------------\n// Who lives here is derived from what's built: every building that attracts\n// somebody puts them on the street. More buildings + higher tiers = a busier village.\nconst villagers = [];\nlet villagerSig = null;\nlet villagerTick = -1;\n\nfunction rosterFor() {\n  const lv = cache.lv;\n  const out = [];\n  for (const b of builtList()) {\n    const def = defFor(b.type);\n    if (!def?.villager) continue;\n    const n = def.id === 'cottage' ? Math.min(3, b.tier) : (b.tier >= 2 ? 2 : 1);\n    for (let i = 0; i < n; i++) out.push({ who: def.villager, home: frontOf(b), idx: i });\n  }\n  if (lv >= 2) out.push({ who: 'mayor', home: plazaCentre(), idx: 0 });\n  if (lv >= 2) out.push({ who: 'kid', home: plazaCentre(), idx: 1 });\n  if (lv >= 4) out.push({ who: 'twin', home: plazaCentre(), idx: 2 });\n  if (lv >= 5) out.push({ who: 'weaver', home: plazaCentre(), idx: 3 });\n  return out.slice(0, 12);\n}\n\nfunction buildVillagers() {\n  const roster = rosterFor();\n  const sig = roster.map(r => r.who + r.home.x + ',' + r.home.y + r.idx).join('|');\n  if (sig === villagerSig) return;\n  villagerSig = sig;\n  villagers.length = 0;\n  const rng = makeRng(1337);\n  roster.forEach((r, i) => {\n    const ox = rng.int(-2, 2), oy = rng.int(-1, 2);\n    villagers.push({\n      who: r.who,\n      x: r.home.x + ox, y: r.home.y + oy,\n      px: (r.home.x + ox) * TILE, py: (r.home.y + oy) * TILE,\n      tx: r.home.x + ox, ty: r.home.y + oy,\n      dir: DIRS[rng.int(0, 3)], moving: 0, wait: rng.int(20, 140),\n      home: r.home, radius: 3 + (i % 3), seed: 500 + i * 37, frame: 0,\n    });\n  });\n}\n\nfunction syncVillagers(map) {\n  const t = Loop.tick;\n  if (villagerTick === t) return;\n  const steps = villagerTick < 0 ? 1 : clamp(t - villagerTick, 0, 4);\n  villagerTick = t;\n  for (let s = 0; s < steps; s++) stepVillagers(map);\n}\n\nfunction stepVillagers(map) {\n  const STEP_FRAMES = 22;\n  for (const v of villagers) {\n    if (v.moving > 0) {\n      v.moving--;\n      const f = 1 - v.moving / STEP_FRAMES;\n      v.px = (v.x + (v.tx - v.x) * f) * TILE;\n      v.py = (v.y + (v.ty - v.y) * f) * TILE;\n      v.frame = Math.floor((1 - v.moving / STEP_FRAMES) * 4) % 4;\n      if (v.moving === 0) { v.x = v.tx; v.y = v.ty; v.px = v.x * TILE; v.py = v.y * TILE; v.frame = 0; }\n      continue;\n    }\n    if (v.wait > 0) { v.wait--; v.frame = 0; continue; }\n    // Choose a neighbouring tile inside the wander radius that isn't blocked.\n    const r = makeRng(v.seed = (v.seed * 1103515245 + 12345) >>> 0);\n    const order = r.shuffle(['up', 'down', 'left', 'right']);\n    for (const dir of order) {\n      const dx = dir === 'left' ? -1 : dir === 'right' ? 1 : 0;\n      const dy = dir === 'up' ? -1 : dir === 'down' ? 1 : 0;\n      const nx = v.x + dx, ny = v.y + dy;\n      if (Math.hypot(nx - v.home.x, ny - v.home.y) > v.radius) continue;\n      if (!inBounds(map, nx, ny)) continue;\n      if (cache.solid.has(nx + ',' + ny)) continue;\n      if (baseSolid(map, nx, ny)) continue;\n      v.dir = dir; v.tx = nx; v.ty = ny; v.moving = STEP_FRAMES;\n      break;\n    }\n    if (v.moving === 0) v.wait = 30 + (v.seed % 90);\n  }\n}\n\n// --- fallback art (so everything is judgeable before art lands) --------------\nconst fbCache = new Map();\nfunction fbCanvas(key, w, h, paint) {\n  let c = fbCache.get(key);\n  if (c) return c;\n  c = document.createElement('canvas');\n  c.width = w; c.height = h;\n  const ctx = c.getContext('2d');\n  ctx.imageSmoothingEnabled = false;\n  paint(ctx, w, h);\n  fbCache.set(key, c);\n  return c;\n}\n\nfunction groundFallback(kind, season) {\n  return fbCanvas('g:' + kind + ':' + season, TILE, TILE, (ctx) => {\n    const speck = (col, n, seed) => {\n      ctx.fillStyle = col;\n      for (let i = 0; i < n; i++) {\n        const h1 = hash2(i, seed, 1), h2 = hash2(seed, i, 2);\n        ctx.fillRect(Math.floor(h1 * 16), Math.floor(h2 * 16), 1, 1);\n      }\n    };\n    if (kind === 'grass') {\n      ctx.fillStyle = seasonize(P.grass1, season); ctx.fillRect(0, 0, 16, 16);\n      speck(seasonize(P.grass2, season), 26, 7);\n      speck(seasonize(P.grass0, season), 14, 9);\n    } else if (kind === 'gravel') {\n      ctx.fillStyle = P.soil0; ctx.fillRect(0, 0, 16, 16);\n      speck(P.soil1, 40, 3); speck(P.sand1, 22, 4); speck(P.soil2, 12, 8);\n    } else if (kind === 'cobble') {\n      ctx.fillStyle = P.rock3; ctx.fillRect(0, 0, 16, 16);\n      for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {\n        const o = (y % 2) * 2;\n        const cx = ((x * 4 + o) % 16), cy = y * 4;\n        ctx.fillStyle = hash2(cx, cy, 6) > 0.5 ? P.rock1 : P.rock2;\n        ctx.fillRect(cx, cy, 3, 3);\n        ctx.fillStyle = P.rock0;\n        ctx.fillRect(cx, cy, 3, 1);\n      }\n    } else if (kind === 'plaza' || kind === 'plazaEdge') {\n      ctx.fillStyle = P.sand3; ctx.fillRect(0, 0, 16, 16);\n      for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++) {\n        ctx.fillStyle = (x + y) % 2 ? P.sand1 : P.sand0;\n        ctx.fillRect(x * 8, y * 8, 7, 7);\n        ctx.fillStyle = P.sand2;\n        ctx.fillRect(x * 8, y * 8 + 6, 7, 1);\n      }\n      if (kind === 'plazaEdge') { ctx.fillStyle = P.sand3; ctx.fillRect(0, 14, 16, 2); }\n    } else { // path\n      ctx.fillStyle = P.sand2; ctx.fillRect(0, 0, 16, 16);\n      speck(P.sand1, 30, 5); speck(P.sand3, 16, 6);\n    }\n  });\n}\n\nfunction buildingPlaceholder(def, tier) {\n  const w = def.w * TILE, h = (def.h + def.overhang) * TILE;\n  return fbCanvas(`b:${def.id}:${tier}`, w, h, (ctx) => {\n    ctx.fillStyle = '#ff33cc';\n    ctx.fillRect(0, 0, w, h);\n    ctx.fillStyle = '#9c0072';\n    for (let y = 0; y < h; y += 4) for (let x = (y / 4 % 2) * 4; x < w; x += 8) ctx.fillRect(x, y, 4, 2);\n    ctx.fillStyle = '#2b2118';\n    ctx.fillRect(0, 0, w, 1); ctx.fillRect(0, h - 1, w, 1);\n    ctx.fillRect(0, 0, 1, h); ctx.fillRect(w - 1, 0, 1, h);\n    // Footprint / overhang divider so the sort origin is obvious while art is missing.\n    ctx.fillStyle = '#ffffff';\n    ctx.globalAlpha = 0.55;\n    ctx.fillRect(0, def.overhang * TILE, w, 1);\n    ctx.globalAlpha = 1;\n  });\n}\n\nconst DECOR_FB = {\n  't.lamp': (ctx, lit) => {\n    ctx.fillStyle = P.wood3; ctx.fillRect(7, 5, 2, 11);\n    ctx.fillStyle = P.rock3; ctx.fillRect(6, 15, 4, 1);\n    ctx.fillStyle = lit ? P.gold0 : P.rock1; ctx.fillRect(5, 2, 6, 4);\n    ctx.fillStyle = P.wood4; ctx.fillRect(5, 1, 6, 1);\n  },\n  't.planter': (ctx) => {\n    ctx.fillStyle = P.wood2; ctx.fillRect(2, 8, 12, 7);\n    ctx.fillStyle = P.wood1; ctx.fillRect(2, 8, 12, 2);\n    ctx.fillStyle = P.soil2; ctx.fillRect(3, 10, 10, 2);\n    ctx.fillStyle = P.leaf1; ctx.fillRect(4, 6, 2, 4); ctx.fillRect(8, 5, 2, 5); ctx.fillRect(11, 7, 2, 3);\n    ctx.fillStyle = P.bloom1; ctx.fillRect(8, 3, 2, 2); ctx.fillRect(4, 4, 2, 2);\n  },\n  't.bench': (ctx) => {\n    ctx.fillStyle = P.wood1; ctx.fillRect(1, 9, 14, 3);\n    ctx.fillStyle = P.wood2; ctx.fillRect(1, 5, 14, 2);\n    ctx.fillStyle = P.wood3; ctx.fillRect(2, 12, 2, 3); ctx.fillRect(12, 12, 2, 3);\n    ctx.fillStyle = P.wood3; ctx.fillRect(2, 6, 1, 4); ctx.fillRect(13, 6, 1, 4);\n  },\n  't.banner': (ctx, lit, f) => {\n    const sway = [0, 1, 0, -1][f % 4] || 0;\n    ctx.fillStyle = P.wood3; ctx.fillRect(3, 0, 2, 16);\n    ctx.fillStyle = P.roof1; ctx.fillRect(5 + sway, 2, 8, 8);\n    ctx.fillStyle = P.roof0; ctx.fillRect(5 + sway, 2, 8, 2);\n    ctx.fillStyle = P.gold1; ctx.fillRect(8 + sway, 5, 2, 2);\n    ctx.fillStyle = P.roof2;\n    ctx.fillRect(5 + sway, 10, 3, 2); ctx.fillRect(10 + sway, 10, 3, 2);\n  },\n  't.flowerpot': (ctx) => {\n    ctx.fillStyle = P.soil1; ctx.fillRect(5, 10, 6, 5);\n    ctx.fillStyle = P.soil0; ctx.fillRect(4, 9, 8, 2);\n    ctx.fillStyle = P.leaf2; ctx.fillRect(7, 6, 2, 4);\n    ctx.fillStyle = P.bloom1; ctx.fillRect(6, 4, 4, 3);\n    ctx.fillStyle = P.bloom0; ctx.fillRect(7, 5, 2, 1);\n  },\n  't.laundry': (ctx, lit, f) => {\n    const s = [0, 1, 1, 0][f % 4] || 0;\n    ctx.fillStyle = P.wood3; ctx.fillRect(0, 3, 16, 1);\n    ctx.fillStyle = P.paper0; ctx.fillRect(2, 4, 4, 6 + s);\n    ctx.fillStyle = P.roofB0; ctx.fillRect(7, 4, 3, 5 - s);\n    ctx.fillStyle = P.bloom0; ctx.fillRect(11, 4, 4, 6);\n  },\n  't.mailbox': (ctx) => {\n    ctx.fillStyle = P.wood3; ctx.fillRect(7, 8, 2, 8);\n    ctx.fillStyle = P.roofB1; ctx.fillRect(4, 4, 8, 5);\n    ctx.fillStyle = P.roofB0; ctx.fillRect(4, 4, 8, 1);\n    ctx.fillStyle = P.gold2; ctx.fillRect(11, 5, 1, 3);\n  },\n  't.cart': (ctx) => {\n    ctx.fillStyle = P.wood2; ctx.fillRect(1, 6, 14, 6);\n    ctx.fillStyle = P.wood1; ctx.fillRect(1, 6, 14, 2);\n    ctx.fillStyle = P.wood4; ctx.fillRect(3, 12, 4, 4); ctx.fillRect(9, 12, 4, 4);\n    ctx.fillStyle = P.sand1; ctx.fillRect(4, 3, 8, 3);\n  },\n  't.beehive': (ctx, lit, f) => {\n    ctx.fillStyle = P.gold3; ctx.fillRect(3, 5, 10, 10);\n    ctx.fillStyle = P.gold2; ctx.fillRect(3, 5, 10, 3); ctx.fillRect(3, 11, 10, 2);\n    ctx.fillStyle = P.ink; ctx.fillRect(7, 12, 2, 2);\n    ctx.fillStyle = P.spark1; ctx.fillRect(2 + (f % 3), 3, 1, 1); ctx.fillRect(13 - (f % 2), 6, 1, 1);\n  },\n  't.well': (ctx) => {\n    ctx.fillStyle = P.rock2; ctx.fillRect(2, 8, 12, 7);\n    ctx.fillStyle = P.rock1; ctx.fillRect(2, 8, 12, 2);\n    ctx.fillStyle = P.water3; ctx.fillRect(4, 10, 8, 3);\n    ctx.fillStyle = P.wood3; ctx.fillRect(3, 1, 1, 8); ctx.fillRect(12, 1, 1, 8);\n    ctx.fillStyle = P.roof2; ctx.fillRect(1, 0, 14, 3);\n  },\n};\n\nfunction decorFallback(name, lit, frame) {\n  const painter = DECOR_FB[name];\n  return fbCanvas(`d:${name}:${lit ? 1 : 0}:${frame}`, TILE, TILE, (ctx) => {\n    if (painter) { painter(ctx, lit, frame); return; }\n    ctx.fillStyle = P.wood2; ctx.fillRect(3, 6, 10, 9);\n    ctx.fillStyle = P.wood1; ctx.fillRect(3, 6, 10, 2);\n    ctx.fillStyle = P.wood4; ctx.fillRect(3, 10, 10, 1);\n  });\n}\n\nconst CHAR_TINT = {\n  mayor: P.violet2, gran: P.bloom2, kid: P.spark2, farmer: P.leaf2, smith: P.rock3,\n  baker: P.roof1, fisher: P.water3, ranger: P.leaf3, weaver: P.violet1,\n  peddler: P.gold2, twin: P.roofB1, hero: P.roof2, rival: P.ink2,\n};\n\nfunction charFallback(who, dir, frame) {\n  const col = CHAR_TINT[who] || P.wood2;\n  return fbCanvas(`c:${who}:${dir}:${frame}`, 16, 24, (ctx) => {\n    const bob = frame === 1 ? -1 : frame === 3 ? 1 : 0;\n    ctx.fillStyle = 'rgba(0,0,0,0.22)';\n    ctx.fillRect(4, 22, 8, 2);\n    ctx.fillStyle = col;\n    ctx.fillRect(4, 12 + bob, 8, 10);\n    ctx.fillStyle = mix(col, '#ffffff', 0.25);\n    ctx.fillRect(4, 12 + bob, 8, 2);\n    ctx.fillStyle = P.sand0;\n    ctx.fillRect(4, 5 + bob, 8, 8);\n    ctx.fillStyle = P.ink;\n    if (dir !== 'up') { ctx.fillRect(6, 9 + bob, 1, 1); ctx.fillRect(9, 9 + bob, 1, 1); }\n    ctx.fillStyle = mix(col, '#000000', 0.35);\n    ctx.fillRect(3, 3 + bob, 10, 3);\n    ctx.fillStyle = P.ink2;\n    ctx.fillRect(4, 22 + Math.min(0, bob), 3, 2); ctx.fillRect(9, 22 + Math.min(0, bob), 3, 2);\n  });\n}\n\n// --- immediate-mode painters -------------------------------------------------\n// These draw straight to a ctx so both the Hooks (via R.layer) and my own scenes\n// (which need clipping and a camera they control) can use exactly the same code.\n\nconst season = () => S.clock?.season || 'spring';\nexport const isNight = () => { const h = S.clock?.hour ?? 12; return h >= 19 || h < 6; };\nconst nightAmount = () => {\n  const h = S.clock?.hour ?? 12;\n  if (h >= 20 || h < 5) return 1;\n  if (h >= 18) return (h - 18) / 2;\n  if (h < 6) return 1 - (h - 5);\n  return 0;\n};\n\nfunction tileImg(name, frame = 0) { return Atlas.tryGet(name, frame); }\n\nexport function paintBase(ctx, map, cam, view) {\n  const x0 = Math.floor(cam.x / TILE) - 1, y0 = Math.floor(cam.y / TILE) - 1;\n  const x1 = Math.ceil((cam.x + view.w) / TILE) + 1, y1 = Math.ceil((cam.y + view.h) / TILE) + 1;\n  const sea = season();\n  for (let y = y0; y <= y1; y++) {\n    for (let x = x0; x <= x1; x++) {\n      const sx = x * TILE - cam.x, sy = y * TILE - cam.y;\n      if (!inBounds(map, x, y)) { ctx.fillStyle = P.leaf4; ctx.fillRect(sx, sy, TILE, TILE); continue; }\n      const real = baseTile(map, x, y, 'ground');\n      let img = real ? tileImg(real) : null;\n      if (!img) {\n        const v = hash2(x, y, 21);\n        const alt = v > 0.86 ? 't.grass.c' : v > 0.68 ? 't.grass.b' : v > 0.42 ? 't.grass.a' : 't.grass';\n        img = tileImg(alt);\n      }\n      if (img) ctx.drawImage(img, sx, sy);\n      else ctx.drawImage(groundFallback('grass', sea), sx, sy);\n    }\n  }\n}\n\nexport function paintFinish(ctx, map, cam, view) {\n  const sea = season();\n  for (const t of cache.finish) {\n    const sx = t.x * TILE - cam.x, sy = t.y * TILE - cam.y;\n    if (sx < -TILE || sy < -TILE || sx > view.w || sy > view.h) continue;\n    const name = t.mat === 'plaza' ? 't.plaza' : t.mat === 'plazaEdge' ? 't.plaza.edge'\n      : t.mat === 'cobble' ? 't.cobble' : 't.gravel';\n    const img = tileImg(name);\n    if (img) ctx.drawImage(img, sx, sy);\n    else ctx.drawImage(groundFallback(t.mat, sea), sx, sy);\n  }\n}\n\nexport function paintPaths(ctx, map, cam, view) {\n  const lv = cache.lv;\n  for (const t of cache.paths) {\n    const sx = t.x * TILE - cam.x, sy = t.y * TILE - cam.y;\n    if (sx < -TILE || sy < -TILE || sx > view.w || sy > view.h) continue;\n    let img = lv >= 2 ? tileImg(`t.path.m${t.mask}`) : null;\n    if (!img) img = tileImg('t.path.m15');\n    if (img) ctx.drawImage(img, sx, sy);\n    else ctx.drawImage(groundFallback(lv >= 3 ? 'plaza' : 'path', season()), sx, sy);\n  }\n}\n\nexport function paintDecor(ctx, map, cam, view) {\n  const lit = isNight();\n  const f = Math.floor(Loop.tick / 14);\n  for (const d of cache.decor) {\n    const sx = d.x * TILE - cam.x, sy = d.y * TILE - cam.y;\n    if (sx < -TILE || sy < -TILE * 2 || sx > view.w || sy > view.h) continue;\n    const name = d.lamp && lit ? 't.lamp.lit' : d.name;\n    let img = tileImg(name, d.anim > 1 ? f % d.anim : 0);\n    if (!img && d.lamp) img = tileImg('t.lamp');\n    if (img) ctx.drawImage(img, sx, sy);\n    else ctx.drawImage(decorFallback(d.name, d.lamp && lit, f % 4), sx, sy);\n  }\n}\n\n/** One building, drawn with its bottom row on tile row (b.y + h - 1). */\nexport function drawBuilding(ctx, b, sx, sy, opts = {}) {\n  const def = defFor(b.type);\n  if (!def) return;\n  const tier = clamp(b.tier || 1, 1, def.tiers);\n  const img = Atlas.tryGet(def.sprite(tier));\n  const alpha = opts.alpha ?? 1;\n  const prev = ctx.globalAlpha;\n  if (alpha < 1) ctx.globalAlpha = alpha;\n  if (img) {\n    if (b.flip) {\n      ctx.save();\n      ctx.translate(sx + img.width, sy);\n      ctx.scale(-1, 1);\n      ctx.drawImage(img, 0, 0);\n      ctx.restore();\n    } else ctx.drawImage(img, sx, sy);\n  } else {\n    ctx.drawImage(buildingPlaceholder(def, tier), sx, sy);\n    ctx.globalAlpha = alpha;\n    R.text(def.id, sx + (def.w * TILE) / 2, sy + 3, { align: 'center', color: '#fff', shadow: '#000' });\n    R.text('t' + tier, sx + (def.w * TILE) / 2, sy + 13, { align: 'center', color: '#ffd0f4', shadow: '#000' });\n  }\n  ctx.globalAlpha = prev;\n}\n\nfunction chimneyOf(b, def) {\n  return {\n    x: b.x * TILE + (b.flip ? 4 : def.w * TILE - 10),\n    y: (b.y - def.overhang) * TILE - 6,\n  };\n}\n\nexport function paintBuildingExtras(ctx, b, cam, view) {\n  const def = defFor(b.type);\n  if (!def) return;\n  const lv = cache.lv;\n  // Chimney smoke: homes always, everything else once the village is properly alive.\n  const smokey = b.type === 'cottage' || b.type === 'kitchen' || b.type === 'bathhouse'\n    || (lv >= 4 && (b.type === 'workshop' || b.type === 'infirmary'));\n  if (smokey) {\n    const c = chimneyOf(b, def);\n    const sx = c.x - cam.x, sy = c.y - cam.y;\n    if (sx > -20 && sy > -24 && sx < view.w && sy < view.h) {\n      const f = Math.floor(Loop.tick / 9);\n      const img = Atlas.tryGet('fx.smoke', f % 4);\n      if (img) ctx.drawImage(img, sx - 8, sy - 8);\n      else {\n        const prev = ctx.globalAlpha;\n        for (let i = 0; i < 3; i++) {\n          const t = ((Loop.tick / 3 + i * 12) % 36) / 36;\n          ctx.globalAlpha = (1 - t) * 0.45;\n          ctx.fillStyle = P.rock0;\n          const r = 2 + t * 3;\n          ctx.fillRect(Math.round(sx + Math.sin(t * 5 + i) * 3 - r / 2), Math.round(sy - t * 18), Math.round(r), Math.round(r));\n        }\n        ctx.globalAlpha = prev;\n      }\n    }\n  }\n}\n\nexport function paintVillagers(ctx, map, cam, view, sortEntity) {\n  syncVillagers(map);\n  for (const v of villagers) {\n    const sx = Math.round(v.px - cam.x), sy = Math.round(v.py - cam.y) - 8;\n    if (sx < -20 || sy < -28 || sx > view.w + 4 || sy > view.h + 4) continue;\n    const img = Atlas.tryGet(`c.${v.who}.${v.dir}`, v.frame)\n      || Atlas.tryGet(`c.${v.who}.down`, v.frame);\n    const draw = (c) => {\n      const sh = Atlas.tryGet('fx.shadow');\n      if (sh) { const p = c.globalAlpha; c.globalAlpha = 0.5; c.drawImage(sh, sx, sy + 18); c.globalAlpha = p; }\n      if (img) c.drawImage(img, sx, sy);\n      else c.drawImage(charFallback(v.who, v.dir, v.frame), sx, sy);\n    };\n    if (sortEntity) sortEntity(v.py + 16, draw);\n    else draw(ctx);\n  }\n}\n\n/** Warm windows and lamp pools after dark. Drawn additively, above everything. */\nexport function paintLights(ctx, map, cam, view) {\n  const n = nightAmount();\n  if (n <= 0.02) return;\n  const saveCtx = ctx;\n  for (const l of cache.lamps) {\n    const sx = l.x * TILE - cam.x + 8, sy = l.y * TILE - cam.y + 4;\n    if (sx < -30 || sy < -30 || sx > view.w + 30 || sy > view.h + 30) continue;\n    glowAt(saveCtx, sx, sy, 26, '#ffd79a', 0.4 * n);\n  }\n  for (const b of builtList()) {\n    const def = defFor(b.type);\n    if (!def) continue;\n    const sx = b.x * TILE - cam.x + def.w * TILE / 2;\n    const sy = (b.y - def.overhang * 0.4) * TILE - cam.y + 8;\n    if (sx < -40 || sy < -40 || sx > view.w + 40 || sy > view.h + 40) continue;\n    glowAt(saveCtx, sx, sy, 12 + def.w * 5 + (b.tier || 1) * 3, '#ffca7a', (0.16 + 0.06 * (b.tier || 1)) * n);\n  }\n}\n\nfunction glowAt(ctx, x, y, r, color, alpha) {\n  ctx.save();\n  ctx.globalCompositeOperation = 'lighter';\n  ctx.globalAlpha = alpha;\n  const g = ctx.createRadialGradient(x, y, 0, x, y, r);\n  g.addColorStop(0, color);\n  g.addColorStop(1, 'rgba(0,0,0,0)');\n  ctx.fillStyle = g;\n  ctx.fillRect(x - r, y - r, r * 2, r * 2);\n  ctx.restore();\n}\n\n// Reusable sort buffer — no per-frame allocation in the draw path.\nconst sortBuf = [];\n\n/**\n * Paint the whole village world immediately into `ctx`. Used by the build scene and\n * by the board's backdrop; the Hooks use the individual painters instead so the\n * world's own y-sorting stays in charge.\n */\nexport function paintVillage(ctx, cam, view, opts = {}) {\n  const map = opts.map || activeMap();\n  ensureState();\n  ensureLayout(map);\n  if (opts.base !== false) paintBase(ctx, map, cam, view);\n  paintFinish(ctx, map, cam, view);\n  paintPaths(ctx, map, cam, view);\n  paintDecor(ctx, map, cam, view);\n\n  sortBuf.length = 0;\n  for (const b of builtList()) {\n    const def = defFor(b.type);\n    if (!def) continue;\n    const sx = b.x * TILE - cam.x;\n    const sy = (b.y - def.overhang) * TILE - cam.y;\n    if (sx > view.w || sy > view.h || sx + def.w * TILE < 0 || sy + (def.h + def.overhang) * TILE < 0) continue;\n    sortBuf.push({ y: (b.y + def.h) * TILE, b, sx, sy });\n  }\n  sortBuf.sort((a, b) => a.y - b.y);\n  for (const it of sortBuf) {\n    drawBuilding(ctx, it.b, it.sx, it.sy, { alpha: opts.buildingAlpha ?? 1 });\n    paintBuildingExtras(ctx, it.b, cam, view);\n  }\n  paintVillagers(ctx, map, cam, view, null);\n  if (opts.lights !== false) paintLights(ctx, map, cam, view);\n  return map;\n}\n\n// --- placement validation ----------------------------------------------------\nconst vTiles = [];\n\n/**\n * Can `type` stand with its origin at (x, y)?\n * Returns { ok, reason, tiles:[{x,y,ok}] } — the per-tile flags drive the tile-by-tile\n * footprint outline in build mode, which is what makes placement feel tactile.\n */\nexport function validate(type, x, y, opts = {}) {\n  const def = defFor(type);\n  const map = opts.map || activeMap();\n  ensureState();\n  ensureLayout(map);\n  vTiles.length = 0;\n  if (!def) return { ok: false, reason: 'Unknown building.', tiles: vTiles };\n\n  let ok = true, reason = '';\n  const ignore = opts.ignoreId || null;\n  const player = opts.player || null;\n\n  const blockedBy = (xx, yy) => {\n    const b = buildingAt(xx, yy);\n    return b && b.id !== ignore ? b : null;\n  };\n\n  for (let yy = y; yy < y + def.h; yy++) {\n    for (let xx = x; xx < x + def.w; xx++) {\n      let tileOk = true, why = '';\n      if (!inBounds(map, xx, yy) || xx < 1 || yy < 1 || xx > (map.w - 2) || yy > (map.h - 2)) {\n        tileOk = false; why = 'Too close to the edge of the map.';\n      } else if (blockedBy(xx, yy)) {\n        tileOk = false; why = `A ${defFor(blockedBy(xx, yy).type)?.name || 'building'} is already here.`;\n      } else if (baseSolid(map, xx, yy)) {\n        tileOk = false; why = 'The ground here is taken — try a clear patch.';\n      } else if (player && player.x === xx && player.y === yy) {\n        tileOk = false; why = 'You are standing there!';\n      }\n      vTiles.push({ x: xx, y: yy, ok: tileOk });\n      if (!tileOk) { ok = false; if (!reason) reason = why; }\n    }\n  }\n  // Roof overhang must fit on the map too.\n  if (y - def.overhang < 0) { ok = false; reason = reason || 'The roof would hang off the map.'; }\n\n  // The door needs somewhere to open onto.\n  const dx = x + Math.floor((def.w - 1) / 2), dy = y + def.h;\n  if (ok) {\n    if (!inBounds(map, dx, dy) || blockedBy(dx, dy) || baseSolid(map, dx, dy)) {\n      ok = false; reason = 'The door needs a clear tile in front of it.';\n    }\n  }\n  if (ok) {\n    const r = ruleOk(type, x, y, {\n      hearth: plazaCentre(),\n      neighbours: (bx, by, bw, bh) => {\n        let n = 0;\n        for (let yy = by - 1; yy <= by + bh; yy++) {\n          for (let xx = bx - 1; xx <= bx + bw; xx++) {\n            if (xx >= bx && xx < bx + bw && yy >= by && yy < by + bh) continue;\n            const b = blockedBy(xx, yy);\n            if (b) n++;\n          }\n        }\n        return n;\n      },\n    });\n    if (!r.ok) { ok = false; reason = r.reason; }\n  }\n  return { ok, reason, tiles: vTiles, door: { x: dx, y: dy } };\n}\n\n/** First plot where `type` fits — where build mode starts its cursor. */\nexport function firstValidPlot(type, opts = {}) {\n  const def = defFor(type);\n  for (const p of plotList()) {\n    if (validate(type, p.x, p.y, opts).ok) return { x: p.x, y: p.y };\n  }\n  // Spiral out from the plaza looking for anywhere at all.\n  const c = plazaCentre();\n  for (let r = 2; r < 16; r++) {\n    for (let a = 0; a < 24; a++) {\n      const th = (a / 24) * Math.PI * 2;\n      const x = Math.round(c.x + Math.cos(th) * r * 1.3) - Math.floor(def.w / 2);\n      const y = Math.round(c.y + Math.sin(th) * r) - Math.floor(def.h / 2);\n      if (validate(type, x, y, opts).ok) return { x, y };\n    }\n  }\n  return { x: c.x - Math.floor(def.w / 2), y: c.y - def.h - 2 };\n}\n\n// --- mutation ----------------------------------------------------------------\nlet lastLevel = null;\n\nexport function recompute({ celebrate = true } = {}) {\n  ensureState();\n  const lv = level();\n  const prev = lastLevel === null ? (S.village.level || lv) : lastLevel;\n  S.village.level = lv;\n  lastLevel = lv;\n  invalidate();\n  if (celebrate && lv > prev) celebrateLevel(prev, lv);\n  return lv;\n}\n\nexport function celebrateLevel(from, to) {\n  Bus.emit(EV.VILLAGE_LEVEL, { level: to, from });\n  R.flash(P.gold0, 8);\n  R.shake(2, 12);\n  try { Audio.sfx('chime'); } catch {}\n  ringBell(3);\n  try { UIx.toast(`Village Level ${to}!`, { ms: 2800, icon: 'ui.star' }); } catch {}\n  if (Scenes.has('__villagelevel')) {\n    try { Scenes.push('__villagelevel', { from, to }); } catch {}\n  }\n}\n\n/** The bell tower answers when the village grows — if it's been built. */\nexport function ringBell(times = 1) {\n  if (!countOf('belltower')) return false;\n  for (let i = 0; i < times; i++) {\n    setTimeout(() => { try { Audio.sfx('chime', { rate: 0.55, gain: 1.3 }); } catch {} }, i * 420);\n  }\n  return true;\n}\n\n/** Commit a placement. Assumes cost has already been checked; charges it here. */\nexport function place(type, x, y, { flip = false, free = false } = {}) {\n  ensureState();\n  const def = defFor(type);\n  if (!def) return null;\n  const c = costToBuild(type);\n  if (!free && !Economy.spend(c, `built ${def.name}`)) return null;\n  const b = { id: 'b' + (S.village.nextId++), type, x, y, tier: 1, builtAt: S.clock?.day ?? 0, flip };\n  S.village.buildings.push(b);\n  S.stats && (S.stats.built = (S.stats.built || 0) + 1);\n  if (!S.village.unlocked.includes(type)) S.village.unlocked.push(type);\n  invalidate();\n  Bus.emit(EV.BUILDING_PLACED, { building: b, type, cost: c });\n  try { Hooks.missions.note('built', { type, tier: 1 }); } catch {}\n  recompute();\n  save();\n  return b;\n}\n\nexport function upgrade(b) {\n  ensureState();\n  const def = defFor(b.type);\n  if (!def) return false;\n  const tier = b.tier || 1;\n  if (tier >= def.tiers) return false;\n  const c = costToUpgrade(b.type, tier);\n  if (!Economy.spend(c, `upgraded ${def.name}`)) return false;\n  b.tier = tier + 1;\n  invalidate();\n  Bus.emit(EV.BUILDING_UPGRADED, { building: b, type: b.type, tier: b.tier, cost: c });\n  try { Hooks.missions.note('upgraded', { type: b.type, tier: b.tier }); } catch {}\n  recompute();\n  save();\n  return true;\n}\n\nexport function relocate(b, x, y) {\n  b.x = x; b.y = y;\n  invalidate();\n  recompute({ celebrate: false });\n  save();\n  return true;\n}\n\nexport function demolish(b) {\n  const i = S.village.buildings.indexOf(b);\n  if (i < 0 || b.type === 'hearthstone') return false;\n  S.village.buildings.splice(i, 1);\n  // Half the materials come back — never punish experimenting with the layout.\n  const def = defFor(b.type);\n  let coins = 0, hearth = 0;\n  for (let t = 0; t < (b.tier || 1); t++) { coins += def.costs[t].coins; hearth += def.costs[t].hearth; }\n  Economy.earn({ coins: Math.floor(coins / 2), hearth: Math.floor(hearth / 2) }, `salvaged ${def.name}`);\n  invalidate();\n  recompute({ celebrate: false });\n  save();\n  return true;\n}\n\nexport function unlock(type) {\n  ensureState();\n  if (!S.village.unlocked.includes(type)) {\n    S.village.unlocked.push(type);\n    setFlag('unlock.' + type, true);\n    invalidate();\n    return true;\n  }\n  return false;\n}\n\n// --- interaction -------------------------------------------------------------\nasync function openBuildingMenu(b) {\n  const def = defFor(b.type);\n  const tier = b.tier || 1;\n  await UIx.say(def.doorLine, { speaker: `${def.name}  Lv ${tier}` });\n  const canUp = tier < def.tiers;\n  const choices = [];\n  if (canUp) choices.push(`Upgrade to Level ${tier + 1}`);\n  choices.push('What does it do?');\n  if (b.type !== 'hearthstone') choices.push('Move it');\n  choices.push('Leave it be');\n  const pick = await UIx.ask('What would you like to do?', choices, { speaker: def.name });\n  let i = 0;\n  if (canUp && pick === i++) { Scenes.push('village', { tab: 'upgrade', focus: b.id }); return; }\n  if (pick === i++) {\n    const gives = benefitsFor(b.type, tier);\n    await UIx.sayMany([def.blurb, ...gives.map(g => '- ' + g)], { speaker: def.name });\n    return;\n  }\n  if (b.type !== 'hearthstone' && pick === i++) {\n    Scenes.push('build', { type: b.type, mode: 'relocate', movingId: b.id });\n    return;\n  }\n}\n\nasync function openPlot(plot) {\n  const yes = await UIx.confirm('An empty plot, waiting for something. Open the build menu?');\n  if (yes) Scenes.push('village', { tab: 'build', plot });\n}\n\n// --- Hooks -------------------------------------------------------------------\nconst HOOKS = {\n  applyTo(map) {\n    if (!map) return;\n    ensureState();\n    if (map.id !== VILLAGE_MAP && !map.village) return;\n    // Cooperate with the world if it has tagged a spot for the Hearthstone.\n    try {\n      if (map.tag && !S.village.__hearthPinned) {\n        for (let y = 0; y < map.h; y++) {\n          for (let x = 0; x < map.w; x++) {\n            if (map.tag(x, y) === 'hearth') {\n              const h = hearth();\n              h.x = x; h.y = y;\n              S.village.__hearthPinned = true;\n              y = map.h; break;\n            }\n          }\n        }\n      }\n    } catch { /* world still landing */ }\n    invalidate();\n    ensureLayout(map);\n    recompute({ celebrate: false });\n  },\n\n  drawGround(map, cam) {\n    if (!map || (map.id !== VILLAGE_MAP && !map.village)) return;\n    ensureState();\n    ensureLayout(map);\n    const c = cam || R.camera;\n    const view = { w: R.W, h: R.H };\n    R.layer(LAYER.MID, ctx => {\n      paintFinish(ctx, map, c, view);\n      paintPaths(ctx, map, c, view);\n      paintDecor(ctx, map, c, view);\n    });\n    R.layer(LAYER.WEATHER, ctx => paintLights(ctx, map, c, view));\n  },\n\n  drawSprites(map, cam, sortEntity) {\n    if (!map || (map.id !== VILLAGE_MAP && !map.village)) return;\n    ensureState();\n    ensureLayout(map);\n    const c = cam || R.camera;\n    const view = { w: R.W, h: R.H };\n    const push = sortEntity || ((y, fn) => R.sortEntity(y, fn));\n    for (const b of builtList()) {\n      const def = defFor(b.type);\n      if (!def) continue;\n      const sx = b.x * TILE - c.x;\n      const sy = (b.y - def.overhang) * TILE - c.y;\n      if (sx > view.w || sy > view.h || sx + def.w * TILE < 0 || sy + (def.h + def.overhang) * TILE < 0) continue;\n      push((b.y + def.h) * TILE, ctx => {\n        drawBuilding(ctx, b, sx, sy);\n        paintBuildingExtras(ctx, b, c, view);\n      });\n    }\n    paintVillagers(null, map, c, view, push);\n  },\n\n  solid(map, x, y) {\n    if (!map || (map.id !== VILLAGE_MAP && !map.village)) return false;\n    ensureState();\n    ensureLayout(map);\n    return cache.solid.has(x + ',' + y);\n  },\n\n  interact(map, x, y) {\n    if (!map || (map.id !== VILLAGE_MAP && !map.village)) return null;\n    ensureState();\n    ensureLayout(map);\n    const b = cache.doors.get(x + ',' + y) || buildingAt(x, y);\n    if (b) {\n      if (b.type === 'hearthstone') {\n        return async () => {\n          await UIx.say(defFor('hearthstone').doorLine, { speaker: 'Hearthstone' });\n          Scenes.push('village');\n        };\n      }\n      return async () => openBuildingMenu(b);\n    }\n    const plot = plotList().find(p => p.x === x && p.y === y);\n    if (plot) return async () => openPlot(plot);\n    return null;\n  },\n\n  level() { ensureState(); return level(); },\n\n  openBuildMode(type) {\n    ensureState();\n    if (!type) { Scenes.push('village', { tab: 'build' }); return; }\n    Scenes.push('build', { type });\n  },\n};\n\n// --- public model ------------------------------------------------------------\nexport const Village = {\n  VILLAGE_MAP, TILE, PLOTS,\n  ensureState, hearth, plazaCentre, doorOf, frontOf, footprintOf, buildingAt, plotList,\n  activeMap, level, levelFor, points, progress, unlocksAt, LEVEL_POINTS, MAX_LEVEL,\n  finishRadius, invalidate, ensureLayout, cache,\n  paintVillage, paintBase, paintFinish, paintPaths, paintDecor, paintVillagers,\n  paintLights, drawBuilding, buildingPlaceholder, groundFallback, decorFallback,\n  validate, firstValidPlot, place, upgrade, relocate, demolish, unlock,\n  recompute, celebrateLevel, ringBell, isNight,\n  get villagers() { return villagers; },\n  openBoard(params) { Scenes.push('village', params); },\n  openBuild(type, params) { Scenes.push('build', { type, ...params }); },\n};\n\n// --- register ---------------------------------------------------------------\nexport function register() {\n  ensureState();\n  lastLevel = level();\n  S.village.level = lastLevel;\n\n  defineVillageSfx();\n  Hooks.install('village', HOOKS);\n\n  // Missions and battles change the village's level; keep it honest and celebrate.\n  Bus.on(EV.MISSION_DONE, () => recompute());\n  Bus.on(EV.DAY_CHANGED, () => invalidate());\n  Bus.on(EV.SEASON_CHANGED, () => invalidate());\n\n  if (typeof window !== 'undefined') window.__village = Village;\n  return Village;\n}\n\nfunction defineVillageSfx() {\n  try {\n    Audio.defineSfx('build.hit', { voices: [\n      { noise: true, dur: 0.07, lp: 1400, gain: 0.16, curve: 2.2 },\n      { wave: 'triangle', f: 190, f2: 120, dur: 0.09, gain: 0.10 },\n    ] });\n    Audio.defineSfx('build.saw', { voices: [{ noise: true, dur: 0.22, hp: 1800, gain: 0.09, curve: 1.1 }] });\n    Audio.defineSfx('build.done', { voices: [\n      { wave: 'triangle', f: 523, dur: 0.10, gain: 0.13 },\n      { at: 0.09, wave: 'triangle', f: 659, dur: 0.10, gain: 0.13 },\n      { at: 0.18, wave: 'triangle', f: 784, dur: 0.20, gain: 0.14 },\n      { at: 0.18, wave: 'square', f: 1568, dur: 0.16, gain: 0.06 },\n    ] });\n    Audio.defineSfx('village.up', { voices: [\n      { wave: 'square', f: 523, dur: 0.10, gain: 0.11 },\n      { at: 0.10, wave: 'square', f: 659, dur: 0.10, gain: 0.11 },\n      { at: 0.20, wave: 'square', f: 784, dur: 0.10, gain: 0.12 },\n      { at: 0.30, wave: 'square', f: 1046, dur: 0.30, gain: 0.13 },\n    ] });\n    Audio.defineSfx('warm', { voices: [\n      { wave: 'triangle', f: 392, dur: 0.24, gain: 0.10 },\n      { at: 0.06, wave: 'triangle', f: 587, dur: 0.30, gain: 0.09 },\n    ] });\n  } catch { /* audio not ready is fine */ }\n}\n\nexport default Village;\n","deps":{"../core/renderer.js":"core/renderer.js","../core/scene.js":"core/scene.js","../core/loop.js":"core/loop.js","../art/atlas.js":"art/atlas.js","../art/palette.js":"art/palette.js","../core/rng.js":"core/rng.js","../core/events.js":"core/events.js","../core/bridge.js":"core/bridge.js","../core/audio.js":"core/audio.js","../state.js":"state.js","../core/util.js":"core/util.js","./economy.js":"village/economy.js","./buildings.js":"village/buildings.js"}},{"id":"village/buildui.js","code":"// Build mode and the village board.\n//\n// Littlewood's standard is the target: you always know what to build next, what it\n// costs, what it gives you, and what is still locked and why. Placement is tactile —\n// a ghost of the real building follows the cursor, green when it fits and red when it\n// does not, with the footprint outlined tile by tile. Upgrades show a literal\n// before/after so the transformation is the reward, not a number going up.\n\nimport { R, LAYER } from '../core/renderer.js';\nimport { Input } from '../core/input.js';\nimport { Scenes } from '../core/scene.js';\nimport { Atlas } from '../art/atlas.js';\nimport { Audio } from '../core/audio.js';\nimport { UIx, Hooks } from '../core/bridge.js';\nimport { Font } from '../core/font.js';\nimport { S } from '../state.js';\nimport { P, mix, shade } from '../art/palette.js';\nimport { clamp, ease, TILE } from '../core/util.js';\nimport { Village } from './village.js';\nimport {\n  DEFS, defFor, buildRow, costToBuild, costToUpgrade, benefitsFor, gainsFrom,\n  builtList, builtOf, countOf, bestTier, unlockState, placeNote, discountPct, CATEGORY,\n} from './buildings.js';\nimport { Economy } from './economy.js';\n\nconst money = c => `${c.coins || 0}c${c.hearth ? `  ${c.hearth}h` : ''}`;\n\n// ============================================================ the village board\nconst TABS = [{ id: 'build', label: 'Build' }, { id: 'upgrade', label: 'Upgrade' }, { id: 'village', label: 'Village' }];\n\nfunction boardScene(params) {\n  let tab = Math.max(0, TABS.findIndex(t => t.id === (params?.tab || 'build')));\n  let sel = 0, scroll = 0, t = 0, busy = false;\n  let rows = [];\n\n  function refresh() {\n    const lv = Village.level();\n    if (TABS[tab].id === 'build') {\n      rows = DEFS.map(d => ({ kind: 'build', def: d, ...buildRow(d.id, lv) }));\n    } else if (TABS[tab].id === 'upgrade') {\n      rows = builtList()\n        .map(b => ({ kind: 'upgrade', b, def: defFor(b.type) }))\n        .filter(r => r.def && (r.b.tier || 1) < r.def.tiers)\n        .map(r => ({ ...r, cost: costToUpgrade(r.b.type, r.b.tier || 1) }));\n    } else rows = [];\n    sel = clamp(sel, 0, Math.max(0, rows.length - 1));\n    const vis = 5;\n    if (sel < scroll) scroll = sel;\n    if (sel >= scroll + vis) scroll = sel - vis + 1;\n  }\n\n  async function activate() {\n    const row = rows[sel];\n    if (!row) return;\n    busy = true;\n    try {\n      if (row.kind === 'build') {\n        if (row.state === 'locked') {\n          await UIx.say(row.lock.reason || `Not yet. ${row.def.name} opens up later.`, { speaker: row.def.name });\n          return;\n        }\n        if (row.state === 'full') {\n          await UIx.say(`You already have as many as Emberhollow can support right now.`, { speaker: row.def.name });\n          return;\n        }\n        if (!row.affordable) {\n          Audio.sfx('deny');\n          await UIx.say(`That needs ${money(row.cost)}. Not yet — but soon.`, { speaker: row.def.name });\n          return;\n        }\n        Scenes.replace('build', { type: row.def.id });\n        return;\n      }\n      // upgrade\n      const ok = await Scenes.pushAsync('upgradecard', { b: row.b });\n      if (ok) refresh();\n    } finally { busy = false; }\n  }\n\n  function update() {\n    t++;\n    if (busy || UIx.busy) return;\n    if (Input.pressed('b')) { Audio.sfx('cancel'); Scenes.pop(); return; }\n    if (Input.pressed('left')) { tab = (tab + TABS.length - 1) % TABS.length; sel = 0; scroll = 0; Audio.sfx('cursor'); refresh(); }\n    if (Input.pressed('right')) { tab = (tab + 1) % TABS.length; sel = 0; scroll = 0; Audio.sfx('cursor'); refresh(); }\n    if (rows.length) {\n      if (Input.pressed('down')) { sel = (sel + 1) % rows.length; Audio.sfx('cursor'); refresh(); }\n      if (Input.pressed('up')) { sel = (sel + rows.length - 1) % rows.length; Audio.sfx('cursor'); refresh(); }\n    }\n    if (Input.pressed('a')) activate();\n  }\n\n  function render() {\n    R.layer(LAYER.GROUND, () => {\n      R.rect(0, 0, R.W, R.H, mix(P.wood4, P.ink, 0.45));\n      R.rect(0, 0, R.W, 24, mix(P.ink, P.wood4, 0.5));\n      R.rect(0, 23, R.W, 1, P.gold3);\n    });\n    R.layer(LAYER.UI, () => {\n      header();\n      if (TABS[tab].id === 'village') villagePage();\n      else { list(); detail(); }\n      R.rect(0, R.H - 12, R.W, 12, mix(P.ink, P.wood4, 0.5));\n      R.text('◀ ▶ tabs    A select    B back', 6, R.H - 10, { color: P.ui1 });\n    });\n  }\n\n  function header() {\n    const lv = Village.level();\n    R.text('EMBERHOLLOW', 8, 6, { color: P.gold1 });\n    R.text(`Level ${lv}`, 96, 6, { color: P.gold0 });\n    const c = Atlas.tryGet('ui.coin'); if (c) R.blit(c, R.W - 108, 5);\n    R.text(String(S.coins), R.W - 95, 6, { color: P.gold0 });\n    const h = Atlas.tryGet('ui.hearth'); if (h) R.blit(h, R.W - 56, 5);\n    R.text(String(S.hearth), R.W - 43, 6, { color: P.ember0 });\n\n    let tx = 8;\n    TABS.forEach((tb, i) => {\n      const w = Font.measure(tb.label), on = i === tab;\n      if (on) R.rect(tx - 3, 24, w + 6, 10, P.gold3);\n      R.text(tb.label, tx, 25, { color: on ? P.gold0 : P.ui2 });\n      tx += w + 12;\n    });\n  }\n\n  function list() {\n    const X = 8, Y = 38, W = 150, H = 118;\n    UIx.panel(X - 2, Y - 2, W + 4, H + 4, 'paper');\n    if (!rows.length) {\n      R.text(TABS[tab].id === 'upgrade' ? 'Nothing to upgrade yet.' : 'Nothing available.',\n        X + 8, Y + 14, { color: P.ink3, shadow: false });\n      return;\n    }\n    for (let i = 0; i < 5; i++) {\n      const idx = scroll + i, row = rows[idx];\n      if (!row) break;\n      const y = Y + 2 + i * 23, on = idx === sel;\n      const locked = row.kind === 'build' && row.state === 'locked';\n      const poor = row.kind === 'build' && row.state === 'poor';\n      R.rect(X, y, W - 4, 21, on ? mix(P.gold1, P.paper0, 0.5) : P.paper1);\n      R.rect(X, y, 2, 21, CATEGORY?.[row.def.cat]?.color || P.gold2);\n      if (on) {\n        const c = Atlas.tryGet('ui.cursor');\n        if (c) R.blit(c, X - 8, y + 5 + Math.sin(t / 9) * 0.6);\n      }\n      const label = row.kind === 'upgrade'\n        ? `${row.def.name}  ${row.b.tier}→${row.b.tier + 1}` : row.def.name;\n      R.text(label, X + 7, y + 2, { color: locked ? P.ui2 : P.ink2, shadow: false });\n      if (locked) {\n        const b = Atlas.tryGet('ui.badge.lock'); if (b) R.blit(b, X + W - 18, y + 2);\n        // Say WHY it is locked — a grey row with no explanation is the thing\n        // Littlewood never does.\n        const why = row.lock.reason || 'locked';\n        R.text(why.length > 30 ? why.slice(0, 29) + '…' : why, X + 7, y + 11,\n          { color: P.ui2, shadow: false });\n      } else {\n        R.text(money(row.cost || { coins: 0 }), X + W - 8, y + 11,\n          { color: poor ? P.hpBad : P.ink3, shadow: false, align: 'right' });\n        if (row.kind === 'build' && row.have > 0) {\n          R.text(`have ${row.have}/${row.cap}`, X + 7, y + 11, { color: P.ui2, shadow: false });\n        }\n      }\n    }\n  }\n\n  function detail() {\n    const X = 164, W = R.W - X - 8, Y = 38, H = 118;\n    UIx.panel(X, Y, W, H, 'paper');\n    const row = rows[sel];\n    if (!row) return;\n    const def = row.def;\n    const tier = row.kind === 'upgrade' ? (row.b.tier || 1) + 1 : 1;\n\n    // Preview of what you'd actually get.\n    const img = Atlas.tryGet(`b.${def.id}.t${Math.min(def.tiers, tier)}`);\n    if (img) {\n      const s = Math.min(1, 46 / Math.max(img.width, img.height));\n      R.blit(img, X + W / 2 - (img.width * s) / 2, Y + 6, { w: img.width * s, h: img.height * s });\n    }\n    let y = Y + 56;\n    R.text(def.name, X + W / 2, y, { color: P.ink, shadow: false, align: 'center' }); y += 12;\n    for (const l of Font.wrap(def.blurb || placeNote(def.id), W - 14).slice(0, 3)) {\n      R.text(l, X + 7, y, { color: P.ink3, shadow: false }); y += 10;\n    }\n    y += 2;\n    R.rect(X + 6, y, W - 12, 1, P.ui1); y += 4;\n    R.text(row.kind === 'upgrade' ? 'Gains' : 'Gives you', X + 7, y, { color: P.ui2, shadow: false }); y += 11;\n    const gains = row.kind === 'upgrade' ? gainsFrom(def.id, row.b.tier || 1) : benefitsFor(def.id, 1);\n    const bottom = Y + H - 4;\n    for (const g of (gains || [])) {\n      // Wrap and clip to the panel — benefit text runs long and used to spill off-screen.\n      for (const l of Font.wrap('· ' + g, W - 14)) {\n        if (y + 9 > bottom) return;\n        R.text(l, X + 7, y, { color: P.leaf3, shadow: false });\n        y += 9;\n      }\n    }\n  }\n\n  function villagePage() {\n    const X = 8, Y = 38, W = R.W - 16, H = 118;\n    UIx.panel(X, Y, W, H, 'paper');\n    const lv = Village.level();\n    const prog = Village.progress ? Village.progress() : null;\n    R.text(`Emberhollow, Level ${lv}`, X + 8, Y + 6, { color: P.ink, shadow: false });\n\n    // Progress toward the next level — never a mystery number.\n    const bw = W - 20;\n    R.rect(X + 8, Y + 20, bw, 6, P.ui1);\n    const frac = prog ? clamp(prog.frac ?? 0, 0, 1) : 0;\n    R.rect(X + 8, Y + 20, Math.round(bw * frac), 6, P.gold2);\n    R.rect(X + 8, Y + 20, Math.round(bw * frac), 1, P.gold0);\n    R.text(prog ? `${prog.have ?? Village.points()} / ${prog.need ?? '—'} toward level ${Math.min(lv + 1, Village.MAX_LEVEL)}`\n      : `${Village.points()} points`, X + 8, Y + 30, { color: P.ink3, shadow: false });\n\n    const stats = [\n      ['Buildings', String(builtList().length)],\n      ['Missions done', String((S.missions?.done || []).length)],\n      ['Guardians bonded', String(S.stats?.bonded || 0)],\n      ['Workshop discount', discountPct() ? discountPct() + '%' : '—'],\n    ];\n    stats.forEach(([k, v], i) => {\n      const yy = Y + 46 + i * 12;\n      R.text(k, X + 10, yy, { color: P.ink3, shadow: false });\n      R.text(v, X + W - 10, yy, { color: P.ink2, shadow: false, align: 'right' });\n    });\n\n    const next = Village.unlocksAt ? Village.unlocksAt(lv + 1) : null;\n    if (next && next.length) {\n      R.text('Next level opens: ' + next.slice(0, 3).join(', '), X + 10, Y + H - 18,\n        { color: P.gold3, shadow: false });\n    }\n  }\n\n  return { enter() { Village.ensureState(); refresh(); }, update, render };\n}\n\n// ====================================================== upgrade before/after card\nfunction upgradeCardScene(params) {\n  const b = params?.b;\n  let t = 0, sel = 0, busy = false;\n  const def = b ? defFor(b.type) : null;\n  const tier = b?.tier || 1;\n  const cost = def ? costToUpgrade(b.type, tier) : null;\n  const can = cost ? Economy.canAfford(cost) : false;\n\n  async function confirm() {\n    if (!can) { Audio.sfx('deny'); return; }\n    busy = true;\n    try {\n      const ok = Village.upgrade(b);\n      if (ok) {\n        Audio.sfx('build.done');\n        R.flash('#fff6c4', 8);\n        UIx.toast(`${def.name} is now tier ${b.tier}`, { ms: 2200 });\n        await UIx.say(`${def.name} has grown. ${(gainsFrom(def.id, tier) || [])[0] || 'The village feels warmer.'}`,\n          { speaker: 'Emberhollow' });\n      }\n      Scenes.pop(ok);\n    } finally { busy = false; }\n  }\n\n  return {\n    drawsBelow: true,\n    update() {\n      t++;\n      if (busy || UIx.busy) return;\n      if (Input.pressed('b')) { Audio.sfx('cancel'); Scenes.pop(false); }\n      if (Input.pressed('left') || Input.pressed('right')) { sel = 1 - sel; Audio.sfx('cursor'); }\n      if (Input.pressed('a')) { if (sel === 0) confirm(); else { Audio.sfx('cancel'); Scenes.pop(false); } }\n    },\n    render() {\n      R.layer(LAYER.UI, () => {\n        R.rect(0, 0, R.W, R.H, 'rgba(12,10,18,0.62)');\n        const W = 244, H = 132, X = (R.W - W) / 2, Y = (R.H - H) / 2;\n        UIx.panel(X, Y, W, H, 'paper');\n        if (!def) { R.text('Nothing to upgrade.', X + 12, Y + 12, { color: P.ink2, shadow: false }); return; }\n\n        R.text(def.name, X + W / 2, Y + 8, { color: P.ink, shadow: false, align: 'center' });\n        R.text(`Level ${tier}  →  Level ${tier + 1}`, X + W / 2, Y + 20,\n          { color: P.gold3, shadow: false, align: 'center' });\n\n        // The literal before/after — this is the whole point of the card.\n        const before = Atlas.tryGet(`b.${def.id}.t${tier}`);\n        const after = Atlas.tryGet(`b.${def.id}.t${Math.min(def.tiers, tier + 1)}`);\n        const box = 52;\n        const drawAt = (img, cx) => {\n          if (!img) return;\n          const s = Math.min(1, box / Math.max(img.width, img.height));\n          R.blit(img, cx - (img.width * s) / 2, Y + 34 + (box - img.height * s),\n            { w: img.width * s, h: img.height * s });\n        };\n        drawAt(before, X + 56);\n        drawAt(after, X + W - 56);\n        const pulse = 0.6 + 0.4 * Math.sin(t / 10);\n        R.text('▶', X + W / 2 - 4, Y + 58, { color: P.gold2, shadow: false, alpha: pulse });\n        R.text('now', X + 56, Y + 90, { color: P.ui2, shadow: false, align: 'center' });\n        R.text('next', X + W - 56, Y + 90, { color: P.gold3, shadow: false, align: 'center' });\n\n        let y = Y + 100;\n        for (const g of (gainsFrom(def.id, tier) || []).slice(0, 2)) {\n          R.text('· ' + g, X + 12, y, { color: P.leaf3, shadow: false }); y += 10;\n        }\n        R.text(money(cost || { coins: 0 }), X + W - 12, Y + 100,\n          { color: can ? P.ink2 : P.hpBad, shadow: false, align: 'right' });\n\n        ['Upgrade', 'Not now'].forEach((label, i) => {\n          const bx = X + 14 + i * 78, by = Y + H - 18;\n          const on = i === sel;\n          R.rect(bx - 4, by - 3, 72, 14, on ? mix(P.gold1, P.paper0, 0.4) : P.paper1);\n          R.stroke(bx - 4, by - 3, 72, 14, on ? P.gold3 : P.ui1);\n          R.text(label, bx + 32, by, {\n            color: i === 0 && !can ? P.ui2 : P.ink2, shadow: false, align: 'center',\n          });\n        });\n      });\n    },\n  };\n}\n\n// ================================================================== build mode\nfunction buildModeScene(params) {\n  // Opened directly (?scene=build) there is no type; fall back to the first thing\n  // that is actually buildable so the screen is always inspectable.\n  const type = params?.type\n    || DEFS.find(d => buildRow(d.id, Village.level()).state === 'ready')?.id\n    || DEFS[1]?.id || DEFS[0]?.id;\n  const def = defFor(type);\n  let cx = 0, cy = 0, t = 0, busy = false;\n  let valid = { ok: false, reason: '', tiles: [] };\n  let raising = null;        // {t} construction animation\n\n  function recheck() {\n    if (!def) { valid = { ok: false, reason: 'Nothing to place.', tiles: [] }; return; }\n    const map = Hooks.world.currentMap?.() || null;\n    try { valid = Village.validate(type, cx, cy, { map }); }\n    catch { valid = { ok: false, reason: 'Step into the village to build.', tiles: [] }; }\n  }\n\n  function move(dx, dy) {\n    cx = clamp(cx + dx, 0, 200);\n    cy = clamp(cy + dy, 0, 200);\n    recheck();\n    Audio.sfx('cursor', { gain: 0.5 });\n  }\n\n  async function place() {\n    if (!valid.ok) { Audio.sfx('deny'); UIx.toast(valid.reason || 'It will not fit here.'); return; }\n    busy = true;\n    try {\n      raising = { t: 0 };\n      Audio.sfx('build.saw');\n      await waitFrames(14);\n      Audio.sfx('build.hit');\n      await waitFrames(14);\n      Audio.sfx('build.hit');\n      await waitFrames(12);\n      const b = Village.place(type, cx, cy);\n      if (!b) { Audio.sfx('deny'); raising = null; return; }\n      Audio.sfx('build.done');\n      R.flash('#fff6c4', 6);\n      R.shake(2, 8);\n      await waitFrames(18);\n      raising = null;\n      UIx.toast(`${def.name} raised`, { ms: 2200 });\n      await UIx.say(`${def.name} is standing. ${(benefitsFor(type, 1) || [])[0] || 'Emberhollow feels a little fuller.'}`,\n        { speaker: 'Emberhollow' });\n      Scenes.pop(true);\n    } finally { busy = false; }\n  }\n\n  return {\n    enter() {\n      Village.ensureState();\n      if (!def) { cx = 0; cy = 0; return; }\n      const map = Hooks.world.currentMap?.() || null;\n      let start = null;\n      try { start = Village.firstValidPlot(type, { map }); } catch { /* no map yet */ }\n      start = start || Village.plazaCentre() || { x: 21, y: 19 };\n      cx = start.x; cy = start.y;\n      recheck();\n    },\n    update() {\n      t++;\n      if (raising) raising.t++;\n      if (busy || UIx.busy) return;\n      if (Input.pressed('b')) { Audio.sfx('cancel'); Scenes.pop(false); return; }\n      if (!def) return;\n      const d = Input.dir();\n      if (Input.pressed('up')) move(0, -1);\n      else if (Input.pressed('down')) move(0, 1);\n      else if (Input.pressed('left')) move(-1, 0);\n      else if (Input.pressed('right')) move(1, 0);\n      if (Input.pressed('a')) place();\n      if (Input.pressed('select')) {\n        // Jump to the next suggested plot — never leave the player hunting.\n        const plots = Village.plotList();\n        const next = plots.find(p => p.x !== cx || p.y !== cy);\n        if (next) { cx = next.x; cy = next.y; recheck(); Audio.sfx('confirm'); }\n      }\n      // Keep the camera on the cursor so placement always reads in context.\n      R.centerOn(cx * TILE + (def ? def.w * 8 : 8), cy * TILE + (def ? def.h * 8 : 8),\n        Hooks.world.currentMap?.()?.bounds);\n    },\n    render() {\n      const cam = R.camera;\n      R.layer(LAYER.OVER, () => {\n        if (!def) return;\n        // Footprint, tile by tile, so the player can count the space.\n        for (let j = 0; j < def.h; j++) {\n          for (let i = 0; i < def.w; i++) {\n            const sx = (cx + i) * TILE - cam.x, sy = (cy + j) * TILE - cam.y;\n            const blocked = valid.tiles?.some?.(tl => tl.x === cx + i && tl.y === cy + j && tl.bad);\n            const col = valid.ok && !blocked ? 'rgba(126,217,87,0.32)' : 'rgba(232,86,63,0.34)';\n            R.rect(sx, sy, TILE, TILE, col);\n            R.stroke(sx, sy, TILE, TILE, valid.ok ? '#9bea6b' : '#ff9a8a');\n          }\n        }\n        // Ghost of the real building, so you see what you are actually placing.\n        const img = Atlas.tryGet(`b.${def.id}.t1`);\n        const gx = cx * TILE - cam.x, gy = (cy - def.overhang) * TILE - cam.y;\n        if (img) {\n          const bounce = raising ? Math.max(0, 1 - raising.t / 40) * 8 : Math.sin(t / 18) * 1;\n          R.blit(img, gx, gy - bounce, { alpha: raising ? Math.min(1, raising.t / 30) : 0.62 });\n        }\n        if (raising) {\n          const f = Atlas.tryGet('fx.build.frame');\n          if (f && raising.t < 34) {\n            for (let j = 0; j < def.h; j++) for (let i = 0; i < def.w; i++) {\n              R.blit(f, (cx + i) * TILE - cam.x, (cy + j) * TILE - cam.y, { alpha: 0.8 });\n            }\n          }\n          if (raising.t % 9 === 0) {\n            const d = Atlas.tryGet('fx.dust', (raising.t / 9) % 4);\n            if (d) R.blit(d, gx + def.w * 8 - 12, gy + def.h * 16);\n          }\n        }\n      });\n\n      R.layer(LAYER.UI, () => {\n        if (!def) return;\n        const H = 40;\n        UIx.panel(6, R.H - H - 4, R.W - 12, H, 'paper');\n        R.text(`Placing ${def.name}`, 14, R.H - H + 1, { color: P.ink, shadow: false });\n        R.text(money(costToBuild(def.id)), R.W - 14, R.H - H + 1,\n          { color: P.ink2, shadow: false, align: 'right' });\n        R.text(valid.ok ? 'Looks like a good spot.' : (valid.reason || 'It will not fit here.'),\n          14, R.H - H + 13, { color: valid.ok ? P.leaf3 : P.hpBad, shadow: false });\n        R.text('◀▲▼▶ move    A place    ⇥ next plot    B cancel', 14, R.H - H + 25,\n          { color: P.ui2, shadow: false });\n      });\n    },\n  };\n}\n\nconst waitFrames = n => new Promise(res => {\n  let left = n;\n  const tick = () => (--left <= 0) ? res() : requestAnimationFrame(tick);\n  requestAnimationFrame(tick);\n});\n\nexport function register() {\n  Scenes.register('village', p => boardScene(p));\n  Scenes.register('build', p => buildModeScene(p));\n  Scenes.register('upgradecard', p => upgradeCardScene(p));\n}\n","deps":{"../core/renderer.js":"core/renderer.js","../core/input.js":"core/input.js","../core/scene.js":"core/scene.js","../art/atlas.js":"art/atlas.js","../core/audio.js":"core/audio.js","../core/bridge.js":"core/bridge.js","../core/font.js":"core/font.js","../state.js":"state.js","../art/palette.js":"art/palette.js","../core/util.js":"core/util.js","./village.js":"village/village.js","./buildings.js":"village/buildings.js","./economy.js":"village/economy.js"}},{"id":"missions/missions.js","code":"// Family missions: the real-world half of the game.\n//\n// TONE IS THE FEATURE. These are invitations, not chores. Rules we hold to:\n//   * Opt-in. Nothing is assigned. You choose what to track, and nothing is ever\n//     \"overdue\". There are no timers, no red text, no reminders.\n//   * Trusted. Completion is self-reported. There is no verification and never any\n//     doubt — one gentle \"Did you do it together?\" and then a warm celebration.\n//   * A missed day never costs anything. The streak simply doesn't grow; it rests.\n//     No language anywhere in this file scolds, nags, or implies failure.\n//   * Every reward is visible in the village, so real kindness turns into cobbles,\n//     lamps, and neighbours. A few missions unlock specific buildings outright.\n//\n// In-game missions (walking, bonding, talking) live in the same system but are\n// tagged kind:'game', progress themselves from Hooks.missions.note(), and are shown\n// on their own tab so the two kinds are never confused.\n\nimport { S, setFlag, save } from '../state.js';\nimport { Bus, EV } from '../core/events.js';\nimport { UIx, Hooks } from '../core/bridge.js';\nimport { Audio } from '../core/audio.js';\nimport { makeRng } from '../core/rng.js';\nimport { Economy } from '../village/economy.js';\n\nexport const CATS = {\n  kitchen: { name: 'Together at the table', color: '#f0836a', icon: '●' },\n  tidy: { name: 'Making room', color: '#7fb6d9', icon: '●' },\n  outdoors: { name: 'Outside', color: '#8cc055', icon: '●' },\n  kindness: { name: 'Kindness', color: '#f593b9', icon: '♥' },\n  learning: { name: 'Finding out', color: '#a98ada', icon: '●' },\n  creativity: { name: 'Making things', color: '#f5c877', icon: '★' },\n  rest: { name: 'Rest', color: '#bfeaf2', icon: '●' },\n  helping: { name: 'Lending a hand', color: '#dda23f', icon: '●' },\n  game: { name: 'In the valley', color: '#ffe066', icon: '⬥' },\n};\n\n// r() = a real-world family mission. g() = something you do in the game.\nconst r = (id, cat, title, desc, opts = {}) => ({\n  id, cat, kind: 'real', title, desc,\n  need: opts.need || 1,\n  repeat: opts.repeat || 'once',\n  reward: { coins: opts.coins || 0, hearth: opts.hearth ?? 3 },\n  unlocks: opts.unlocks || null,\n  visible: opts.visible || null,\n  stepLabel: opts.stepLabel || null,\n});\nconst g = (id, title, desc, metric, need, opts = {}) => ({\n  id, cat: 'game', kind: 'game', title, desc, metric, need,\n  repeat: 'once', reward: { coins: opts.coins || 0, hearth: opts.hearth ?? 2 },\n  unlocks: opts.unlocks || null, visible: opts.visible || null,\n});\n\nexport const CATALOGUE = [\n  // --- together at the table --------------------------------------------------\n  r('cook-together', 'kitchen', 'Cook Dinner Together',\n    'Make one meal as a family. Everyone gets a job, even the small ones.',\n    { hearth: 8, coins: 20, unlocks: 'kitchen', visible: 'A warm light appears in the Kitchen window.' }),\n  r('set-the-table', 'kitchen', 'Set the Table',\n    'Plates, cups, and something in the middle that did not need to be there.',\n    { hearth: 3, repeat: 'daily' }),\n  r('bake-something', 'kitchen', 'Bake Something',\n    'Bread, biscuits, or a very lopsided cake. Lopsided is traditional.',\n    { hearth: 6, coins: 15 }),\n  r('try-new-veg', 'kitchen', 'Try One New Vegetable',\n    'One bite is a whole adventure. You are allowed to make a face.',\n    { hearth: 4 }),\n  r('dishes-together', 'kitchen', 'Wash Up Together',\n    'One washes, one dries, somebody sings badly. This is the correct method.',\n    { hearth: 3, repeat: 'daily' }),\n  r('eat-no-screens', 'kitchen', 'One Meal, No Screens',\n    'Just the food and the people. See what everybody says.',\n    { hearth: 4, repeat: 'daily' }),\n\n  // --- making room ------------------------------------------------------------\n  r('tidy-ten', 'tidy', 'Ten Minutes of Tidying, Together',\n    'Set a timer, put on a song, and stop the moment it ends. Really stop.',\n    { hearth: 3, repeat: 'daily' }),\n  r('make-bed', 'tidy', 'Make Your Bed',\n    'It takes a minute and the whole room feels calmer.',\n    { hearth: 2, repeat: 'daily' }),\n  r('three-homes', 'tidy', 'Find Homes for Three Things',\n    'Three things that live somewhere else. Escort them there.',\n    { hearth: 5, need: 3, stepLabel: 'things put away' }),\n  r('laundry-help', 'tidy', 'Help With the Laundry',\n    'Matching socks is a two-person sport with no known champion.',\n    { hearth: 4, repeat: 'weekly', visible: 'Laundry lines appear between the cottages.' }),\n  r('give-away', 'tidy', 'Choose One Thing to Give Away',\n    'Something you have finished with, that somebody else is just starting.',\n    { hearth: 6, coins: 10 }),\n\n  // --- outside ----------------------------------------------------------------\n  r('walk-birds', 'outdoors', 'Take a Walk, Name Three Birds',\n    'Or three trees, or three clouds. Guessing counts. Guessing loudly counts more.',\n    { hearth: 6, need: 3, stepLabel: 'birds named' }),\n  r('water-plants', 'outdoors', 'Water the Plants',\n    'They will not say thank you. They will grow, which is their way of saying it.',\n    { hearth: 2, repeat: 'daily', unlocks: 'garden', visible: 'The Garden Plot starts sprouting.' }),\n  r('outside-half-hour', 'outdoors', 'Half an Hour Outside',\n    'Rain counts. Puddles especially count.',\n    { hearth: 4, repeat: 'daily' }),\n  r('plant-something', 'outdoors', 'Plant Something',\n    'A seed, a cutting, or a hopeful bean in a cup on the windowsill.',\n    { hearth: 7, coins: 15, visible: 'Planters bloom around the plaza.' }),\n  r('five-treasures', 'outdoors', 'Collect Five Small Treasures',\n    'Leaves, stones, one shell, and a genuinely excellent stick.',\n    { hearth: 5, need: 5, stepLabel: 'treasures found' }),\n  r('watch-the-sky', 'outdoors', 'Watch the Sky Get Dark',\n    'Sit outside until the first star. Say nothing much.',\n    { hearth: 5 }),\n\n  // --- kindness ---------------------------------------------------------------\n  r('thank-you-note', 'kindness', 'Write a Thank-You Note',\n    'Short is fine. Drawings are better. Post it if you can.',\n    { hearth: 6, coins: 10 }),\n  r('call-someone', 'kindness', 'Call Someone Who\\'d Like to Hear From You',\n    'A grandparent, an old friend, the neighbour with the loud dog.',\n    { hearth: 5, repeat: 'weekly' }),\n  r('secret-kindness', 'kindness', 'Do One Kind Thing Nobody Asked For',\n    'Extra credit if nobody notices it was you.',\n    { hearth: 4, repeat: 'daily' }),\n  r('share-something', 'kindness', 'Share Something You Love',\n    'A song, a snack, a favourite page. Watch their face.',\n    { hearth: 3, repeat: 'daily' }),\n  r('say-the-good-thing', 'kindness', 'Tell Someone What You Like About Them',\n    'Out loud, to their face. Yes, it is a bit awkward. Do it anyway.',\n    { hearth: 5 }),\n\n  // --- finding out ------------------------------------------------------------\n  r('read-aloud', 'learning', 'Read a Chapter Out Loud',\n    'Take turns. Do the voices. Argue about who does the villain.',\n    { hearth: 7, coins: 15, unlocks: 'library', visible: 'The Story Nook lights its reading lamp.' }),\n  r('learn-a-word', 'learning', 'Learn a Word in Another Language',\n    'Then use it all day, slightly incorrectly.',\n    { hearth: 3, repeat: 'daily' }),\n  r('ask-three', 'learning', 'Ask a Grown-Up Three Questions',\n    'About when they were small. Keep going if the answers are good.',\n    { hearth: 5, need: 3, stepLabel: 'questions asked' }),\n  r('work-together', 'learning', 'Sit Together While You Work',\n    'Same table, different jobs, one pot of something warm.',\n    { hearth: 3, repeat: 'daily' }),\n  r('look-it-up', 'learning', 'Look Up Something You Wondered About',\n    'The thing you both said \"huh\" about earlier. Go and find out.',\n    { hearth: 4 }),\n\n  // --- making things ----------------------------------------------------------\n  r('make-something', 'creativity', 'Make Something With Your Hands',\n    'Paper, clay, cardboard, tape. Mostly tape.',\n    { hearth: 7, coins: 15, unlocks: 'workshop', visible: 'The Workshop opens its shutters.' }),\n  r('draw-family', 'creativity', 'Draw Someone in Your Family',\n    'Accuracy is not required and rarely helps.',\n    { hearth: 5 }),\n  r('build-a-fort', 'creativity', 'Build a Blanket Fort',\n    'Structural integrity optional. Snacks inside mandatory.',\n    { hearth: 6 }),\n  r('sing-together', 'creativity', 'Sing One Song Together',\n    'Loudly, and slightly out of tune, which is the right tune.',\n    { hearth: 3, repeat: 'daily' }),\n  r('invent-a-story', 'creativity', 'Invent a Story, One Line Each',\n    'It will go badly wrong. That is the good part.',\n    { hearth: 4, repeat: 'weekly' }),\n\n  // --- rest -------------------------------------------------------------------\n  r('rest-together', 'rest', 'Twenty Quiet Minutes Together',\n    'No screens. Just a room, and the people in it.',\n    { hearth: 8, unlocks: 'bathhouse', visible: 'Steam rises from the Spring House.' }),\n  r('bedtime-story', 'rest', '
