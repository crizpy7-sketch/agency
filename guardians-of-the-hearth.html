10: ['arcbolt'],\n      15: ['swiftshift'], 22: ['skyshear'], 28: ['voltlash'], 35: ['thundermane'],\n    },\n  },\n  {\n    id: 'voltmane', base: [68, 66, 58, 92, 72, 102], growth: 'medium',\n    bondRate: 45, xpBase: 166, evo: null,\n    dex: 'Its mane holds a whole afternoon of sunlight and gives it back after dark.',\n    learn: {\n      1: ['static_nip', 'glimmer', 'arcbolt', 'thundermane'], 22: ['skyshear'],\n      29: ['voltlash'], 36: ['swiftshift'], 43: ['hush_of_wings'], 49: ['thundermane'],\n    },\n  },\n  {\n    id: 'florabloom', base: [55, 42, 52, 62, 68, 50], growth: 'medium',\n    bondRate: 170, xpBase: 57, evo: { to: 'floradiant', level: 24, bond: 140 },\n    dex: 'Opens at the sound of a familiar voice and closes for strangers. It is not shy, only careful.',\n    learn: {\n      1: ['petal_brush', 'sunbask'], 6: ['pollen_haze'], 11: ['leaf_dart'],\n      16: ['bloomburst'], 22: ['kindle_song'], 28: ['bindvine'], 35: ['radiant_bloom'],\n    },\n  },\n  {\n    id: 'floradiant', base: [80, 58, 72, 95, 95, 62], growth: 'medium',\n    bondRate: 40, xpBase: 174, evo: null,\n    dex: 'Its crown turns to follow whoever it likes best in the room. Bees follow it everywhere.',\n    learn: {\n      1: ['petal_brush', 'sunbask', 'pollen_haze', 'radiant_bloom'], 24: ['bloomburst'],\n      30: ['kindle_song'], 37: ['mend'], 44: ['bough_embrace'], 50: ['radiant_bloom'],\n    },\n  },\n  {\n    id: 'drakindle', base: [50, 58, 50, 55, 48, 55], growth: 'slow',\n    bondRate: 60, xpBase: 66, evo: { to: 'drakember', level: 26 },\n    dex: 'Hatches in the cold ash of a lightning-struck tree. Keeps one wing over its eyes in daylight.',\n    learn: {\n      1: ['shade_nip', 'bristle'], 6: ['dim_veil'], 11: ['nightbite'],\n      17: ['cinder_nip'], 23: ['gloomsurge'], 30: ['blaze_rush'], 38: ['duskbrand'],\n    },\n  },\n  {\n    id: 'drakember', base: [78, 88, 72, 82, 70, 78], growth: 'slow',\n    bondRate: 30, xpBase: 204, evo: null,\n    dex: 'Flies the boundary between the last light and the first dark, and will not be hurried across it.',\n    learn: {\n      1: ['shade_nip', 'dim_veil', 'nightbite', 'duskbrand'], 26: ['gloomsurge'],\n      33: ['blaze_rush'], 40: ['sunflare'], 46: ['duskbrand'], 52: ['gloomsurge'],\n    },\n  },\n  {\n    id: 'hearthling', base: [70, 60, 70, 80, 88, 60], growth: 'medium',\n    bondRate: 8, xpBase: 190, evo: null,\n    dex: 'Only ever found where a fire has been kept alight for a hundred years. It counts the village as its own body.',\n    learn: {\n      1: ['warm_nuzzle', 'mend'], 7: ['kindle_song'], 13: ['hearthlight'],\n      19: ['glimmer'], 25: ['sunbask'], 32: ['hearthbond'], 40: ['sunspire'],\n    },\n  },\n];\n\n// Fold in the foundation-owned name / type / stage / line, so those never drift.\nconst ROSTER = {};\nfor (const g of GUARDIANS) {\n  const own = S.find(s => s.id === g.id);\n  if (!own) throw new Error(`[species] missing stats for roster id \"${g.id}\"`);\n  ROSTER[g.id] = Object.freeze({\n    ...own,\n    name: g.name,\n    type: g.type,\n    types: Object.freeze([g.type]),\n    stage: g.stage,\n    line: g.line,\n    front: `g.${g.id}.front`,\n    back: `g.${g.id}.back`,\n    ow: `g.${g.id}.ow`,\n    stats: Object.freeze({\n      hp: own.base[0], atk: own.base[1], def: own.base[2],\n      spa: own.base[3], spd: own.base[4], spe: own.base[5],\n    }),\n  });\n}\nfor (const s of S) {\n  if (!ROSTER[s.id]) throw new Error(`[species] \"${s.id}\" is not in the canonical roster`);\n}\n\nexport const SPECIES = Object.freeze(ROSTER);\nexport const SPECIES_IDS = Object.freeze(GUARDIANS.map(g => g.id));\nexport const getSpecies = id => SPECIES[id] || null;\nexport const speciesName = id => SPECIES[id]?.name || String(id);\n/** The three the player is offered at the start. */\nexport const STARTERS = Object.freeze(['embercub', 'leafowl', 'aquarabbit']);\n\nexport const STAT_KEYS = Object.freeze(['hp', 'atk', 'def', 'spa', 'spd', 'spe']);\nexport const STAT_LABEL = Object.freeze({\n  hp: 'HEART', atk: 'ATTACK', def: 'GUARD', spa: 'SPIRIT', spd: 'RESOLVE', spe: 'SPEED',\n});\n\n// ---------------------------------------------------------------------------\n//  learnsets & evolution\n// ---------------------------------------------------------------------------\n/** Every move id this species knows by `level`, in learn order. */\nexport function movesUpTo(speciesId, level) {\n  const sp = SPECIES[speciesId];\n  if (!sp) return [];\n  const out = [];\n  for (const lv of Object.keys(sp.learn).map(Number).sort((a, b) => a - b)) {\n    if (lv > level) break;\n    for (const id of sp.learn[lv]) if (!out.includes(id)) out.push(id);\n  }\n  return out;\n}\n/** Moves newly available exactly at `level`. */\nexport function movesAt(speciesId, level) {\n  return (SPECIES[speciesId]?.learn[level] || []).slice();\n}\n\n/**\n * Does this guardian meet its evolution condition right now?\n * Returns { to, toName, reason } or null. Never mutates.\n */\nexport function evolutionFor(g) {\n  const sp = SPECIES[g.species];\n  if (!sp || !sp.evo) return null;\n  const e = sp.evo;\n  if (e.level !== undefined && g.lvl < e.level) return null;\n  if (e.bond !== undefined && (g.bond || 0) < e.bond) return null;\n  return {\n    to: e.to,\n    toName: speciesName(e.to),\n    reason: e.bond !== undefined ? 'bond' : 'level',\n  };\n}\nexport const evoHint = id => {\n  const e = SPECIES[id]?.evo;\n  if (!e) return 'This one is already all it means to be.';\n  if (e.bond !== undefined) return `Grows into ${speciesName(e.to)} at Lv${e.level} once it trusts you.`;\n  return `Grows into ${speciesName(e.to)} at Lv${e.level}.`;\n};\n\n/**\n * Apply an evolution in place. Keeps the nickname if the player set one, keeps HP\n * proportion, adds the new form's level-1 moves if there is room.\n */\nexport function commitEvolve(g) {\n  const evo = evolutionFor(g);\n  if (!evo) return null;\n  const from = g.species;\n  const frac = g.maxhp > 0 ? g.hp / g.maxhp : 1;\n  const nicknamed = g.nick && g.nick !== speciesName(from);\n  g.species = evo.to;\n  g.types = SPECIES[evo.to].types.slice();\n  if (!nicknamed) g.nick = speciesName(evo.to);\n  recalcStats(g);\n  g.hp = Math.max(1, Math.round(g.maxhp * frac));\n  for (const id of movesAt(evo.to, 1)) {\n    if (g.moves.length >= 4) break;\n    if (!g.moves.some(m => m.id === id)) g.moves.push(makeMoveSlot(id));\n  }\n  return { from, to: evo.to, fromName: speciesName(from), toName: speciesName(evo.to) };\n}\n\n// ---------------------------------------------------------------------------\n//  the party-member factory\n// ---------------------------------------------------------------------------\nlet seq = 0;\n/** Reset the instance counter — tests use this so ids are reproducible. */\nexport const resetGuardianIds = (n = 0) => { seq = n; };\n\nexport function computeStats(speciesId, lvl) {\n  const sp = SPECIES[speciesId];\n  const b = sp.stats;\n  return {\n    hp: hpAt(b.hp, lvl), atk: statAt(b.atk, lvl), def: statAt(b.def, lvl),\n    spa: statAt(b.spa, lvl), spd: statAt(b.spd, lvl), spe: statAt(b.spe, lvl),\n  };\n}\n\n/** Recompute stats after a level-up or an evolution, keeping HP sensible. */\nexport function recalcStats(g) {\n  const before = g.maxhp || 0;\n  g.stats = computeStats(g.species, g.lvl);\n  g.maxhp = g.stats.hp;\n  if (before === 0) g.hp = g.maxhp;\n  else g.hp = Math.min(g.maxhp, g.hp + Math.max(0, g.maxhp - before));\n  return g;\n}\n\n/**\n * Build a party member. This is the shape state.js documents:\n *   {id, species, nick, lvl, xp, hp, maxhp, moves:[], stats:{}, bond}\n * plus the battle fields (types, status, met) that persist with it.\n */\nexport function makeGuardian(speciesId, level = 5, opts = {}) {\n  const sp = SPECIES[speciesId];\n  if (!sp) throw new Error(`[species] unknown guardian \"${speciesId}\"`);\n  const lvl = Math.max(1, Math.min(maxLevel, level | 0));\n  const g = {\n    id: opts.id || `g${++seq}`,\n    species: speciesId,\n    nick: opts.nick || sp.name,\n    types: sp.types.slice(),\n    lvl,\n    xp: 0,\n    xpNext: xpNeeded(lvl, sp.growth),\n    hp: 0, maxhp: 0,\n    stats: null,\n    moves: [],\n    bond: opts.bond === undefined ? Math.min(255, 60 + Math.floor(sp.bondRate / 8)) : opts.bond,\n    status: null,\n    statusTurns: 0,\n    met: { lvl, where: opts.where || 'the wild', day: opts.day || 0 },\n  };\n  recalcStats(g);\n  g.hp = opts.hp === undefined ? g.maxhp : Math.max(0, Math.min(g.maxhp, opts.hp));\n  const wanted = opts.moves && opts.moves.length ? opts.moves : movesUpTo(speciesId, lvl).slice(-4);\n  for (const id of wanted.slice(0, 4)) g.moves.push(makeMoveSlot(id));\n  if (!g.moves.length) g.moves.push(makeMoveSlot('warm_nuzzle'));\n  return g;\n}\n\n/** A trainer's team from a compact spec: [['voltkit', 8], ['wisplet', 9]]. */\nexport const makeTeam = spec => spec.map(([id, lvl, o]) => makeGuardian(id, lvl, o));\n\n/** Clear everything battle-scoped. Called when a battle ends — nothing follows you out. */\nexport function restEasy(g, { full = false } = {}) {\n  g.status = null;\n  g.statusTurns = 0;\n  if (full) {\n    g.hp = g.maxhp;\n    for (const m of g.moves) m.focus = m.maxFocus;\n  }\n  return g;\n}\n\nexport const isFainted = g => !g || g.hp <= 0;\nexport const displayName = g => g?.nick || speciesName(g?.species);\nexport const frontSprite = g => `g.${g.species}.front`;\nexport const backSprite = g => `g.${g.species}.back`;\nexport const owSprite = g => `g.${g.species}.ow`;\n\n/** Dex row for ui/party.js and the dex screen. */\nexport function dexEntry(id) {\n  const sp = SPECIES[id];\n  if (!sp) return null;\n  return {\n    id, name: sp.name, type: sp.type, stage: sp.stage, line: sp.line,\n    dex: sp.dex, base: sp.stats, evo: evoHint(id),\n    moves: Object.entries(sp.learn).map(([lv, ids]) => ({ lv: +lv, moves: ids.map(i => getMove(i).name) })),\n  };\n}\n","deps":{"../art/names.js":"art/names.js","./moves.js":"battle/moves.js"}},{"id":"ui/party.js","code":"// Party, summary, and records.\n//\n// Also implements Hooks.party, which is how the battle screen asks the player to\n// pick a Guardian — so this has to be fast to read and fast to answer.\n\nimport { R, LAYER } from '../core/renderer.js';\nimport { Input } from '../core/input.js';\nimport { Scenes } from '../core/scene.js';\nimport { Atlas } from '../art/atlas.js';\nimport { Audio } from '../core/audio.js';\nimport { UIx, Hooks } from '../core/bridge.js';\nimport { Font } from '../core/font.js';\nimport { S } from '../state.js';\nimport { P, TYPE_COLOR, mix, shade } from '../art/palette.js';\nimport { clamp } from '../core/util.js';\nimport { GUARDIANS } from '../art/names.js';\nimport { getSpecies, displayName, speciesName, makeGuardian } from '../battle/species.js';\n\nconst hpFrac = g => g && g.maxhp ? clamp(g.hp / g.maxhp, 0, 1) : 0;\nconst hpColor = f => f > 0.5 ? P.hpGood : f > 0.22 ? P.hpWarn : P.hpBad;\n\nfunction typeChip(x, y, ty) {\n  const b = Atlas.tryGet(`ui.type.${ty}`);\n  if (b) R.blit(b, x, y);\n  else R.rect(x, y, 22, 9, TYPE_COLOR[ty] || P.ui2);\n  R.text(ty.slice(0, 3).toUpperCase(), x + 11, y + 1,\n    { color: '#fffaf0', shadow: shade(TYPE_COLOR[ty] || P.ui2, -0.55), align: 'center' });\n}\n\n// ------------------------------------------------------------------ party list\nfunction partyScene(params) {\n  const picking = !!params?.picking;\n  let sel = 0, t = 0, busy = false;\n\n  const party = () => (params?.party || S.party);\n\n  async function act() {\n    const list = party();\n    const g = list[sel];\n    if (!g) return;\n    if (picking) { Scenes.pop(sel); return; }\n    busy = true;\n    try {\n      const i = await UIx.ask(displayName(g), ['Summary', 'Move up', 'Back']);\n      if (i === 0) await Scenes.pushAsync('summary', { g });\n      else if (i === 1 && sel > 0) {\n        [list[sel - 1], list[sel]] = [list[sel], list[sel - 1]];\n        sel--; Audio.sfx('confirm');\n      }\n    } finally { busy = false; }\n  }\n\n  return {\n    update() {\n      t++;\n      if (busy || UIx.busy) return;\n      const list = party();\n      if (Input.pressed('b')) { Audio.sfx('cancel'); Scenes.pop(picking ? -1 : undefined); return; }\n      if (list.length) {\n        if (Input.pressed('down')) { sel = (sel + 1) % list.length; Audio.sfx('cursor'); }\n        if (Input.pressed('up')) { sel = (sel + list.length - 1) % list.length; Audio.sfx('cursor'); }\n      }\n      if (Input.pressed('a')) act();\n    },\n    render() {\n      const list = party();\n      R.layer(LAYER.GROUND, () => {\n        for (let y = 0; y < R.H; y++) R.rect(0, y, R.W, 1, mix('#1b2233', '#2a2036', y / R.H));\n      });\n      R.layer(LAYER.UI, () => {\n        R.text(picking ? 'CHOOSE A GUARDIAN' : 'YOUR GUARDIANS', 8, 6, { color: P.gold1 });\n        if (!list.length) {\n          UIx.panel(30, 60, R.W - 60, 50, 'paper');\n          R.text('No Guardians yet.', R.W / 2, 72, { color: P.ink2, shadow: false, align: 'center' });\n          R.text('Gran Willow has one waiting for you.', R.W / 2, 86, { color: P.ink3, shadow: false, align: 'center' });\n        }\n        list.slice(0, 6).forEach((g, i) => {\n          const col = i % 2, row = Math.floor(i / 2);\n          const x = 8 + col * 152, y = 22 + row * 44;\n          const on = i === sel;\n          UIx.panel(x, y, 146, 40, 'paper');\n          if (on) R.stroke(x - 1, y - 1, 148, 42, P.gold2);\n          const ow = Atlas.tryGet(`g.${g.species}.ow`, Math.floor(t / 24) % 2);\n          if (ow) R.blit(ow, x + 5, y + 12);\n          R.text(displayName(g), x + 24, y + 4, { color: g.hp > 0 ? P.ink2 : P.ui2, shadow: false });\n          R.text(`Lv ${g.lvl}`, x + 140, y + 4, { color: P.ink3, shadow: false, align: 'right' });\n          (g.types || []).forEach((ty, k) => typeChip(x + 24 + k * 25, y + 15, ty));\n          const f = hpFrac(g);\n          R.rect(x + 24, y + 28, 88, 5, P.ui1);\n          R.rect(x + 24, y + 28, Math.round(88 * f), 5, hpColor(f));\n          R.text(`${g.hp}/${g.maxhp}`, x + 140, y + 27, { color: P.ink3, shadow: false, align: 'right' });\n          if (on) {\n            const c = Atlas.tryGet('ui.cursor');\n            if (c) R.blit(c, x - 8, y + 16 + Math.sin(t / 8) * 0.6);\n          }\n        });\n        R.rect(0, R.H - 12, R.W, 12, 'rgba(16,12,20,0.8)');\n        R.text(picking ? 'A choose    B cancel' : 'A options    B back', 6, R.H - 10, { color: P.ui1 });\n      });\n    },\n  };\n}\n\n// --------------------------------------------------------------------- summary\nfunction summaryScene(params) {\n  const g = params?.g || S.party[0] || makeGuardian('embercub', 5);\n  let t = 0;\n  const sp = getSpecies(g.species);\n\n  return {\n    update() {\n      t++;\n      if (Input.pressed('b') || Input.pressed('a')) { Audio.sfx('cancel'); Scenes.pop(); }\n    },\n    render() {\n      R.layer(LAYER.GROUND, () => {\n        for (let y = 0; y < R.H; y++) R.rect(0, y, R.W, 1, mix('#1b2233', '#2a2036', y / R.H));\n      });\n      R.layer(LAYER.UI, () => {\n        UIx.panel(6, 6, 118, R.H - 24, 'paper');\n        const img = Atlas.tryGet(`g.${g.species}.front`);\n        if (img) R.blit(img, 28, 12 + Math.sin(t / 30) * 1.5);\n        R.text(displayName(g), 65, 82, { color: P.ink, shadow: false, align: 'center' });\n        R.text(`Lv ${g.lvl}`, 65, 94, { color: P.ink3, shadow: false, align: 'center' });\n        (g.types || []).forEach((ty, k) => typeChip(42 + k * 25, 106, ty));\n        const f = hpFrac(g);\n        R.rect(18, 122, 94, 6, P.ui1);\n        R.rect(18, 122, Math.round(94 * f), 6, hpColor(f));\n        R.text(`${g.hp} / ${g.maxhp}`, 65, 132, { color: P.ink3, shadow: false, align: 'center' });\n        if (sp?.flavour) {\n          let y = 144;\n          for (const l of Font.wrap(sp.flavour, 106).slice(0, 2)) {\n            R.text(l, 12, y, { color: P.ui2, shadow: false }); y += 9;\n          }\n        }\n\n        UIx.panel(130, 6, R.W - 136, 78, 'paper');\n        const stats = [['HP', g.maxhp], ['Attack', g.stats?.atk], ['Defence', g.stats?.def],\n                       ['Sp. Atk', g.stats?.spa], ['Sp. Def', g.stats?.spd], ['Speed', g.stats?.spe]];\n        stats.forEach(([k, v], i) => {\n          const y = 11 + i * 11;\n          R.text(k, 137, y, { color: P.ui2, shadow: false });\n          R.text(String(v ?? '—'), 176, y, { color: P.ink2, shadow: false, align: 'right' });\n          const bw = Math.round(clamp((v || 0) / 160, 0, 1) * 96);\n          R.rect(182, y + 2, 96, 4, P.ui1);\n          R.rect(182, y + 2, bw, 4, mix(P.gold2, P.leaf2, i / 6));\n        });\n\n        UIx.panel(130, 88, R.W - 136, R.H - 106, 'paper');\n        R.text('Moves', 137, 92, { color: P.ui2, shadow: false });\n        (g.moves || []).slice(0, 4).forEach((m, i) => {\n          const y = 104 + i * 14;\n          typeChip(137, y, m.type);\n          R.text(m.name, 164, y, { color: P.ink2, shadow: false });\n          R.text(`${m.focus}/${m.maxFocus ?? m.focus}`, R.W - 12, y, { color: P.ink3, shadow: false, align: 'right' });\n        });\n        R.rect(0, R.H - 12, R.W, 12, 'rgba(16,12,20,0.8)');\n        R.text('B back', 6, R.H - 10, { color: P.ui1 });\n      });\n    },\n  };\n}\n\n// --------------------------------------------------------------------- records\nfunction dexScene() {\n  let sel = 0, t = 0;\n  const rows = GUARDIANS.map(g => ({ ...g, state: S.seen?.[g.id] || null }));\n\n  return {\n    update() {\n      t++;\n      if (Input.pressed('b')) { Audio.sfx('cancel'); Scenes.pop(); return; }\n      if (Input.pressed('down')) { sel = (sel + 1) % rows.length; Audio.sfx('cursor'); }\n      if (Input.pressed('up')) { sel = (sel + rows.length - 1) % rows.length; Audio.sfx('cursor'); }\n      if (Input.pressed('right')) { sel = clamp(sel + 6, 0, rows.length - 1); Audio.sfx('cursor'); }\n      if (Input.pressed('left')) { sel = clamp(sel - 6, 0, rows.length - 1); Audio.sfx('cursor'); }\n    },\n    render() {\n      R.layer(LAYER.GROUND, () => {\n        for (let y = 0; y < R.H; y++) R.rect(0, y, R.W, 1, mix('#1b2233', '#2a2036', y / R.H));\n      });\n      R.layer(LAYER.UI, () => {\n        const bonded = rows.filter(r => r.state === 'bonded').length;\n        const seen = rows.filter(r => r.state).length;\n        R.text('RECORDS', 8, 6, { color: P.gold1 });\n        R.text(`${bonded} bonded · ${seen} met · ${rows.length} known to exist`, R.W - 8, 6,\n          { color: P.ui2, align: 'right' });\n\n        const start = Math.max(0, Math.min(rows.length - 18, Math.floor(sel / 6) * 6 - 6));\n        for (let i = 0; i < 18; i++) {\n          const r = rows[start + i];\n          if (!r) break;\n          const x = 8 + (i % 6) * 51, y = 20 + Math.floor(i / 6) * 46;\n          const on = start + i === sel;\n          R.rect(x, y, 47, 42, on ? mix(P.gold2, '#1b2233', 0.55) : 'rgba(255,255,255,0.05)');\n          if (on) R.stroke(x, y, 47, 42, P.gold2);\n          const img = Atlas.tryGet(`g.${r.id}.front`);\n          if (img) {\n            if (r.state) R.blit(img, x - 8, y - 10, { w: 64, h: 64 });\n            else R.silhouette(img, x - 8, y - 10, '#0e1420', 0.7);\n          }\n          R.text(r.state ? r.name.slice(0, 8) : '???', x + 23, y + 33,\n            { color: r.state === 'bonded' ? P.gold0 : r.state ? P.ui1 : P.ui2, align: 'center' });\n        }\n        R.rect(0, R.H - 12, R.W, 12, 'rgba(16,12,20,0.8)');\n        const cur = rows[sel];\n        R.text(cur?.state ? `${cur.name} — ${cur.type}` : 'Not met yet', 6, R.H - 10, { color: P.ui1 });\n      });\n    },\n  };\n}\n\nexport function register() {\n  Scenes.register('party', p => partyScene(p));\n  Scenes.register('summary', p => summaryScene(p));\n  Scenes.register('dex', () => dexScene());\n\n  Hooks.install('party', {\n    async openParty(opts) { return Scenes.pushAsync('party', opts); },\n    async openSummary(g) { return Scenes.pushAsync('summary', { g }); },\n    async chooseGuardian(opts) {\n      return Scenes.pushAsync('party', { ...opts, picking: true });\n    },\n  });\n}\n","deps":{"../core/renderer.js":"core/renderer.js","../core/input.js":"core/input.js","../core/scene.js":"core/scene.js","../art/atlas.js":"art/atlas.js","../core/audio.js":"core/audio.js","../core/bridge.js":"core/bridge.js","../core/font.js":"core/font.js","../state.js":"state.js","../art/palette.js":"art/palette.js","../core/util.js":"core/util.js","../art/names.js":"art/names.js","../battle/species.js":"battle/species.js"}},{"id":"world/maps.js","code":"// The world. Outdoor maps are composed with a tiny authoring DSL — fill, border,\n// pond, road, grove, scatter — because 40x34 grids of hand-typed characters are\n// unreadable and easy to get subtly wrong. Interiors are small enough to draw\n// literally, so they are.\n//\n// Everything here is intent: where the road runs, where the grass is tall, what you\n// can see from the gate. map.js turns it into tiles, masks, canopies, and collision.\n\nimport { hash2 } from '../core/rng.js';\n\n// ---------------------------------------------------------------- authoring DSL\nclass Sheet {\n  constructor(w, h, fill = '.') {\n    this.w = w; this.h = h;\n    this.g = Array.from({ length: h }, () => new Array(w).fill(fill));\n  }\n  in(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h; }\n  set(x, y, ch) { if (this.in(x, y)) this.g[y][x] = ch; return this; }\n  get(x, y) { return this.in(x, y) ? this.g[y][x] : null; }\n\n  rect(x, y, w, h, ch) {\n    for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) this.set(i, j, ch);\n    return this;\n  }\n  hline(x, y, len, ch) { for (let i = x; i < x + len; i++) this.set(i, y, ch); return this; }\n  vline(x, y, len, ch) { for (let j = y; j < y + len; j++) this.set(x, j, ch); return this; }\n\n  /** Tree wall around the edge; trees are 2x2 so they step by two. */\n  treeBorder({ top = 2, bottom = 2, left = 2, right = 2, gaps = [] } = {}) {\n    const skip = (x, y) => gaps.some(g => x >= g.x && x < g.x + (g.w || 1) && y >= g.y && y < g.y + (g.h || 1));\n    for (let x = 0; x < this.w - 1; x += 2) {\n      for (let j = 0; j < top; j += 2) if (!skip(x, j)) this.set(x, j, 'T');\n      for (let j = 0; j < bottom; j += 2) {\n        const y = this.h - 2 - j;\n        if (!skip(x, y)) this.set(x, y, 'T');\n      }\n    }\n    for (let y = 0; y < this.h - 1; y += 2) {\n      for (let i = 0; i < left; i += 2) if (!skip(i, y)) this.set(i, y, 'T');\n      for (let i = 0; i < right; i += 2) {\n        const x = this.w - 2 - i;\n        if (!skip(x, y)) this.set(x, y, 'T');\n      }\n    }\n    return this;\n  }\n\n  /** Soft-edged blob of `ch`, with an optional rim character. */\n  blob(cx, cy, rx, ry, ch, { rim = null, seed = 3, wobble = 0.55 } = {}) {\n    for (let y = Math.floor(cy - ry - 1); y <= cy + ry + 1; y++) {\n      for (let x = Math.floor(cx - rx - 1); x <= cx + rx + 1; x++) {\n        const n = (hash2(x, y, seed) - 0.5) * wobble;\n        const d = ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 + n * 0.5;\n        if (d <= 1) this.set(x, y, ch);\n        else if (rim && d <= 1.35) this.set(x, y, rim);\n      }\n    }\n    return this;\n  }\n\n  /** An L-shaped road: horizontal then vertical, or the reverse. */\n  road(x0, y0, x1, y1, ch = 'p', { vfirst = false, width = 1 } = {}) {\n    const put = (x, y) => {\n      for (let k = 0; k < width; k++) this.set(x + k, y, ch);\n    };\n    if (vfirst) {\n      for (let y = Math.min(y0, y1); y <= Math.max(y0, y1); y++) put(x0, y);\n      for (let x = Math.min(x0, x1); x <= Math.max(x0, x1); x++) put(x, y1);\n    } else {\n      for (let x = Math.min(x0, x1); x <= Math.max(x0, x1); x++) put(x, y0);\n      for (let y = Math.min(y0, y1); y <= Math.max(y0, y1); y++) put(x1, y);\n    }\n    return this;\n  }\n\n  /** A stand of trees, thinned by noise so it never reads as a grid. */\n  grove(x, y, w, h, { density = 0.62, ch = 'T', seed = 11 } = {}) {\n    for (let j = y; j < y + h; j += 2) {\n      for (let i = x; i < x + w; i += 2) {\n        const jitter = hash2(i, j, seed) < 0.4 ? 1 : 0;\n        if (hash2(i, j, seed + 1) < density) this.set(i + jitter, j, ch);\n      }\n    }\n    return this;\n  }\n\n  /** Sprinkle accents onto plain grass only, deterministically. */\n  scatter(chars, rate, { seed = 23, area = null } = {}) {\n    const a = area || { x: 0, y: 0, w: this.w, h: this.h };\n    for (let y = a.y; y < a.y + a.h; y++) {\n      for (let x = a.x; x < a.x + a.w; x++) {\n        if (this.get(x, y) !== '.') continue;\n        const n = hash2(x, y, seed);\n        if (n < rate) this.set(x, y, chars[Math.floor(hash2(x, y, seed + 5) * chars.length)]);\n      }\n    }\n    return this;\n  }\n\n  /** Patch of encounter grass with a soft edge. */\n  meadowPatch(cx, cy, rx, ry, seed = 41) { return this.blob(cx, cy, rx, ry, '\"', { seed, wobble: 0.8 }); }\n\n  /** Fence run. Corners get posts. */\n  fence(x, y, w, h) {\n    for (let i = x; i < x + w; i++) { this.set(i, y, '-'); this.set(i, y + h - 1, '-'); }\n    for (let j = y; j < y + h; j++) { this.set(x, j, '|'); this.set(x + w - 1, j, '|'); }\n    this.set(x, y, '+'); this.set(x + w - 1, y, '+');\n    this.set(x, y + h - 1, '+'); this.set(x + w - 1, y + h - 1, '+');\n    return this;\n  }\n\n  rows() { return this.g.map(r => r.join('')); }\n}\n\n// ---------------------------------------------------------------- village (home)\n// village.js pins the Hearthstone to the '@' tag and lays its plots out around it,\n// spanning roughly x 10..33, y 11..31 — so authored scenery stays out of that band.\nfunction villageRows() {\n  const s = new Sheet(40, 34);\n  s.treeBorder({ top: 2, bottom: 2, left: 2, right: 2, gaps: [{ x: 20, y: 32, w: 2, h: 2 }] });\n\n  // The heart of the village and its plaza.\n  s.rect(18, 17, 7, 5, '0');\n  s.set(21, 19, '@');\n\n  // The road: in from the south gate, up to the plaza, then out east and west.\n  s.road(21, 33, 21, 22, 'p', { vfirst: true });\n  s.vline(21, 22, 11, 'p');\n  s.hline(9, 25, 13, 'p');\n  s.hline(21, 25, 12, 'p');\n  s.set(21, 33, 'A');\n\n  // North strip: the three houses that were here before you arrived.\n  s.rect(5, 6, 4, 4, '.'); s.rect(16, 6, 4, 4, '.'); s.rect(26, 6, 5, 4, '.');\n  s.hline(6, 10, 2, 'p'); s.hline(17, 10, 2, 'p'); s.hline(27, 10, 3, 'p');\n  s.road(7, 10, 21, 16, 'p'); s.road(18, 10, 21, 14, 'p'); s.road(28, 10, 21, 12, 'p');\n\n  // The mill pond, tucked into the south-west where no plot reaches.\n  s.blob(6, 28, 4, 3, 'w', { rim: 's', seed: 9 });\n  s.set(4, 26, '~'); s.set(9, 30, 'j'); s.set(7, 25, 'q');\n\n  // Kitchen garden behind the fence, and the well by the road.\n  s.fence(31, 20, 6, 6);\n  s.rect(32, 21, 4, 4, 'N');\n  s.set(33, 20, '-'); s.set(34, 20, 'A');\n  s.set(19, 24, 'e');\n\n  // Lamps along the plaza edge, benches facing the Hearthstone.\n  for (const [x, y] of [[17, 16], [25, 16], [17, 22], [25, 22]]) s.set(x, y, 'l');\n  s.set(19, 22, 'K'); s.set(23, 22, 'K');\n  s.set(20, 30, 'I');          // signpost at the gate\n  s.set(24, 27, 'M');\n\n  s.scatter([',', '*', '`', '%'], 0.14, { seed: 31, area: { x: 2, y: 2, w: 36, h: 30 } });\n  s.set(12, 7, 'B'); s.set(13, 8, 'b'); s.set(34, 12, 'O'); s.set(35, 14, 'o');\n  return s.rows();\n}\n\n// ---------------------------------------------------------------- meadow (south)\nfunction meadowRows() {\n  const s = new Sheet(38, 32);\n  s.treeBorder({ top: 2, bottom: 2, left: 2, right: 2, gaps: [{ x: 18, y: 0, w: 2, h: 2 }, { x: 34, y: 14, w: 4, h: 4 }] });\n  s.road(19, 0, 19, 30, 'p', { vfirst: true });\n  s.vline(19, 0, 22, 'p');\n  s.hline(19, 21, 17, 'p');\n  s.set(19, 0, 'A');\n\n  s.meadowPatch(9, 8, 6, 4, 41);\n  s.meadowPatch(28, 9, 5, 3, 47);\n  s.meadowPatch(11, 25, 7, 4, 53);\n  s.meadowPatch(30, 27, 4, 3, 59);\n\n  s.fence(4, 14, 12, 6);\n  s.set(9, 14, 'A');\n  s.rect(5, 15, 10, 4, ','); s.set(9, 17, 'S'); s.set(6, 16, 'h'); s.set(13, 18, 'h');\n\n  s.grove(24, 3, 10, 6, { density: 0.5, seed: 61 });\n  s.blob(31, 17, 3, 2, 'w', { rim: 's', seed: 13 });\n  s.set(24, 24, 'L'); s.set(27, 22, 'u'); s.set(8, 22, 'O');\n  s.set(18, 3, 'I'); s.set(21, 12, 'i');\n  s.scatter([',', '*', '`', 'm'], 0.13, { seed: 71, area: { x: 2, y: 2, w: 34, h: 28 } });\n  return s.rows();\n}\n\n// ---------------------------------------------------------------- forest (east)\nfunction forestRows() {\n  const s = new Sheet(34, 34);\n  s.treeBorder({ top: 2, bottom: 2, left: 2, right: 2, gaps: [{ x: 0, y: 14, w: 2, h: 4 }] });\n  s.grove(3, 3, 28, 28, { density: 0.44, seed: 83 });\n  s.grove(4, 4, 26, 26, { density: 0.3, ch: 'Y', seed: 89 });\n\n  // A path that winds instead of running straight — the forest should feel unmapped.\n  const path = [[1, 16], [6, 16], [6, 12], [11, 12], [11, 20], [16, 20], [16, 9], [22, 9], [22, 17], [27, 17], [27, 26]];\n  for (let i = 0; i < path.length - 1; i++) {\n    const [ax, ay] = path[i], [bx, by] = path[i + 1];\n    for (let x = Math.min(ax, bx); x <= Math.max(ax, bx); x++) s.set(x, ay, 'p');\n    for (let y = Math.min(ay, by); y <= Math.max(ay, by); y++) s.set(bx, y, 'p');\n  }\n  // Clear a tile either side of the path so the canopy never swallows it.\n  for (const [x, y] of path) s.rect(x - 1, y - 1, 3, 3, s.get(x, y) === 'p' ? 'p' : '.');\n\n  s.meadowPatch(8, 24, 4, 3, 97);\n  s.meadowPatch(24, 6, 4, 3, 101);\n\n  // The secret clearing: reachable only by walking round the grove at (26,26).\n  s.blob(28, 28, 3, 3, '.', { seed: 5, wobble: 0.2 });\n  s.set(28, 28, 'Z'); s.set(30, 29, 'm'); s.set(26, 30, 'm');\n  s.set(1, 15, 'I');\n  s.scatter([';', 'm', 'b', '`'], 0.16, { seed: 103, area: { x: 2, y: 2, w: 30, h: 30 } });\n  return s.rows();\n}\n\n// ------------------------------------------------------------- riverside (west)\nfunction riversideRows() {\n  const s = new Sheet(36, 26);\n  s.treeBorder({ top: 2, bottom: 2, left: 2, right: 2, gaps: [{ x: 32, y: 10, w: 4, h: 4 }] });\n  // The river runs north-south; one bridge crosses it.\n  s.rect(14, 0, 6, 26, 'w');\n  s.rect(15, 0, 4, 26, 'W');\n  s.hline(13, 12, 1, 's'); s.hline(20, 12, 1, 's');\n  s.rect(14, 12, 6, 1, '=');\n  s.vline(13, 0, 26, 's'); s.vline(20, 0, 26, 's');\n  s.hline(2, 12, 12, 'p'); s.hline(20, 12, 14, 'p');\n\n  for (const [x, y] of [[14, 4], [19, 7], [14, 19], [19, 22], [15, 24]]) s.set(x, y, '~');\n  s.set(12, 15, 'j'); s.set(21, 8, 'j');\n  s.meadowPatch(7, 6, 4, 3, 107);\n  s.meadowPatch(27, 19, 5, 3, 109);\n  s.set(11, 12, 'i');\n  s.set(24, 6, 'O'); s.set(26, 8, 'o'); s.set(6, 20, 'L');\n  s.grove(22, 15, 10, 8, { density: 0.4, seed: 113 });\n  s.scatter([',', '*', '`'], 0.12, { seed: 127, area: { x: 2, y: 2, w: 32, h: 22 } });\n  return s.rows();\n}\n\n// ---------------------------------------------------------------------- interiors\n// Small enough to read as drawings, so they are drawn.\nconst HOME = [\n  '^^^^^^^^^^^^',\n  '[[E[[[[[E[[[',\n  '[5_____7_R_[',\n  '[6____Q___([',\n  '[____314__ [',\n  '[Z_________[',\n  '[__________[',\n  '[[[[[d[[[[[[',\n].map(r => r.replace(/\\(/g, '_').padEnd(12, '_'));\n\nconst GRANHOUSE = [\n  '^^^^^^^^^^^^^^',\n  '[[E[[[[[[[E[[[',\n  '[R__7_G_7__J_[',\n  '[___________R[',\n  '[__Q_____Q___[',\n  '[_314___314__[',\n  '[____________[',\n  '[__k_____5___[',\n  '[________6___[',\n  '[[[[[[d[[[[[[[',\n].map(r => r.replace(/k/g, '_'));\n\nconst WORKSHOP = [\n  '^^^^^^^^^^^^^^',\n  '][E]]]]]]E]]]]',\n  ']_a____8888__]',\n  ']______8___X_]',\n  ']__y_______x_]',\n  ']____Q_______]',\n  ']____2_____Z_]',\n  ']____________]',\n  ']]]]]]d]]]]]]]',\n];\n\n// ---------------------------------------------------------------------- the world\nexport const MAPS = {\n  village: {\n    name: 'Emberhollow', village: true, music: 'village',\n    rows: villageRows(),\n    // Authored buildings that predate the player. Player-built ones come from village.js.\n    structures: [\n      { sprite: 'b.cottage.t2', x: 5, y: 8, w: 2, h: 2, overhang: 1, door: { x: 6, y: 9 }, to: 'home' },\n      { sprite: 'b.infirmary.t2', x: 16, y: 8, w: 2, h: 2, overhang: 1, door: { x: 17, y: 9 }, to: 'granhouse' },\n      { sprite: 'b.workshop.t2', x: 26, y: 8, w: 3, h: 2, overhang: 1, door: { x: 27, y: 9 }, to: 'workshop' },\n    ],\n    warps: [\n      { x: 21, y: 33, to: 'meadow', tx: 19, ty: 1, dir: 'down' },\n      { x: 20, y: 33, to: 'meadow', tx: 19, ty: 1, dir: 'down' },\n    ],\n    npcs: [\n      { who: 'mayor', x: 22, y: 21, dir: 'up', wander: 0, id: 'mayor' },\n      { who: 'gran', x: 18, y: 11, dir: 'down', wander: 1, id: 'gran' },\n      { who: 'kid', x: 25, y: 26, dir: 'left', wander: 3, id: 'kid' },\n      { who: 'smith', x: 28, y: 11, dir: 'down', wander: 1, id: 'smith' },\n      { who: 'baker', x: 12, y: 24, dir: 'right', wander: 2, id: 'baker' },\n      { who: 'farmer', x: 33, y: 26, dir: 'up', wander: 1, id: 'farmer' },\n      { who: 'weaver', x: 8, y: 20, dir: 'down', wander: 2, id: 'weaver' },\n      { who: 'fisher', x: 9, y: 29, dir: 'left', wander: 1, id: 'fisher' },\n    ],\n  },\n\n  meadow: {\n    name: 'Gladewind Meadow', music: 'field',\n    rows: meadowRows(),\n    encounters: [\n      { id: 'embercub', w: 12, lo: 3, hi: 5 },\n      { id: 'leafowl', w: 18, lo: 3, hi: 6 },\n      { id: 'aquarabbit', w: 12, lo: 3, hi: 5 },\n      { id: 'voltkit', w: 8, lo: 4, hi: 6 },\n      { id: 'florabloom', w: 14, lo: 3, hi: 6 },\n      { id: 'wisplet', w: 10, lo: 4, hi: 7 },\n      { id: 'terranox', w: 8, lo: 4, hi: 7 },\n    ],\n    warps: [\n      { x: 19, y: 0, to: 'village', tx: 21, ty: 32, dir: 'up' },\n      { x: 36, y: 21, to: 'forest', tx: 1, ty: 16, dir: 'right' },\n      { x: 37, y: 21, to: 'forest', tx: 1, ty: 16, dir: 'right' },\n    ],\n    npcs: [\n      { who: 'ranger', x: 21, y: 6, dir: 'down', wander: 2, id: 'ranger' },\n      { who: 'twin', x: 12, y: 17, dir: 'down', wander: 1, id: 'twinA' },\n      { who: 'peddler', x: 24, y: 20, dir: 'left', wander: 0, id: 'peddler' },\n    ],\n  },\n\n  forest: {\n    name: 'Hollowpine Wood', music: 'forest',\n    rows: forestRows(),\n    encounters: [\n      { id: 'leafowl', w: 20, lo: 6, hi: 10 },\n      { id: 'grovewing', w: 6, lo: 12, hi: 15 },\n      { id: 'drakindle', w: 8, lo: 7, hi: 11 },\n      { id: 'terranox', w: 14, lo: 6, hi: 10 },\n      { id: 'wisplet', w: 14, lo: 6, hi: 10 },\n      { id: 'florabloom', w: 12, lo: 6, hi: 9 },\n      { id: 'voltkit', w: 10, lo: 7, hi: 10 },\n    ],\n    warps: [\n      { x: 0, y: 16, to: 'meadow', tx: 35, ty: 21, dir: 'left' },\n      { x: 1, y: 16, to: 'meadow', tx: 35, ty: 21, dir: 'left' },\n    ],\n    npcs: [\n      { who: 'rival', x: 16, y: 12, dir: 'down', wander: 0, id: 'rival' },\n      { who: 'ranger', x: 11, y: 18, dir: 'right', wander: 2, id: 'ranger2' },\n    ],\n  },\n\n  riverside: {\n    name: 'Stillwater Reach', music: 'river',\n    rows: riversideRows(),\n    encounters: [\n      { id: 'aquarabbit', w: 24, lo: 5, hi: 9 },\n      { id: 'torrentide', w: 5, lo: 13, hi: 16 },\n      { id: 'wisplet', w: 14, lo: 5, hi: 8 },\n      { id: 'leafowl', w: 12, lo: 5, hi: 8 },\n      { id: 'terranox', w: 12, lo: 5, hi: 9 },\n    ],\n    warps: [\n      { x: 34, y: 12, to: 'village', tx: 3, ty: 25, dir: 'right' },\n      { x: 35, y: 12, to: 'village', tx: 3, ty: 25, dir: 'right' },\n    ],\n    npcs: [\n      { who: 'fisher', x: 12, y: 8, dir: 'right', wander: 0, id: 'fisher2' },\n    ],\n  },\n\n  home: {\n    name: 'Your Cottage', indoor: true, music: 'home',\n    rows: HOME,\n    warps: [{ x: 5, y: 7, to: 'village', tx: 6, ty: 10, dir: 'down' }],\n    npcs: [],\n  },\n\n  granhouse: {\n    name: \"Gran Willow's Warmhouse\", indoor: true, music: 'home',\n    rows: GRANHOUSE,\n    warps: [{ x: 6, y: 9, to: 'village', tx: 17, ty: 10, dir: 'down' }],\n    npcs: [{ who: 'gran', x: 6, y: 4, dir: 'down', wander: 0, id: 'granIn' }],\n  },\n\n  workshop: {\n    name: 'The Workshop', indoor: true, music: 'shop',\n    rows: WORKSHOP,\n    warps: [{ x: 6, y: 8, to: 'village', tx: 27, ty: 10, dir: 'down' }],\n    npcs: [{ who: 'smith', x: 3, y: 3, dir: 'right', wander: 0, id: 'smithIn' }],\n  },\n};\n\nexport const START = { map: 'village', x: 22, y: 24, dir: 'down' };\n","deps":{"../core/rng.js":"core/rng.js"}},{"id":"ui/title.js","code":"// The title screen — the first thing anyone sees.\n//\n// An ember drifting up from a banked hearth, the name set in the game's own font,\n// and a save summary on Continue so returning feels like returning somewhere.\n\nimport { R, LAYER } from '../core/renderer.js';\nimport { Input } from '../core/input.js';\nimport { Scenes } from '../core/scene.js';\nimport { Atlas } from '../art/atlas.js';\nimport { Audio } from '../core/audio.js';\nimport { UIx } from '../core/bridge.js';\nimport { Font } from '../core/font.js';\nimport { S, hasSave, load, resetSave, defaults, adopt, save } from '../state.js';\nimport { P, mix, shade } from '../art/palette.js';\nimport { clamp, ease, pad2 } from '../core/util.js';\nimport { makeRng } from '../core/rng.js';\nimport { START } from '../world/maps.js';\n\nconst rng = makeRng(77);\n\nfunction titleScene() {\n  let t = 0, sel = 0, busy = false;\n  const embers = [];\n  let saved = null;\n  let items = [];\n\n  function readSave() {\n    if (!hasSave()) { saved = null; return; }\n    // Peek without disturbing the live state: load(), read, then keep it — Continue\n    // wants exactly this state anyway, and New Journey resets it.\n    load();\n    saved = {\n      name: S.player.name,\n      level: S.village?.level || 1,\n      party: S.party.length,\n      day: S.clock?.day || 1,\n      mins: Math.floor((S.playtime || 0) / 3600),\n      bonded: S.stats?.bonded || 0,\n    };\n  }\n\n  function buildItems() {\n    items = saved\n      ? [{ id: 'continue', label: 'Continue' }, { id: 'new', label: 'New Journey' }, { id: 'settings', label: 'Settings' }]\n      : [{ id: 'new', label: 'New Journey' }, { id: 'settings', label: 'Settings' }];\n    sel = 0;\n  }\n\n  async function choose() {\n    const it = items[sel];\n    if (!it) return;\n    busy = true;\n    try {\n      Audio.sfx('confirm');\n      if (it.id === 'continue') {\n        await UIx.fade('out', 16);\n        Scenes.reset('overworld');\n        await UIx.fade('in', 16);\n      } else if (it.id === 'new') {\n        if (saved) {\n          const ok = await UIx.confirm('Starting a new journey will replace the one you have. Are you sure?');\n          if (!ok) return;\n        }\n        adopt(defaults());\n        S.player.map = START.map; S.player.x = START.x; S.player.y = START.y; S.player.dir = START.dir;\n        save();\n        await UIx.fade('out', 16);\n        Scenes.reset('overworld');\n        await UIx.fade('in', 16);\n        await opening();\n      } else {\n        await settings();\n      }\n    } finally { busy = false; }\n  }\n\n  async function settings() {\n    const i = await UIx.ask('Settings', [\n      Audio.muted ? 'Sound: off' : 'Sound: on',\n      `Text speed: ${['slow', 'normal', 'fast'][clamp((S.settings.textSpeed || 2) - 1, 0, 2)]}`,\n      'Back',\n    ]);\n    if (i === 0) { S.settings.muted = Audio.toggleMute(); await settings(); }\n    else if (i === 1) {\n      S.settings.textSpeed = ((S.settings.textSpeed || 2) % 3) + 1;\n      await settings();\n    }\n  }\n\n  async function opening() {\n    await UIx.sayMany([\n      'Emberhollow was a busy place once. Then it was quiet for a long time.',\n      'Gran Willow wrote to you anyway. She said the Hearthstone was still warm, and that warm is all you need to start.',\n      'Every journey begins at the hearth.',\n    ], { speaker: null });\n  }\n\n  function update() {\n    t++;\n    if (embers.length < 24 && t % 6 === 0) {\n      embers.push({ x: R.W / 2 + rng.range(-40, 40), y: 150, v: rng.range(0.22, 0.6), p: rng.range(0, 6.28), s: rng.float() < 0.3 ? 2 : 1 });\n    }\n    for (let i = embers.length - 1; i >= 0; i--) {\n      const e = embers[i];\n      e.y -= e.v; e.p += 0.03;\n      if (e.y < -4) embers.splice(i, 1);\n    }\n    if (busy || UIx.busy) return;\n    if (Input.pressed('down')) { sel = (sel + 1) % items.length; Audio.sfx('cursor'); }\n    if (Input.pressed('up')) { sel = (sel + items.length - 1) % items.length; Audio.sfx('cursor'); }\n    if (Input.pressed('a') || Input.pressed('start')) choose();\n  }\n\n  function render() {\n    R.layer(LAYER.GROUND, () => {\n      // Night sky over a hill, warmed from below by the hearth.\n      for (let y = 0; y < R.H; y++) {\n        const k = y / R.H;\n        R.rect(0, y, R.W, 1, mix('#141b2e', '#3d2b33', ease.inQuad(k)));\n      }\n      for (let i = 0; i < 40; i++) {\n        const sx = (i * 71) % R.W, sy = (i * 37) % 90;\n        const tw = 0.4 + 0.6 * Math.sin(t / 30 + i);\n        R.rect(sx, sy, 1, 1, `rgba(255,246,214,${0.15 + tw * 0.35})`);\n      }\n      // Hills\n      for (let x = 0; x < R.W; x++) {\n        const h1 = 128 + Math.sin(x / 46) * 7 + Math.sin(x / 13) * 2;\n        R.rect(x, h1, 1, R.H - h1, '#20321f');\n        const h2 = 142 + Math.sin(x / 31 + 2) * 6;\n        R.rect(x, h2, 1, R.H - h2, '#16241a');\n      }\n      // The hearth itself, centred under the title\n      const gx = R.W / 2, gy = 162;\n      R.glow(gx, gy, 46 + Math.sin(t / 22) * 4, 'rgba(255,176,86,0.5)', 0.7);\n      for (let i = 0; i < 3; i++) {\n        const w = 22 - i * 6;\n        R.rect(gx - w / 2, gy - i * 3, w, 3, [P.ember3, P.ember2, P.ember1][i]);\n      }\n      R.rect(gx - 14, gy + 4, 28, 3, P.rock3);\n    });\n\n    R.layer(LAYER.MID, () => {\n      for (const e of embers) {\n        const x = e.x + Math.sin(e.p) * 5;\n        const a = clamp(e.y / 150, 0, 1);\n        R.rect(x, e.y, e.s, e.s, `rgba(255,${170 + Math.floor(60 * a)},110,${a})`);\n      }\n    });\n\n    R.layer(LAYER.UI, () => {\n      // Title, with a soft ember glow behind it.\n      const cx = R.W / 2;\n      const bob = Math.sin(t / 44) * 1;\n      R.glow(cx, 44 + bob, 84, 'rgba(245,200,119,0.14)', 0.9);\n      R.text('GUARDIANS', cx, 30 + bob, { align: 'center', color: P.gold0, shadow: '#5a3410' });\n      R.text('OF THE HEARTH', cx, 44 + bob, { align: 'center', color: P.gold1, shadow: '#5a3410' });\n      R.rect(cx - 54, 58 + bob, 108, 1, P.gold3);\n\n      // Menu\n      const baseY = 92;\n      items.forEach((it, i) => {\n        const on = i === sel;\n        const y = baseY + i * 16;\n        const w = 96;\n        if (on) {\n          R.rect(cx - w / 2, y - 3, w, 14, 'rgba(245,200,119,0.16)');\n          R.stroke(cx - w / 2, y - 3, w, 14, P.gold2);\n          const c = Atlas.tryGet('ui.cursor');\n          if (c) R.blit(c, cx - w / 2 - 9, y + 1 + Math.sin(t / 8) * 0.6);\n        }\n        R.text(it.label, cx, y, { align: 'center', color: on ? P.gold0 : P.ui1 });\n      });\n\n      // Save summary — returning should feel like returning somewhere.\n      if (saved) {\n        const y = R.H - 30;\n        R.text(`${saved.name} · Emberhollow Lv ${saved.level} · Day ${saved.day}`, cx, y,\n          { align: 'center', color: P.ui2 });\n        R.text(`${saved.party} in your party · ${saved.bonded} bonded · ${saved.mins} min played`, cx, y + 10,\n          { align: 'center', color: P.ui2 });\n      }\n    });\n  }\n\n  return {\n    enter() {\n      readSave();\n      buildItems();\n      t = 0;\n      if (Audio.hasSong('title')) Audio.play('title');\n    },\n    update, render,\n  };\n}\n\nexport function register() {\n  Scenes.register('title', () => titleScene());\n}\n","deps":{"../core/renderer.js":"core/renderer.js","../core/input.js":"core/input.js","../core/scene.js":"core/scene.js","../art/atlas.js":"art/atlas.js","../core/audio.js":"core/audio.js","../core/bridge.js":"core/bridge.js","../core/font.js":"core/font.js","../state.js":"state.js","../art/palette.js":"art/palette.js","../core/util.js":"core/util.js","../core/rng.js":"core/rng.js","../world/maps.js":"world/maps.js"}},{"id":"ui/pause.js","code":"// The start-button menu. Its whole job is to get you somewhere else quickly and\n// never crash on a piece that isn't there.\n\nimport { R, LAYER } from '../core/renderer.js';\nimport { Input } from '../core/input.js';\nimport { Scenes } from '../core/scene.js';\nimport { Atlas } from '../art/atlas.js';\nimport { Audio } from '../core/audio.js';\nimport { UIx, Hooks } from '../core/bridge.js';\nimport { Font } from '../core/font.js';\nimport { S, save } from '../state.js';\nimport { P, mix } from '../art/palette.js';\nimport { clockText, timeOfDay } from '../world/daynight.js';\n\nconst ITEMS = [\n  { id: 'party', label: 'Guardians', scene: 'party', hint: 'Your team' },\n  { id: 'village', label: 'Village', scene: 'village', hint: 'Build and upgrade' },\n  { id: 'missions', label: 'Missions', scene: 'missions', hint: 'Family missions' },\n  { id: 'dex', label: 'Records', scene: 'dex', hint: 'Guardians you have met' },\n  { id: 'save', label: 'Save', hint: 'Keep your progress' },\n  { id: 'settings', label: 'Settings', hint: 'Sound and text' },\n  { id: 'close', label: 'Close', hint: '' },\n];\n\nfunction pauseScene() {\n  let sel = 0, t = 0, busy = false;\n\n  async function pick() {\n    const it = ITEMS[sel];\n    busy = true;\n    try {\n      Audio.sfx('confirm');\n      if (it.id === 'close') { Scenes.pop(); return; }\n      if (it.id === 'save') {\n        save();\n        UIx.toast('Progress kept', { ms: 1600 });\n        return;\n      }\n      if (it.id === 'settings') { await settings(); return; }\n      if (it.scene && Scenes.has(it.scene)) Scenes.push(it.scene);\n      else await UIx.say('Not open yet.');\n    } finally { busy = false; }\n  }\n\n  async function settings() {\n    const i = await UIx.ask('Settings', [\n      Audio.muted ? 'Sound: off' : 'Sound: on',\n      `Text speed: ${['slow', 'normal', 'fast'][Math.max(0, Math.min(2, (S.settings.textSpeed || 2) - 1))]}`,\n      'Back to title',\n      'Back',\n    ]);\n    if (i === 0) { S.settings.muted = Audio.toggleMute(); await settings(); }\n    else if (i === 1) { S.settings.textSpeed = ((S.settings.textSpeed || 2) % 3) + 1; await settings(); }\n    else if (i === 2) {\n      if (await UIx.confirm('Return to the title? Your progress is saved.')) {\n        save();\n        await UIx.fade('out', 14);\n        Scenes.reset('title');\n        await UIx.fade('in', 14);\n      } else await settings();\n    }\n  }\n\n  return {\n    pausesBelow: true, drawsBelow: true,\n    update() {\n      t++;\n      if (busy || UIx.busy) return;\n      if (Input.pressed('b') || Input.pressed('start')) { Audio.sfx('cancel'); Scenes.pop(); return; }\n      if (Input.pressed('down')) { sel = (sel + 1) % ITEMS.length; Audio.sfx('cursor'); }\n      if (Input.pressed('up')) { sel = (sel + ITEMS.length - 1) % ITEMS.length; Audio.sfx('cursor'); }\n      if (Input.pressed('a')) pick();\n    },\n    render() {\n      R.layer(LAYER.UI, () => {\n        R.rect(0, 0, R.W, R.H, 'rgba(10,8,14,0.35)');\n        // Tightened so the menu and the status card together clear the hint bar —\n        // the last card row used to sit underneath it.\n        const w = 108, x = R.W - w - 6, y = 6, h = ITEMS.length * 13 + 8;\n        UIx.panel(x, y, w, h, 'paper');\n        ITEMS.forEach((it, i) => {\n          const iy = y + 5 + i * 13;\n          const on = i === sel;\n          if (on) {\n            R.rect(x + 4, iy - 2, w - 8, 13, mix(P.gold1, P.paper0, 0.5));\n            const c = Atlas.tryGet('ui.cursor');\n            if (c) R.blit(c, x - 3, iy + Math.sin(t / 8) * 0.6);\n          }\n          R.text(it.label, x + 12, iy, { color: on ? P.ink : P.ink3, shadow: false });\n        });\n\n        // A status card, so the menu also answers \"where am I and how am I doing\".\n        const cy = y + h + 5, cw = w, ch = 51;\n        UIx.panel(x, cy, cw, ch, 'paper');\n        const rows = [\n          [S.player.name, `Day ${S.clock.day}`],\n          [clockText(), timeOfDay()],\n          ['Coins', String(S.coins)],\n          ['Hearth', String(S.hearth)],\n          ['Village', `Lv ${safeLevel()}`],\n        ];\n        rows.forEach(([k, v], i) => {\n          const ry = cy + 4 + i * 9;\n          R.text(k, x + 8, ry, { color: P.ui2, shadow: false });\n          R.text(v, x + cw - 8, ry, { color: P.ink2, shadow: false, align: 'right' });\n        });\n\n        const hint = ITEMS[sel]?.hint;\n        if (hint) {\n          R.rect(6, R.H - 14, R.W - 12, 12, 'rgba(20,16,12,0.7)');\n          R.text(hint, 12, R.H - 12, { color: P.ui1 });\n        }\n      });\n    },\n  };\n}\n\nconst safeLevel = () => { try { return Hooks.village.level(); } catch { return 1; } };\n\nexport function register() {\n  Scenes.register('pause', () => pauseScene());\n}\n","deps":{"../core/renderer.js":"core/renderer.js","../core/input.js":"core/input.js","../core/scene.js":"core/scene.js","../art/atlas.js":"art/atlas.js","../core/audio.js":"core/audio.js","../core/bridge.js":"core/bridge.js","../core/font.js":"core/font.js","../state.js":"state.js","../art/palette.js":"art/palette.js","../world/daynight.js":"world/daynight.js"}},{"id":"world/legend.js","code":"// Map authoring legend: one character per tile.\n//\n// Maps are written as arrays of equal-length strings, so a map is readable as a map\n// in the source. Everything expensive — autotile edge masks, tree canopy expansion,\n// solidity — is derived at load time by map.js, never authored by hand.\n//\n// Fields\n//   g      ground tile name (LAYER.GROUND)\n//   fam    autotile family; the ground name becomes `t.<fam>.m<mask>`\n//   mid    tile drawn on LAYER.MID (over ground, under the player)\n//   over   tile drawn on LAYER.OVER (above the player — canopies, roofs)\n//   solid  blocks movement\n//   tag    semantic marker read by other systems ('hearth', 'door', 'sign', …)\n//   grass  triggers wild-encounter checks and the rustle effect\n//   ledge  hop-down direction\n//   tree   2x2 canopy anchor (top-left); pine is 1x2\n//   water  swimmable/fishable surface\n\nconst G = 't.grass';\n\nexport const LEGEND = {\n  // --- open ground ---\n  '.': { g: G },\n  ',': { g: G, mid: 't.grass.tuft' },\n  '`': { g: G, mid: 't.grass.pebble' },\n  '*': { g: G, mid: 't.grass.flower' },\n  '%': { g: G, mid: 't.grass.flower2' },\n  '\"': { g: G, mid: 't.tallgrass', grass: true },\n  ';': { g: G, mid: 't.leaves' },\n\n  // --- autotiled families ---\n  'p': { g: 't.path', fam: 'path' },\n  'g': { g: 't.gravel' },\n  'z': { g: 't.plaza' },\n  'k': { g: 't.cobble' },\n  's': { g: 't.sand', fam: 'sand' },\n  'w': { g: 't.water', fam: 'water', solid: true, water: true },\n  'W': { g: 't.deepwater', fam: 'deepwater', solid: true, water: true },\n  'n': { g: 't.snow', fam: 'snow' },\n  'f': { g: 't.floor', fam: 'floor' },\n\n  // --- cliffs & walls ---\n  'c': { g: 't.cliff.face', solid: true },\n  'C': { g: 't.cliff.top' },\n  '#': { g: G, mid: 't.wall.stone', solid: true },\n  'H': { g: G, mid: 't.hedge', solid: true },\n  '<': { g: 't.stair.up' },\n  '>': { g: 't.stair.down' },\n  'v': { g: G, ledge: 'down' },\n\n  // --- water dressing ---\n  '~': { g: 't.water', fam: 'water', mid: 't.reed', solid: true, water: true },\n  'q': { g: 't.water', fam: 'water', mid: 't.lilypad', solid: true, water: true },\n  'j': { g: 't.water', fam: 'water', mid: 't.cattail', solid: true, water: true },\n  '=': { g: 't.bridge.h' },\n  ':': { g: 't.bridge.v' },\n\n  // --- fences & structure ---\n  '-': { g: G, mid: 't.fence.h', solid: true },\n  '|': { g: G, mid: 't.fence.v', solid: true },\n  '+': { g: G, mid: 't.fence.post', solid: true },\n  'A': { g: 't.path', fam: 'path', mid: 't.fence.gate' },\n\n  // --- trees & flora (2x2 unless noted) ---\n  'T': { g: G, tree: 'oak' },\n  'Y': { g: G, tree: 'pine' },\n  'b': { g: G, mid: 't.bush', solid: true },\n  'B': { g: G, mid: 't.bush.berry', solid: true },\n  'o': { g: G, mid: 't.rock.small', solid: true },\n  'O': { g: G, mid: 't.rock.big', solid: true },\n  'u': { g: G, mid: 't.stump', solid: true },\n  'L': { g: G, mid: 't.log', solid: true },\n  'm': { g: G, mid: 't.mushroom' },\n\n  // --- props ---\n  'i': { g: G, mid: 't.sign', solid: true, tag: 'sign' },\n  'I': { g: 't.path', fam: 'path', mid: 't.signpost', solid: true, tag: 'sign' },\n  'l': { g: 't.path', fam: 'path', mid: 't.lamp', solid: true, tag: 'lamp' },\n  'e': { g: G, mid: 't.well', solid: true, tag: 'well' },\n  'x': { g: G, mid: 't.crate', solid: true },\n  'X': { g: G, mid: 't.barrel', solid: true },\n  'h': { g: G, mid: 't.hay', solid: true },\n  'K': { g: 't.plaza', mid: 't.bench', solid: true, tag: 'bench' },\n  'P': { g: G, mid: 't.planter', solid: true },\n  'F': { g: G, mid: 't.flowerpot', solid: true },\n  'M': { g: G, mid: 't.mailbox', solid: true, tag: 'mail' },\n  'S': { g: G, mid: 't.scarecrow', solid: true },\n  'V': { g: G, mid: 't.beehive', solid: true },\n  'N': { g: 't.crop.soil', mid: 't.crop.grown' },\n  'n_': { g: 't.crop.soil', mid: 't.crop.sprout' },\n\n  // --- the village heart: where village.js pins the Hearthstone ---\n  '@': { g: 't.plaza', tag: 'hearth' },\n  '0': { g: 't.plaza' },\n\n  // --- interiors ---\n  'F_': { g: 't.floor.wood' },\n  '_': { g: 't.floor.wood' },\n  '/': { g: 't.floor.wood.a' },\n  '\\\\': { g: 't.floor.tile' },\n  'r': { g: 't.floor.rug' },\n  '[': { g: 't.iwall.plaster', solid: true },\n  ']': { g: 't.iwall.plank', solid: true },\n  '^': { g: 't.iwall.top', solid: true },\n  'E': { g: 't.iwall.window', solid: true },\n  'd': { g: 't.floor.wood', mid: 't.door.wood', tag: 'exit' },\n  'D': { g: G, mid: 't.door.arch', tag: 'door' },\n  't': { g: 't.floor.wood', mid: 't.table', solid: true },\n  'Q': { g: 't.floor.wood', mid: 't.table.set', solid: true },\n  '1': { g: 't.floor.wood', mid: 't.chair.d', solid: true },\n  '2': { g: 't.floor.wood', mid: 't.chair.u', solid: true },\n  '3': { g: 't.floor.wood', mid: 't.chair.l', solid: true },\n  '4': { g: 't.floor.wood', mid: 't.chair.r', solid: true },\n  '5': { g: 't.floor.wood', mid: 't.bed.head', solid: true },\n  '6': { g: 't.floor.wood', mid: 't.bed.foot', solid: true },\n  '7': { g: 't.floor.wood', mid: 't.shelf.books', solid: true },\n  '8': { g: 't.floor.wood', mid: 't.counter', solid: true },\n  '9': { g: 't.floor.wood', mid: 't.stove', solid: true, tag: 'stove' },\n  'G': { g: 't.floor.wood', mid: 't.hearth.lit', solid: true, tag: 'hearthfire' },\n  'J': { g: 't.floor.wood', mid: 't.cabinet', solid: true },\n  'R': { g: 't.floor.wood', mid: 't.plant.pot', solid: true },\n  'U': { g: 't.floor.wood', mid: 't.painting', solid: true, tag: 'painting' },\n  'Z': { g: 't.floor.wood', mid: 't.chest', solid: true, tag: 'chest' },\n  'a': { g: 't.floor.wood', mid: 't.anvil', solid: true, tag: 'anvil' },\n  'y': { g: 't.floor.wood', mid: 't.loom', solid: true, tag: 'loom' },\n  'k_': { g: 't.floor.wood', mid: 't.basket', solid: true },\n};\n\n// Unknown characters fall back to plain grass rather than crashing a whole map.\nexport const cellFor = ch => LEGEND[ch] || LEGEND['.'];\nexport const isTree = ch => !!LEGEND[ch]?.tree;\n","deps":{}},{"id":"world/map.js","code":"// Runtime map: bakes authored character rows into flat arrays once, then answers\n// lookups in O(1). Autotile masks, tree canopies, and solidity are all derived here\n// so map authors only ever write terrain.\n\nimport { cellFor } from './legend.js';\nimport { MAPS } from './maps.js';\nimport { TILE } from '../core/util.js';\nimport { hash2 } from '../core/rng.js';\n\nconst cache = new Map();\n\n// Four subtle grass variants, chosen by position hash so a field never looks tiled\n// and always looks the same on revisit.\nconst GRASS_VARIANTS = ['t.grass', 't.grass.a', 't.grass.b', 't.grass.c'];\n\nclass GameMap {\n  constructor(id, def) {\n    this.id = id;\n    this.def = def;\n    this.rows = def.rows;\n    this.h = def.rows.length;\n    this.w = Math.max(...def.rows.map(r => r.length));\n    this.village = !!def.village;\n    this.indoor = !!def.indoor;\n    this.music = def.music || null;\n    this.name = def.name || id;\n    this.bounds = { w: this.w, h: this.h };\n    this.warps = (def.warps || []).slice();\n    this.encounters = def.encounters || null;\n    this.npcs = def.npcs || [];\n    this.structures = def.structures || [];\n    this.bake();\n    this.applyStructures();\n  }\n\n  // Authored buildings (the ones that predate the player) block their footprint and\n  // turn their door tile into a warp, so the world reads as lived-in from tile one.\n  applyStructures() {\n    for (const st of this.structures) {\n      for (let j = st.y; j < st.y + st.h; j++) {\n        for (let i = st.x; i < st.x + st.w; i++) {\n          if (this.inside(i, j)) this._solid[this.idx(i, j)] = 1;\n        }\n      }\n      if (st.door) {\n        const i = this.idx(st.door.x, st.door.y);\n        if (this.inside(st.door.x, st.door.y)) {\n          this._solid[i] = 0;\n          this._tag[i] = 'door';\n          this._mid[i] = 't.door.wood';\n        }\n        if (st.to) {\n          const target = MAPS[st.to];\n          const back = target?.warps?.find(w => w.to === this.id);\n          this.warps.push({\n            x: st.door.x, y: st.door.y, to: st.to,\n            tx: back ? back.x : 1, ty: back ? back.y : 1,\n            dir: 'up', door: true,\n          });\n        }\n      }\n    }\n  }\n\n  bake() {\n    const n = this.w * this.h;\n    this._ground = new Array(n).fill('t.grass');\n    this._mid = new Array(n).fill(null);\n    this._over = new Array(n).fill(null);\n    this._solid = new Uint8Array(n);\n    this._tag = new Array(n).fill(null);\n    this._grass = new Uint8Array(n);\n    this._ledge = new Array(n).fill(null);\n    this._fam = new Array(n).fill(null);\n    this._water = new Uint8Array(n);\n\n    // Pass 1: place everything the legend states directly.\n    for (let y = 0; y < this.h; y++) {\n      const row = this.rows[y];\n      for (let x = 0; x < this.w; x++) {\n        const i = y * this.w + x;\n        const ch = row[x] ?? '.';\n        const c = cellFor(ch);\n        this._ground[i] = c.g || 't.grass';\n        this._fam[i] = c.fam || null;\n        if (c.mid) this._mid[i] = c.mid;\n        if (c.over) this._over[i] = c.over;\n        if (c.solid) this._solid[i] = 1;\n        if (c.tag) this._tag[i] = c.tag;\n        if (c.grass) this._grass[i] = 1;\n        if (c.ledge) this._ledge[i] = c.ledge;\n        if (c.water) this._water[i] = 1;\n        if (c.tree) this.placeTree(x, y, c.tree);\n      }\n    }\n\n    // Pass 2: autotile masks, now that every family is known.\n    for (let y = 0; y < this.h; y++) {\n      for (let x = 0; x < this.w; x++) {\n        const i = y * this.w + x;\n        const fam = this._fam[i];\n        if (!fam) {\n          // Quiet variation for plain grass only — never for authored accents.\n          if (this._ground[i] === 't.grass') {\n            this._ground[i] = GRASS_VARIANTS[Math.floor(hash2(x, y, 7) * 4)];\n          }\n          continue;\n        }\n        let m = 0;\n        if (this.famAt(x, y - 1) === fam) m |= 1;\n        if (this.famAt(x + 1, y) === fam) m |= 2;\n        if (this.famAt(x, y + 1) === fam) m |= 4;\n        if (this.famAt(x - 1, y) === fam) m |= 8;\n        this._ground[i] = `t.${fam}.m${m}`;\n      }\n    }\n  }\n\n  // Off-map counts as the same family, so shorelines don't grow a rim at the edge.\n  famAt(x, y) {\n    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return this._edgeFam ?? null;\n    return this._fam[y * this.w + x];\n  }\n\n  // 'oak' is a 2x2 canopy anchored top-left; its lower row is the solid trunk band.\n  // 'pine' is 1x2. Canopies live on the OVER layer so the player walks behind them.\n  placeTree(x, y, kind) {\n    const put = (xx, yy, name, solid) => {\n      if (xx < 0 || yy < 0 || xx >= this.w || yy >= this.h) return;\n      const i = yy * this.w + xx;\n      this._over[i] = name;\n      if (solid) this._solid[i] = 1;\n    };\n    if (kind === 'pine') {\n      put(x, y, 't.pine.top', false);\n      put(x, y + 1, 't.pine.trunk', true);\n    } else {\n      put(x, y, 't.tree.canopy.nw', false);\n      put(x + 1, y, 't.tree.canopy.ne', false);\n      put(x, y + 1, 't.tree.canopy.sw', true);\n      put(x + 1, y + 1, 't.tree.canopy.se', true);\n    }\n  }\n\n  // ---- lookups ----\n  inside(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h; }\n  idx(x, y) { return y * this.w + x; }\n\n  ground(x, y) { return this.inside(x, y) ? this._ground[this.idx(x, y)] : null; }\n  mid(x, y) { return this.inside(x, y) ? this._mid[this.idx(x, y)] : null; }\n  over(x, y) { return this.inside(x, y) ? this._over[this.idx(x, y)] : null; }\n  tag(x, y) { return this.inside(x, y) ? this._tag[this.idx(x, y)] : null; }\n  isGrass(x, y) { return this.inside(x, y) ? !!this._grass[this.idx(x, y)] : false; }\n  isWater(x, y) { return this.inside(x, y) ? !!this._water[this.idx(x, y)] : false; }\n  ledge(x, y) { return this.inside(x, y) ? this._ledge[this.idx(x, y)] : null; }\n\n  /** Terrain solidity only. The overworld adds buildings, NPCs, and the player. */\n  solid(x, y) {\n    if (!this.inside(x, y)) return true;      // the world edge is a wall\n    return !!this._solid[this.idx(x, y)];\n  }\n\n  warpAt(x, y) {\n    for (const w of this.warps) if (w.x === x && w.y === y) return w;\n    return null;\n  }\n\n  encounterTable(x, y) {\n    if (!this.encounters) return null;\n    if (!this.isGrass(x, y)) return null;\n    return this.encounters;\n  }\n\n  /** Every tile carrying a tag, for systems that want to find their own markers. */\n  findTag(tag) {\n    const out = [];\n    for (let i = 0; i < this._tag.length; i++) {\n      if (this._tag[i] === tag) out.push({ x: i % this.w, y: Math.floor(i / this.w) });\n    }\n    return out;\n  }\n\n  get pixelW() { return this.w * TILE; }\n  get pixelH() { return this.h * TILE; }\n}\n\nexport function loadMap(id) {\n  if (cache.has(id)) return cache.get(id);\n  const def = MAPS[id];\n  if (!def) throw new Error(`[map] unknown map \"${id}\"`);\n  const m = new GameMap(id, def);\n  cache.set(id, m);\n  return m;\n}\n\nexport const mapIds = () => Object.keys(MAPS);\nexport const clearMapCache = () => cache.clear();\n","deps":{"./legend.js":"world/legend.js","./maps.js":"world/maps.js","../core/util.js":"core/util.js","../core/rng.js":"core/rng.js"}},{"id":"world/npc.js","code":"// NPCs: grid-aligned like the player, with a small wander radius, a notice reaction,\n// and dialogue that knows how far along the village is.\n\nimport { DIR_VEC, opposite, dirTowards, TILE } from '../core/util.js';\nimport { Atlas } from '../art/atlas.js';\nimport { R } from '../core/renderer.js';\nimport { UIx, Hooks } from '../core/bridge.js';\nimport { S, flag, setFlag } from '../state.js';\nimport { makeRng } from '../core/rng.js';\nimport { Audio } from '../core/audio.js';\n\nconst WALK_FRAMES = 14;          // NPCs amble; the player is quicker\nconst rng = makeRng(20260730);\n\nexport class Npc {\n  constructor(def, map) {\n    this.def = def;\n    this.id = def.id || `${def.who}@${def.x},${def.y}`;\n    this.who = def.who;\n    this.home = { x: def.x, y: def.y };\n    this.x = def.x; this.y = def.y;\n    this.px = def.x * TILE; this.py = def.y * TILE;\n    this.dir = def.dir || 'down';\n    this.wander = def.wander ?? 0;\n    this.map = map;\n    this.frame = 0; this.anim = 0;\n    this.moving = false; this.t = 0;\n    this.fx = this.x; this.fy = this.y;\n    this.cool = 40 + Math.floor(rng.float() * 120);\n    this.noticed = 0;\n    this.talking = false;\n  }\n\n  get tile() { return { x: this.x, y: this.y }; }\n\n  face(dir) { if (dir) this.dir = dir; }\n\n  canStep(nx, ny, blocked) {\n    if (this.map.solid(nx, ny)) return false;\n    if (Math.abs(nx - this.home.x) > this.wander || Math.abs(ny - this.home.y) > this.wander) return false;\n    return !blocked(nx, ny);\n  }\n\n  update(blocked) {\n    if (this.moving) {\n      this.t++;\n      const k = Math.min(1, this.t / WALK_FRAMES);\n      this.px = (this.fx + (this.x - this.fx) * k) * TILE;\n      this.py = (this.fy + (this.y - this.fy) * k) * TILE;\n      this.anim++;\n      if (k >= 1) { this.moving = false; this.fx = this.x; this.fy = this.y; }\n      return;\n    }\n    this.px = this.x * TILE; this.py = this.y * TILE;\n    if (this.noticed > 0) this.noticed--;\n    if (this.talking || this.wander <= 0) return;\n    if (--this.cool > 0) return;\n    this.cool = 70 + Math.floor(rng.float() * 160);\n\n    const dir = ['up', 'down', 'left', 'right'][Math.floor(rng.float() * 4)];\n    const v = DIR_VEC[dir];\n    const nx = this.x + v.x, ny = this.y + v.y;\n    this.dir = dir;\n    if (this.canStep(nx, ny, blocked)) {\n      this.fx = this.x; this.fy = this.y;\n      this.x = nx; this.y = ny;\n      this.moving = true; this.t = 0;\n    }\n  }\n\n  notice(playerX, playerY) {\n    if (this.noticed > 0) return;\n    if (Math.abs(playerX - this.x) + Math.abs(playerY - this.y) <= 2) {\n      this.noticed = 50;\n    }\n  }\n\n  draw(cam) {\n    const name = `c.${this.who}.${this.dir}`;\n    const img = Atlas.tryGet(name, this.moving ? (Math.floor(this.anim / 7) % 4) : 0);\n    const sx = Math.round(this.px - cam.x);\n    const sy = Math.round(this.py - cam.y) - 8;   // 16x24 sprite stands on its tile\n    const shadow = Atlas.tryGet('fx.shadow');\n    if (shadow) R.blit(shadow, sx, sy + 19, { alpha: 0.5 });\n    if (img) R.blit(img, sx, sy);\n    else R.rect(sx + 2, sy + 4, 12, 20, '#ff00ff');\n    if (this.noticed > 30) {\n      const ex = Atlas.tryGet('fx.exclaim');\n      if (ex) R.blit(ex, sx, sy - 12);\n      else R.text('!', sx + 6, sy - 10, { color: '#ffe066' });\n    }\n  }\n\n  async interact() {\n    this.talking = true;\n    const dir = dirTowards(this.x, this.y, S.player.x, S.player.y);\n    if (dir) this.face(dir);\n    Audio.sfx('confirm');\n    try {\n      const lines = linesFor(this);\n      for (const l of lines) await UIx.say(l.text, { speaker: l.speaker ?? nameOf(this.who) });\n      await afterTalk(this);\n    } finally {\n      this.talking = false;\n    }\n  }\n}\n\nexport const NAMES = {\n  hero: 'You', mayor: 'Mayor Bramble', gran: 'Gran Willow', kid: 'Pip',\n  farmer: 'Odell', smith: 'Hesta', baker: 'Marrow', fisher: 'Quill',\n  ranger: 'Sable', weaver: 'Nettle', peddler: 'Cobb', twin: 'Wick',\n  rival: 'Ash-of-the-North',\n};\nexport const nameOf = who => NAMES[who] || 'Villager';\n\n// Dialogue reacts to village level and story flags so the world notices your progress.\nfunction linesFor(npc) {\n  const lv = (() => { try { return Hooks.village.level(); } catch { return 1; } })();\n  const party = S.party.length;\n  const T = t => ({ text: t });\n\n  switch (npc.who) {\n    case 'mayor':\n      if (!flag('metMayor')) return [\n        T('You must be the one Gran wrote about. Welcome to Emberhollow.'),\n        T('We are a small place. Half our roofs are older than I am, and the other half are only ideas.'),\n        T('Stand by the Hearthstone when you have a moment. It remembers every good thing this village does.'),\n      ];\n      if (lv <= 1) return [T('The Hearthstone is quiet, but it is listening. Build something and it will warm.')];\n      if (lv < 4) return [T(`Level ${lv} already. I walked past the plaza this morning and did not recognise it.`)];\n      return [T('People are moving back. Whole families. I did not think I would see that again.')];\n\n    case 'gran':\n      if (!flag('gotStarter')) return [\n        T('There you are. Come in out of the wind — the kettle is on.'),\n        T('The Guardians are not pets, mind. They are neighbours who happen to have paws.'),\n        T('Come inside and I will introduce you to one properly.'),\n      ];\n      return [\n        T(party ? 'Your Guardian looks well fed. Good. That is half of it.' : 'Go on, take one of mine. The house is too quiet.'),\n        T('A hearth is only a fire until someone sits at it.'),\n      ];\n\n    case 'kid': return [\n      T('I saw a Leafowl in the tall grass and it looked RIGHT at me.'),\n      T('If you go in the grass, walk slow. They do not like loud feet.'),\n    ];\n    case 'smith': return [\n      T('Bring me anything bent and I will make it straight. Bring me anything straight and I will make it better.'),\n      T(lv >= 3 ? 'The workshop is busy again. I have not been busy in years.' : 'Quiet week. Quiet year, really.'),\n    ];\n    case 'baker': return [\n      T('Bread is the only thing in this village older than the Mayor.'),\n      T('Come by after your family has cooked together. I want to hear what you made.'),\n    ];\n    case 'farmer': return [\n      T('Rain came late. The beds forgave me anyway.'),\n      T('A Terranox got into the carrots. I have decided to call that fertiliser.'),\n    ];\n    case 'fisher': return [\n      T('The river runs west of here, past the old bridge.'),\n      T('Stillwater Reach. Good water. Better silence.'),\n    ];\n    case 'weaver': return [\n      T('Every banner over the plaza came off this loom.'),\n      T(lv >= 4 ? 'I am running out of plaza to hang them on.' : 'One day there will be enough village to decorate.'),\n    ];\n    case 'ranger': return [\n      T('Tall grass means Guardians. Step in and something will notice you.'),\n      T('Weaken it first, then offer a charm. Never the other way round.'),\n    ];\n    case 'peddler': return [\n      T('Charms, salves, and unreliable directions. Two of the three are for sale.'),\n    ];\n    case 'twin': return [\n      T('My brother says he saw the Hearthstone glow. My brother says a lot of things.'),\n    ];\n    case 'rival':\n      if (!flag('metRival')) return [\n        T('So you are the one taking the long way round.'),\n        T('I came south to see whether Emberhollow was worth saving. I have not decided.'),\n        T('Show me something worth the walk and I will change my mind.'),\n      ];\n      return [T('Still building. Good. I will keep watching.')];\n    default: return [T('Lovely day for it.')];\n  }\n}\n\nasync function afterTalk(npc) {\n  if (npc.who === 'mayor' && !flag('metMayor')) setFlag('metMayor');\n  if (npc.who === 'rival' && !flag('metRival')) setFlag('metRival');\n  try { Hooks.missions.note('talk', { who: npc.who }); } catch {}\n}\n\nexport function makeNpcs(map) {\n  return (map.npcs || []).map(d => new Npc(d, map));\n}\n","deps":{"../core/util.js":"core/util.js","../art/atlas.js":"art/atlas.js","../core/renderer.js":"core/renderer.js","../core/bridge.js":"core/bridge.js","../state.js":"state.js","../core/rng.js":"core/rng.js","../core/audio.js":"core/audio.js"}},{"id":"world/overworld.js","code":"// The overworld: movement, camera, layer composition, encounters, warps, interaction.\n//\n// Movement feel is the headline quality target, so the rules are explicit:\n//   * tapping a direction you are not facing TURNS you, it does not move you\n//   * holding it walks, one tile per step, with no pause between chained steps\n//   * a step that has begun always completes, even if you let go mid-step\n//   * running is the same grid, just faster, with dust\n// Everything else in this file exists to keep that responsive.\n\nimport { R, LAYER } from '../core/renderer.js';\nimport { Input } from '../core/input.js';\nimport { Scenes } from '../core/scene.js';\nimport { Atlas } from '../art/atlas.js';\nimport { Audio } from '../core/audio.js';\nimport { UIx, Hooks } from '../core/bridge.js';\nimport { S, save } from '../state.js';\nimport { Bus, EV } from '../core/events.js';\nimport { TILE, DIR_VEC, clamp, ease } from '../core/util.js';\nimport { makeRng } from '../core/rng.js';\nimport { loadMap } from './map.js';\nimport { START } from './maps.js';\nimport { makeNpcs, nameOf } from './npc.js';\nimport { drawLighting, drawWeather, drawNightGlow, isNight, lampTile } from './daynight.js';\n\n// --- timing constants: the whole feel lives here -----------------------------\nconst WALK = 8;          // frames per tile walking\nconst RUN = 5;           // frames per tile running\nconst TURN = 4;          // frames a turn-in-place takes before a step may begin\nconst HOP = 18;          // frames for a ledge hop\nconst ENCOUNTER_RATE = 0.11;\nconst ENCOUNTER_GRACE = 3;   // steps of safety after a battle or a map change\n\nconst rng = makeRng(90210);\n\nlet map = null;\nlet npcs = [];\nlet player = null;\nlet busy = false;          // a scene/transition owns the player\nlet grace = ENCOUNTER_GRACE;\nlet dust = [];\nlet rustle = [];\n\nfunction makePlayer() {\n  return {\n    x: S.player.x, y: S.player.y, dir: S.player.dir || 'down',\n    px: S.player.x * TILE, py: S.player.y * TILE,\n    fx: S.player.x, fy: S.player.y,\n    moving: false, t: 0, dur: WALK, anim: 0, running: false,\n    turn: 0, bump: 0, hop: null,\n  };\n}\n\nfunction syncState() {\n  S.player.x = player.x; S.player.y = player.y; S.player.dir = player.dir;\n  S.player.map = map.id;\n}\n\n// --- collision ---------------------------------------------------------------\nfunction occupied(x, y) {\n  for (const n of npcs) {\n    if (n.x === x && n.y === y) return true;\n    if (n.moving && n.fx === x && n.fy === y) return true;\n  }\n  return false;\n}\n\nfunction blockedFor(x, y) {\n  if (map.solid(x, y)) return true;\n  try { if (Hooks.village.solid(map, x, y)) return true; } catch {}\n  return false;\n}\n\nfunction canWalk(x, y) { return !blockedFor(x, y) && !occupied(x, y); }\n\n// --- entering a tile ---------------------------------------------------------\nfunction onArrive() {\n  syncState();\n  S.stats.steps++;\n  try { Hooks.missions.note('step', { map: map.id, x: player.x, y: player.y }); } catch {}\n\n  if (grace > 0) grace--;\n\n  if (map.isGrass(player.x, player.y)) {\n    rustle.push({ x: player.x, y: player.y, t: 0 });\n    Audio.sfx('step', { rate: 0.8 });\n    maybeEncounter();\n  } else {\n    Audio.sfx('step', { rate: player.running ? 1.25 : 1 });\n  }\n\n  if (player.running) dust.push({ x: player.px, y: player.py, t: 0 });\n\n  const w = map.warpAt(player.x, player.y);\n  if (w) { doWarp(w); return; }\n}\n\nfunction maybeEncounter() {\n  if (grace > 0) return;\n  const table = map.encounterTable(player.x, player.y);\n  if (!table || !table.length) return;\n  if (rng.float() > ENCOUNTER_RATE) return;\n  const entry = rng.weighted(table.map(e => [e, e.w]));\n  const level = rng.int(entry.lo, entry.hi);\n  startBattle({ speciesId: entry.id, level, kind: 'wild' });\n}\n\nasync function startBattle(params) {\n  let can = false;\n  try { can = Hooks.battle.canBattle(); } catch {}\n  if (!can) { UIx.toast('A Guardian watches from the grass…'); grace = 6; return; }\n  busy = true;\n  try {\n    S.stats.battles++;\n    await UIx.battleFx();\n    const result = await Hooks.battle.start(params);\n    if (result === 'won') S.stats.wins++;\n    if (result === 'bonded') { S.stats.bonded++; try { Hooks.missions.note('catch', params); } catch {} }\n    Bus.emit(result === 'lost' ? EV.BATTLE_LOST : EV.BATTLE_WON, { result, ...params });\n    if (result === 'lost') await recover();\n    grace = ENCOUNTER_GRACE;\n    await UIx.fade('in', 12);\n  } finally { busy = false; }\n}\n\nasync function recover() {\n  await UIx.say('Your Guardians are worn out. Gran Willow tucks them by the hearth until morning.');\n  for (const g of S.party) g.hp = g.maxhp;\n  await enterMap('village', 17, 10, 'down', { fade: false });\n}\n\n// --- warps -------------------------------------------------------------------\nasync function doWarp(w) {\n  busy = true;\n  const door = !!w.door || map.tag(player.x, player.y) === 'door';\n  try {\n    if (door) Audio.sfx('door');\n    await (door ? UIx.doorway('out') : UIx.fade('out', 12));\n    await enterMap(w.to, w.tx, w.ty, w.dir || player.dir, { fade: false });\n    await (door ? UIx.doorway('in') : UIx.fade('in', 12));\n  } finally { busy = false; }\n}\n\nexport async function enterMap(id, x, y, dir = 'down', { fade = true } = {}) {\n  if (fade) await UIx.fade('out', 12);\n  map = loadMap(id);\n  npcs = makeNpcs(map);\n  S.player.map = id;\n  player = makePlayer();\n  player.x = x; player.y = y; player.dir = dir;\n  player.px = x * TILE; player.py = y * TILE;\n  player.fx = x; player.fy = y;\n  grace = ENCOUNTER_GRACE;\n  dust.length = 0; rustle.length = 0;\n  syncState();\n  try { Hooks.village.applyTo(map); } catch (e) { console.warn('[world] village.applyTo', e); }\n  try { Hooks.missions.note('enter-map', { map: id }); } catch {}\n  Bus.emit(EV.MAP_ENTERED, { map: id });\n  if (map.music && Audio.hasSong(map.music)) Audio.play(map.music);\n  R.centerOn(player.px + 8, player.py + 8, map.bounds);\n  if (fade) await UIx.fade('in', 12);\n}\n\n// --- interaction -------------------------------------------------------------\nasync function interact() {\n  const v = DIR_VEC[player.dir];\n  const tx = player.x + v.x, ty = player.y + v.y;\n\n  const npc = npcs.find(n => n.x === tx && n.y === ty);\n  if (npc) { busy = true; try { await npc.interact(); } finally { busy = false; } return; }\n\n  let handler = null;\n  try { handler = Hooks.village.interact(map, tx, ty); } catch {}\n  if (handler) { busy = true; try { await handler(); } finally { busy = false; } return; }\n\n  const tag = map.tag(tx, ty);\n  if (tag) { busy = true; try { await interactTag(tag, tx, ty); } finally { busy = false; } return; }\n\n  // Facing water with nothing to do reads better as a beat than as silence.\n  if (map.isWater(tx, ty)) {\n    busy = true;\n    try { await UIx.say('The water is clear all the way to the stones.'); } finally { busy = false; }\n  }\n}\n\nasync function interactTag(tag, tx, ty) {\n  switch (tag) {\n    case 'sign': return UIx.say(signText(tx, ty));\n    case 'well': return UIx.say('The well is deep and cold. Someone has tied a ribbon to the rope.');\n    case 'bench': return UIx.say('A bench worn smooth by a hundred evenings.');\n    case 'mail': return UIx.say('The post box is empty. Someone has already been by.');\n    case 'hearthfire': return UIx.say('The fire is banked low and warm. It could burn all night like this.');\n    case 'stove': return UIx.say('Something is simmering. It smells like a reason to stay.');\n    case 'painting': return UIx.say('A painting of Emberhollow, from before the roofs went quiet.');\n    case 'chest': {\n      if (S.flags.foundClearing) return UIx.say('The chest is empty now.');\n      S.flags.foundClearing = true;\n      S.bag.charm = (S.bag.charm || 0) + 5;\n      Audio.sfx('chime');\n      return UIx.say('Someone left five charms here, wrapped in waxed cloth. For whoever came looking.');\n    }\n    case 'anvil': return UIx.say('The anvil rings faintly when you touch it, as if it remembers being struck.');\n    case 'loom': return UIx.say('Half a banner, waiting for the rest of the year.');\n    case 'exit': case 'door': return;\n    default: return UIx.say('Nothing here but the wind.');\n  }\n}\n\nfunction signText(x, y) {\n  const key = `${map.id}:${x},${y}`;\n  const signs = {\n    'village:20,30': 'EMBERHOLLOW — Population: growing again.\\nSouth: Gladewind Meadow.',\n    'meadow:18,3': 'GLADEWIND MEADOW — Mind the tall grass. It minds you.',\n    'meadow:21,12': 'Guardians rest in the grass. Walk softly and offer a charm, not a fright.',\n    'forest:1,15': 'HOLLOWPINE WOOD — The path forgets itself. Follow it anyway.',\n    'riverside:11,12': 'STILLWATER REACH — The bridge holds. The railing does not.',\n  };\n  return signs[key] || 'The lettering has weathered away.';\n}\n\n// --- update ------------------------------------------------------------------\nfunction tryStep(dir) {\n  const v = DIR_VEC[dir];\n  const nx = player.x + v.x, ny = player.y + v.y;\n\n  // A ledge below you is a one-way hop down, not a wall.\n  if (dir === 'down' && map.ledge(nx, ny) === 'down' && canWalk(nx, ny + 1)) {\n    player.hop = { fromX: player.x, fromY: player.y, toX: nx, toY: ny + 1, t: 0 };\n    player.x = nx; player.y = ny + 1;\n    Audio.sfx('bump', { rate: 1.6 });\n    return true;\n  }\n  if (!canWalk(nx, ny)) {\n    if (player.bump <= 0) { Audio.sfx('bump'); player.bump = 10; }\n    return false;\n  }\n  player.fx = player.x; player.fy = player.y;\n  player.x = nx; player.y = ny;\n  player.moving = true; player.t = 0;\n  player.dur = pl
