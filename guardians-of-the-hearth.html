<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12161f">
<title>Guardians of the Hearth</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b0e14; }
  body {
    display:flex; align-items:center; justify-content:center;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  #stage { position:relative; image-rendering:pixelated; }
  #screen {
    display:block; image-rendering:pixelated; image-rendering:crisp-edges;
    background:#0b0e14; box-shadow:0 0 0 1px #000, 0 24px 60px -20px #000;
  }
  /* ---- boot veil ---- */
  #veil {
    position:fixed; inset:0; z-index:50; background:#0b0e14; color:#e8dfc8;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    transition:opacity .45s ease; font-size:13px; letter-spacing:.14em; text-transform:uppercase;
  }
  #veil.gone { opacity:0; pointer-events:none; }
  #veil.hidden { display:none; }
  #veil .mark { font-size:20px; letter-spacing:.3em; color:#f5c877; text-shadow:0 2px 0 #7a4a1c; }
  #bar { width:180px; height:4px; background:#232a38; overflow:hidden; }
  #bar i { display:block; height:100%; width:0%; background:#f5c877; transition:width .2s ease; }
  #veil .hint { color:#7d8899; font-size:11px; letter-spacing:.1em; }
  #veil button {
    font:inherit; font-size:12px; letter-spacing:.18em; text-transform:uppercase;
    padding:12px 26px; color:#12161f; background:#f5c877; border:0; cursor:pointer;
    box-shadow:0 3px 0 #a9762a;
  }
  #veil button:active { transform:translateY(2px); box-shadow:0 1px 0 #a9762a; }
  /* ---- touch controls (shown only for touch devices) ---- */
  #touch { position:fixed; inset:0; z-index:40; display:none; pointer-events:none; }
  body.touch #touch { display:block; }
  #touch .pad, #touch .btn {
    position:absolute; pointer-events:auto; border-radius:50%;
    background:rgba(232,223,200,.10); border:1px solid rgba(232,223,200,.22);
    backdrop-filter:blur(2px);
  }
  #touch .pad { left:max(14px,env(safe-area-inset-left)); bottom:max(18px,env(safe-area-inset-bottom));
    width:132px; height:132px; }
  #touch .pad i { position:absolute; inset:0; margin:auto; width:34px; height:34px; border-radius:50%;
    background:rgba(245,200,119,.5); transition:transform .06s linear; }
  #touch .btn { width:62px; height:62px; right:max(16px,env(safe-area-inset-right));
    display:grid; place-items:center; color:#f5c877; font-size:15px; letter-spacing:.06em; }
  #touch .btn.a { bottom:max(74px,calc(env(safe-area-inset-bottom) + 62px)); }
  #touch .btn.b { bottom:max(16px,env(safe-area-inset-bottom)); right:max(86px,calc(env(safe-area-inset-right) + 70px)); }
  #touch .btn.m { top:max(16px,env(safe-area-inset-top)); width:46px; height:46px; font-size:12px; }
  #touch .btn:active, #touch .btn.on { background:rgba(245,200,119,.32); }
  /* ---- crash panel ---- */
  #crash { position:fixed; inset:0; z-index:60; display:none; background:#160f14; color:#ffb4b4;
    padding:24px; font-size:12px; line-height:1.6; overflow:auto; white-space:pre-wrap; }
  #crash.on { display:block; }
  #crash h1 { font-size:14px; color:#ff8080; margin-bottom:10px; letter-spacing:.1em; }
</style>
</head>
<body>
  <div id="stage"><canvas id="screen" width="320" height="180"></canvas></div>

  <div id="touch" aria-hidden="true">
    <div class="pad" id="tpad"><i></i></div>
    <div class="btn a" id="tA">A</div>
    <div class="btn b" id="tB">B</div>
    <div class="btn m" id="tM">☰</div>
  </div>

  <div id="veil">
    <div class="mark">GUARDIANS OF THE HEARTH</div>
    <div id="bar"><i></i></div>
    <div class="hint" id="veilHint">warming the hearth…</div>
    <button id="startBtn" hidden>Press to begin</button>
  </div>

  <div id="crash"><h1>The hearth went cold.</h1><div id="crashBody"></div></div>

, '..#..', '..#..', '..#..']),\n  U: G(['#...#', '#...#', '#...#', '#...#', '#...#', '.###.']),\n  V: G(['#...#', '#...#', '#...#', '#...#', '.#.#.', '..#..']),\n  W: G(['#...#', '#...#', '#...#', '#.#.#', '##.##', '#...#']),\n  X: G(['#...#', '.#.#.', '..#..', '..#..', '.#.#.', '#...#']),\n  Y: G(['#...#', '#...#', '.#.#.', '..#..', '..#..', '..#..']),\n  Z: G(['#####', '....#', '...#.', '..#..', '.#...', '#####']),\n\n  a: G(['.##.', '...#', '.###', '#..#', '.###'], 1),\n  b: G(['#...', '#...', '###.', '#..#', '#..#', '###.']),\n  c: G(['.###', '#...', '#...', '#...', '.###'], 1),\n  d: G(['...#', '...#', '.###', '#..#', '#..#', '.###']),\n  e: G(['.##.', '#..#', '####', '#...', '.###'], 1),\n  f: G(['..##', '.#..', '####', '.#..', '.#..', '.#..']),\n  g: G(['.###', '#..#', '#..#', '.###', '...#', '###.'], 1),\n  h: G(['#...', '#...', '###.', '#..#', '#..#', '#..#']),\n  i: G(['#', '.', '#', '#', '#', '#']),\n  j: G(['..#', '...', '..#', '..#', '..#', '..#', '##.'], 0),\n  k: G(['#...', '#..#', '#.#.', '##..', '#.#.', '#..#']),\n  l: G(['##.', '.#.', '.#.', '.#.', '.#.', '.##']),\n  m: G(['##.##', '#.#.#', '#.#.#', '#.#.#', '#.#.#'], 1),\n  n: G(['###.', '#..#', '#..#', '#..#', '#..#'], 1),\n  o: G(['.##.', '#..#', '#..#', '#..#', '.##.'], 1),\n  p: G(['###.', '#..#', '#..#', '###.', '#...', '#...'], 1),\n  q: G(['.###', '#..#', '#..#', '.###', '...#', '...#'], 1),\n  r: G(['###.', '#..#', '#...', '#...', '#...'], 1),\n  s: G(['.###', '#...', '.##.', '...#', '###.'], 1),\n  t: G(['.#..', '.#..', '###.', '.#..', '.#..', '.###']),\n  u: G(['#..#', '#..#', '#..#', '#..#', '.###'], 1),\n  v: G(['#..#', '#..#', '#..#', '.##.', '.##.'], 1),\n  w: G(['#.#.#', '#.#.#', '#.#.#', '#.#.#', '.#.#.'], 1),\n  x: G(['#..#', '.##.', '.##.', '.##.', '#..#'], 1),\n  y: G(['#..#', '#..#', '#..#', '.###', '...#', '###.'], 1),\n  z: G(['####', '...#', '.##.', '#...', '####'], 1),\n\n  0: G(['.###.', '#..##', '#.#.#', '##..#', '#...#', '.###.']),\n  1: G(['..#..', '.##..', '..#..', '.. \n  '|': G(['#', '#', '#', '#', '#', '#']),\n  '…': G(['......', '......', '......', '......', '......', '#.#.#.']),\n  '×': G(['.....', '#...#', '.#.#.', '..#..', '.#.#.', '#...#']),\n  '·': G(['.', '.', '.', '##', '##']),\n\n  // UI pictograms — same box, drawn inline with text.\n  '▶': G(['#....', '##...', '###..', '####.', '###..', '##...', '#....'], 0),\n  '◀': G(['....#', '...##', '..###', '.####', '..###', '...##', '....#'], 0),\n  '▼': G(['.......', '#######', '.#####.', '..###..', '...#...'], 1),\n  '▲': G(['...#...', '..###..', '.#####.', '#######'], 2),\n  '♥': G(['.##.##.', '#######', '#######', '.#####.', '..###..', '...#...'], 0),\n  '★': G(['...#...', '..###..', '#######', '.#####.', '..#.#..', '.#...#.'], 0),\n  '●': G(['.###.', '#####', '#####', '#####', '.###.'], 1),\n  '○': G(['.###.', '#...#', '#...#', '#...#', '.###.'], 1),\n  '⬥': G(['..#..', '.###.', '#####', '.###.', '..#..'], 1),\n  '⏻': G(['..#..', '.###.', '#####', '#####', '.###.', '..#..'], 0),\n};\n\n// Aliases so callers can use plain ASCII for the pictograms.\nexport const ALIAS = {\n  '^': '▲', 'v': null,   // 'v' stays a letter; use '▼' directly\n};\n","deps":{}},{"id":"core/font.js","code":"// Pixel font engine. Glyph data lives in art/glyphs.js; this file turns it into\n// tinted sheets and draws crisp, shadowed, wrapped text.\n//\n// Text quality is load-bearing for the whole game's feel, so: 1px offset shadow by\n// default (reads on any background), integer positions only, per-colour sheet cache.\n\nimport { GLYPHS, FONT } from '../art/glyphs.js';\n\nconst SHEET_COLS = 24;\nlet sheet = null;                 // white master sheet\nconst rects = new Map();          // char -> {x,y,w,h}\nconst tinted = new Map();         // color -> canvas\nlet built = false;\n\nfunction cv(w, h) {\n  const c = document.createElement('canvas');\n  c.width = w; c.height = h;\n  const x = c.getContext('2d');\n  x.imageSmoothingEnabled = false;\n  return c;\n}\n\nexport function buildFont() {\n  if (built) return;\n  const chars = Object.keys(GLYPHS);\n  const cellW = 10, cellH = FONT.box;\n  const rows = Math.ceil(chars.length / SHEET_COLS);\n  sheet = cv(SHEET_COLS * cellW, rows * cellH);\n  const ctx = sheet.getContext('2d');\n  ctx.fillStyle = '#fff';\n\n  chars.forEach((ch, i) => {\n    const gx = (i % SHEET_COLS) * cellW, gy = Math.floor(i / SHEET_COLS) * cellH;\n    const g = GLYPHS[ch];\n    for (let r = 0; r < g.rows.length; r++) {\n      const row = g.rows[r], py = gy + g.top + r;\n      for (let c = 0; c < row.length; c++) {\n        if (row[c] === '#') ctx.fillRect(gx + c, py, 1, 1);\n      }\n    }\n    rects.set(ch, { x: gx, y: gy, w: g.w, h: cellH });\n  });\n  built = true;\n}\n\nfunction sheetFor(color) {\n  if (color === '#fff' || color === '#ffffff') return sheet;\n  let c = tinted.get(color);\n  if (c) return c;\n  c = cv(sheet.width, sheet.height);\n  const x = c.getContext('2d');\n  x.drawImage(sheet, 0, 0);\n  x.globalCompositeOperation = 'source-in';\n  x.fillStyle = color;\n  x.fillRect(0, 0, c.width, c.height);\n  tinted.set(color, c);\n  return c;\n}\n\nconst advance = ch => {\n  if (ch === ' ') return FONT.space + FONT.gap;\n  const r = rects.get(ch);\n  return r ? r.w + FONT.gap : FONT.space + FONT.gap;\n};\n\nexport const Font = {\n  get lineHeight() { return FONT.lineHeight; },\n  get box() { return FONT.box; },\n\n  measure(str) {\n    let w = 0;\n    for (const ch of String(str)) w += advance(ch);\n    return Math.max(0, w - FONT.gap);\n  },\n\n  // Greedy word wrap. Respects explicit \\n. Never breaks mid-word unless a single\n  // word is longer than the line, which would otherwise overflow the text box.\n  wrap(str, maxW) {\n    const out = [];\n    for (const para of String(str).split('\\n')) {\n      let line = '';\n      for (const word of para.split(' ')) {\n        const test = line ? line + ' ' + word : word;\n        if (this.measure(test) <= maxW || !line) {\n          if (this.measure(test) > maxW && !line) {\n integer math.\nexport class Timer {\n  constructor() { this.t = 0; }\n  set(frames) { this.t = frames; return this; }\n  tick() { if (this.t > 0) this.t--; return this.t === 0; }\n  get running() { return this.t > 0; }\n  get done() { return this.t <= 0; }\n}\n\nexport const wait = ms => new Promise(r => setTimeout(r, ms));\n\n// Format helpers used across UI.\nexport const pad2 = n => String(n).padStart(2, '0');\nexport const commas = n => String(n).replace(/\\B(?=(\\d{3})+(?!\\d))/g, ',');\nexport const titleCase = s => s.replace(/(^|[\\s-])([a-z])/g, (_, a, b) => a + b.toUpperCase());\n","deps":{}},{"id":"core/renderer.js","code":"// Layered pixel renderer. 320x180 internal, integer-scaled to the window.\n//\n// Layers: 0 ground, 1 mid (decor under the player), 2 entity (y-sorted),\n//         3 over (tree canopies, roofs, anything that occludes the player),\n//         4 weather/lighting, 5 ui.\n// Scenes never touch ctx directly outside of a layer callback — that ordering is what\n// makes the world read correctly at a glance.\n\nimport { Font } from './font.js';\nimport { clamp } from './util.js';\n\nexport const LAYER = { GROUND: 0, MID: 1, ENTITY: 2, OVER: 3, WEATHER: 4, UI: 5 };\n\nconst N_LAYERS = 6;\nconst layers = Array.from({ length: N_LAYERS }, () => []);\nconst entities = [];\n\nlet canvas, ctx, scale = 1;\nlet shakeFrames = 0, shakeMag = 0, shakeX = 0, shakeY = 0;\nlet flashFrames = 0, flashTotal = 0, flashColor = '#fff';\nlet scratch = null, scratchCtx = null;\n\nexport const R = {\n  W: 320, H: 180,\n  camera: { x: 0, y: 0 },\n  get ctx() { return ctx; },\n  get canvas() { return canvas; },\n  get scale() { return scale; },\n\n  init(el) {\n    canvas = el;\n    canvas.width = this.W; canvas.height = this.H;\n    ctx = canvas.getContext('2d', { alpha: false });\n    ctx.imageSmoothingEnabled = false;\n    scratch = document.createElement('canvas');\n    scratch.width = this.W; scratch.height = this.H;\n    scratchCtx = scratch.getContext('2d');\n
